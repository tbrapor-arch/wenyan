# Build the app and publish it on GitHub Pages.
# One-time setup in the repo: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Build and publish the app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit (the tag is only a comment): a moved or hijacked tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python packages
        run: pip install -r requirements.txt

      # the dictionary sources (CC-CEDICT, jieba, complete-hsk-vocabulary: pinned versions, see data/fetch.sh)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw
          key: data-raw-${{ hashFiles('data/fetch.sh') }}

      - name: Dictionary sources
        run: make data

      # validates every lesson (fails the run on an error), then writes app/dist/index.html
      - name: App
        run: make app

      # the published site: CSP (script hash of this build), manifest, icons, offline service worker
      - name: Site
        run: python3 -I tools/site.py _site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
