]}, {"topic": "以 and 為", "refs": ["L1 n.10", "L6 n.9", "L6 n.10", "L5 n.8", "L1 n.9"], "text": "以 X V \"use X to V\" · 以 A 為 B \"regard A as B\" · 以為 \"think that\". 為 wéi \"to be, make, run\" · 為 wèi \"for\" · 為 A V \"be V'ed by A\" (passive).\n", "examples": ["以子之矛", "子以我為不信", "吾為子先行", "而身為宋國笑"], "examples_s": ["以子之矛", "子以我为不信", "吾为子先行", "而身为宋国笑"]}], "exercise": [{"h": "三人行，必有我師焉。", "py": "Sān rén xíng, bì yǒu wǒ shī yān.", "src": "論語·述而", "en": "When three people walk together, there is sure to be a teacher for me among them.", "tests": "行 = walk, 有", "h_s": "三人行，必有我师焉。"}, {"h": "朝聞道，夕死可矣。", "py": "Zhāo wén dào, xī sǐ kě yǐ.", "src": "論語·里仁", "en": "Hear the Way in the morning, and one may die in the evening.", "tests": "聞, 可, 矣", "h_s": "朝闻道，夕死可矣。"}, {"h": "吾日三省吾身：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？", "py": "Wú rì sān xǐng wú shēn: wèi rén móu ér bù zhōng hū? Yǔ péngyǒu jiāo ér bù xìn hū? Chuán bù xí hū?", "src": "論語·學而", "en": "Every day I examine myself on three points: in planning for others, have I been less than loyal? With friends, have I been less than trustworthy? Have I passed on what I have not practised?", "tests": "吾, 身, 為 wèi, 而, 與, 信, 乎", "h_s": "吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？"}, {"h": "歲寒，然後知松柏之後凋也。", "py": "Suì hán, rán hòu zhī sōng bǎi zhī hòu diāo yě.", "src": "論語·子罕", "en": "Only when the year turns cold do we know that pines and cypresses are the last to wither.", "tests": "之 between subject and predicate, 也", "h_s": "岁寒，然后知松柏之后凋也。"}, {"h": "其身正，不令而行；其身不正，雖令不從。", "py": "Qí shēn zhèng, bù lìng ér xíng; qí shēn bù zhèng, suī lìng bù cóng.", "src": "論語·子路", "en": "If he himself is upright, things get done without orders; if he himself is not upright, even his orders are not followed.", "tests": "其, 身, 而, 從", "h_s": "其身正，不令而行；其身不正，虽令不从。"}, {"h": "工欲善其事，必先利其器。", "py": "Gōng yù shàn qí shì, bì xiān lì qí qì.", "src": "論語·衛靈公", "en": "A craftsman who wants to do his work well must first sharpen his tools.", "tests": "欲, 先, 利 (as a verb), 其", "h_s": "工欲善其事，必先利其器。"}], "title_s": "复习一"}]}, {"key": "baihua", "zh": "白話", "en": "Modern prose", "about": "The written language beyond the old HSK 5 (the 2,500-word level before 2021): public-domain essays and fiction, read for the literary words that textbooks stop before.", "lessons": [{"id": 1, "slug": "luo-hua-sheng", "title": "落花生", "title_py": "Luòhuāshēng", "title_en": "Peanuts", "source": {"work": "落花生", "author": "許地山 (1894–1941)", "period": 1922, "text_from": "《許地山作品選集》(好讀出版), as excerpted by 遠見 gvm.com.tw/article/60672; compared line by line on 2026-11-12", "work_s": "落花生"}, "status": "draft", "intro": "Xu Dishan was born in Tainan in 1894; his family left Taiwan for Fujian after the Japanese takeover the next year. He became a scholar of religion, ended his career as professor of Chinese at the University of Hong Kong, and signed his fiction 落華生, \"Peanut\". This essay was published in 1922 and has been in Chinese school readers ever since. The sentences are short and the story is a family evening, which makes it a good first step: nearly every word you don't know here is a *written* word, the layer of vocabulary that starts where the old HSK 5 stopped. Watch the five words built on 然.\n", "lines": [{"h": "我們屋後有半畝隙地。", "en": "Behind our house there was half a mu of unused ground.", "p": true, "h_s": "我们屋后有半亩隙地。"}, {"h": "母親說：「讓它荒蕪著怪可惜，既然你們那麼愛吃花生，就闢來做花生園罷。」", "en": "Mother said, \"It's rather a shame to leave it lying waste. Since you're all so fond of peanuts, let's clear it and make a peanut garden.\"", "h_s": "母亲说：「让它荒芜著怪可惜，既然你们那么爱吃花生，就辟来做花生园罢。」"}, {"h": "我們幾姊弟和幾個小丫頭都很喜歡——買種的買種，動土的動土，灌園的灌園；", "en": "We children and the few young maids were all delighted. Some bought seed, some dug the ground, some watered the plot;", "h_s": "我们几姊弟和几个小丫头都很喜欢——买种的买种，动土的动土，灌园的灌园；"}, {"h": "過不了幾個月，居然收穫了！", "en": "and before many months had gone by, to our surprise, there was a harvest!", "h_s": "过不了几个月，居然收获了！"}, {"h": "媽媽說：「今晚我們可以做一個收穫節，也請你們爹爹來嘗嘗我們的新花生，如何？」", "en": "Mama said, \"Tonight we could hold a harvest festival, and ask your father to come and taste our new peanuts. What do you say?\"", "p": true, "h_s": "妈妈说：「今晚我们可以做一个收获节，也请你们爹爹来尝尝我们的新花生，如何？」"}, {"h": "我們都答應了。", "en": "We all agreed.", "h_s": "我们都答应了。"}, {"h": "母親把花生做成好幾樣的食品，還吩咐這節期要在園裡的茅亭舉行。", "en": "Mother made the peanuts into a good many dishes, and gave word that the festival was to be held in the thatched pavilion in the garden.", "h_s": "母亲把花生做成好几样的食品，还吩咐这节期要在园里的茅亭举行。"}, {"h": "那晚上的天色不大好，可是爹爹也到來，實在很難得！", "en": "The sky was not very promising that evening, but Father came all the same, which was a rare thing indeed!", "p": true, "h_s": "那晚上的天色不大好，可是爹爹也到来，实在很难得！"}, {"h": "爹爹說：「你們愛吃花生麼？」", "en": "Father said, \"Do you like eating peanuts?\"", "h_s": "爹爹说：「你们爱吃花生么？」"}, {"h": "我們都爭著答應：「愛！」", "en": "We all raced to answer, \"We do!\"", "p": true, "h_s": "我们都争著答应：「爱！」"}, {"h": "「誰能把花生的好處說出來？」", "en": "\"Who can tell me what is good about the peanut?\"", "p": true, "h_s": "「谁能把花生的好处说出来？」"}, {"h": "姊姊說：「花生的氣味很美。」", "en": "Elder sister said, \"Peanuts have a lovely flavour.\"", "p": true, "h_s": "姊姊说：「花生的气味很美。」"}, {"h": "哥哥說：「花生可以製油。」", "en": "Elder brother said, \"You can make oil from peanuts.\"", "p": true, "h_s": "哥哥说：「花生可以制油。」"}, {"h": "我說：「無論何等人都可以用賤價買它來吃；都喜歡吃它。這就是它的好處。」", "en": "I said, \"People of every sort can buy them cheaply to eat, and everyone likes them. That is what's good about them.\"", "p": true, "h_s": "我说：「无论何等人都可以用贱价买它来吃；都喜欢吃它。这就是它的好处。」"}, {"h": "爹爹說：「花生的用處固然很多，但有一樣是很可貴的。", "en": "Father said, \"The peanut has many uses, to be sure, but one thing about it is truly precious.", "p": true, "h_s": "爹爹说：「花生的用处固然很多，但有一样是很可贵的。"}, {"h": "這小小的豆不像那好看的蘋果、桃子、石榴，把它們的果實懸在枝上，", "en": "This little bean is not like the handsome apple, peach and pomegranate, which hang their fruit on the branch,", "h_s": "这小小的豆不像那好看的苹果、桃子、石榴，把它们的果实悬在枝上，"}, {"h": "鮮紅嫩綠的顏色，令人一望而發生羨慕的心。", "en": "bright red and tender green, so that one look is enough to make people admire them.", "lit": "causing people, at one glance, to have an admiring heart arise", "h_s": "鲜红嫩绿的颜色，令人一望而发生羡慕的心。"}, {"h": "它只把果子埋在地下，等到成熟，才容人把它挖出來。", "en": "It just buries its fruit in the ground, and only when it is ripe does it let anyone dig it up.", "h_s": "它只把果子埋在地下，等到成熟，才容人把它挖出来。"}, {"h": "你們偶然看見一棵花生瑟縮地長在地上，不能立刻辨出它有沒有果實，", "en": "If you happen to see a peanut plant huddled low on the ground, you can't tell straight away whether it has any fruit;", "h_s": "你们偶然看见一棵花生瑟缩地长在地上，不能立刻辨出它有没有果实，"}, {"h": "必得等到你接觸它才能知道。」", "en": "you have to wait until you touch it to know.\"", "h_s": "必得等到你接触它才能知道。」"}, {"h": "我們都說：「是的。」母親也點點頭。", "en": "We all said, \"That's true.\" Mother nodded too.", "p": true, "h_s": "我们都说：「是的。」母亲也点点头。"}, {"h": "爹爹接下去說：「所以你們要像花生，因為它是有用的，不是偉大、好看的東西。」", "en": "Father went on, \"So you must be like the peanut, because it is a useful thing, not a grand or good-looking one.\"", "h_s": "爹爹接下去说：「所以你们要像花生，因为它是有用的，不是伟大、好看的东西。」"}, {"h": "我說：「那麼，人要做有用的人，不要做偉大、體面的人了。」", "en": "I said, \"Then a person should be a useful person, and not a great or grand-looking one.\"", "p": true, "h_s": "我说：「那么，人要做有用的人，不要做伟大、体面的人了。」"}, {"h": "爹爹說：「這是我對於你們的希望。」", "en": "Father said, \"That is what I hope for you.\"", "p": true, "h_s": "爹爹说：「这是我对于你们的希望。」"}, {"h": "我們談到夜闌才散，", "en": "We talked until the night was nearly over before we parted.", "p": true, "h_s": "我们谈到夜阑才散，"}, {"h": "所有花生食品雖然沒有了，然而父親的話現在還印在我心版上。", "en": "All the peanut dishes are long gone, yet Father's words are printed on my heart to this day.", "h_s": "所有花生食品虽然没有了，然而父亲的话现在还印在我心版上。"}], "notes": [{"n": 1, "line": 0, "at": "隙地", "text": "**隙** xì is a crack or gap (空隙, 縫隙), so 隙地 is the bit of land left over between things: a spare plot. In speech you would say 空地. This is the pattern of the whole lesson: a one-character classical word (隙) living on inside a two-character written one.\n", "at_s": "隙地"}, {"n": 2, "line": 1, "at": "怪可惜", "text": "**怪** as an adverb, \"rather, quite\", is colloquial northern usage, normally 怪…的 (怪可惜的). **可惜** is 可 + verb, \"worth regretting\": the same 可 as in 可貴 \"worth prizing\" (line 15), 可愛, 可怕, 可笑. In Classical Chinese this 可 is still a free word with a passive sense (→ 文言 L1 n.8).\n", "at_s": "怪可惜"}, {"n": 3, "line": 1, "at": "既然", "text": "**既然 … 就 …** \"since (it is already the case that) …, then …\". 既 jì is classical for \"already, having done\". The 然 is the first of five in this text: 既然, 居然, 固然, 雖然, 然而. Classical 然 means \"so, like that\"; stuck onto a word it makes \"in such a way\" (→ 文言 L3 n.3), and that is how the written language builds its adverbs and conjunctions.\n", "at_s": "既然"}, {"n": 4, "line": 1, "at": "闢", "text": "**闢** pì \"to open up, clear (land)\", as in 開闢. Careful with the simplified form: 辟 stands for two different words, 闢 pì \"open up\" and 辟 bì \"sovereign; to ward off\" (復辟 fùbì \"restoration of a monarch\").\n", "at_s": "辟"}, {"n": 5, "line": 1, "at": "罷", "text": "**罷** here is the particle *ba*, today written 吧. Writers of the 1920s wrote 罷 for it, and 麼 for 嗎 (line 9: 愛吃花生麼？). Both are read as the modern particles. As a full word 罷 is bà \"to stop\" (罷工, 罷了).\n", "at_s": "罢"}, {"n": 6, "line": 2, "at": "買種的買種", "text": "**A 的 A, B 的 B** \"some did A, some did B\": each 的 phrase is \"the ones who …\". 種 is zhǒng \"seed\" here, not zhòng \"to plant\". 動土 \"break ground\" and 灌園 \"water the garden\" are verb + object in the classical way, one character each.\n", "at_s": "买种的买种"}, {"n": 7, "line": 3, "at": "居然", "text": "**居然** \"unexpectedly, against what one would think\". The children are amazed their own work produced anything. Its near-twin 竟然 is a little stronger and can be used for bad surprises.\n", "at_s": "居然"}, {"n": 8, "line": 4, "at": "我們的新花生", "text": "In the first printing (《小說月報》, 1922) this was 我們**底**新花生, and the last line 父親**底**話. For some years in the 1920s many writers kept 的 for descriptions (好看的蘋果) and wrote 底 for possession. Later editions, like ours, print 的 throughout; in an old edition of 魯迅 or 許地山 you will meet 底 on every page.\n", "at_s": "我们的新花生"}, {"n": 9, "line": 4, "at": "如何", "text": "**如何** at the end of a proposal: \"how about it?\". It is the classical question 何如 / 如何, \"what is it like?\" (→ 文言 L6 n.3), and still the normal written word for 怎麼樣.\n", "at_s": "如何"}, {"n": 10, "line": 6, "at": "吩咐", "text": "**吩咐** fēnfù \"to give instructions\" (to children, servants, juniors). 節期 \"the time of a festival\" is rare; the \"harvest festival\" is the mother's own invention. 茅亭 is a pavilion roofed with 茅 máo, thatch grass.\n", "at_s": "吩咐"}, {"n": 11, "line": 13, "at": "無論何等人", "text": "**何等** \"what kind, what rank of\": 何 is the classical \"what\". Today 何等 is mostly an exclamation, \"how very\" (何等重要!). **賤價** \"low price\": 賤 keeps its oldest sense, \"cheap\", the opposite of 貴; in today's speech it is mostly an insult.\n", "at_s": "无论何等人"}, {"n": 12, "line": 14, "at": "固然", "text": "**固然 …, 但 …** \"admittedly …, but …\": the speaker grants a point before making his own. 固 is classical \"certainly, by nature\" (→ 文言 L5 n.10: 蛇固無足).\n", "at_s": "固然"}, {"n": 13, "line": 16, "at": "令人一望而發生羨慕的心", "text": "Three written features in one clause. **令** \"to cause, make\" is the written word for 讓 / 叫 (令人感動). **一 … 而 …** \"at a single …, then …\": 而 joins two verbs exactly as in Classical Chinese (→ 文言 L1 n.4). And **發生** means \"to arise, come into being\"; today it is nearly always \"to happen\". 羨慕的心 is the classical 羨慕之心 with 的 for 之.\n", "at_s": "令人一望而发生羡慕的心"}, {"n": 14, "line": 17, "at": "容", "text": "**容** \"to allow, permit\", as in 不容 \"does not allow\", 容許, 容忍. 才容人 \"only then does it let people …\".\n", "at_s": "容"}, {"n": 15, "line": 18, "at": "瑟縮", "text": "**瑟縮** sèsuō \"huddled, shrinking (as if from cold)\". Both syllables begin with s-: it is an alliterative two-syllable word of the classical type, where the sound carries the picture and the characters cannot be translated one by one (compare 彷彿, 徘徊, 參差).\n", "at_s": "瑟缩"}, {"n": 16, "line": 19, "at": "必得", "text": "**必得** bìděi \"must, have no choice but to\". 得 is děi \"must\", not dé \"to get\".\n", "at_s": "必得"}, {"n": 17, "line": 23, "at": "對於", "text": "**於** yú is the all-purpose classical preposition, \"at, in, to, with regard to\" (→ 文言 L2 n.5). Written Chinese keeps it inside 對於, 關於, 由於, 至於, 等於, and on its own after a verb: 生於台南 \"born in Tainan\".\n", "at_s": "对于"}, {"n": 18, "line": 24, "at": "夜闌", "text": "**闌** lán \"nearly over, at its end\". 夜闌 \"deep in the night\" is a poetic word; the four-character phrase 夜闌人靜 \"the night far gone and everyone quiet\" is where you will meet it most.\n", "at_s": "夜阑"}, {"n": 19, "line": 25, "at": "雖然", "text": "**雖然 …, 然而 …** \"although …, yet …\". 然而 is literally \"so, and yet\": it is the written \"but\", heavier than 但是 or 可是, and it usually opens the clause that matters most. **心版** is \"the printing block of the heart\": 版 is a woodblock, which is why the words are 印, printed, on it.\n", "at_s": "虽然"}], "glossary": [{"w": "隙地", "py": "xìdì", "en": "a spare, unused plot of land", "w_s": "隙地"}, {"w": "荒蕪", "py": "huāngwú", "en": "(of land) lying waste, overgrown", "checked": ["cyz"], "w_s": "荒芜"}, {"w": "怪", "py": "guài", "en": "rather, quite (colloquial)", "w_s": "怪"}, {"w": "既然", "py": "jìrán", "en": "since, given that", "hsk": 4, "w_s": "既然"}, {"w": "闢", "py": "pì", "en": "to open up, clear (land)", "checked": ["cyz"], "w_s": "辟"}, {"w": "罷", "py": "ba", "en": "= 吧, the suggestion particle (1920s spelling)", "w_s": "罢"}, {"w": "姊弟", "py": "zǐdì", "en": "sisters and brothers, siblings", "w_s": "姊弟"}, {"w": "丫頭", "py": "yātou", "en": "a young maidservant; a girl", "w_s": "丫头"}, {"w": "動土", "py": "dòngtǔ", "en": "to break ground, start digging", "w_s": "动土"}, {"w": "灌園", "py": "guànyuán", "en": "to water a garden", "w_s": "灌园"}, {"w": "居然", "py": "jūrán", "en": "unexpectedly, to one's surprise", "hsk": 5, "w_s": "居然"}, {"w": "收穫", "py": "shōuhuò", "en": "to harvest; a harvest", "hsk": 5, "w_s": "收获"}, {"w": "嘗", "py": "cháng", "en": "to taste", "hsk": 4, "w_s": "尝"}, {"w": "如何", "py": "rúhé", "en": "how about it? (written for 怎麼樣)", "hsk": 5, "w_s": "如何"}, {"w": "吩咐", "py": "fēnfù", "en": "to give instructions, tell someone to", "w_s": "吩咐"}, {"w": "節期", "py": "jiéqī", "en": "the time of a festival (rare)", "w_s": "节期"}, {"w": "茅亭", "py": "máotíng", "en": "a thatched pavilion", "w_s": "茅亭"}, {"w": "天色", "py": "tiānsè", "en": "the look of the sky, the weather", "w_s": "天色"}, {"w": "難得", "py": "nándé", "en": "rare, hard to come by", "w_s": "难得"}, {"w": "爭", "py": "zhēng", "en": "to compete, vie (to be first)", "w_s": "争"}, {"w": "製油", "py": "zhìyóu", "en": "to make oil", "w_s": "制油"}, {"w": "無論", "py": "wúlùn", "en": "no matter (what, who)", "hsk": 4, "w_s": "无论"}, {"w": "何等", "py": "héděng", "en": "what kind of, of whatever rank", "w_s": "何等"}, {"w": "賤價", "py": "jiànjià", "en": "a low price", "checked": ["cyz"], "w_s": "贱价"}, {"w": "固然", "py": "gùrán", "en": "admittedly, it is true that", "w_s": "固然"}, {"w": "可貴", "py": "kěguì", "en": "worth prizing, precious", "w_s": "可贵"}, {"w": "石榴", "py": "shíliu", "en": "pomegranate", "w_s": "石榴"}, {"w": "懸", "py": "xuán", "en": "to hang, suspend", "w_s": "悬"}, {"w": "嫩綠", "py": "nènlǜ", "en": "tender green", "w_s": "嫩绿"}, {"w": "令", "py": "lìng", "en": "to cause, make (someone feel or do)", "checked": ["cyz"], "w_s": "令"}, {"w": "羨慕", "py": "xiànmù", "en": "to admire, envy", "hsk": 4, "w_s": "羡慕"}, {"w": "成熟", "py": "chéngshú", "en": "ripe", "hsk": 5, "w_s": "成熟"}, {"w": "容", "py": "róng", "en": "to allow, let", "checked": ["cyz"], "w_s": "容"}, {"w": "偶然", "py": "ǒurán", "en": "by chance", "hsk": 5, "w_s": "偶然"}, {"w": "瑟縮", "py": "sèsuō", "en": "huddled up, shrinking", "w_s": "瑟缩"}, {"w": "辨", "py": "biàn", "en": "to tell apart, make out", "checked": ["cyz"], "w_s": "辨"}, {"w": "必得", "py": "bìděi", "en": "must, have to", "w_s": "必得"}, {"w": "接觸", "py": "jiēchù", "en": "to touch, come into contact with", "hsk": 5, "w_s": "接触"}, {"w": "體面", "py": "tǐmiàn", "en": "respectable-looking, grand", "w_s": "体面"}, {"w": "對於", "py": "duìyú", "en": "with regard to, for", "hsk": 4, "w_s": "对于"}, {"w": "夜闌", "py": "yèlán", "en": "late at night, when the night is nearly over", "checked": ["cyz"], "w_s": "夜阑"}, {"w": "散", "py": "sàn", "en": "to break up, disperse", "w_s": "散"}, {"w": "雖然", "py": "suīrán", "en": "although", "hsk": 2, "w_s": "虽然"}, {"w": "然而", "py": "rán'ér", "en": "yet, but (written)", "hsk": 4, "w_s": "然而"}, {"w": "心版", "py": "xīnbǎn", "en": "the 'printing block' of the heart: one's memory", "w_s": "心版"}], "exercise": [{"h": "以子之矛，陷子之楯，何如？", "ref": "文言 L2", "tests": "如何 (line 5). The classical order is usually 何如.", "py": "Yǐ zǐ zhī máo, xiàn zǐ zhī dùn, hé rú?", "en": "What if you used your spear to pierce your shield?", "src": "韓非子·難一 · 文言 L2", "to": {"track": "wenyan", "id": 2}, "h_s": "以子之矛，陷子之楯，何如？"}, {"h": "蛇固無足，子安能為之足？", "ref": "文言 L5", "tests": "固 in 固然 (line 15).", "py": "Shé gù wú zú, zǐ ān néng wéi zhī zú?", "en": "Snakes have no feet, of course: how can you give it feet?", "src": "戰國策·齊策二 · 文言 L5", "to": {"track": "wenyan", "id": 5}, "h_s": "蛇固无足，子安能为之足？"}, {"h": "兔走觸株，折頸而死。", "ref": "文言 L1", "tests": "而 joining two verbs, as in 一望而發生 (line 17).", "py": "tù zǒu chù zhū, zhé jǐng ér sǐ.", "en": "A hare, running, struck the stump, broke its neck and died.", "src": "韓非子·五蠹 · 文言 L1", "to": {"track": "wenyan", "id": 1}, "h_s": "兔走触株，折颈而死。"}, {"h": "虎以為然，故遂與之行，", "ref": "文言 L6", "tests": "然 \"so\" as a full word; the 然 of 既然, 居然, 固然, 雖然, 然而.", "py": "Hǔ yǐ wéi rán, gù suì yǔ zhī xíng,", "en": "The tiger thought he was right, so it went along with him.", "src": "戰國策·楚策一 · 文言 L6", "to": {"track": "wenyan", "id": 6}, "h_s": "虎以为然，故遂与之行，"}, {"h": "兔不可復得，", "ref": "文言 L1", "tests": "可 + verb, as in 可惜 and 可貴.", "py": "Tù bù kě fù dé,", "en": "Hares could not be got again,", "src": "韓非子·五蠹 · 文言 L1", "to": {"track": "wenyan", "id": 1}, "h_s": "兔不可复得，"}, {"h": "吾矛之利，於物無不陷也。", "ref": "文言 L2", "tests": "於 in 對於 (line 24); 無 in 無論.", "py": "Wú máo zhī lì, yú wù wú bù xiàn yě.", "en": "My spears are so sharp that there is nothing they can't pierce.", "src": "韓非子·難一 · 文言 L2", "to": {"track": "wenyan", "id": 2}, "h_s": "吾矛之利，于物无不陷也。"}], "culture": "**The other ending.** The version most people in China know is the primary-school one, which was cut and reworded for children. The text here is the adult original in a modern edition (see note 8 for what the first printing looked like).\n", "title_s": "落花生"}]}, {"key": "chengyu", "zh": "成語", "en": "Idioms", "about": "成語 in order of modern frequency, twenty at a time, grouped by pattern.", "lessons": []}]}</script>
<script>
(() => {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const H = document.documentElement, app = $("#app"), pop = $("#pop");
  const store = {
    get(k, d){ try{ const v = localStorage.getItem("wy." + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem("wy." + k, JSON.stringify(v)); }catch(e){} }
  };
  const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const REF = /(?:(文言|白話) )?L(\d+) n\.(\d+)/g, TRACK_OF = {"文言": "wenyan", "白話": "baihua"};
  // **bold**, *italic*, and cross-references (L3 n.5 · 文言 L1 n.4) as buttons.
  const md = (t, own) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>")
    .replace(REF, (m, tr, l, n) => `<button class="ref" data-to="${TRACK_OF[tr] || own}/${l}/n${n}">${m}</button>`);
  const today = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  let course, T, L;
  let simp = store.get("simp", false), py = store.get("py", true), cover = store.get("cover", false);
  let done = store.get("done", {});
  const Z = (o, k) => simp && o[k + "_s"] ? o[k + "_s"] : o[k];
  const track = k => course.tracks.find(t => t.key === k);
  const isDone = (t, l) => !!done[t.key + ":" + l.id];

  /* ---------- routing ---------- */
  // Every route maps to a tab here, so a redrawn tab bar keeps its highlight.
  const TABS = [["wenyan", "文言", "Classical"], ["baihua", "白話", "Prose"], ["chengyu", "成語", "Idioms"],
                ["settings", "設定", "Settings"]];
  const route = () => { const p = location.hash.replace(/^#\/?/, "").split("/"); return {tab: TABS.some(t => t[0] === p[0]) ? p[0] : store.get("tab", "wenyan"), id: p[1] ? +p[1] : null, note: p[2] || null}; };
  function drawTabs(tab){
    $("#tabs").innerHTML = TABS.map(([k, zh, en]) => `<a href="#${k}" ${k === tab ? 'aria-current="page"' : ""}><b>${zh}</b>${en}</a>`).join("");
  }
  function go(){
    hidePop();
    const r = route();
    H.classList.toggle("simp", simp); H.classList.toggle("nopy", !py); H.classList.toggle("cover", cover);
    H.dataset.theme = store.get("night", false) ? "dark" : "light";
    drawTabs(r.tab); L = null;
    if (r.tab === "settings") return settings();
    store.set("tab", r.tab);
    T = track(r.tab); L = r.id ? T.lessons.find(l => l.id === r.id) : null;
    if (!L) return home();
    lesson();
    if (r.note){ const n = $("#" + r.note); if (n){ n.scrollIntoView({block: "center"}); n.classList.add("flash"); } }
    else scrollTo(0, 0);
  }

  /* ---------- track home ---------- */
  const sealHTML = (t, cls = "") => { const cs = [...t].filter(c => /\p{Script=Han}/u.test(c)).slice(0, 4); return `<div class="seal ${cs.length < 2 ? "one" : ""} ${cls}" aria-hidden="true">${cs.map(c => `<span>${esc(c)}</span>`).join("")}</div>`; };
  function home(){
    const ls = T.lessons, nDone = ls.filter(l => isDone(T, l)).length, next = ls.find(l => !isDone(T, l));
    let body;
    if (!ls.length) body = `<div class="empty"><b>No ${esc(T.zh)} lessons in this build yet.</b><br>
      The tab is ready: put the lesson files in <code>${T.key === "wenyan" ? "lessons" : T.key}/</code> and run <code>python3 tools/build.py</code>.</div>`;
    else body = `
      ${next ? `<div class="next"><div class="t"><div class="kicker">${nDone ? "Next lesson" : "Start here"} · ${next.id}</div>
          <div class="zh1">${esc(Z(next, "title"))}</div><div class="te">${esc(next.title_en)}</div></div>
          <a class="btn red" href="#${T.key}/${next.id}">${nDone ? "Continue" : "Start"}</a></div>`
        : `<div class="next"><div class="t"><div class="kicker">All done</div><div class="te">Every lesson written so far is marked as done.</div></div></div>`}
      <div class="prog">${nDone} of ${ls.length} done</div>
      <h2>Lessons</h2>
      <div class="grid">${ls.map(l => `<a class="tile ${isDone(T, l) ? "done" : ""} ${l.kind === "review" ? "rev" : ""}" href="#${T.key}/${l.id}">
        <div class="n">${l.id}${l.kind === "review" ? " · REVIEW" : ""}</div><div class="z">${esc(Z(l, "title"))}</div><div class="te">${esc(l.title_en)}</div></a>`).join("")}</div>`;
    app.innerHTML = `<section class="thead">${sealHTML(T.zh)}<div><div class="kicker">${esc(T.en)}</div><h1>${esc(T.zh)}</h1><p>${esc(T.about)}</p></div></section>${body}
      <footer>Course content CC BY-SA 4.0 · code MIT · classical and pre-1950s texts are in the public domain.</footer>`;
    scrollTo(0, 0);
  }

  /* ---------- lesson ---------- */
  function bar(){
    const i = T.lessons.indexOf(L), p = T.lessons[i - 1], n = T.lessons[i + 1], reading = T.key !== "chengyu" && L.kind !== "review";
    return `<div class="lbar">
      <a class="ic" href="#${T.key}" aria-label="Back to ${esc(T.en)} lessons">←</a>
      <div class="ttl">${esc(T.zh)} ${L.id} ·<b>${esc(Z(L, "title"))}</b></div>
      <a class="ic" id="prev" ${p ? `href="#${T.key}/${p.id}"` : 'aria-disabled="true"'} aria-label="Previous lesson">‹</a>
      <a class="ic" id="next" ${n ? `href="#${T.key}/${n.id}"` : 'aria-disabled="true"'} aria-label="Next lesson">›</a>
      <div class="toggles">
        <button class="tg" id="tScript" aria-pressed="${simp}" title="Traditional / simplified">${simp ? "简 → 繁" : "繁 → 简"}</button>
        ${T.key === "wenyan" || T.key === "chengyu" ? `<button class="tg" id="tPy" aria-pressed="${py}">Pinyin</button>` : ""}
        ${reading || T.key === "chengyu" ? `<button class="tg" id="tCover" aria-pressed="${cover}" title="Hide the English; tap a line to check">Cover</button>` : ""}
      </div></div>`;
  }
  function finish(){
    const d = done[T.key + ":" + L.id], i = T.lessons.indexOf(L), n = T.lessons[i + 1];
    return `<div class="finish"><div class="msg">${d ? `<b>Done</b> on ${esc(d)}.` : `<b>Finished reading?</b><small>Mark it done to keep your place.</small>`}</div>
      ${d ? `<button class="btn ghost" id="undo">Undo</button>` : `<button class="btn red" id="markdone">Mark as done</button>`}
      ${n ? `<a class="btn ghost" href="#${T.key}/${n.id}">Next lesson ›</a>` : ""}</div>`;
  }
  // Mark glossary words (longest match first) and note anchors in a line.
  function markLine(line, i){
    const t = Z(line, "h");
    const words = L.glossary.map((g, gi) => ({w: Z(g, "w"), gi})).sort((a, b) => b.w.length - a.w.length);
    const ends = {};
    L.notes.filter(n => n.line === i).forEach(n => { const at = Z(n, "at"), p = t.indexOf(at); if (p >= 0) (ends[p + at.length - 1] ||= []).push(n.n); });
    let out = "", k = 0;
    while (k < t.length){
      const m = words.find(x => t.startsWith(x.w, k)), len = m ? m.w.length : 1, seg = t.slice(k, k + len);
      out += m ? `<span class="w" data-g="${m.gi}">${esc(seg)}</span>` : esc(seg);
      for (let j = k; j < k + len; j++) if (ends[j]) out += ends[j].map(n => `<sup class="nn" data-n="${n}">${n}</sup>`).join("");
      k += len;
    }
    return out;
  }
  const exerciseHTML = title => L.exercise ? `<h2>${title}</h2><div class="ex">${L.exercise.map(e => `
    <div class="e"><div class="zh">${esc(Z(e, "h"))}</div>${e.py ? `<div class="py">${esc(e.py)}</div>` : ""}
    <div class="src">${esc(e.src)}${e.to ? ` · <button class="ref" data-to="${e.to.track}/${e.to.id}">open</button>` : ""}</div>
    <details><summary>Answer</summary><p>${esc(e.en)}</p>${e.tests ? `<p class="tests">Practises: ${esc(e.tests)}</p>` : ""}</details></div>`).join("")}</div>` : "";

  const glHTML = (gs, known) => `<div class="gl ${known ? "known" : ""}">${gs.map(g => `<div class="g"><span class="c">${esc(Z(g, "w"))}</span><span class="p">${esc(g.py)}${g.hsk ? ` · old HSK ${g.hsk}` : ""}</span><span class="d">${esc(g.en)}</span>
    ${g.sw ? `<div class="sw"><b>說文</b>${esc(g.sw)}</div>` : ""}</div>`).join("")}</div>`;
  function lesson(){
    if (T.key === "chengyu") return chengyuLesson();
    const hero = (k, extra = "") => `<section class="hero">${sealHTML(Z(L, "title"))}<div><div class="kicker">${k}</div>
      <h1>${esc(Z(L, "title"))}</h1><div class="sub">${esc(L.title_py || "")}${L.title_py ? " — " : ""}${esc(L.title_en)}</div></div></section>
      ${L.intro ? `<p class="intro">${md(L.intro, T.key)}</p>` : ""}<div class="meta">${extra}<span class="badge" title="draft → good → solid">${esc(L.status)}</span></div>`;
    if (L.kind === "review"){
      app.innerHTML = bar() + hero(`Lesson ${L.id} · Review`) + `<h2>What you've learned</h2>
        <div class="recap">${L.recap.map((r, i) => `<div class="rc"><span class="num">${i + 1}</span><div>
          <h3>${md(r.topic, T.key)}</h3><p>${md(r.text, T.key)}</p>
          ${r.examples ? `<div class="rx">${(simp ? r.examples_s : r.examples).map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
          <div class="refs">${(r.refs || []).map(x => md(x, T.key)).join("")}</div></div></div>`).join("")}</div>
        ${exerciseHTML("Exercise · translate")}${finish()}<footer>Exercise texts: public domain. Course content CC BY-SA 4.0.</footer>`;
      return;
    }
    const prose = T.key === "baihua";
    app.innerHTML = bar() + hero(`Lesson ${L.id} · ${esc(prose ? L.source.author : Z(L.source, "work"))}`, `${esc(prose ? Z(L.source, "work") : L.source.author)} · ${esc(L.source.period)}`) + `
      <h2>Text</h2>
      <div class="pages ${prose ? "prose" : ""}">
        <div class="page left">${L.lines.map((l, i) => `<div class="ln ${l.p ? "p" : ""}" data-i="${i}"><div class="zh">${markLine(l, i)}</div>
          ${l.py ? `<div class="py">${esc(l.py)}</div>` : ""}<div class="en-inline">${esc(l.en)}</div></div>`).join("")}</div>
        <div class="page right">${L.lines.map((l, i) => `<div class="ln ${l.p ? "p" : ""}" data-i="${i}"><div class="en">${esc(l.en)}</div>
          ${l.lit ? `<div class="lit">lit. ${esc(l.lit)}</div>` : ""}</div>`).join("")}</div>
      </div>
      <h2>Notes</h2>
      <div class="notes">${L.notes.map(n => `<div class="note" id="n${n.n}"><span class="num">${n.n}</span><p><span class="at">${esc(Z(n, "at"))}</span>${md(n.text, T.key)}</p></div>`).join("")}</div>
      ${prose ? `<h2>Words beyond old HSK 5</h2>${glHTML(L.glossary.filter(g => !g.hsk))}
        ${L.glossary.some(g => g.hsk) ? `<h2>Already in old HSK 1–5 · here for the notes</h2>${glHTML(L.glossary.filter(g => g.hsk), true)}` : ""}`
        : `<h2>Glossary</h2>${glHTML(L.glossary)}`}
      ${exerciseHTML(prose ? "Roots · the classical sentences behind these words" : "Exercise · translate")}
      ${L.culture ? `<h2>Context</h2><div class="culture">${md(L.culture, T.key)}</div>` : ""}
      ${finish()}
      <footer>Text: public domain (${esc(L.source.text_from)}). Course content CC BY-SA 4.0.</footer>`;
    syncHeights();
  }
  function chengyuLesson(){
    const ex = x => x ? `<div class="xs"><span class="lab">Example</span><span class="zh">${esc(x.h)}</span>
      ${x.py ? `<div class="py">${esc(x.py)}${x.py_auto ? '<span class="auto" title="Generated pinyin, not yet checked by hand">AUTO</span>' : ""}</div>` : ""}
      <div class="mean">${esc(x.en)}</div><div class="lit">${esc(x.src)}</div></div>` : "";
    app.innerHTML = bar() + `<section class="hero">${sealHTML(Z(L, "title"))}<div><div class="kicker">成語 · Lesson ${L.id}</div>
        <h1>${esc(Z(L, "title"))}</h1><div class="sub">${esc(L.title_en)}</div></div></section>
      ${L.intro ? `<p class="intro">${md(L.intro, T.key)}</p>` : ""}<div class="meta"><span class="badge">${esc(L.status)}</span></div>
      ${L.frames?.length ? `<h2>Patterns</h2><div class="frames">${L.frames.map(f => `<div class="frame"><b>${esc(f.f)}</b>${esc(f.en)}</div>`).join("")}</div>` : ""}
      <h2>${L.items.length} 成語</h2>
      <div class="cys">${L.items.map(it => `<div class="cy"><div class="hw">${esc(Z(it, "w"))}</div>
        <div class="py">${esc(it.py)}${it.py_tw ? ` · TW ${esc(it.py_tw)}` : ""}</div>${it.lit ? `<div class="lit">${esc(it.lit)}</div>` : ""}
        <div class="mean">${esc(it.en)}</div>
        ${it.note ? `<div class="nt">${md(it.note, "wenyan")}</div>` : ""}
        ${it.origin ? `<div class="or"><span class="lab">Origin</span>${esc(it.origin.work)}${it.origin.text ? `<div class="zh">${esc(it.origin.text)}</div>` : ""}</div>` : ""}
        ${ex(it.ex)}</div>`).join("")}</div>
      ${finish()}<footer>Examples: Tatoeba (CC BY 2.0 FR), Chinese Wikipedia (CC BY-SA). Course content CC BY-SA 4.0.</footer>`;
  }
  // Keep left/right lines aligned on wide screens.
  function syncHeights(){
    const left = $$(".page.left .ln"), right = $$(".page.right .ln");
    left.forEach((l, i) => { l.style.minHeight = ""; right[i].style.minHeight = ""; });
    if (innerWidth <= 720) return;
    left.forEach((l, i) => { const h = Math.max(l.offsetHeight, right[i].offsetHeight); l.style.minHeight = right[i].style.minHeight = h + "px"; });
  }

  /* ---------- pop-ups ---------- */
  let popY = 0;
  function place(el){
    pop.style.display = "block"; popY = scrollY;
    const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(innerWidth - pw - 8, r.left + r.width / 2 - pw / 2)) + "px";
    pop.style.top = Math.max(8, r.bottom + 8 + ph > innerHeight ? r.top - ph - 8 : r.bottom + 8) + "px";
  }
  function showWord(el){
    const g = L.glossary[+el.dataset.g];
    $$(".w.on,sup.nn.on").forEach(x => x.classList.remove("on")); el.classList.add("on");
    pop.className = "";
    pop.innerHTML = `<span class="c">${esc(Z(g, "w"))}</span><span class="p">${esc(g.py)}</span><div>${esc(g.en)}</div>${g.sw ? `<div class="sw">說文：${esc(g.sw)}</div>` : ""}`;
    place(el);
  }
  function showNote(el){
    const n = L.notes.find(x => x.n === +el.dataset.n);
    $$(".w.on,sup.nn.on").forEach(x => x.classList.remove("on")); el.classList.add("on");
    pop.className = "note-pop";
    pop.innerHTML = `<div class="nh"><span class="num">${n.n}</span><span class="c">${esc(Z(n, "at"))}</span></div>
      <div class="nb">${md(n.text, T.key)}</div><button class="goto" data-n="${n.n}">All notes ↓</button>`;
    place(el);
  }
  function hidePop(){ pop.style.display = "none"; pop.className = ""; $$(".w.on,sup.nn.on").forEach(x => x.classList.remove("on")); }
  function flash(n){ if (!n) return; n.scrollIntoView({behavior: "smooth", block: "center"}); n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash"); }

  function saveDone(){ store.set("done", done); }

  /* ---------- settings ---------- */
  function settings(){
    const sw = (id, on) => `<button class="tg" id="${id}" aria-pressed="${on}">${on ? "On" : "Off"}</button>`;
    app.innerHTML = `<div class="set"><div class="kicker">Settings</div><h1>設定</h1>
      <div class="row"><div class="l">Simplified characters<small>The course is written in traditional characters; simplified is derived from it.</small></div>${sw("sSimp", simp)}</div>
      <div class="row"><div class="l">Pinyin under each line<small>文言 and 成語. In 白話 lessons, tap a word to see its reading.</small></div>${sw("sPy", py)}</div>
      <div class="row"><div class="l">Cover the English<small>Read the Chinese first; tap a line to check yourself.</small></div>${sw("sCover", cover)}</div>
      <div class="row"><div class="l">Night mode<small>The app stays light unless you switch this on.</small></div>${sw("sNight", store.get("night", false))}</div>
      <h2>Progress</h2>
      <div class="row"><div class="l">${Object.keys(done).length} lessons done<small>Kept in this browser only. Save a file to move it to another device.</small></div>
        <button class="btn ghost" id="save">Save</button><button class="btn ghost" id="load">Load</button><input type="file" id="file" accept="application/json,.json" hidden></div>
      <footer>Wenyan 文言 · lessons, notes and translations CC BY-SA 4.0 · code MIT.</footer></div>`;
    scrollTo(0, 0);
  }

  /* ---------- events ---------- */
  document.addEventListener("click", e => {
    const t = e.target, id = t.closest("button,a")?.id;
    const ref = t.closest(".ref");
    if (ref && ref.dataset.to){ location.hash = ref.dataset.to; return; }
    if (t.closest("#pop .goto")){ const n = $("#n" + t.closest(".goto").dataset.n); hidePop(); flash(n); return; }
    if (t.closest("#pop")) return;
    if (t.closest("sup.nn")){ showNote(t.closest("sup.nn")); return; }
    if (t.closest(".w")){ showWord(t.closest(".w")); return; }
    hidePop();
    if (id === "tScript" || id === "sSimp"){ simp = !simp; store.set("simp", simp); return go(); }
    if (id === "tPy" || id === "sPy"){ py = !py; store.set("py", py); return go(); }
    if (id === "tCover" || id === "sCover"){ cover = !cover; store.set("cover", cover); return go(); }
    if (id === "sNight"){ store.set("night", !store.get("night", false)); return go(); }
    if (id === "markdone"){ done[T.key + ":" + L.id] = today(); saveDone(); const y = scrollY; go(); scrollTo(0, y); return; }
    if (id === "undo"){ delete done[T.key + ":" + L.id]; saveDone(); const y = scrollY; go(); scrollTo(0, y); return; }
    if (id === "save"){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({app: "wenyan", saved: today(), done}, null, 1)], {type: "application/json"})); a.download = `wenyan-progress-${today()}.json`; a.click(); return; }
    if (id === "load") return $("#file").click();
    const ln = t.closest(".ln"), cy = t.closest(".cy");
    if (ln && cover) $$(`.ln[data-i="${ln.dataset.i}"]`).forEach(x => x.classList.toggle("peek"));
    if (cy && cover) cy.classList.toggle("peek");
  });
  document.addEventListener("change", async e => {
    if (e.target.id !== "file" || !e.target.files[0]) return;
    try{ const d = JSON.parse(await e.target.files[0].text()); if (d.app !== "wenyan") throw 0;
      // merge: keep the earliest finish date of each lesson (a "deck" in an older file is ignored)
      for (const k in d.done) if (!done[k] || d.done[k] < done[k]) done[k] = d.done[k];
      saveDone(); go();
    }catch(x){ alert("That file is not a Wenyan progress file."); }
  });
  addEventListener("keydown", e => {
    if (e.target.closest("input,textarea,select") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape") hidePop();
    if (L && e.key === "ArrowLeft") $("#prev")?.click();
    if (L && e.key === "ArrowRight") $("#next")?.click();
  });
  // A word pop-up closes once the page has really moved (a few pixels of font-loading shift don't count).
  addEventListener("scroll", () => { if (!pop.classList.contains("note-pop") && Math.abs(scrollY - popY) > 30) hidePop(); }, {passive: true});
  addEventListener("resize", () => { if (L) syncHeights(); });
  addEventListener("hashchange", go);

  (async () => {
    const inline = $("#course-data").textContent.trim();
    course = inline ? JSON.parse(inline) : await (await fetch("course.json")).json();
    if (!store.get("migrated", false)){ store.set("migrated", true); const old = store.get("lesson", null); if (old !== null && !location.hash && course.tracks[0].lessons[old]) location.hash = "wenyan/" + course.tracks[0].lessons[old].id; }
    go();
    if (document.fonts) document.fonts.ready.then(() => { if (L) syncHeights(); });
  })();
})();
</script>
</body>
</html>
