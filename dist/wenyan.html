here 以此故法 is simply \"with these old laws\" (→ L1 n.10).\n", "at_s": "故法为其国"}, {"n": 10, "line": 12, "at": "徙", "text": "**徙** xǐ \"to move, shift\" — used of people, capitals, and here of the times. The author mirrors the story: the boat moved, the sword didn't; the times moved, the laws didn't.\n", "at_s": "徙"}, {"n": 11, "line": 15, "at": "豈不難哉", "text": "**豈 … 哉** \"how could …?!\": 豈 qǐ starts a rhetorical question, 哉 zāi ends an exclamation. 豈不難哉 \"how could it not be difficult!\" = it is certainly difficult.\n", "at_s": "岂不难哉"}], "glossary": [{"w": "涉", "py": "shè", "en": "to cross (a river)", "checked": ["cyz"], "w_s": "涉"}, {"w": "江", "py": "jiāng", "en": "the Yangzi; (later) river", "checked": ["cyz"], "w_s": "江"}, {"w": "劍", "py": "jiàn", "en": "sword", "checked": [], "w_s": "剑"}, {"w": "自", "py": "zì", "en": "from", "checked": ["cyz"], "w_s": "自"}, {"w": "舟", "py": "zhōu", "en": "boat", "checked": ["cyz"], "w_s": "舟"}, {"w": "墜", "py": "zhuì", "en": "to fall", "drop": null, "checked": ["cyz"], "w_s": "坠"}, {"w": "遽", "py": "jù", "en": "at once, hastily", "checked": ["cyz"], "w_s": "遽"}, {"w": "契", "py": "qì", "en": "to carve a notch", "checked": ["cyz"], "w_s": "契"}, {"w": "是", "py": "shì", "en": "this (summing up)", "checked": ["cyz"], "w_s": "是"}, {"w": "所", "py": "suǒ", "en": "nominaliser: the place / thing that …", "checked": ["cyz"], "w_s": "所"}, {"w": "從", "py": "cóng", "en": "from", "checked": ["cyz"], "w_s": "从"}, {"w": "止", "py": "zhǐ", "en": "to stop", "checked": ["cyz"], "w_s": "止"}, {"w": "入", "py": "rù", "en": "to enter", "checked": ["cyz"], "w_s": "入"}, {"w": "求", "py": "qiú", "en": "to look for, seek", "checked": ["cyz"], "w_s": "求"}, {"w": "已", "py": "yǐ", "en": "already", "checked": ["cyz"], "w_s": "已"}, {"w": "行", "py": "xíng", "en": "to move, go", "checked": ["cyz"], "w_s": "行"}, {"w": "若", "py": "ruò", "en": "like, as", "checked": ["cyz"], "w_s": "若"}, {"w": "此", "py": "cǐ", "en": "this", "checked": ["cyz"], "w_s": "此"}, {"w": "亦", "py": "yì", "en": "also (不亦…乎 isn't it …?)", "checked": ["cyz"], "w_s": "亦"}, {"w": "惑", "py": "huò", "en": "deluded, foolish", "checked": ["cyz"], "w_s": "惑"}, {"w": "乎", "py": "hū", "en": "question particle", "checked": ["cyz"], "w_s": "乎"}, {"w": "故", "py": "gù", "en": "old, former", "checked": ["cyz"], "w_s": "故"}, {"w": "法", "py": "fǎ", "en": "law, method", "checked": ["cyz"], "w_s": "法"}, {"w": "時", "py": "shí", "en": "the times", "checked": ["cyz"], "w_s": "时"}, {"w": "徙", "py": "xǐ", "en": "to move, shift", "checked": ["cyz"], "w_s": "徙"}, {"w": "豈", "py": "qǐ", "en": "how could …? (rhetorical)", "checked": ["cyz"], "w_s": "岂"}, {"w": "難", "py": "nán", "en": "difficult", "checked": ["cyz"], "w_s": "难"}, {"w": "哉", "py": "zāi", "en": "exclamatory particle", "checked": ["cyz"], "w_s": "哉"}], "exercise": [{"h": "學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？", "py": "Xué ér shí xí zhī, bù yì yuè hū? Yǒu péng zì yuǎn fāng lái, bù yì lè hū?", "src": "論語·學而", "en": "To learn and practise it at the right times — is that not a pleasure? To have friends come from afar — is that not a joy?", "tests": "不亦…乎, 自", "h_s": "学而时习之，不亦说乎？有朋自远方来，不亦乐乎？"}, {"h": "己所不欲，勿施於人。", "py": "Jǐ suǒ bù yù, wù shī yú rén.", "src": "論語·衛靈公", "en": "What you yourself do not want, do not do to others.", "tests": "所 (所不欲 \"what one doesn't want\"), 於", "h_s": "己所不欲，勿施于人。"}, {"h": "是可忍也，孰不可忍也？", "py": "Shì kě rěn yě, shú bù kě rěn yě?", "src": "論語·八佾", "en": "If this can be tolerated, what cannot?", "tests": "是 = this, 可 + verb (→ L1 n.8)", "h_s": "是可忍也，孰不可忍也？"}, {"h": "逝者如斯夫！不舍晝夜。", "py": "Shì zhě rú sī fú! Bù shě zhòu yè.", "src": "論語·子罕", "en": "What passes away is like this, day and night without ceasing!", "tests": "如 = 若, 者, 夫 (exclamatory, at the end)", "h_s": "逝者如斯夫！不舍昼夜。"}], "culture": "Lü Buwei, a merchant, became chancellor of Qin and patron of the young king who would become the First Emperor. He had the book displayed at the gate of the Qin capital and offered a thousand pieces of gold to anyone who could add or remove a single character (一字千金). Like Han Fei, the authors of 察今 argue against copying the laws of the ancient kings: \"times change, so laws must change\".\n", "title_s": "刻舟求剑"}, {"id": 5, "slug": "hua-she", "title": "畫蛇添足", "title_py": "Huà shé tiān zú", "title_en": "Drawing Feet on the Snake", "source": {"work": "戰國策·齊策二", "author": "anonymous; compiled by 劉向 Liu Xiang (77–6 BC)", "period": "Warring States stories, Han compilation", "text_from": "《戰國策·齊策二·昭陽為楚伐魏》, the standard text, matched against a published edition and the 古汉语常用字字典's quotation of the last line; punctuation modernised.\n", "work_s": "战国策·齐策二"}, "status": "draft", "intro": "The *Intrigues of the Warring States* collects the speeches of travelling persuaders, men who went from court to court selling strategies. Here the persuader 陳軫 Chen Zhen meets a Chu general who has just won a great victory and wants to attack the state of Qi as well. He tells him this story to say: you already have the wine — stop while you're ahead. New in this lesson: the \"not yet\" negative 未, the question word 安 \"how\", and 為 meaning \"to make\".\n", "lines": [{"h": "楚有祠者，", "py": "Chǔ yǒu cí zhě,", "en": "In Chu there was a man who made a sacrifice to his ancestors.", "h_s": "楚有祠者，"}, {"h": "賜其舍人卮酒。", "py": "cì qí shè rén zhī jiǔ.", "en": "He gave his retainers a flagon of wine.", "h_s": "赐其舍人卮酒。"}, {"h": "舍人相謂曰：", "py": "Shè rén xiāng wèi yuē:", "en": "The retainers said to one another:", "h_s": "舍人相谓曰："}, {"h": "「數人飲之不足，", "py": "Shù rén yǐn zhī bù zú,", "en": "\"For several of us to drink it, it's not enough;", "h_s": "「数人饮之不足，"}, {"h": "一人飲之有餘。", "py": "yī rén yǐn zhī yǒu yú.", "en": "for one to drink it, there's more than enough.", "h_s": "一人饮之有余。"}, {"h": "請畫地為蛇，", "py": "Qǐng huà dì wéi shé,", "en": "Let's each draw a snake on the ground,", "h_s": "请画地为蛇，"}, {"h": "先成者飲酒。」", "py": "xiān chéng zhě yǐn jiǔ.", "en": "and whoever finishes first drinks the wine.\"", "h_s": "先成者饮酒。」"}, {"h": "一人蛇先成，", "py": "Yī rén shé xiān chéng,", "en": "One man's snake was done first.", "h_s": "一人蛇先成，"}, {"h": "引酒且飲之，", "py": "yǐn jiǔ qiě yǐn zhī,", "en": "He pulled the wine towards him and was about to drink it,", "h_s": "引酒且饮之，"}, {"h": "乃左手持卮，", "py": "nǎi zuǒ shǒu chí zhī,", "en": "but then, holding the flagon in his left hand,", "h_s": "乃左手持卮，"}, {"h": "右手畫蛇，曰：", "py": "yòu shǒu huà shé, yuē:", "en": "and drawing on the snake with his right, he said:", "h_s": "右手画蛇，曰："}, {"h": "「吾能為之足。」", "py": "Wú néng wéi zhī zú.", "en": "\"I can give it feet!\"", "lit": "I can make it feet", "h_s": "「吾能为之足。」"}, {"h": "未成，", "py": "Wèi chéng,", "en": "Before he had finished,", "h_s": "未成，"}, {"h": "一人之蛇成，", "py": "yī rén zhī shé chéng,", "en": "another man's snake was done.", "h_s": "一人之蛇成，"}, {"h": "奪其卮曰：", "py": "duó qí zhī yuē:", "en": "He snatched the flagon and said:", "h_s": "夺其卮曰："}, {"h": "「蛇固無足，", "py": "Shé gù wú zú,", "en": "\"Snakes have no feet, of course:", "h_s": "「蛇固无足，"}, {"h": "子安能為之足？」", "py": "zǐ ān néng wéi zhī zú?", "en": "how can you give it feet?\"", "h_s": "子安能为之足？」"}, {"h": "遂飲其酒。", "py": "Suì yǐn qí jiǔ.", "en": "And so he drank the wine.", "h_s": "遂饮其酒。"}, {"h": "為蛇足者，", "py": "Wéi shé zú zhě,", "en": "The one who drew feet on the snake", "h_s": "为蛇足者，"}, {"h": "終亡其酒。", "py": "zhōng wáng qí jiǔ.", "en": "lost his wine in the end.", "h_s": "终亡其酒。"}], "notes": [{"n": 1, "line": 0, "at": "祠", "text": "**祠** cí \"to make an offering (to ancestors or spirits)\". After the rite the sacrificial wine was shared out. 楚有祠者 \"in Chu there was one who sacrificed\": the 有…者 opening again (→ L1 n.2), this time with a place (楚) as the topic.\n", "at_s": "祠"}, {"n": 2, "line": 1, "at": "舍人卮酒", "text": "**舍人** shè rén \"retainers, household men\" (舍 \"lodging\": those who lodged in his house). **卮** zhī is a wine flagon; 卮酒 \"a flagon of wine\" — the container works as a measure word. **賜** cì \"to give (from a superior)\". 賜 + person + thing: two objects, as in English \"gave his men wine\".\n", "at_s": "舍人卮酒"}, {"n": 3, "line": 2, "at": "相謂", "text": "**相** xiāng before a verb = \"each other, mutually\": 相謂 \"said to each other\". (It can also mean \"to someone\", as in modern 相信, but here it's reciprocal.)\n", "at_s": "相谓"}, {"n": 4, "line": 3, "at": "數人飲之不足", "text": "**數** shù \"several\" (read shǔ as the verb \"to count\"). The two lines are a perfect parallel pair: 數人飲之 | 不足 / 一人飲之 | 有餘. **足** \"enough\" and **餘** \"surplus\". The whole story will pun on 足, which also means \"foot\".\n", "at_s": "数人饮之不足"}, {"n": 5, "line": 5, "at": "請", "text": "**請** qǐng \"please (let us) …\": a polite proposal. **畫地為蛇** \"draw on the ground to make a snake\": 為 wéi \"to make, to be (as)\".\n", "at_s": "请"}, {"n": 6, "line": 8, "at": "且", "text": "**且** qiě before a verb = \"about to\": 且飲之 \"was about to drink it\". (Elsewhere 且 means \"and, moreover\".) **引** yǐn \"to draw, pull towards oneself\".\n", "at_s": "且"}, {"n": 7, "line": 9, "at": "乃", "text": "**乃** nǎi \"then, thereupon\", often with a sense of surprise or contrast: \"but then he …\". Compare 因 (→ L1 n.5) and 遂 (n. 11).\n", "at_s": "乃"}, {"n": 8, "line": 11, "at": "為之足", "text": "**為之足** wéi zhī zú \"make feet for it\": 為 takes two objects, 之 \"it (the snake)\" and 足 \"feet\". Some editions and teachers read it wèi zhī zú \"draw feet *for* it\", with 為 as a preposition; the meaning is the same.\n", "at_s": "为之足"}, {"n": 9, "line": 12, "at": "未", "text": "**未** wèi = \"not yet\". 未成 \"(he had) not yet finished\". Compare 不 (simple \"not\") and 弗 (→ L2 n.8). 未 often implies \"but it will / should happen\".\n", "at_s": "未"}, {"n": 10, "line": 15, "at": "固", "text": "**固** gù \"certainly, by nature, of course\": 蛇固無足 \"snakes, by their nature, have no feet\". **安** ān in line 17 is a question word, \"how? where?\": 子安能 \"how can you …?\" — not \"peaceful\".\n", "at_s": "固"}, {"n": 11, "line": 17, "at": "遂", "text": "**遂** suì \"and so, thereupon, then (as a result)\". **飲其酒** \"drank *his* wine\": 其 is the would-be winner's — it was his by rights.\n", "at_s": "遂"}, {"n": 12, "line": 19, "at": "亡", "text": "**亡** wáng = \"to lose\" (and \"to flee, to perish\"), not only \"to die\". 終亡其酒 \"in the end lost his wine\". **終** zhōng \"in the end\". The idiom 畫蛇添足 \"draw a snake and add feet\" means to spoil something by overdoing it.\n", "at_s": "亡"}], "glossary": [{"w": "祠", "py": "cí", "en": "to make an offering (to ancestors)", "checked": ["cyz"], "w_s": "祠"}, {"w": "賜", "py": "cì", "en": "to give (to an inferior)", "checked": ["cyz"], "w_s": "赐"}, {"w": "舍人", "py": "shè rén", "en": "retainers, household men", "checked": [], "w_s": "舍人"}, {"w": "卮", "py": "zhī", "en": "wine flagon", "checked": ["cyz"], "w_s": "卮"}, {"w": "酒", "py": "jiǔ", "en": "wine", "checked": [], "w_s": "酒"}, {"w": "相", "py": "xiāng", "en": "each other", "checked": ["cyz"], "w_s": "相"}, {"w": "數", "py": "shù", "en": "several", "checked": ["cyz"], "w_s": "数"}, {"w": "飲", "py": "yǐn", "en": "to drink", "checked": ["cyz"], "w_s": "饮"}, {"w": "足", "py": "zú", "en": "enough; foot", "checked": ["cyz"], "w_s": "足"}, {"w": "餘", "py": "yú", "en": "surplus, more than enough", "checked": ["cyz"], "w_s": "余"}, {"w": "請", "py": "qǐng", "en": "please, let us …", "checked": ["cyz"], "w_s": "请"}, {"w": "畫", "py": "huà", "en": "to draw", "checked": ["cyz"], "w_s": "画"}, {"w": "蛇", "py": "shé", "en": "snake", "checked": [], "w_s": "蛇"}, {"w": "先", "py": "xiān", "en": "first", "checked": ["cyz"], "w_s": "先"}, {"w": "成", "py": "chéng", "en": "to complete, be finished", "checked": ["cyz"], "w_s": "成"}, {"w": "引", "py": "yǐn", "en": "to pull towards oneself", "checked": ["cyz"], "w_s": "引"}, {"w": "且", "py": "qiě", "en": "about to", "checked": ["cyz"], "w_s": "且"}, {"w": "乃", "py": "nǎi", "en": "then, thereupon", "checked": ["cyz"], "w_s": "乃"}, {"w": "持", "py": "chí", "en": "to hold", "checked": ["cyz"], "w_s": "持"}, {"w": "未", "py": "wèi", "en": "not yet", "checked": ["cyz"], "w_s": "未"}, {"w": "奪", "py": "duó", "en": "to snatch, seize", "checked": ["cyz"], "w_s": "夺"}, {"w": "固", "py": "gù", "en": "by nature, certainly", "checked": ["cyz"], "w_s": "固"}, {"w": "安", "py": "ān", "en": "how? (question word)", "checked": ["cyz"], "w_s": "安"}, {"w": "遂", "py": "suì", "en": "thereupon, and so", "checked": ["cyz"], "w_s": "遂"}, {"w": "終", "py": "zhōng", "en": "in the end", "checked": ["cyz"], "w_s": "终"}, {"w": "亡", "py": "wáng", "en": "to lose", "checked": ["cyz"], "w_s": "亡"}], "exercise": [{"h": "未知生，焉知死？", "py": "Wèi zhī shēng, yān zhī sǐ?", "src": "論語·先進", "en": "Not yet understanding life, how could one understand death?", "tests": "未, 焉 = 安 \"how\"", "h_s": "未知生，焉知死？"}, {"h": "亡羊而補牢，未為遲也。", "py": "Wáng yáng ér bǔ láo, wèi wéi chí yě.", "src": "戰國策·楚策四", "en": "To mend the pen after losing a sheep is not yet too late.", "tests": "亡 = lose, 未, 而", "h_s": "亡羊而补牢，未为迟也。"}, {"h": "泉涸，魚相與處於陸，相呴以濕，相濡以沫，不如相忘於江湖。", "py": "Quán hé, yú xiāng yǔ chǔ yú lù, xiāng xǔ yǐ shī, xiāng rú yǐ mò, bù rú xiāng wàng yú jiāng hú.", "src": "莊子·大宗師", "en": "When the spring dries up, the fish are left together on dry land; they moisten each other with their breath and wet each other with their spittle. Better to forget each other in the rivers and lakes.", "tests": "相 = each other, 於", "h_s": "泉涸，鱼相与处于陆，相呴以湿，相濡以沫，不如相忘于江湖。"}], "culture": "The frame story: 昭陽 Zhao Yang, chief minister and general of Chu, has crushed Wei and is marching on Qi. Qi sends 陳軫 Chen Zhen to him. After the fable Chen Zhen points out that Zhao Yang already holds the highest rank Chu can give; even if he wins, he gains nothing more, and if he loses, he loses everything — like the man who drew the feet. Zhao Yang turned back.\n", "title_s": "画蛇添足"}, {"id": 6, "slug": "hu-jia-hu-wei", "title": "狐假虎威", "title_py": "Hú jiǎ hǔ wēi", "title_en": "The Fox Borrows the Tiger's Might", "source": {"work": "戰國策·楚策一", "author": "anonymous; compiled by 劉向 Liu Xiang (77–6 BC)", "period": "Warring States stories, Han compilation", "text_from": "《戰國策·楚策一·江乙對荊宣王》, as printed in 王力《古代漢語》 unit 1; its dash before 猶 is replaced by a comma.\n", "work_s": "战国策·楚策一"}, "status": "draft", "intro": "The first fable told *inside* a conversation, the way persuaders actually used them. King Xuan of Chu (here called 荊, an old name for Chu) asks why the northern states fear his minister Zhao Xixu. Jiang Yi, a rival of Zhao's, answers with a story. Watch three things: the 之 of L2 doing heavy work in long sentences, 以 A 為 B \"to regard A as B\", and two words, 地方 and 其實, that look modern but aren't.\n", "lines": [{"h": "荊宣王問群臣曰：", "py": "Jīng Xuān wáng wèn qún chén yuē:", "en": "King Xuan of Jing asked his ministers:", "h_s": "荆宣王问群臣曰："}, {"h": "「吾聞北方之畏昭奚恤也，", "py": "Wú wén běi fāng zhī wèi Zhāo Xīxù yě,", "en": "\"I hear that the north fears Zhao Xixu.", "h_s": "「吾闻北方之畏昭奚恤也，"}, {"h": "果誠何如？」", "py": "guǒ chéng hé rú?", "en": "Is it really so?\"", "h_s": "果诚何如？」"}, {"h": "群臣莫對。", "py": "Qún chén mò duì.", "en": "None of the ministers answered.", "h_s": "群臣莫对。"}, {"h": "江乙對曰：", "py": "Jiāng Yǐ duì yuē:", "en": "Jiang Yi replied:", "h_s": "江乙对曰："}, {"h": "「虎求百獸而食之，", "py": "Hǔ qiú bǎi shòu ér shí zhī,", "en": "\"A tiger was hunting all the beasts to eat them,", "h_s": "「虎求百兽而食之，"}, {"h": "得狐。", "py": "dé hú.", "en": "and caught a fox.", "h_s": "得狐。"}, {"h": "狐曰：『子無敢食我也！", "py": "Hú yuē: Zǐ wú gǎn shí wǒ yě!", "en": "The fox said: 'Don't you dare eat me!", "h_s": "狐曰：『子无敢食我也！"}, {"h": "天帝使我長百獸，", "py": "Tiān dì shǐ wǒ zhǎng bǎi shòu,", "en": "The Lord of Heaven has made me chief of all the beasts;", "h_s": "天帝使我长百兽，"}, {"h": "今子食我，", "py": "jīn zǐ shí wǒ,", "en": "if you eat me now,", "h_s": "今子食我，"}, {"h": "是逆天帝命也。", "py": "shì nì tiān dì mìng yě.", "en": "that is defying the Lord of Heaven's command.", "h_s": "是逆天帝命也。"}, {"h": "子以我為不信，", "py": "Zǐ yǐ wǒ wéi bù xìn,", "en": "If you think I'm lying,", "lit": "you take me as not truthful", "h_s": "子以我为不信，"}, {"h": "吾為子先行，", "py": "wú wèi zǐ xiān xíng,", "en": "I'll walk ahead of you,", "h_s": "吾为子先行，"}, {"h": "子隨我後，", "py": "zǐ suí wǒ hòu,", "en": "you follow behind me,", "h_s": "子随我后，"}, {"h": "觀百獸之見我而敢不走乎？』", "py": "guān bǎi shòu zhī jiàn wǒ ér gǎn bù zǒu hū?", "en": "and see whether a single beast that sees me dares not run!'", "h_s": "观百兽之见我而敢不走乎？』"}, {"h": "虎以為然，", "py": "Hǔ yǐ wéi rán,", "en": "The tiger thought he was right,", "h_s": "虎以为然，"}, {"h": "故遂與之行，", "py": "gù suì yǔ zhī xíng,", "en": "so it went along with him.", "h_s": "故遂与之行，"}, {"h": "獸見之皆走。", "py": "shòu jiàn zhī jiē zǒu.", "en": "The beasts saw them and all ran.", "h_s": "兽见之皆走。"}, {"h": "虎不知獸畏己而走也，", "py": "Hǔ bù zhī shòu wèi jǐ ér zǒu yě,", "en": "The tiger didn't realise the beasts ran because they feared *it*;", "h_s": "虎不知兽畏己而走也，"}, {"h": "以為畏狐也。", "py": "yǐ wéi wèi hú yě.", "en": "it thought they feared the fox.", "h_s": "以为畏狐也。"}, {"h": "今王之地方五千里，", "py": "Jīn wáng zhī dì fāng wǔ qiān lǐ,", "en": "Now Your Majesty's land is five thousand li on each side,", "lit": "your land — square five-thousand li", "h_s": "今王之地方五千里，"}, {"h": "帶甲百萬，", "py": "dài jiǎ bǎi wàn,", "en": "with a million men in armour,", "h_s": "带甲百万，"}, {"h": "而專屬之昭奚恤。", "py": "ér zhuān zhǔ zhī Zhāo Xīxù.", "en": "and you have entrusted them all to Zhao Xixu.", "h_s": "而专属之昭奚恤。"}, {"h": "故北方之畏奚恤也，", "py": "Gù běi fāng zhī wèi Xīxù yě,", "en": "So when the north fears Xixu,", "h_s": "故北方之畏奚恤也，"}, {"h": "其實畏王之甲兵也，", "py": "qí shí wèi wáng zhī jiǎ bīng yě,", "en": "what it really fears is Your Majesty's army,", "h_s": "其实畏王之甲兵也，"}, {"h": "猶百獸之畏虎也。」", "py": "yóu bǎi shòu zhī wèi hǔ yě.", "en": "just as the beasts feared the tiger.\"", "h_s": "犹百兽之畏虎也。」"}], "notes": [{"n": 1, "line": 0, "at": "荊宣王", "text": "**荊** Jīng is another name for Chu (楚). 宣王 King Xuan reigned 369–340 BC. **群臣** \"the assembled ministers\". The 戰國策 is full of scenes like this: a king asks, the court falls silent, one adviser speaks.\n", "at_s": "荆宣王"}, {"n": 2, "line": 1, "at": "北方之畏昭奚恤也", "text": "**Subject + 之 + predicate as an object** (→ L2 n.3). 北方畏昭奚恤 would be a sentence, \"the north fears Zhao Xixu\"; with 之 it becomes a noun phrase, \"the north's fearing Zhao Xixu\", the object of 聞 \"I hear (of)\". The final 也 marks a pause before the question. The same pattern returns in lines 15, 24 and 26.\n", "at_s": "北方之畏昭奚恤也"}, {"n": 3, "line": 2, "at": "果誠何如", "text": "**果** and **誠** both mean \"really, truly\" (果 survives in 果然 \"sure enough\"). 何如 \"how is it?\" (→ L2 n.7).\n", "at_s": "果诚何如"}, {"n": 4, "line": 3, "at": "莫對", "text": "**莫** \"no one\" (→ L2 n.4). **對** duì = to reply *to a superior*: ministers 對 the king; the king 問 or 曰.\n", "at_s": "莫对"}, {"n": 5, "line": 5, "at": "食之", "text": "**食** shí \"to eat\" (the modern word is 吃). Read sì when it means \"to feed someone\". 求 here is \"to hunt for, look for\" (→ L4).\n", "at_s": "食之"}, {"n": 6, "line": 7, "at": "無敢", "text": "**無** here = **毋** wú \"don't!\": a prohibition. 子無敢食我也 \"don't you dare eat me\". Classical Chinese uses 無/毋 and 勿 for \"don't\", where modern Chinese says 別 or 不要.\n", "at_s": "无敢"}, {"n": 7, "line": 8, "at": "使我長百獸", "text": "**使 A V** \"make A do V, have A V\": a causative. **長** zhǎng (→ L3 n.2) \"chief\" used as a verb: 長百獸 \"to be chief of the hundred beasts\". 百獸 \"the hundred beasts\" = all animals.\n", "at_s": "使我长百兽"}, {"n": 8, "line": 10, "at": "是逆", "text": "**是** = \"this (that you'd be doing)\" (→ L4 n.4). 是逆天帝命也 \"this is defying the Lord of Heaven's command\" — 也 closes the judgment (→ L1 n.11). **逆** nì \"to go against, defy\".\n", "at_s": "是逆"}, {"n": 9, "line": 11, "at": "以我為不信", "text": "**以 A 為 B** \"to regard A as B\": 以我為不信 \"regard me as untruthful\". Two lines later, 以為 (→ L3 n.10) \"to think\" is the same structure with the A left out: 虎以為然 \"the tiger considered (it) right\". **信** xìn \"truthful, trustworthy\"; **然** rán \"so, right\".\n", "at_s": "以我为不信"}, {"n": 10, "line": 12, "at": "為子先行", "text": "**為** wèi \"for, on behalf of\": 為子先行 \"walk ahead for you\". Contrast 為 wéi \"to be, to make\" (L4, L5). And **行** = \"walk\" vs **走** = \"run\" (line 15): both in the same breath, the clearest proof of → L1 n.3.\n", "at_s": "为子先行"}, {"n": 11, "line": 14, "at": "敢不走乎", "text": "**敢不 V 乎** \"dare not V?\": a rhetorical question meaning \"none will dare *not* run\" = they will all run. **觀** guān \"to observe, watch\".\n", "at_s": "敢不走乎"}, {"n": 12, "line": 18, "at": "畏己而走", "text": "**己** jǐ \"oneself\": 畏己 \"feared *it* (the tiger itself)\". 己 refers back to the subject of the main clause, 虎.\n", "at_s": "畏己而走"}, {"n": 13, "line": 20, "at": "地方", "text": "**地方 is two words!** Read 地 | 方五千里: \"(your) land — five thousand li square\", i.e. five thousand li from east to west and from north to south. Modern 地方 \"place\" is a later compound; reading it here would be a classic 古今 mistake. (A 里 lǐ was roughly 400 m.)\n", "at_s": "地方"}, {"n": 14, "line": 21, "at": "帶甲", "text": "**帶甲** \"wearing armour\" = armoured soldiers. **屬** zhǔ (line 23) \"to entrust\": 專屬之昭奚恤 \"entrust them solely to Zhao Xixu\", with 之 = \"them\" (the million soldiers) and 昭奚恤 as the second object.\n", "at_s": "带甲"}, {"n": 15, "line": 24, "at": "其實", "text": "**其實** = \"the reality of it\", not the modern adverb \"actually\". The sentence is: [北方之畏 奚恤也] subject, [其實] \"its reality\", [畏王之甲兵也] predicate: \"the north's fearing Xixu — the truth of it is fearing Your Majesty's armies\". 甲兵 \"armour and weapons\" = the army.\n", "at_s": "其实"}, {"n": 16, "line": 25, "at": "猶", "text": "**猶** yóu \"to be like, just as\" (also \"still\"). Jiang Yi closes by mapping the fable onto the court: king = tiger, Zhao Xixu = fox. That's the persuader's art: never say it directly.\n", "at_s": "犹"}], "glossary": [{"w": "荊", "py": "Jīng", "en": "Jing (= Chu)", "checked": ["cyz"], "w_s": "荆"}, {"w": "問", "py": "wèn", "en": "to ask", "checked": ["cyz"], "w_s": "问"}, {"w": "群臣", "py": "qún chén", "en": "the ministers, the court", "checked": [], "w_s": "群臣"}, {"w": "聞", "py": "wén", "en": "to hear (of)", "checked": ["cyz"], "w_s": "闻"}, {"w": "北方", "py": "běi fāng", "en": "the north (the Central States)", "checked": [], "w_s": "北方"}, {"w": "畏", "py": "wèi", "en": "to fear", "checked": ["cyz"], "w_s": "畏"}, {"w": "果", "py": "guǒ", "en": "really, sure enough", "checked": ["cyz"], "w_s": "果"}, {"w": "誠", "py": "chéng", "en": "truly, really", "checked": ["cyz"], "w_s": "诚"}, {"w": "對", "py": "duì", "en": "to reply (to a superior)", "checked": ["cyz"], "w_s": "对"}, {"w": "虎", "py": "hǔ", "en": "tiger", "checked": [], "w_s": "虎"}, {"w": "獸", "py": "shòu", "en": "beast, wild animal", "checked": [], "w_s": "兽"}, {"w": "食", "py": "shí", "en": "to eat", "checked": ["cyz"], "w_s": "食"}, {"w": "狐", "py": "hú", "en": "fox", "checked": ["cyz"], "w_s": "狐"}, {"w": "敢", "py": "gǎn", "en": "to dare", "checked": ["cyz"], "w_s": "敢"}, {"w": "天帝", "py": "tiān dì", "en": "the Lord of Heaven", "checked": [], "w_s": "天帝"}, {"w": "使", "py": "shǐ", "en": "to make (someone do)", "checked": ["cyz"], "w_s": "使"}, {"w": "逆", "py": "nì", "en": "to go against, defy", "checked": ["cyz"], "w_s": "逆"}, {"w": "命", "py": "mìng", "en": "command", "checked": ["cyz"], "w_s": "命"}, {"w": "信", "py": "xìn", "en": "truthful, trustworthy", "checked": ["cyz"], "w_s": "信"}, {"w": "隨", "py": "suí", "en": "to follow", "checked": ["cyz"], "w_s": "随"}, {"w": "後", "py": "hòu", "en": "behind", "checked": ["cyz"], "w_s": "后"}, {"w": "觀", "py": "guān", "en": "to watch, observe", "checked": ["cyz"], "w_s": "观"}, {"w": "見", "py": "jiàn", "en": "to see", "checked": ["cyz"], "w_s": "见"}, {"w": "然", "py": "rán", "en": "so, right", "checked": ["cyz"], "w_s": "然"}, {"w": "己", "py": "jǐ", "en": "oneself", "checked": ["cyz"], "w_s": "己"}, {"w": "方", "py": "fāng", "en": "square; on each side", "checked": ["cyz"], "w_s": "方"}, {"w": "里", "py": "lǐ", "en": "li (unit of distance)", "checked": ["cyz"], "w_s": "里"}, {"w": "帶甲", "py": "dài jiǎ", "en": "armoured soldiers", "checked": [], "w_s": "带甲"}, {"w": "專", "py": "zhuān", "en": "solely, exclusively", "checked": ["cyz"], "w_s": "专"}, {"w": "屬", "py": "zhǔ", "en": "to entrust", "checked": ["cyz"], "w_s": "属"}, {"w": "其實", "py": "qí shí", "en": "the reality of it", "checked": [], "w_s": "其实"}, {"w": "甲兵", "py": "jiǎ bīng", "en": "armour and weapons; the army", "checked": [], "w_s": "甲兵"}, {"w": "猶", "py": "yóu", "en": "just as, like", "checked": ["cyz"], "w_s": "犹"}], "exercise": [{"h": "知之為知之，不知為不知，是知也。", "py": "Zhī zhī wéi zhī zhī, bù zhī wéi bù zhī, shì zhī yě.", "src": "論語·為政", "en": "To count what you know as knowing it, and what you don't know as not knowing it — that is knowledge.", "tests": "為 = count as, 是 = this, 也", "h_s": "知之为知之，不知为不知，是知也。"}, {"h": "人而無信，不知其可也。", "py": "Rén ér wú xìn, bù zhī qí kě yě.", "src": "論語·為政", "en": "A person without trustworthiness — I don't know how that could work.", "tests": "信, 無, 其", "h_s": "人而无信，不知其可也。"}, {"h": "過猶不及。", "py": "Guò yóu bù jí.", "src": "論語·先進", "en": "Going too far is just like falling short.", "tests": "猶", "h_s": "过犹不及。"}], "culture": "The fox's trick gave Chinese the idiom 狐假虎威 \"the fox borrows the tiger's majesty\" (假 jiǎ \"to borrow\" — the word itself is not in the story). It is used of underlings who throw their weight around on the strength of a powerful patron. Jiang Yi's real target was his rival Zhao Xixu: by reminding the king whose power it really was, he cut Zhao down to size.\n", "title_s": "狐假虎威"}, {"id": 7, "slug": "review-1", "kind": "review", "title": "複習一", "title_py": "Fùxí yī", "title_en": "Review 1: Lessons 1–6", "status": "draft", "intro": "Six fables, about 300 characters, and most of the machinery of Classical Chinese prose is already in place. Re-read the six texts once more, aloud, with Cover on. Then go through the points below: each one sends you back to the note where it was first explained. Finish with the exercise: six new sentences from the 論語, using only what you've met.\n", "recap": [{"topic": "有 … 者: bringing a character on stage", "refs": ["L1 n.2", "L3 n.1", "L4 n.1", "L5 n.1"], "text": "Place or group + 有 + verb phrase + 者 = \"there was one (from X) who …\". Every fable but L6 opens this way: 宋人有耕者 · 楚人有鬻楯與矛者 · 宋人有閔其苗之不長而揠之者 · 楚人有涉江者 · 楚有祠者.\n", "examples": ["宋人有耕者", "楚人有涉江者", "楚有祠者"], "examples_s": ["宋人有耕者", "楚人有涉江者", "楚有祠者"]}, {"topic": "The four faces of 之", "refs": ["L1 n.10", "L2 n.2", "L2 n.3", "L6 n.2"], "text": "(1) between two nouns, like 的: 先王之政. (2) after a verb, \"him / it / them\": 譽之, 求之. (3) between subject and predicate, turning a sentence into a noun phrase: 吾楯之堅 \"the hardness of my shield\", 北方之畏昭奚恤 \"the north's fearing Zhao Xixu\". (4) as a verb, \"to go to\" — not seen yet, but coming.\n", "examples": ["先王之政", "譽之", "吾楯之堅", "北方之畏昭奚恤也"], "examples_s": ["先王之政", "誉之", "吾楯之坚", "北方之畏昭奚恤也"]}, {"topic": "也 and 矣", "refs": ["L1 n.11", "L3 n.5", "L3 n.11"], "text": "也 closes a statement of what *is*: 皆守株之類也, A者 B者也. 矣 marks what *has come to be*: 今日病矣, 苗則槁矣, 舟已行矣. A sentence with no verb + 也 is the Classical \"A is B\"; 是 still means \"this\".\n", "examples": ["皆守株之類也", "不耘苗者也", "苗則槁矣", "是吾劍之所從墜"], "examples_s": ["皆守株之类也", "不耘苗者也", "苗则槁矣", "是吾剑之所从坠"]}, {"topic": "Five negatives", "refs": ["L2 n.4", "L2 n.8", "L3 n.12", "L5 n.9", "L6 n.6"], "text": "不 plain \"not\" · 弗 \"not (it)\" · 未 \"not yet\" · 非 \"it is not that\" · 無/毋 \"there is no; don't!\" — plus 莫 \"no one / nothing\", a pronoun with the negation built in. Double negatives make strong positives: 無不陷 \"pierces everything\".\n", "examples": ["其人弗能應也", "未成", "非徒無益", "子無敢食我也", "莫能陷也"], "examples_s": ["其人弗能应也", "未成", "非徒无益", "子无敢食我也", "莫能陷也"]}, {"topic": "所 and 者", "refs": ["L1 n.2", "L4 n.5", "L3 n.9"], "text": "者 follows a verb phrase: \"one who V's\" (耕者, 先成者, 為蛇足者). 所 precedes a verb: \"what / where one V's\" (所從墜 \"where it fell from\", 所契 \"what he'd notched\").\n", "examples": ["先成者飲酒", "吾劍之所從墜", "其所契者"], "examples_s": ["先成者饮酒", "吾剑之所从坠", "其所契者"]}, {"topic": "Words that changed meaning (古今詞義)", "refs": ["L1 n.3", "L3 n.5", "L4 n.1", "L5 n.12", "L6 n.13", "L6 n.15"], "text": "走 run (not walk) · 行 walk / move · 趨 hurry · 病 exhausted · 江 the Yangzi · 亡 lose · 身 oneself · 地方 \"land … square\" · 其實 \"the reality of it\".\n", "examples": ["兔走觸株", "今日病矣", "終亡其酒", "今王之地方五千里"], "examples_s": ["兔走触株", "今日病矣", "终亡其酒", "今王之地方五千里"]}, {"topic": "Rhetorical questions", "refs": ["L4 n.8", "L4 n.11", "L5 n.10", "L6 n.11"], "text": "不亦…乎 \"isn't it …?\" · 豈…哉 \"how could …!\" · 安 \"how?\" · 敢不…乎 \"would dare not …?\". All of them expect the listener to agree.\n", "examples": ["不亦惑乎", "豈不難哉", "子安能為之足"], "examples_s": ["不亦惑乎", "岂不难哉", "子安能为之足"]}, {"topic": "以 and 為", "refs": ["L1 n.10", "L6 n.9", "L6 n.10", "L5 n.8", "L1 n.9"], "text": "以 X V \"use X to V\" · 以 A 為 B \"regard A as B\" · 以為 \"think that\". 為 wéi \"to be, make, run\" · 為 wèi \"for\" · 為 A V \"be V'ed by A\" (passive).\n", "examples": ["以子之矛", "子以我為不信", "吾為子先行", "而身為宋國笑"], "examples_s": ["以子之矛", "子以我为不信", "吾为子先行", "而身为宋国笑"]}], "exercise": [{"h": "三人行，必有我師焉。", "py": "Sān rén xíng, bì yǒu wǒ shī yān.", "src": "論語·述而", "en": "When three people walk together, there is sure to be a teacher for me among them.", "tests": "行 = walk, 有", "h_s": "三人行，必有我师焉。"}, {"h": "朝聞道，夕死可矣。", "py": "Zhāo wén dào, xī sǐ kě yǐ.", "src": "論語·里仁", "en": "Hear the Way in the morning, and one may die in the evening.", "tests": "聞, 可, 矣", "h_s": "朝闻道，夕死可矣。"}, {"h": "吾日三省吾身：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？", "py": "Wú rì sān xǐng wú shēn: wèi rén móu ér bù zhōng hū? Yǔ péngyǒu jiāo ér bù xìn hū? Chuán bù xí hū?", "src": "論語·學而", "en": "Every day I examine myself on three points: in planning for others, have I been less than loyal? With friends, have I been less than trustworthy? Have I passed on what I have not practised?", "tests": "吾, 身, 為 wèi, 而, 與, 信, 乎", "h_s": "吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？"}, {"h": "歲寒，然後知松柏之後凋也。", "py": "Suì hán, rán hòu zhī sōng bǎi zhī hòu diāo yě.", "src": "論語·子罕", "en": "Only when the year turns cold do we know that pines and cypresses are the last to wither.", "tests": "之 between subject and predicate, 也", "h_s": "岁寒，然后知松柏之后凋也。"}, {"h": "其身正，不令而行；其身不正，雖令不從。", "py": "Qí shēn zhèng, bù lìng ér xíng; qí shēn bù zhèng, suī lìng bù cóng.", "src": "論語·子路", "en": "If he himself is upright, things get done without orders; if he himself is not upright, even his orders are not followed.", "tests": "其, 身, 而, 從", "h_s": "其身正，不令而行；其身不正，虽令不从。"}, {"h": "工欲善其事，必先利其器。", "py": "Gōng yù shàn qí shì, bì xiān lì qí qì.", "src": "論語·衛靈公", "en": "A craftsman who wants to do his work well must first sharpen his tools.", "tests": "欲, 先, 利 (as a verb), 其", "h_s": "工欲善其事，必先利其器。"}], "title_s": "复习一"}]}, {"key": "baihua", "zh": "白話", "en": "Modern prose", "about": "The written language beyond HSK 5 (the 2012 level, 2,500 words): public-domain essays and fiction, read for the literary words that textbooks stop before.", "lessons": [{"id": 1, "slug": "luo-hua-sheng", "title": "落花生", "title_py": "Luòhuāshēng", "title_en": "Peanuts", "source": {"work": "落花生", "author": "許地山 (1894–1941)", "period": 1922, "text_from": "《許地山作品選集》(好讀出版), as excerpted by 遠見 gvm.com.tw/article/60672; compared line by line on 2026-11-12", "work_s": "落花生"}, "status": "draft", "intro": "Xu Dishan was born in Tainan in 1894; his family left Taiwan for Fujian after the Japanese takeover the next year. He became a scholar of religion, ended his career as professor of Chinese at the University of Hong Kong, and signed his fiction 落華生, \"Peanut\". This essay was published in 1922 and has been in Chinese school readers ever since. The sentences are short and the story is a family evening, which makes it a good first step: nearly every word you don't know here is a *written* word, the layer of vocabulary that starts where the HSK 5 stopped. Watch the five words built on 然.\n", "lines": [{"h": "我們屋後有半畝隙地。", "en": "Behind our house there was half a mu of unused ground.", "p": true, "h_s": "我们屋后有半亩隙地。"}, {"h": "母親說：「讓它荒蕪著怪可惜，既然你們那麼愛吃花生，就闢來做花生園罷。」", "en": "Mother said, \"It's rather a shame to leave it lying waste. Since you're all so fond of peanuts, let's clear it and make a peanut garden.\"", "h_s": "母亲说：「让它荒芜著怪可惜，既然你们那么爱吃花生，就辟来做花生园罢。」"}, {"h": "我們幾姊弟和幾個小丫頭都很喜歡——買種的買種，動土的動土，灌園的灌園；", "en": "We children and the few young maids were all delighted. Some bought seed, some dug the ground, some watered the plot;", "h_s": "我们几姊弟和几个小丫头都很喜欢——买种的买种，动土的动土，灌园的灌园；"}, {"h": "過不了幾個月，居然收穫了！", "en": "and before many months had gone by, to our surprise, there was a harvest!", "h_s": "过不了几个月，居然收获了！"}, {"h": "媽媽說：「今晚我們可以做一個收穫節，也請你們爹爹來嘗嘗我們的新花生，如何？」", "en": "Mama said, \"Tonight we could hold a harvest festival, and ask your father to come and taste our new peanuts. What do you say?\"", "p": true, "h_s": "妈妈说：「今晚我们可以做一个收获节，也请你们爹爹来尝尝我们的新花生，如何？」"}, {"h": "我們都答應了。", "en": "We all agreed.", "h_s": "我们都答应了。"}, {"h": "母親把花生做成好幾樣的食品，還吩咐這節期要在園裡的茅亭舉行。", "en": "Mother made the peanuts into a good many dishes, and gave word that the festival was to be held in the thatched pavilion in the garden.", "h_s": "母亲把花生做成好几样的食品，还吩咐这节期要在园里的茅亭举行。"}, {"h": "那晚上的天色不大好，可是爹爹也到來，實在很難得！", "en": "The sky was not very promising that evening, but Father came all the same, which was a rare thing indeed!", "p": true, "h_s": "那晚上的天色不大好，可是爹爹也到来，实在很难得！"}, {"h": "爹爹說：「你們愛吃花生麼？」", "en": "Father said, \"Do you like eating peanuts?\"", "h_s": "爹爹说：「你们爱吃花生么？」"}, {"h": "我們都爭著答應：「愛！」", "en": "We all raced to answer, \"We do!\"", "p": true, "h_s": "我们都争著答应：「爱！」"}, {"h": "「誰能把花生的好處說出來？」", "en": "\"Who can tell me what is good about the peanut?\"", "p": true, "h_s": "「谁能把花生的好处说出来？」"}, {"h": "姊姊說：「花生的氣味很美。」", "en": "Elder sister said, \"Peanuts have a lovely flavour.\"", "p": true, "h_s": "姊姊说：「花生的气味很美。」"}, {"h": "哥哥說：「花生可以製油。」", "en": "Elder brother said, \"You can make oil from peanuts.\"", "p": true, "h_s": "哥哥说：「花生可以制油。」"}, {"h": "我說：「無論何等人都可以用賤價買它來吃；都喜歡吃它。這就是它的好處。」", "en": "I said, \"People of every sort can buy them cheaply to eat, and everyone likes them. That is what's good about them.\"", "p": true, "h_s": "我说：「无论何等人都可以用贱价买它来吃；都喜欢吃它。这就是它的好处。」"}, {"h": "爹爹說：「花生的用處固然很多，但有一樣是很可貴的。", "en": "Father said, \"The peanut has many uses, to be sure, but one thing about it is truly precious.", "p": true, "h_s": "爹爹说：「花生的用处固然很多，但有一样是很可贵的。"}, {"h": "這小小的豆不像那好看的蘋果、桃子、石榴，把它們的果實懸在枝上，", "en": "This little bean is not like the handsome apple, peach and pomegranate, which hang their fruit on the branch,", "h_s": "这小小的豆不像那好看的苹果、桃子、石榴，把它们的果实悬在枝上，"}, {"h": "鮮紅嫩綠的顏色，令人一望而發生羨慕的心。", "en": "bright red and tender green, so that one look is enough to make people admire them.", "lit": "causing people, at one glance, to have an admiring heart arise", "h_s": "鲜红嫩绿的颜色，令人一望而发生羡慕的心。"}, {"h": "它只把果子埋在地下，等到成熟，才容人把它挖出來。", "en": "It just buries its fruit in the ground, and only when it is ripe does it let anyone dig it up.", "h_s": "它只把果子埋在地下，等到成熟，才容人把它挖出来。"}, {"h": "你們偶然看見一棵花生瑟縮地長在地上，不能立刻辨出它有沒有果實，", "en": "If you happen to see a peanut plant huddled low on the ground, you can't tell straight away whether it has any fruit;", "h_s": "你们偶然看见一棵花生瑟缩地长在地上，不能立刻辨出它有没有果实，"}, {"h": "必得等到你接觸它才能知道。」", "en": "you have to wait until you touch it to know.\"", "h_s": "必得等到你接触它才能知道。」"}, {"h": "我們都說：「是的。」母親也點點頭。", "en": "We all said, \"That's true.\" Mother nodded too.", "p": true, "h_s": "我们都说：「是的。」母亲也点点头。"}, {"h": "爹爹接下去說：「所以你們要像花生，因為它是有用的，不是偉大、好看的東西。」", "en": "Father went on, \"So you must be like the peanut, because it is a useful thing, not a grand or good-looking one.\"", "h_s": "爹爹接下去说：「所以你们要像花生，因为它是有用的，不是伟大、好看的东西。」"}, {"h": "我說：「那麼，人要做有用的人，不要做偉大、體面的人了。」", "en": "I said, \"Then a person should be a useful person, and not a great or grand-looking one.\"", "p": true, "h_s": "我说：「那么，人要做有用的人，不要做伟大、体面的人了。」"}, {"h": "爹爹說：「這是我對於你們的希望。」", "en": "Father said, \"That is what I hope for you.\"", "p": true, "h_s": "爹爹说：「这是我对于你们的希望。」"}, {"h": "我們談到夜闌才散，", "en": "We talked until the night was nearly over before we parted.", "p": true, "h_s": "我们谈到夜阑才散，"}, {"h": "所有花生食品雖然沒有了，然而父親的話現在還印在我心版上。", "en": "All the peanut dishes are long gone, yet Father's words are printed on my heart to this day.", "h_s": "所有花生食品虽然没有了，然而父亲的话现在还印在我心版上。"}], "notes": [{"n": 1, "line": 0, "at": "隙地", "text": "**隙** xì is a crack or gap (空隙, 縫隙), so 隙地 is the bit of land left over between things: a spare plot. In speech you would say 空地. This is the pattern of the whole lesson: a one-character classical word (隙) living on inside a two-character written one.\n", "at_s": "隙地"}, {"n": 2, "line": 1, "at": "怪可惜", "text": "**怪** as an adverb, \"rather, quite\", is colloquial northern usage, normally 怪…的 (怪可惜的). **可惜** is 可 + verb, \"worth regretting\": the same 可 as in 可貴 \"worth prizing\" (line 15), 可愛, 可怕, 可笑. In Classical Chinese this 可 is still a free word with a passive sense (→ 文言 L1 n.8).\n", "at_s": "怪可惜"}, {"n": 3, "line": 1, "at": "既然", "text": "**既然 … 就 …** \"since (it is already the case that) …, then …\". 既 jì is classical for \"already, having done\". The 然 is the first of five in this text: 既然, 居然, 固然, 雖然, 然而. Classical 然 means \"so, like that\"; stuck onto a word it makes \"in such a way\" (→ 文言 L3 n.3), and that is how the written language builds its adverbs and conjunctions.\n", "at_s": "既然"}, {"n": 4, "line": 1, "at": "闢", "text": "**闢** pì \"to open up, clear (land)\", as in 開闢. Careful with the simplified form: 辟 stands for two different words, 闢 pì \"open up\" and 辟 bì \"sovereign; to ward off\" (復辟 fùbì \"restoration of a monarch\").\n", "at_s": "辟"}, {"n": 5, "line": 1, "at": "罷", "text": "**罷** here is the particle *ba*, today written 吧. Writers of the 1920s wrote 罷 for it, and 麼 for 嗎 (line 9: 愛吃花生麼？). Both are read as the modern particles. As a full word 罷 is bà \"to stop\" (罷工, 罷了).\n", "at_s": "罢"}, {"n": 6, "line": 2, "at": "買種的買種", "text": "**A 的 A, B 的 B** \"some did A, some did B\": each 的 phrase is \"the ones who …\". 種 is zhǒng \"seed\" here, not zhòng \"to plant\". 動土 \"break ground\" and 灌園 \"water the garden\" are verb + object in the classical way, one character each.\n", "at_s": "买种的买种"}, {"n": 7, "line": 3, "at": "居然", "text": "**居然** \"unexpectedly, against what one would think\". The children are amazed their own work produced anything. Its near-twin 竟然 is a little stronger and can be used for bad surprises.\n", "at_s": "居然"}, {"n": 8, "line": 4, "at": "我們的新花生", "text": "In the first printing (《小說月報》, 1922) this was 我們**底**新花生, and the last line 父親**底**話. For some years in the 1920s many writers kept 的 for descriptions (好看的蘋果) and wrote 底 for possession. Later editions, like ours, print 的 throughout; in an old edition of 魯迅 or 許地山 you will meet 底 on every page.\n", "at_s": "我们的新花生"}, {"n": 9, "line": 4, "at": "如何", "text": "**如何** at the end of a proposal: \"how about it?\". It is the classical question 何如 / 如何, \"what is it like?\" (→ 文言 L6 n.3), and still the normal written word for 怎麼樣.\n", "at_s": "如何"}, {"n": 10, "line": 6, "at": "吩咐", "text": "**吩咐** fēnfù \"to give instructions\" (to children, servants, juniors). 節期 \"the time of a festival\" is rare; the \"harvest festival\" is the mother's own invention. 茅亭 is a pavilion roofed with 茅 máo, thatch grass.\n", "at_s": "吩咐"}, {"n": 11, "line": 13, "at": "無論何等人", "text": "**何等** \"what kind, what rank of\": 何 is the classical \"what\". Today 何等 is mostly an exclamation, \"how very\" (何等重要!). **賤價** \"low price\": 賤 keeps its oldest sense, \"cheap\", the opposite of 貴; in today's speech it is mostly an insult.\n", "at_s": "无论何等人"}, {"n": 12, "line": 14, "at": "固然", "text": "**固然 …, 但 …** \"admittedly …, but …\": the speaker grants a point before making his own. 固 is classical \"certainly, by nature\" (→ 文言 L5 n.10: 蛇固無足).\n", "at_s": "固然"}, {"n": 13, "line": 16, "at": "令人一望而發生羨慕的心", "text": "Three written features in one clause. **令** \"to cause, make\" is the written word for 讓 / 叫 (令人感動). **一 … 而 …** \"at a single …, then …\": 而 joins two verbs exactly as in Classical Chinese (→ 文言 L1 n.4). And **發生** means \"to arise, come into being\"; today it is nearly always \"to happen\". 羨慕的心 is the classical 羨慕之心 with 的 for 之.\n", "at_s": "令人一望而发生羡慕的心"}, {"n": 14, "line": 17, "at": "容", "text": "**容** \"to allow, permit\", as in 不容 \"does not allow\", 容許, 容忍. 才容人 \"only then does it let people …\".\n", "at_s": "容"}, {"n": 15, "line": 18, "at": "瑟縮", "text": "**瑟縮** sèsuō \"huddled, shrinking (as if from cold)\". Both syllables begin with s-: it is an alliterative two-syllable word of the classical type, where the sound carries the picture and the characters cannot be translated one by one (compare 彷彿, 徘徊, 參差).\n", "at_s": "瑟缩"}, {"n": 16, "line": 19, "at": "必得", "text": "**必得** bìděi \"must, have no choice but to\". 得 is děi \"must\", not dé \"to get\".\n", "at_s": "必得"}, {"n": 17, "line": 23, "at": "對於", "text": "**於** yú is the all-purpose classical preposition, \"at, in, to, with regard to\" (→ 文言 L2 n.5). Written Chinese keeps it inside 對於, 關於, 由於, 至於, 等於, and on its own after a verb: 生於台南 \"born in Tainan\".\n", "at_s": "对于"}, {"n": 18, "line": 24, "at": "夜闌", "text": "**闌** lán \"nearly over, at its end\". 夜闌 \"deep in the night\" is a poetic word; the four-character phrase 夜闌人靜 \"the night far gone and everyone quiet\" is where you will meet it most.\n", "at_s": "夜阑"}, {"n": 19, "line": 25, "at": "雖然", "text": "**雖然 …, 然而 …** \"although …, yet …\". 然而 is literally \"so, and yet\": it is the written \"but\", heavier than 但是 or 可是, and it usually opens the clause that matters most. **心版** is \"the printing block of the heart\": 版 is a woodblock, which is why the words are 印, printed, on it.\n", "at_s": "虽然"}], "glossary": [{"w": "隙地", "py": "xìdì", "en": "a spare, unused plot of land", "w_s": "隙地"}, {"w": "荒蕪", "py": "huāngwú", "en": "(of land) lying waste, overgrown", "checked": ["cyz"], "w_s": "荒芜"}, {"w": "怪", "py": "guài", "en": "rather, quite (colloquial)", "w_s": "怪"}, {"w": "既然", "py": "jìrán", "en": "since, given that", "hsk": 4, "w_s": "既然"}, {"w": "闢", "py": "pì", "en": "to open up, clear (land)", "checked": ["cyz"], "w_s": "辟"}, {"w": "罷", "py": "ba", "en": "= 吧, the suggestion particle (1920s spelling)", "w_s": "罢"}, {"w": "姊弟", "py": "zǐdì", "en": "sisters and brothers, siblings", "w_s": "姊弟"}, {"w": "丫頭", "py": "yātou", "en": "a young maidservant; a girl", "w_s": "丫头"}, {"w": "動土", "py": "dòngtǔ", "en": "to break ground, start digging", "w_s": "动土"}, {"w": "灌園", "py": "guànyuán", "en": "to water a garden", "w_s": "灌园"}, {"w": "居然", "py": "jūrán", "en": "unexpectedly, to one's surprise", "hsk": 5, "w_s": "居然"}, {"w": "收穫", "py": "shōuhuò", "en": "to harvest; a harvest", "hsk": 5, "w_s": "收获"}, {"w": "嘗", "py": "cháng", "en": "to taste", "hsk": 4, "w_s": "尝"}, {"w": "如何", "py": "rúhé", "en": "how about it? (written for 怎麼樣)", "hsk": 5, "w_s": "如何"}, {"w": "吩咐", "py": "fēnfù", "en": "to give instructions, tell someone to", "w_s": "吩咐"}, {"w": "節期", "py": "jiéqī", "en": "the time of a festival (rare)", "w_s": "节期"}, {"w": "茅亭", "py": "máotíng", "en": "a thatched pavilion", "w_s": "茅亭"}, {"w": "天色", "py": "tiānsè", "en": "the look of the sky, the weather", "w_s": "天色"}, {"w": "難得", "py": "nándé", "en": "rare, hard to come by", "w_s": "难得"}, {"w": "爭", "py": "zhēng", "en": "to compete, vie (to be first)", "w_s": "争"}, {"w": "製油", "py": "zhìyóu", "en": "to make oil", "w_s": "制油"}, {"w": "無論", "py": "wúlùn", "en": "no matter (what, who)", "hsk": 4, "w_s": "无论"}, {"w": "何等", "py": "héděng", "en": "what kind of, of whatever rank", "w_s": "何等"}, {"w": "賤價", "py": "jiànjià", "en": "a low price", "checked": ["cyz"], "w_s": "贱价"}, {"w": "固然", "py": "gùrán", "en": "admittedly, it is true that", "w_s": "固然"}, {"w": "可貴", "py": "kěguì", "en": "worth prizing, precious", "w_s": "可贵"}, {"w": "石榴", "py": "shíliu", "en": "pomegranate", "w_s": "石榴"}, {"w": "懸", "py": "xuán", "en": "to hang, suspend", "w_s": "悬"}, {"w": "嫩綠", "py": "nènlǜ", "en": "tender green", "w_s": "嫩绿"}, {"w": "令", "py": "lìng", "en": "to cause, make (someone feel or do)", "checked": ["cyz"], "w_s": "令"}, {"w": "羨慕", "py": "xiànmù", "en": "to admire, envy", "hsk": 4, "w_s": "羡慕"}, {"w": "成熟", "py": "chéngshú", "en": "ripe", "hsk": 5, "w_s": "成熟"}, {"w": "容", "py": "róng", "en": "to allow, let", "checked": ["cyz"], "w_s": "容"}, {"w": "偶然", "py": "ǒurán", "en": "by chance", "hsk": 5, "w_s": "偶然"}, {"w": "瑟縮", "py": "sèsuō", "en": "huddled up, shrinking", "w_s": "瑟缩"}, {"w": "辨", "py": "biàn", "en": "to tell apart, make out", "checked": ["cyz"], "w_s": "辨"}, {"w": "必得", "py": "bìděi", "en": "must, have to", "w_s": "必得"}, {"w": "接觸", "py": "jiēchù", "en": "to touch, come into contact with", "hsk": 5, "w_s": "接触"}, {"w": "體面", "py": "tǐmiàn", "en": "respectable-looking, grand", "w_s": "体面"}, {"w": "對於", "py": "duìyú", "en": "with regard to, for", "hsk": 4, "w_s": "对于"}, {"w": "夜闌", "py": "yèlán", "en": "late at night, when the night is nearly over", "checked": ["cyz"], "w_s": "夜阑"}, {"w": "散", "py": "sàn", "en": "to break up, disperse", "w_s": "散"}, {"w": "雖然", "py": "suīrán", "en": "although", "hsk": 2, "w_s": "虽然"}, {"w": "然而", "py": "rán'ér", "en": "yet, but (written)", "hsk": 4, "w_s": "然而"}, {"w": "心版", "py": "xīnbǎn", "en": "the 'printing block' of the heart: one's memory", "w_s": "心版"}], "exercise": [{"h": "以子之矛，陷子之楯，何如？", "ref": "文言 L2", "tests": "如何 (line 5). The classical order is usually 何如.", "py": "Yǐ zǐ zhī máo, xiàn zǐ zhī dùn, hé rú?", "en": "What if you used your spear to pierce your shield?", "src": "韓非子·難一 · 文言 L2", "to": {"track": "wenyan", "id": 2}, "h_s": "以子之矛，陷子之楯，何如？"}, {"h": "蛇固無足，子安能為之足？", "ref": "文言 L5", "tests": "固 in 固然 (line 15).", "py": "Shé gù wú zú, zǐ ān néng wéi zhī zú?", "en": "Snakes have no feet, of course: how can you give it feet?", "src": "戰國策·齊策二 · 文言 L5", "to": {"track": "wenyan", "id": 5}, "h_s": "蛇固无足，子安能为之足？"}, {"h": "兔走觸株，折頸而死。", "ref": "文言 L1", "tests": "而 joining two verbs, as in 一望而發生 (line 17).", "py": "tù zǒu chù zhū, zhé jǐng ér sǐ.", "en": "A hare, running, struck the stump, broke its neck and died.", "src": "韓非子·五蠹 · 文言 L1", "to": {"track": "wenyan", "id": 1}, "h_s": "兔走触株，折颈而死。"}, {"h": "虎以為然，故遂與之行，", "ref": "文言 L6", "tests": "然 \"so\" as a full word; the 然 of 既然, 居然, 固然, 雖然, 然而.", "py": "Hǔ yǐ wéi rán, gù suì yǔ zhī xíng,", "en": "The tiger thought he was right, so it went along with him.", "src": "戰國策·楚策一 · 文言 L6", "to": {"track": "wenyan", "id": 6}, "h_s": "虎以为然，故遂与之行，"}, {"h": "兔不可復得，", "ref": "文言 L1", "tests": "可 + verb, as in 可惜 and 可貴.", "py": "Tù bù kě fù dé,", "en": "Hares could not be got again,", "src": "韓非子·五蠹 · 文言 L1", "to": {"track": "wenyan", "id": 1}, "h_s": "兔不可复得，"}, {"h": "吾矛之利，於物無不陷也。", "ref": "文言 L2", "tests": "於 in 對於 (line 24); 無 in 無論.", "py": "Wú máo zhī lì, yú wù wú bù xiàn yě.", "en": "My spears are so sharp that there is nothing they can't pierce.", "src": "韓非子·難一 · 文言 L2", "to": {"track": "wenyan", "id": 2}, "h_s": "吾矛之利，于物无不陷也。"}], "culture": "**The other ending.** The version most people in China know is the primary-school one, which was cut and reworded for children. The text here is the adult original in a modern edition (see note 8 for what the first printing looked like).\n", "title_s": "落花生"}]}, {"key": "chengyu", "zh": "成語", "en": "Idioms", "about": "成語 in order of modern frequency, twenty at a time, grouped by pattern.", "lessons": [{"id": 1, "slug": "mirrors", "title": "對稱", "title_py": "Duìchèn", "title_en": "Mirror patterns", "status": "draft", "intro": "Many everyday 成語 are built on a frame that repeats: 一X一Y, 無X無Y, 所X所Y, 胡X亂Y. Once you see the frame, you only have to learn the two halves, which usually say the same thing twice (全心全意 \"whole heart, whole mind\") or repeat a word (日復一日 \"day comes back to day\"). Learn the frames, not just the words: the same frames make hundreds of rarer 成語.\n", "frames": [{"f": "一X一Y", "en": "X and Y are near-synonyms; 一 = 'one, the same, every'", "ex": ["一模一樣", "一舉一動", "一年一度"], "f_s": "一X一Y", "ex_s": ["一模一样", "一举一动", "一年一度"]}, {"f": "全X全Y", "en": "whole X, whole Y: total commitment", "ex": ["全心全意"], "f_s": "全X全Y", "ex_s": ["全心全意"]}, {"f": "不X不Y / 無X無Y", "en": "negation twice: 'without X or Y'", "ex": ["不知不覺", "無法無天", "無緣無故"], "f_s": "不X不Y / 无X无Y", "ex_s": ["不知不觉", "无法无天", "无缘无故"]}, {"f": "所X所Y", "en": "所 + verb = 'what one Xs' (classical nominaliser, → lesson 3)", "ex": ["所作所為"], "f_s": "所X所Y", "ex_s": ["所作所为"]}, {"f": "各X各Y / 隨X隨Y / 何X何Y", "en": "each…each, wherever…whenever, which…which", "ex": ["各式各樣", "隨時隨地", "何去何從"], "f_s": "各X各Y / 随X随Y / 何X何Y", "ex_s": ["各式各样", "随时随地", "何去何从"]}, {"f": "謝X謝Y / 討X還Y / 想X設Y", "en": "two verb–object pairs side by side", "ex": ["謝天謝地", "討價還價", "想方設法"], "f_s": "谢X谢Y / 讨X还Y / 想X设Y", "ex_s": ["谢天谢地", "讨价还价", "想方设法"]}, {"f": "胡X亂Y", "en": "胡 and 亂 both mean 'wildly, at random'", "ex": ["胡思亂想", "胡言亂語", "胡說八道"], "f_s": "胡X乱Y", "ex_s": ["胡思乱想", "胡言乱语", "胡说八道"]}, {"f": "深X熟Y / 千X百Y", "en": "two adjective–noun or number–noun pairs", "ex": ["深思熟慮", "千方百計"], "f_s": "深X熟Y / 千X百Y", "ex_s": ["深思熟虑", "千方百计"]}], "items": [{"w": "一模一樣", "py": "yī mó yī yàng", "lit": "one-mould-one-shape", "en": "exactly alike, identical", "ex": {"h": "这两个双胞胎兄弟长得一模一样。", "py": "Zhè liǎng gè shuāng bāo tāi xiōng dì zhǎng de yī mó yī yàng.", "py_auto": true, "src": "tatoeba", "en": "The two twin brothers look exactly alike.", "h_t": "這兩個雙胞胎兄弟長得一模一樣。", "h_s": "这两个双胞胎兄弟长得一模一样。"}, "w_s": "一模一样"}, {"w": "一舉一動", "py": "yī jǔ yī dòng", "lit": "every-raise-every-move", "en": "every move someone makes", "ex": {"h": "醫生繼續觀察病人的一舉一動。", "py": "Yī shēng jì xù guān chá bìng rén de yī jǔ yī dòng.", "py_auto": true, "src": "tatoeba", "en": "The doctor kept watching the patient's every move.", "h_t": "醫生繼續觀察病人的一舉一動。", "h_s": "医生继续观察病人的一举一动。"}, "w_s": "一举一动"}, {"w": "一年一度", "py": "yī nián yī dù", "lit": "one-year-one-time", "en": "once a year, annual", "note": "Used mostly before a noun with 的 (一年一度的…).", "ex": {"h": "今天，该街道为一年一度的圣帕特里克节游行的主要路径。", "py": "Jīn tiān, gāi jiē dào wéi yī nián yī dù de Shèng Pàtèlǐkè Jié yóu xíng de zhǔ yào lù jìng.", "py_auto": true, "src": "wikipedia: 奥康奈尔街", "en": "Today the street is the main route of the annual Saint Patrick's Day parade.", "h_t": "今天，該街道為一年一度的聖帕特里克節遊行的主要路徑。", "h_s": "今天，该街道为一年一度的圣帕特里克节游行的主要路径。"}, "w_s": "一年一度"}, {"w": "全心全意", "py": "quán xīn quán yì", "lit": "whole-heart-whole-mind", "en": "wholeheartedly", "ex": {"h": "我全心全意地支持你。", "py": "Wǒ quán xīn quán yì de zhī chí nǐ.", "py_auto": true, "src": "tatoeba", "en": "I support you wholeheartedly.", "h_t": "我全心全意地支持你。", "h_s": "我全心全意地支持你。"}, "w_s": "全心全意"}, {"w": "不知不覺", "py": "bù zhī bù jué", "lit": "not-know-not-feel", "en": "without realising it, before you know it", "ex": {"h": "不知不覺，秋天已經到了。", "py": "Bù zhī bù jué, qiū tiān yǐ jīng dào le.", "py_auto": true, "src": "tatoeba", "en": "Before we knew it, autumn had come.", "h_t": "不知不覺，秋天已經到了。", "h_s": "不知不觉，秋天已经到了。"}, "w_s": "不知不觉"}, {"w": "無法無天", "py": "wú fǎ wú tiān", "lit": "without-law-without-heaven", "en": "lawless, completely out of control", "note": "天 here is \"Heaven\" as the moral order, not the sky.", "ex": {"h": "政府官员恳求华盛顿能够协助他们制止这种无法无天的行为。", "py": "Zhèng fǔ guān yuán kěn qiú Huáshèngdùn néng gòu xié zhù tā men zhì zhǐ zhè zhǒng wú fǎ wú tiān de xíng wéi.", "py_auto": true, "src": "wikipedia: 約翰·埃德加·胡佛", "en": "Officials begged Washington to help them stop this lawless behaviour.", "h_t": "政府官員懇求華盛頓能夠協助他們制止這種無法無天的行為。", "h_s": "政府官员恳求华盛顿能够协助他们制止这种无法无天的行为。"}, "w_s": "无法无天"}, {"w": "無緣無故", "py": "wú yuán wú gù", "lit": "without-cause-without-reason", "en": "for no reason at all", "ex": {"h": "他看见人无缘无故被铐进枷锁、被打、被囚禁在地牢。", "py": "Tā kàn jiàn rén wú yuán wú gù bèi kào jìn jiā suǒ, bèi dǎ, bèi qiú jìn zài dì láo.", "py_auto": true, "src": "wikipedia: 复活 (小说)", "en": "He saw people put in chains, beaten and locked in dungeons for no reason at all.", "h_t": "他看見人無緣無故被銬進枷鎖、被打、被囚禁在地牢。", "h_s": "他看见人无缘无故被铐进枷锁、被打、被囚禁在地牢。"}, "w_s": "无缘无故"}, {"w": "所作所為", "py": "suǒ zuò suǒ wéi", "lit": "what-one-does-what-one-does", "en": "everything someone has done, someone's conduct", "note": "Usually critical. 作 and 為 both mean \"do\".", "ex": {"h": "汤姆不知道他的所作所为违反了规则。", "py": "Tāngmǔ bù zhī dào tā de suǒ zuò suǒ wéi wéi fǎn le guī zé.", "py_auto": true, "src": "tatoeba", "en": "Tom didn't know that what he had done broke the rules.", "h_t": "湯姆不知道他的所作所為違反了規則。", "h_s": "汤姆不知道他的所作所为违反了规则。"}, "w_s": "所作所为"}, {"w": "各式各樣", "py": "gè shì gè yàng", "lit": "each-style-each-kind", "en": "all kinds of", "ex": {"h": "各式各樣的人住在東京。", "py": "Gè shì gè yàng de rén zhù zài Dōngjīng.", "py_auto": true, "src": "tatoeba", "en": "All kinds of people live in Tokyo.", "h_t": "各式各樣的人住在東京。", "h_s": "各式各样的人住在东京。"}, "w_s": "各式各样"}, {"w": "謝天謝地", "py": "xiè tiān xiè dì", "lit": "thank-heaven-thank-earth", "en": "thank goodness", "ex": {"h": "…场面实在不好形容，但谢天谢地，我的歌词保住了！", "py": "… Chǎng miàn shí zài bù hǎo xíng róng, dàn xiè tiān xiè dì, wǒ de gē cí bǎo zhù le!", "py_auto": true, "src": "wikipedia: 貝隆夫人 (電影)", "en": "The scene is hard to describe, but thank goodness, my lyrics survived!", "h_t": "…場面實在不好形容，但謝天謝地，我的歌詞保住了！", "h_s": "…场面实在不好形容，但谢天谢地，我的歌词保住了！"}, "w_s": "谢天谢地"}, {"w": "隨時隨地", "py": "suí shí suí dì", "lit": "follow-time-follow-place", "en": "anytime, anywhere", "ex": {"h": "特技是繪畫（有趣的画）、随时随地都能睡着、舞蹈。", "py": "Tè jì shì huì huà (yǒu qù de huà), suí shí suí dì dōu néng shuì zháo, wǔ dǎo.", "py_auto": true, "src": "wikipedia: 宮脇咲良", "en": "Special skills: drawing (funny pictures), falling asleep anytime and anywhere, dancing.", "h_t": "特技是繪畫（有趣的畫）、隨時隨地都能睡著、舞蹈。", "h_s": "特技是绘画（有趣的画）、随时随地都能睡着、舞蹈。"}, "w_s": "随时随地"}, {"w": "何去何從", "py": "hé qù hé cóng", "lit": "what-leave-what-follow", "en": "which way to go, what to do next", "note": "何 \"what\" comes before the verb, as in classical Chinese questions (何去 = 去何).", "ex": {"h": "我失業又沒錢。真不知該何去何從。", "py": "Wǒ shī yè yòu méi qián. Zhēn bù zhī gāi hé qù hé cóng.", "py_auto": true, "src": "tatoeba", "en": "I've lost my job and I have no money. I really don't know what to do next.", "h_t": "我失業又沒錢。真不知該何去何從。", "h_s": "我失业又没钱。真不知该何去何从。"}, "w_s": "何去何从"}, {"w": "日復一日", "py": "rì fù ", "不知所措", "无所事事"]}, {"f": "V而V", "en": "而 links two actions: 'and then' or 'yet'", "ex": ["脫穎而出", "視而不見", "取而代之", "挺身而出", "輕而易舉"], "f_s": "V而V", "ex_s": ["脱颖而出", "视而不见", "取而代之", "挺身而出", "轻而易举"]}, {"f": "X之Y", "en": "之 = 的: 'the Y of X'", "ex": ["當務之急"], "f_s": "X之Y", "ex_s": ["当务之急"]}, {"f": "X以Y", "en": "以 = 'with, by means of, so as to'", "ex": ["夢寐以求", "全力以赴", "自以為是", "不以為然"], "f_s": "X以Y", "ex_s": ["梦寐以求", "全力以赴", "自以为是", "不以为然"]}, {"f": "X於Y", "en": "於 = 'to, at, for'", "ex": ["無濟於事"], "f_s": "X于Y", "ex_s": ["无济于事"]}, {"f": "其 / 諸", "en": "其 = 'its, their'; 諸 = 'all the, the various'", "ex": ["名副其實", "諸如此類"], "f_s": "其 / 诸", "ex_s": ["名副其实", "诸如此类"]}], "items": [{"w": "前所未有", "py": "qián suǒ wèi yǒu", "lit": "before-what-not-yet-have", "en": "unprecedented", "ex": {"h": "依靠不斷重複發券，古羅馬建築達到前所未有的宏偉規模。", "py": "Yī kào bù duàn chóng fù fā xuàn, Gǔ Luómǎ jiàn zhù dá dào qián suǒ wèi yǒu de hóng wěi guī mó.", "py_auto": true, "src": "wikipedia: 古羅馬建築", "en": "By repeating the arch again and again, Roman architecture reached an unprecedented scale.", "h_t": "依靠不斷重複發券，古羅馬建築達到前所未有的宏偉規模。", "h_s": "依靠不断重复发券，古罗马建筑达到前所未有的宏伟规模。"}, "w_s": "前所未有"}, {"w": "理所當然", "py": "lǐ suǒ dāng rán", "lit": "reason-what-should-so", "en": "of course, only natural; to take for granted", "note": "視為理所當然 = to take for granted.", "ex": {"h": "我們視健康為理所當然, 直到疾病侵襲。", "py": "Wǒ men shì jiàn kāng wéi lǐ suǒ dāng rán, zhí dào jí bìng qīn xí.", "py_auto": true, "src": "tatoeba", "en": "We take our health for granted until illness strikes.", "h_t": "我們視健康為理所當然, 直到疾病侵襲。", "h_s": "我们视健康为理所当然, 直到疾病侵袭。"}, "w_s": "理所当然"}, {"w": "眾所周知", "py": "zhòng suǒ zhōu zhī", "lit": "crowd-what-all-know", "en": "as everyone knows", "ex": {"h": "众所周知，空气是多种气体的混合体。", "py": "Zhòng suǒ zhōu zhī, kōng qì shì duō zhǒng qì tǐ de hùn hé tǐ.", "py_auto": true, "src": "tatoeba", "en": "As everyone knows, air is a mixture of several gases.", "h_t": "眾所周知，空氣是多種氣體的混合體。", "h_s": "众所周知，空气是多种气体的混合体。"}, "w_s": "众所周知"}, {"w": "為所欲為", "py": s'", "ex": ["出乎意料", "出人意料", "意想不到"], "f_s": "出乎 / 出人 意料", "ex_s": ["出乎意料", "出人意料", "意想不到"]}], "items": [{"w": "不可思議", "py": "bù kě sī yì", "lit": "not-can-think-discuss", "en": "unbelievable, incredible", "origin": {"work": "維摩詰所說經·不思議品", "text": "諸佛菩薩，有解脫名不可思議", "checked": ["moe"], "text_s": "诸佛菩萨，有解脱名不可思议"}, "note": "Buddhist in origin: a state \"beyond thought and words\". Now it just means \"amazing\".", "ex": {"h": "你真是不可思议。", "py": "Nǐ zhēn shì bù kě sī yì.", "py_auto": true, "src": "tatoeba", "en": "You're incredible.", "h_t": "你真是不可思議。", "h_s": "你真是不可思议。"}, "w_s": "不可思议"}, {"w": "無論如何", "py": "wú lùn rú hé", "lit": "without-discussing-how", "en": "no matter what, in any case", "ex": {"h": "無論如何我一定要在明天前完成這工作。", "py": "Wú lùn rú hé wǒ yī dìng yào zài míng tiān qián wán chéng zhè gōng zuò.", "py_auto": true, "src": "tatoeba", "en": "No matter what", "I have to finish this work before tomorrow.": null, "h_t": "無論如何我一定要在明天前完成這工作。", "h_s": "无论如何我一定要在明天前完成这工作。"}, "w_s": "无论如何"}, {"w": "無能為力", "py": "wú néng wéi lì", "lit": "without-ability-make-effort", "en": "powerless, there is nothing one can do", "origin": {"work": "左傳·隱公四年", "text": "老夫耄矣，無能為也", "checked": ["moe"], "text_s": "老夫耄矣，无能为也"}, "ex": {"h": "我不是不同情你，但我實在是無能為力。", "py": "Wǒ bù shì bù tóng qíng nǐ, dàn wǒ shí zài shì wú néng wéi lì.", "py_auto": true, "src": "tatoeba", "en": "It's not that I don't feel for you, but there's really nothing I can do.", "h_t": "我不是不同情你，但我實在是無能為力。", "h_s": "我不是不同情你，但我实在是无能为力。"}, "w_s": "无能为力"}, {"w": "無關緊要", "py": "wú guān jǐn yào", "lit": "without-concern-tight-important", "en": "unimportant, it doesn't matter", "ex": {"h": "別想了，那不過是些無關緊要的細節。", "py": "Bié xiǎng le, nà bù guò shì xiē wú guān jǐn yào de xì jié.", "py_auto": true, "src": "tatoeba", "en": "Forget it, those are just unimportant details.", "h_t": "別想了，那不過是些無關緊要的細節。", "h_s": "别想了，那不过是些无关紧要的细节。"}, "w_s": "无关紧要"}, {"w": "迫不及待", "py": "pò bù jí dài", "lit": "pressed-not-able-wait", "en": "can't wait to, impatiently", ": "supply-not-meet-demand", "en": "demand exceeds supply", "ex": {"h": "收获的蓝莓销往中国各城市超市，供不应求。", "py": "Shōu huò de lán méi xiāo wǎng Zhōngguó gè chéng shì chāo shì, gōng bù yìng qiú.", "py_auto": true, "src": "wikipedia: 停前镇", "en": "The harvested blueberries are sold to supermarkets across China, and demand outstrips supply.", "h_t": "收穫的藍莓銷往中國各城市超市，供不應求。", "h_s": "收获的蓝莓销往中国各城市超市，供不应求。"}, "w_s": "供不应求"}, {"w": "無動於衷", "py": "wú dòng yú zhōng", "lit": "without-moving-in-heart", "en": "unmoved, indifferent", "note": "衷 \"the inner heart\"; 於 = in (→ lesson 3).", "ex": {"h": "对于失败，有些公司采取了补救措施，而大部分却无动于衷。", "py": "Duì yú shī bài, yǒu xiē gōng sī cǎi qǔ le bǔ jiù cuò shī, ér dà bù fèn què wú dòng yú zhōng.", "py_auto": true, "src": "wikipedia: 技术成熟度曲线", "en": "Faced with failure, some companies took remedial action, but most did nothing.", "h_t": "對於失敗，有些公司採取了補救措施，而大部分卻無動於衷。", "h_s": "对于失败，有些公司采取了补救措施，而大部分却无动于衷。"}, "w_s": "无动于衷"}, {"w": "不遺餘力", "py": "bù yí yú lì", "lit": "not-leave-spare-strength", "en": "sparing no effort", "origin": {"work": "戰國策·趙策三", "text": "秦之攻我也，不遺餘力矣", "checked": ["moe"], "text_s": "秦之攻我也，不遗余力矣"}, "ex": {"h": "他不遺餘力幫助我。", "py": "Tā bù yí yú lì bāng zhù wǒ.", "py_auto": true, "src": "tatoeba", "en": "He spared no effort to help me.", "h_t": "他不遺餘力幫助我。", "h_s": "他不遗余力帮助我。"}, "w_s": "不遗余力"}, {"w": "不擇手段", "py": "bù zé shǒu duàn", "lit": "not-choose-means", "en": "by fair means or foul, unscrupulously", "ex": {"h": "為了正當目的並非總是可以不擇手段.", "py": "Wèi le zhèng dāng mù dì bìng fēi zǒng shì kě yǐ bù zé shǒu duàn.", "py_auto": true, "src": "tatoeba", "en": "Even for a good cause, you can't always use any means you like.", "h_t": "為了正當目的並非總是可以不擇手段.", "h_s": "为了正当目的并非总是可以不择手段."}, "w_s": "不择手段"}, {"w": "無與倫比", "py": "wú yǔ lún bǐ", "lit": "without-with-equal-compare", "en": "incomparable, unrivalled", "ex": {"h": "本杰明·富兰克林将玻璃琴的音色描述为“无与伦比的甜蜜”。", "py": "Běnjiémíng·Fùlánkèlín jiāng bō lí qín de yīn sè miáo shù wéi “wú yǔ lún bǐ de tián mì”.", "py_auto": true, "src": "wikipedia: 玻璃琴", "en": "Benjamin Franklin described the glass harmonica's sound as 'incomparably sweet'.", "h_t": "本傑明·富蘭克林將玻璃琴的音色描述為“無與倫比的甜蜜”。", "h_s": "本杰明·富兰克林将玻璃琴的音色描述为“无与伦比的甜蜜”。"}, "w_s": "无与伦比"}, {"w": "情不自禁", "py": "qíng bù zì jīn", "lit": "feeling-not-self-restrain", "en": "can't help (doing something)", "origin": {"work": "劉遵〈七夕穿針〉詩", "text": "步月如有意，情來不自禁", "checked": ["moe"], "text_s": "步月如有意，情来不自禁"}, "ex": {"h": "雖然她有許多缺點，但我卻情不自禁地愛著她。", "py": "Suī rán tā yǒu xǔ duō quē diǎn, dàn wǒ què qíng bù zì jīn de ài zhe tā.", "py_auto": true, "src": "tatoeba", "en": "She has many faults, but I can't help loving her.", "h_t": "雖然她有許多缺點，但我卻情不自禁地愛著她。", "h_s": "虽然她有许多缺点，但我却情不自禁地爱著她。"}, "w_s": "情不自禁"}, {"w": "束手無策", "py": "shù shǒu wú cè", "lit": "bind-hands-without-plan", "en": "helpless, at one's wits' end", "ex": {"h": "當我聽到這個消息時, 我束手無策。", "py": "Dāng wǒ tīng dào zhè ge xiāo xī shí, wǒ shù shǒu wú cè.", "py_auto": true, "src": "tatoeba", "en": "When I heard the news, I didn't know what to do.", "h_t": "當我聽到這個消息時, 我束手無策。", "h_s": "当我听到这个消息时, 我束手无策。"}, "w_s": "束手无策"}, {"w": "截然不同", "py": "jié rán bù tóng", "lit": "cut-off-not-same", "en": "completely different", "ex": {"h": "我們的興趣截然不同。", "py": "Wǒ men de xìng qù jié rán bù tóng.", "py_auto": true, "src": "tatoeba", "en": "Our interests are completely different.", "h_t": "我們的興趣截然不同。", "h_s": "我们的兴趣截然不同。"}, "w_s": "截然不同"}, {"w": "意想不到", "py": "yì xiǎng bù dào", "lit": "idea-think-not-reach", "en": "unexpected", "ex": {"h": "一時失言常常會帶來意想不到的結果。", "py": "Yī shí shī yán cháng cháng huì dài lái yì xiǎng bù dào de jié guǒ.", "py_auto": true, "src": "tatoeba", "en": "A slip of the tongue often has unexpected results.", "h_t": "一時失言常常會帶來意想不到的結果。", "h_s": "一时失言常常会带来意想不到的结果。"}, "w_s": "意想不到"}, {"w": "出乎意料", "py": "chū hū yì liào", "lit": "go-beyond-intention-expectation", "en": "unexpectedly", "note": "乎 = 於 \"beyond\". Also 出乎意料之外 (redundant but common).", "ex": {"h": "让我出乎意料的是，他居然很会唱歌。", "py": "Ràng wǒ chū hū yì liào de shì, tā jū rán hěn huì chàng gē.", "py_auto": true, "src": "tatoeba", "en": "What surprised me was that he actually sings very well.", "h_t": "讓我出乎意料的是，他居然很會唱歌。", "h_s": "让我出乎意料的是，他居然很会唱歌。"}, "w_s": "出乎意料"}, {"w": "出人意料", "py": "chū rén yì liào", "lit": "go-beyond-people's-expectation", "en": "surprisingly, unexpectedly", "ex": {"h": "岬的饭量出人意料地大，曾经一个人吃掉好几个人份的咖喱。", "py": "Jiǎ de fàn liàng chū rén yì liào de dà, céng jīng yī gè rén chī diào hǎo jǐ gè rén fèn de gā lí.", "py_auto": true, "src": "wikipedia: ONE～光辉的季节～", "en": "Misaki eats a surprising amount: she once finished several people's portions of curry on her own.", "h_t": "岬的飯量出人意料地大，曾經一個人吃掉好幾個人份的咖喱。", "h_s": "岬的饭量出人意料地大，曾经一个人吃掉好几个人份的咖喱。"}, "w_s": "出人意料"}, {"w": "無家可歸", "py": "wú jiā kě guī", "lit": "without-home-can-return", "en": "homeless", "ex": {"h": "当我无家可归的时候，我常在那张长椅上睡觉。", "py": "Dāng wǒ wú jiā kě guī de shí hòu, wǒ cháng zài nà zhāng cháng yǐ shàng shuì jiào.", "py_auto": true, "src": "tatoeba", "en": "When I was homeless, I often slept on that bench.", "h_t": "當我無家可歸的時候，我常在那張長椅上睡覺。", "h_s": "当我无家可归的时候，我常在那张长椅上睡觉。"}, "w_s": "无家可归"}], "title_s": "否定"}, {"id": 5, "slug": "images", "title": "意象", "title_py": "Yìxiàng", "title_en": "Pictures: body, roots and light", "status": "draft", "intro": "These 成語 are pictures. Read them literally first (feet on solid ground, hands tucked in sleeves, hair and bones standing on end, deep roots and firm stalks) and the figurative meaning follows. Many come from classical texts you will meet in the main course: the 詩經, 老子, 左傳, 禮記·大學.\n", "items": [{"w": "實事求是", "py": "shí shì qiú shì", "lit": "real-facts-seek-truth", "en": "to seek truth from facts, to be realistic", "origin": {"work": "漢書·景十三王傳", "text": "河間獻王德…修學好古，實事求是", "checked": ["moe"], "text_s": "河间献王德…修学好古，实事求是"}, "note": "Originally praise for a prince who collected old books and checked them carefully. Later a Qing scholarly motto, then a political slogan.", "ex": {"h": "说话要实事求是。", "py": "Shuō huà yào shí shì qiú háng dà zhàn yī chù jí fā.", "py_auto": true, "src": "wikipedia: 维陶塔斯", "en": "Once both Poland and Lithuania backed the rebels, a major war could break out at any moment.", "h_t": "自從波蘭和立陶宛都支持了造反者，一場大戰一觸即發。", "h_s": "自从波兰和立陶宛都支持了造反者，一场大战一触即发。"}, "w_s": "一触即发"}, {"w": "一本正經", "py": "yī běn zhèng jīng", "lit": "one-volume-orthodox-classic", "en": "in all seriousness, prim and proper", "note": "正經 were the orthodox classics; to look as if holding one = to look very serious, often too serious.", "ex": {"h": "身形魁武的金髮帥哥，但性格一本正經，讓人難以親近。", "py": "Shēn xíng kuí wǔ de jīn fà shuài gē, dàn xìng gé yī běn zhèng jīng, ràng rén nán yǐ qīn jìn.", "py_auto": true, "src": "wikipedia: 英雄傳說 軌跡系列角色列表", "en": "A tall, handsome blond man, but so very proper that people find him hard to approach.", "h_t": "身形魁武的金髮帥哥，但性格一本正經，讓人難以親近。", "h_s": "身形魁武的金发帅哥，但性格一本正经，让人难以亲近。"}, "w_s": "一本正经"}, {"w": "一目瞭然", "py": "yī mù liǎo rán", "lit": "one-glance-clear", "en": "clear at a glance", "origin": {"work": "朱子語類·卷一三七", "text": "從高視下，一目瞭然", "checked": ["moe"], "text_s": "从高视下，一目了然"}, "note": "Simplified 一目了然: 瞭 merged into 了.", "ex": {"h": "这个证明的妙处是一目了然，而不必再用公式或语言叙述了。", "py": "Zhè ge zhèng míng de miào chù shì yī mù liǎo rán, ér bù bì zài yòng gōng shì huò yǔ yán xù shù le.", "py_auto": true, "src": "wikipedia: 披薩定理", "en": "The beauty of this proof is that it is clear at a glance, with no need for formulas or words.", "h_t": "這個證明的妙處是一目瞭然，而不必再用公式或語言敘述了。", "h_s": "这个证明的妙处是一目了然，而不必再用公式或语言叙述了。"}, "w_s": "一目了然"}, {"w": "一應俱全", "py": "yī yīng jù quán", "lit": "all-that's-needed-all-complete", "en": "everything one needs is there", "ex": {"h": "屋苑附近亦有多所中小學校，生活及娛樂設施一應俱全。", "py": "Wū yuàn fù jìn yì yǒu duō suǒ zhōng xiǎo xué xiào, shēng huó jí yú lè shè shī yī yīng jù quán.", "py_auto": true, "src": "wikipedia: 環宇海灣", "en": "There are also several schools near the estate, and every everyday and leisure facility you could need.", "h_t": "屋苑附近亦有多所中小學校，生活及娛樂設施一應俱全。", "h_s": "屋苑附近亦有多所中小学校，生活及娱乐设施一应俱全。"}, "w_s": "一应俱全"}, {"w": "煥然一新", "py": "huàn rán yī xīn", "lit": "shining-like-all-new", "en": "looking brand new, completely renewed", "origin": {"work": "張彥遠《歷代名畫記》", "text": "其有晉宋名跡，煥然如新", "checked": ["dcd"], "text_s": "其有晋宋名迹，焕然如新"}, "note": "The source says \"shining as if new\" (如新), of paintings centuries old.", "ex": {"h": "适度的运动让身心焕然一新。", "py": "Shì dù de yùn dòng ràng shēn xīn huàn rán yī xīn.", "py_auto": true, "src": "tatoeba", "en": "Moderate exercise renews body and mind.", "h_t": "適度的運動讓身心煥然一新。", "h_s": "适度的运动让身心焕然一新。"}, "w_s": "焕然一新"}, {"w": "不折不扣", "py": "bù zhé bù kòu", "lit": "not-break-not-deduct", "en": "through and through, a real…", "note": "Originally about money, \"no discount, no deduction\". Now usually before a noun, often negative (不折不扣的騙子 \"a real crook\").", "ex": {"h": "雖然是不折不扣的老菸槍，但也是個很有才幹的記者。", "py": "Suī rán shì bù zhé bù kòu de lǎo yān qiāng, dàn yě shì gè hěn yǒu cái gàn de jì zhě.", "py_auto": true, "src": "wikipedia: 英雄傳說 軌跡系列角色列表", "en": "He's a chain-smoker through and through, but also a very able journalist.", "h_t": "雖然是不折不扣的老菸槍，但也是個很有才幹的記者。", "h_s": "虽然是不折不扣的老烟枪，但也是个很有才干的记者。"}, "w_s": "不折不扣"}], "title_s": "对称与数字"}, {"id": 7, "slug": "particles-2", "title": "虛詞（二）", "title_py": "Xūcí (èr)", "title_en": "Classical grammar, part 2", "status": "draft", "intro": "More 文言 function words, frozen inside modern 成語. 而 again links two verbs (\"and, and then, yet\"). 之 is now also an object pronoun \"it\" (持之以恆 \"hold it with constancy\"). 以 marks the means or the purpose (以身作則 \"with one's own person, make a model\"). 其 is \"its, the\" and 可 + verb is \"can be V-ed\" (屈指可數 \"can be counted on the fingers\"). 所 + verb, from lesson 3, turns a verb into \"what one Vs\".\n", "frames": [{"f": "X而V", "en": "而 joins a manner or a first action to the main verb", "ex": ["背道而馳", "不得而知", "脫口而出", "不言而喻", "從天而降", "久而久之"], "f_s": "X而V", "ex_s": ["背道而驰", "不得而知", "脱口而出", "不言而喻", "从天而降", "久而久之"]}, {"f": "V之", "en": "之 = 'it', the object", "ex": ["久而久之", "持之以恆", "不了了之"], "f_s": "V之", "ex_s": ["久而久之", "持之以恒", "不了了之"]}, {"f": "以 + N / V", "en": "'with, by means of' or 'so as to'", "ex": ["持之以恆", "以身作則", "拭目以待"], "f_s": "以 + N / V", "ex_s": ["持之以恒", "以身作则", "拭目以待"]}, {"f": "其", "en": "'its, his, the'", "ex": ["適得其反", "若無其事"], "f_s": "其", "ex_s": ["适得其反", "若无其事"]}, {"f": "無可V / 可V", "en": "'nothing that can be V-ed' / 'can be V-ed'", "ex": ["無可厚非", "無可奈何", "無計可施", "屈指可數"], "f_s": "无可V / 可V", "ex_s": ["无可厚非", "无可奈何", "无计可施", "屈指可数"]}, {"f": "所V / 之N", "en": "'what one Vs' / 'the N of'", "ex": ["匪夷所思", "後顧之憂", "有生之年"], "f_s": "所V / 之N", "ex_s": ["匪夷所思", "后顾之忧", "有生之年"]}], "items": [{"w": "背道而馳", "py": "bèi dào ér chí", "lit": "turn-back-on-road-and-gallop", "en": "to run in the opposite direction, to go against", "origin": {"work": "白居易〈為人上宰相書〉", "text": "又將背古道而馳者也", "checked": ["moe"], "text_s": "又将背古道而驰者也"}, "ex": {"h": "他的行為和他的信念背道而馳。", "py": "Tā de xíng wéi hé tā de xìn niàn bèi dào ér chí.", "py_auto": true, "src": "tatoeba", "en": "His actions run counter to his beliefs.", "h_t": "他的行為和他的信念背道而馳。", "h_s": "他的行为和他的信念背道而驰。"}, "w_s": "背道而驰"}, {"w": "不得而知", "py": "bù dé ér zhī", "lit": "not-able-to-and-know", "en": "unknown, impossible to know", "ex": {"h": "这个计划能否成功还不得而知。", "py": "Zhè ge jì huà néng fǒu chéng gōng hái bù dé ér zhī.", "py_auto": true, "src": "tatoeba", "en": "Whether this plan will succeed is not yet known.", "h_t": "這個計劃能否成功還不得而知。", "h_s": "这个计划能否成功还不得而知。"}, "w_s": "不得而知"}, {"w": "脫口而出", "py": "tuō kǒu ér chū", "lit": "escape-mouth-and-come-out", "en": "to blurt out", "ex": {"h": "汤姆不假思索脱口而出。", "py": "Tāngmǔ bù jiǎ sī suǒ tuō kǒu ér chū.", "py_auto": true, "src": "tatoeba", "en": "Tom blurted it out without thinking.", "h_t": "湯姆不假思索脫口而出。", "h_s": "汤姆不假思索脱口而出。"}, "w_s": "脱口而出"}, {"w": "不言而喻", "py": "bù yán ér yù", "lit": "not-speak-and-understood", "en": "it goes without saying", "origin": {"work": "孟子·盡心上", "text": "施於四體，四體不言而喻", "checked": ["moe"], "text_s": "施于四体，四体不言而喻"}, "note": "Mencius says the virtues show in a man's whole body, which \"understands without being told\".", "ex": {"h": "當然，不言而喻，該宣言的效力與官方條約有很大不同。", "py": "Dāng rán, bù yán ér yù, gāi xuān yán de xiào lì yǔ guān fāng tiáo yuē yǒu hěn dà bù tóng.", "py_auto": true, "src": "wikipedia: 第一共和國 (大韓民國)", "en": "Of course, it goes without saying that such a declaration carries much less weight than an official treaty.", "h_t": "當然，不言而喻，該宣言的效力與官方條約有很大不同。", "h_s": "当然，不言而喻，该宣言的效力与官方条约有很大不同。"}, "w_s": "不言而喻"}, {"w": "從天而降", "py": "cóng tiān ér jiàng", "lit": "from-sky-and-descend", "en": "to fall from the sky, to come out of nowhere", "note": "降 is jiàng \"come down\" here (xiáng = surrender).", "ex": {"h": "大炸彈從天而降，奪走了許多人的生命。", "py": "Dà zhà dàn cóng tiān ér jiàng, duó zǒu le xǔ duō rén de shēng mìng.", "py_auto": true, "src": "tatoeba", "en": "Huge bombs fell from the sky and took many lives.", "h_t": "大炸彈從天而降，奪走了許多人的生命。", "h_s": "大炸弹从天而降，夺走了许多人的生命。"}, "w_s": "从天而降"}, {"w": "久而久之", "py": "jiǔ ér jiǔ zhī", "lit": "long-and-long-it", "en": "over time, little by little", "note": "之 here is an empty filler that rounds off the rhythm, a common classical use.", "ex": {"h": "久而久之，随着族群的融合交流，形成了新一代的自贡人。", "py": "Jiǔ ér jiǔ zhī, suí zhe zú qún de róng hé jiāo liú, xíng chéng le xīn yī dài de Zìgòng rén.", "py_auto": true, "src": "wikipedia: 自貢話", "en": "Over time, as the different groups mixed, a new generation of Zigong people took shape.", "h_t": "久而久之，隨著族群的融合交流，形成了新一代的自貢人。", "h_s": "久而久之，随着族群的融合交流，形成了新一代的自贡人。"}, "w_s": "久而久之"}, {"w": "匪夷所思", "py": "fěi yí suǒ sī", "lit": "not-ordinary-what-think", "en": "unimaginable, bizarre", "note": "匪 = 非 \"not\", 夷 \"the ordinary\". \"Not what ordinary people would think of.\"", "ex": {"h": "個性大而化之，經常做出很多匪夷所思的事，讓家人無言以對。", "py": "Gè xìng dà ér huà zhī, jīng cháng zuò chū hěn duō fěi yí suǒ sī de shì, ràng jiā rén wú yán yǐ duì.", "py_auto": true, "src": "wikipedia: 百姓貴族", "en": "Easy-going by nature, always doing bizarre things that leave the family speechless.", "h_t": "個性大而化之，經常做出很多匪夷所思的事，讓家人無言以對。", "h_s": "个性大而化之，经常做出很多匪夷所思的事，让家人无言以对。"}, "w_s": "匪夷所思"}, {"w": "持之以恆", "py": "chí zhī yǐ héng", "lit": "hold-it-with-constancy", "en": "to persevere, to keep at it", "ex": {"h": "我对汤姆要持之以恒地学习法语口语这件事很怀疑。", "py": "Wǒ duì Tāngmǔ yào chí zhī yǐ héng de xué xí Fǎyǔ kǒu yǔ zhè jiàn shì hěn huái yí.", "py_auto": true, "src": "tatoeba", "en": "I doubt Tom will keep at learning spoken French.", "h_t": "我對湯姆要持之以恆地學習法語口語這件事很懷疑。", "h_s": "我对汤姆要持之以恒地学习法语口语这件事很怀疑。"}, "w_s": "持之以恒"}, {"w": "以身作則", "py": "yǐ shēn zuò zé", "lit": "with-self-make-model", "en": "to set an example", "origin": {"work": "後漢書·第五倫傳", "text": "以身教者從，以言教者訟", "checked": ["moe"], "text_s": "以身教者从，以言教者讼"}, "ex": {"h": "冯道根木讷少言，平时领兵带士，以身作则，对部下要求严格。", "py": "Féng Dàogēn mù nè shǎo yán, píng shí lǐng bīng dài shì, yǐ shēn zuò zé, duì bù xià yāo qiú yán gé.", "py_auto": true, "src": "wikipedia: 冯道根", "en": "Feng Daogen was a man of few words; leading his troops, he set the example and was strict with his men.", "h_t": "馮道根木訥少言，平時領兵帶士，以身作則，對部下要求嚴格。", "h_s": "冯道根木讷少言，平时领兵带士，以身作则，对部下要求严格。"}, "w_s": "以身作则"}, {"w": "拭目以待", "py": "shì mù yǐ dài", "lit": "wipe-eyes-so-as-to-wait", "en": "to wait and see, to watch this space", "origin": {"work": "漢書·張敞傳", "text": "天下莫不拭目傾耳", "checked": ["moe"], "text_s": "天下莫不拭目倾耳"}, "ex": {"h": "這是一首充滿愛與感謝的歌曲，請大家拭目以待！", "py": "Zhè shì yī shǒu chōng mǎn ài yǔ gǎn xiè de gē qǔ, qǐng dà jiā shì mù yǐ dài!", "py_auto": true, "src": "wikipedia: 4月19日 (歌曲)", "en": "It is a song full of love and gratitude: everyone, watch this space!", "h_t": "這是一首充滿愛與感謝的歌曲，請大家拭目以待！", "h_s": "这是一首充满爱与感谢的歌曲，请大家拭目以待！"}, "w_s": "拭目以待"}, {"w": "適得其反", "py": "shì dé qí fǎn", "lit": "just-get-its-opposite", "en": "to have the opposite effect, to backfire", "ex": {"h": "但有意见认为这次修缮适得其反，是对古桥的\"破坏性保护\"。", "py": "Dàn yǒu yì jiàn rèn wéi zhè cì xiū shàn shì dé qí fǎn, shì duì gǔ qiáo de “pò huài xìng bǎo hù”.", "py_auto": true, "src": "wikipedia: 七桥瓮", "en": "But some held that the repairs backfired, a 'destructive protection' of the old bridge.", "h_t": "但有意見認為這次修繕適得其反，是對古橋的\"破壞性保護\"。", "h_s": "但有意见认为这次修缮适得其反，是对古桥的\"破坏性保护\"。"}, "w_s": "适得其反"}, {"w": "若無其事", "py": "ruò wú qí shì", "lit": "as-if-without-the-matter", "en": "as if nothing had happened", "ex": {"h": "他雖然擺着一副若無其事的樣子，但是我想他心裏一定擔心得不得了。", "py": "Tā suī rán bǎi zhe yī fù ruò wú qí shì de yàng zi, dàn shì wǒ xiǎng tā xīn lǐ yī dìng dān xīn de bù dé le.", "py_auto": true, "src": "tatoeba", "en": "He's acting as if nothing's wrong, but I think he must be terribly worried inside.", "h_t": "他雖然擺著一副若無其事的樣子，但是我想他心裡一定擔心得不得了。", "h_s": "他虽然摆着一副若无其事的样子，但是我想他心里一定担心得不得了。"}, "w_s": "若无其事"}, {"w": "後顧之憂", "py": "hòu gù zhī yōu", "lit": "behind-look-'s-worry", "en": "worries about what one leaves behind", "note": "後顧 \"look back over one's shoulder\". Usually 沒有/解除後顧之憂 \"free from worry at home\".", "ex": {"h": "蒙古军队从此没有后顾之忧，可以无所顾忌地发起强大多的远征。", "py": "Ménggǔ jūn duì cóng cǐ méi yǒu hòu gù zhī yōu, kě yǐ wú suǒ gù jì de fā qǐ qiáng dà duō de yuǎn zhēng.", "py_auto": true, "src": "wikipedia: 长子西征", "en": "From then on the Mongol army had nothing to fear behind it and could launch much bigger campaigns without hesitation.", "h_t": "蒙古軍隊從此沒有後顧之憂，可以無所顧忌地發起強大多的遠征。", "h_s": "蒙古军队从此没有后顾之忧，可以无所顾忌地发起强大多的远征。"}, "w_s": "后顾之忧"}, {"w": "有生之年", "py": "yǒu shēng zhī nián", "lit": "have-life-'s-years", "en": "in one's lifetime", "ex": {"h": "就算可行，也会是设计者有生之年都无法建成的超级工程。", "py": "Jiù suàn kě xíng, yě huì shì shè jì zhě yǒu shēng zhī nián dōu wú fǎ jiàn chéng de chāo jí gōng chéng.", "py_auto": true, "src": "wikipedia: 黄石火山", "en": "Even if feasible, it would be a mega-project its designers could not complete in their lifetime.", "h_t": "就算可行，也會是設計者有生之年都無法建成的超級工程。", "h_s": "就算可行，也会是设计者有生之年都无法建成的超级工程。"}, "w_s": "有生之年"}, {"w": "不了了之", "py": "bù liǎo liǎo zhī", "lit": "not-finish-finish-it", "en": "to fizzle out, to leave unresolved", "note": "The first 了 is \"settled\", the second \"to end\": \"end it by not settling it\".", "ex": {"h": "但其后巴
