i ! Toi aussi, tu cherches le supermarché ?", "en": "Zhang Wei! Are you looking for the supermarket too?", "who_t": "馬克", "toks": [{"s": "张伟", "t": "張偉", "p": "Zhāng Wěi", "k": "张伟"}, {"s": "！", "t": "！"}, {"s": "你", "t": "你", "p": "Nǐ", "k": "你"}, {"s": "也", "t": "也", "p": "yě", "k": "也"}, {"s": "找", "t": "找", "p": "zhǎo", "k": "找"}, {"s": "超市", "t": "超市", "p": "chāoshì", "k": "超市"}, {"s": "？", "t": "？"}]}, {"n": 12, "who": "张伟", "h": "对！我们一起走吧。", "py": "Duì! Wǒmen yìqǐ zǒu ba.", "fr": "Oui ! Allons-y ensemble.", "en": "Yes! Let's go together.", "who_t": "張偉", "toks": [{"s": "对", "t": "對", "p": "Duì", "k": "对"}, {"s": "！", "t": "！"}, {"s": "我们", "t": "我們", "p": "Wǒmen", "k": "我们"}, {"s": "一起", "t": "一起", "p": "yìqǐ", "k": "一起"}, {"s": "走", "t": "走", "p": "zǒu", "k": "走"}, {"s": "吧", "t": "吧", "p": "ba", "k": "吧"}, {"s": "。", "t": "。"}]}], "notes": [{"n": 1, "line": 1, "topic": "vocab", "fr": "**请问** qǐngwèn « puis-je demander » : 请 « prier, s'il vous plaît » + 问 « demander » (L5). C'est la façon polie d'aborder un inconnu, comme « excusez-moi ».\n", "en": "**请问** qǐngwèn \"may I ask\": 请 \"please\" + 问 \"to ask\" (L5). The polite way to stop a stranger, like \"excuse me\".\n", "fr_t": "**請問** qǐngwèn « puis-je demander » : 請 « prier, s'il vous plaît » + 問 « demander » (L5). C'est la façon polie d'aborder un inconnu, comme « excusez-moi ».\n", "en_t": "**請問** qǐngwèn \"may I ask\": 請 \"please\" + 問 \"to ask\" (L5). The polite way to stop a stranger, like \"excuse me\".\n"}, {"n": 2, "line": 1, "topic": "grammar", "fr": "**Lieu + 有 + chose** = « il y a » : 这儿附近有超市 « près d'ici, il y a un supermarché ». Le lieu vient en premier. Même 有 que « avoir » (L4 n.6) : on le nie aussi avec 没.\n", "en": "**Place + 有 + thing** = \"there is\": 这儿附近有超市 \"near here there's a supermarket\". The place comes first. The same 有 as \"to have\" (L4 n.6), negated with 没 too.\n", "fr_t": "**Lieu + 有 + chose** = « il y a » : 這兒附近有超市 « près d'ici, il y a un supermarché ». Le lieu vient en premier. Même 有 que « avoir » (L4 n.6) : on le nie aussi avec 沒.\n", "en_t": "**Place + 有 + thing** = \"there is\": 這兒附近有超市 \"near here there's a supermarket\". The place comes first. The same 有 as \"to have\" (L4 n.6), negated with 沒 too.\n"}, {"n": 3, "line": 2, "topic": "grammar", "fr": "**Chose + 在 + lieu** = « se trouver » : 超市在前面 « le supermarché est devant ». Comparez avec la note 2 : 有 présente quelque chose de nouveau, 在 situe une chose déjà connue.\n", "en": "**Thing + 在 + place** = \"to be (located)\": 超市在前面 \"the supermarket is ahead\". Compare note 2: 有 brings in something new, 在 places something already known.\n", "fr_t": "**Chose + 在 + lieu** = « se trouver » : 超市在前面 « le supermarché est devant ». Comparez avec la note 2 : 有 présente quelque chose de nouveau, 在 situe une chose déjà connue.\n", "en_t": "**Thing + 在 + place** = \"to be (located)\": 超市在前面 \"the supermarket is ahead\". Compare note 2: 有 brings in something new, 在 places something already known.\n"}, {"n": 4, "line": 4, "topic": "grammar", "fr": "Les mots de position suivent le nom, à l'inverse du français : 银行旁边 « banque-côté » = « à côté de la banque ». De même 前面 « devant », 附近 « alentours » : 这儿附近 « près d'ici ».\n", "en": "Position words come after the noun, the reverse of English: 银行旁边 \"bank-side\" = \"next to the bank\". Likewise 前面 \"in front\", 附近 \"nearby\": 这儿附近 \"near here\".\n", "fr_t": "Les mots de position suivent le nom, à l'inverse du français : 銀行旁邊 « banque-côté » = « à côté de la banque ». De même 前面 « devant », 附近 « alentours » : 這兒附近 « près d'ici ».\n", "en_t": "Position words come after the noun, the reverse of English: 銀行旁邊 \"bank-side\" = \"next to the bank\". Likewise 前面 \"in front\", 附近 \"nearby\": 這兒附近 \"near here\".\n"}, {"n": 5, "line": 4, "topic": "vocab", "fr": "**就** jiù devant un verbe insiste : « justement, tout juste ». 就在银行旁边 « c'est juste à côté de la banque ». 就 a beaucoup d'emplois ; on les verra au fil des leçons.\n", "en": "**就** jiù before a verb adds emphasis: \"just, right\". 就在银行旁边 \"it's right next to the bank\". 就 has many uses; they'll come one by one.\n", "fr_t": "**就** jiù devant un verbe insiste : « justement, tout juste ». 就在銀行旁邊 « c'est juste à côté de la banque ». 就 a beaucoup d'emplois ; on les verra au fil des leçons.\n", "en_t": "**就** jiù before a verb adds emphasis: \"just, right\". 就在銀行旁邊 \"it's right next to the bank\". 就 has many uses; they'll come one by one.\n"}, {"n": 6, "line": 5, "topic": "pron", "fr": "**哪儿** nǎr, **这儿** zhèr, **那儿** nàr : le 儿 ne fait pas de syllabe, il ajoute un « r » à la fin (l'erhua, typique de Pékin). Dans le Sud et à Taïwan, on dit 哪里, 这里, 那里 (comme le 哪里 de L3 n.9).\n", "en": "**哪儿** nǎr, **这儿** zhèr, **那儿** nàr: the 儿 is not a syllable, it adds an \"r\" at the end (erhua, typical of Beijing). In the south and in Taiwan people say 哪里, 这里, 那里 (like the 哪里 of L3 n.9).\n", "fr_t": "**哪兒** nǎr, **這兒** zhèr, **那兒** nàr : le 兒 ne fait pas de syllabe, il ajoute un « r » à la fin (l'erhua, typique de Pékin). Dans le Sud et à Taïwan, on dit 哪裏, 這裏, 那裏 (comme le 哪裏 de L3 n.9).\n", "en_t": "**哪兒** nǎr, **這兒** zhèr, **那兒** nàr: the 兒 is not a syllable, it adds an \"r\" at the end (erhua, typical of Beijing). In the south and in Taiwan people say 哪裏, 這裏, 那裏 (like the 哪裏 of L3 n.9).\n"}, {"n": 7, "line": 8, "topic": "vocab", "fr": "**不客气** bú kèqi « de rien », litt. « ne sois pas poli ». 客气 kèqi = « poli, cérémonieux ».\n", "en": "**不客气** bú kèqi \"you're welcome\", lit. \"don't be polite\". 客气 kèqi = \"polite, formal\".\n", "fr_t": "**不客氣** bú kèqi « de rien », litt. « ne sois pas poli ». 客氣 kèqi = « poli, cérémonieux ».\n", "en_t": "**不客氣** bú kèqi \"you're welcome\", lit. \"don't be polite\". 客氣 kèqi = \"polite, formal\".\n"}, {"n": 8, "line": 10, "topic": "vocab", "fr": "**对不起** duìbuqǐ « pardon, désolé », litt. « ne pas pouvoir faire face ». On répond **没关系** méi guānxi « ce n'est rien », litt. « pas de rapport ».\n", "en": "**对不起** duìbuqǐ \"sorry\", lit. \"can't face (you)\". The answer is **没关系** méi guānxi \"no problem\", lit. \"no connection\".\n", "fr_t": "**對不起** duìbuqǐ « pardon, désolé », litt. « ne pas pouvoir faire face ». On répond **沒關係** méi guānxi « ce n'est rien », litt. « pas de rapport ».\n", "en_t": "**對不起** duìbuqǐ \"sorry\", lit. \"can't face (you)\". The answer is **沒關係** méi guānxi \"no problem\", lit. \"no connection\".\n"}, {"n": 9, "line": 10, "topic": "grammar", "fr": "在 peut aussi s'employer pour une personne : 你也在这儿 « toi aussi, tu es là ». Le même schéma que la note 3 : qui + 在 + où.\n", "en": "在 works for people too: 你也在这儿 \"you're here too\". The same pattern as note 3: who + 在 + where.\n", "fr_t": "在 peut aussi s'employer pour une personne : 你也在這兒 « toi aussi, tu es là ». Le même schéma que la note 3 : qui + 在 + où.\n", "en_t": "在 works for people too: 你也在這兒 \"you're here too\". The same pattern as note 3: who + 在 + where.\n"}, {"n": 10, "line": 12, "topic": "pron", "fr": "**一起** yìqǐ « ensemble » : 一 devant un troisième ton se dit yì (L4 n.7). Il se place devant le verbe, comme 也 et 都.\n", "en": "**一起** yìqǐ \"together\": 一 before a third tone is said yì (L4 n.7). It goes before the verb, like 也 and 都.\n", "fr_t": "**一起** yìqǐ « ensemble » : 一 devant un troisième ton se dit yì (L4 n.7). Il se place devant le verbe, comme 也 et 都.\n", "en_t": "**一起** yìqǐ \"together\": 一 before a third tone is said yì (L4 n.7). It goes before the verb, like 也 and 都.\n"}], "words": [{"w": "请问", "py": "qǐngwèn", "fr": "excusez-moi (pour demander)", "en": "excuse me (to ask)", "t": "請問", "lvl": "1"}, {"w": "这儿", "py": "zhèr", "fr": "ici", "en": "here", "t": "這兒", "lvl": "1"}, {"w": "附近", "py": "fùjìn", "fr": "alentours, près de", "en": "nearby, near", "t": "附近", "lvl": "3"}, {"w": "超市", "py": "chāoshì", "fr": "supermarché", "en": "supermarket", "t": "超市", "lvl": "1"}, {"w": "在", "py": "zài", "fr": "se trouver, être (à)", "en": "to be (at, in)", "t": "在", "lvl": "1"}, {"w": "前面", "py": "qiánmiàn", "fr": "devant", "en": fr": "**多少** duōshao « combien » vaut pour n'importe quel nombre et n'a pas besoin de classificateur, à la différence de 几 (L4 n.2). 多少钱 « combien d'argent ». Le prix vient avant l'unité : 多少钱一斤 « combien une livre », 八块一斤 « huit yuans la livre ».\n", "en": "**多少** duōshao \"how much, how many\" works for any number and needs no measure word, unlike 几 (L4 n.2). 多少钱 \"how much money\". The price comes before the unit: 多少钱一斤 \"how much a jin\", 八块一斤 \"eight kuai a jin\".\n", "fr_t": "**多少** duōshao « combien » vaut pour n'importe quel nombre et n'a pas besoin de classificateur, à la différence de 幾 (L4 n.2). 多少錢 « combien d'argent ». Le prix vient avant l'unité : 多少錢一斤 « combien une livre », 八塊一斤 « huit yuans la livre ».\n", "en_t": "**多少** duōshao \"how much, how many\" works for any number and needs no measure word, unlike 幾 (L4 n.2). 多少錢 \"how much money\". The price comes before the unit: 多少錢一斤 \"how much a jin\", 八塊一斤 \"eight kuai a jin\".\n"}, {"n": 4, "line": 3, "topic": "culture", "fr": "L'argent : 块 kuài à l'oral = 元 yuán à l'écrit (le yuan). Un dixième de yuan se dit 毛 máo : 五块五毛 = 5,50, et on laisse tomber le dernier mot : 五块五. **斤** jīn = 500 g, l'unité des marchés.\n", "en": "Money: 块 kuài in speech = 元 yuán in writing (the yuan). A tenth of a yuan is 毛 máo: 五块五毛 = 5.50, and the last word is dropped: 五块五. **斤** jīn = 500 g, the market unit.\n", "fr_t": "L'argent : 塊 kuài à l'oral = 元 yuán à l'écrit (le yuan). Un dixième de yuan se dit 毛 máo : 五塊五毛 = 5,50, et on laisse tomber le dernier mot : 五塊五. **斤** jīn = 500 g, l'unité des marchés.\n", "en_t": "Money: 塊 kuài in speech = 元 yuán in writing (the yuan). A tenth of a yuan is 毛 máo: 五塊五毛 = 5.50, and the last word is dropped: 五塊五. **斤** jīn = 500 g, the market unit.\n"}, {"n": 5, "line": 4, "topic": "grammar", "fr": "便宜的 « des pas chères » : adjectif + 的 = nom (L6 n.4). 有便宜的吗？« Vous en avez des pas chères ? ».\n", "en": "便宜的 \"cheap ones\": adjective + 的 = noun (L6 n.4). 有便宜的吗？\"Do you have cheap ones?\".\n", "fr_t": "便宜的 « des pas chères » : adjectif + 的 = nom (L6 n.4). 有便宜的嗎？« Vous en avez des pas chères ? ».\n", "en_t": "便宜的 \"cheap ones\": adjective + 的 = noun (L6 n.4). 有便宜的嗎？\"Do you have cheap ones?\".\n"}, {"n": 6, "line": 7, "topic": "grammar", "fr": "**还** hái « encore, en plus » devant le verbe : 还要别的吗 « vous voulez encore autre chose ? ». 我们还要买水 « il faut encore acheter de l'eau ». 别的 bié de « autre (chose) ».\n", "en": "**还** hái \"also, in addition\" before the verb: 还要别的吗 \"do you want anything else?\". 我们还要买水 \"we still need to buy water\". 别的 bié de \"other (things)\".\n", "fr_t": "**還** hái « encore, en plus » devant le verbe : 還要別的嗎 « vous voulez encore autre chose ? ». 我們還要買水 « il faut encore acheter de l'eau ». 別的 bié de « autre (chose) ».\n", "en_t": "**還** hái \"also, in addition\" before the verb: 還要別的嗎 \"do you want anything else?\". 我們還要買水 \"we still need to buy water\". 別的 bié de \"other (things)\".\n"}, {"n": 7, "line": 10, "topic": "pron", "fr": "一共 yígòng « en tout » : yí devant un quatrième ton (L4 n.7). Le même 一 se dit yì devant 斤, premier ton (ligne 2).\n", "en": "一共 yígòng \"altogether\": yí before a fourth tone (L4 n.7). The same 一 is yì before 斤, a first tone (line 2).\n", "fr_t": "一共 yígòng « en tout » : yí devant un quatrième ton (L4 n.7). Le même 一 se dit yì devant 斤, premier ton (ligne 2).\n", "en_t": "一共 yígòng \"altogether\": yí before a fourth tone (L4 n.7). The same 一 is yì before 斤, a first tone (line 2).\n"}, {"n": 8, "line": 12, "topic": "vocab", "fr": "**给** gěi « donner » : 给您 « (je vous) donne », la formule pour tendre l'argent ou un objet. On verra plus tard 给 « pour, à » devant un verbe.\n", "en": "**给** gěi \"to give\": 给您 \"(I) give you\", what you say when handing over money or an object. Later, 给 will also mean \"for, to\" before a verb.\n", "fr_t": "**給** gěi « donner » : 給您 « (je vous) donne », la formule pour tendre l'argent ou un objet. On verra plus tard 給 « pour, à » devant un verbe.\n", "en_t": "**給** gěi \ ": "wǔ", "k": "五"}, {"s": "分", "t": "分", "p": "fēn", "k": "分"}, {"s": "。", "t": "。"}, {"s": "张伟", "t": "張偉", "p": "Zhāng Wěi", "k": "张伟"}, {"s": "，", "t": "，"}, {"s": "你", "t": "你", "p": "nǐ", "k": "你"}, {"s": "也", "t": "也", "p": "yě", "k": "也"}, {"s": "很", "t": "很", "p": "hěn", "k": "很"}, {"s": "晚", "t": "晚", "p": "wǎn", "k": "晚"}, {"s": "！", "t": "！"}]}, {"n": 11, "who": "马克", "h": "对不起！明天我七点起床！", "py": "Duìbuqǐ! Míngtiān wǒ qī diǎn qǐchuáng!", "fr": "Pardon ! Demain je me lève à sept heures !", "en": "Sorry! Tomorrow I'll get up at seven!", "who_t": "馬克", "toks": [{"s": "对不起", "t": "對不起", "p": "Duìbuqǐ", "k": "对不起"}, {"s": "！", "t": "！"}, {"s": "明天", "t": "明天", "p": "Míngtiān", "k": "明天"}, {"s": "我", "t": "我", "p": "wǒ", "k": "我"}, {"s": "七", "t": "七", "p": "qī", "k": "七"}, {"s": "点", "t": "點", "p": "diǎn", "k": "点"}, {"s": "起床", "t": "起牀", "p": "qǐchuáng", "k": "起床"}, {"s": "！", "t": "！"}]}], "notes": [{"n": 1, "line": 2, "topic": "grammar", "fr": "L'heure : nombre + **点** diǎn : 八点 « huit heures ». Les minutes avec **分** fēn : 九点五分 « neuf heures cinq ». La demie : **半** bàn, 八点半. Pour demander : 几点 « combien d'heures » (几, L4 n.2).\n", "en": "Telling the time: number + **点** diǎn: 八点 \"eight o'clock\". Minutes with **分** fēn: 九点五分 \"five past nine\". Half past: **半** bàn, 八点半. To ask: 几点 \"how many o'clock\" (几, L4 n.2).\n", "fr_t": "L'heure : nombre + **點** diǎn : 八點 « huit heures ». Les minutes avec **分** fēn : 九點五分 « neuf heures cinq ». La demie : **半** bàn, 八點半. Pour demander : 幾點 « combien d'heures » (幾, L4 n.2).\n", "en_t": "Telling the time: number + **點** diǎn: 八點 \"eight o'clock\". Minutes with **分** fēn: 九點五分 \"five past nine\". Half past: **半** bàn, 八點半. To ask: 幾點 \"how many o'clock\" (幾, L4 n.2).\n"}, {"n": 2, "line": 2, "topic": "vocab", "fr": "**现在** xiànzài « maintenant ». Comme 今年 (L5 n.2), il va en tête ou devant le verbe.\n", "en": "**现在** xiànzài \"now\". Like 今年 (L5 n.2), it goes first or before the verb.\n", "fr_t": "**現在** xiànzài « maintenant ». Comme 今年 (L5 n.2), il va en tête ou devant le verbe.\n", "en_t": "**現在** xiànzài \"now\". Like 今年 (L5 n.2), it goes first or before the verb.\n"}, {"n": 3, "line": 4, "topic": "grammar", "fr": "L'heure d'une action se met **devant le verbe**, jamais après : 我们几点上班 « nous à-quelle-heure commençons », 我每天六点起床 « je chaque-jour six-heures me-lève ». L'ordre : sujet, quand, verbe.\n", "en": "The time of an action goes **before the verb**, never after: 我们几点上班 \"we at-what-time start-work\", 我每天六点起床 \"I every-day six-o'clock get-up\". The order: subject, when, verb.\n", "fr_t": "L'heure d'une action se met **devant le verbe**, jamais après : 我們幾點上班 « nous à-quelle-heure commençons », 我每天六點起牀 « je chaque-jour six-heures me-lève ». L'ordre : sujet, quand, verbe.\n", "en_t": "The time of an action goes **before the verb**, never after: 我們幾點上班 \"we at-what-time start-work\", 我每天六點起牀 \"I every-day six-o'clock get-up\". The order: subject, when, verb.\n"}, {"n": 4, "line": 4, "topic": "vocab", "fr": "**上班** shàngbān « aller au travail, commencer le travail », litt. « monter à l'équipe ». Le contraire : 下班 xiàbān « finir le travail ».\n", "en": "**上班** shàngbān \"go to work, start work\", lit. \"go up to the shift\". Its opposite: 下班 xiàbān \"finish work\".\n", "fr_t": "**上班** shàngbān « aller au travail, commencer le travail », litt. « monter à l'équipe ». Le contraire : 下班 xiàbān « finir le travail ».\n", "en_t": "**上班** shàngbān \"go to work, start work\", lit. \"go up to the shift\". Its opposite: 下班 xiàbān \"finish work\".\n"}, {"n": 5, "line": 6, "topic": "grammar", "fr": "**每** měi « chaque » + **天** tiān « jour » : 每天 « tous les jours ». 天 n'a pas besoin de classificateur. Le verbe n'indique pas le temps : 我七点起床 peut être « je me lève » ou « je me lèverai » (ligne 11) ; le contexte et les mots de temps suffisent.\n", "en": "**每** měi \"every\" + **天** tiān \"day\": 每天 \"every day\". 天 takes no measure word. The verb doesn't show tense: 我七点起床 can be \"I get up\" or \"I'll get up\" (line 11); context and time words do the job.\n", "fr_t": "**每** měi « chaque » + **天** tiān « jour » : 每天 « tous les jours ». 天 n'a pas besoin de classificateur. Le verbe n'indique pas le temps : 我七點起牀 peut être « je me lève » ou « je me lèverai » (ligne 11) ; le contexte et les mots de temps suffisent.\n", "en_t": "**每** měi \"every\" + **天** tiān \"day\": 每天 \"every day\". 天 takes no measure word. The verb doesn't show tense: 我七點起牀 can be \"I get up\" or \"I'll get up\" (line 11); context and time words do the job.\n"}, {"n": 6, "line": 8, "topic": "vocab", "fr": "**早** zǎo « tôt », **晚** wǎn « tard ». 早上 zǎoshang « le matin », 晚上 wǎnshang « le soir » (leçon 11). Au bureau, on se salue souvent d'un simple 早！« bonjour ! » le matin.\n", "en": "**早** zǎo \"early\", **晚** wǎn \"late\". 早上 zǎoshang \"morning\", 晚上 wǎnshang \"evening\" (lesson 11). At work people often greet each other with just 早！\"morning!\".\n", "fr_t": "**早** zǎo « tôt », **晚** wǎn « tard ». 早上 zǎoshang « le matin », 晚上 wǎnshang « le soir » (leçon 11). Au bureau, on se salue souvent d'un simple 早！« bonjour ! » le matin.\n", "en_t": "**早** zǎo \"early\", **晚** wǎn \"late\". 早上 zǎoshang \"morning\", 晚上 wǎnshang \"evening\" (lesson 11). At work people often greet each other with just 早！\"morning!\".\n"}, {"n": 7, "line": 10, "topic": "grammar", "fr": "你也很晚 « toi aussi (tu es) très tard » : un adjectif avec 很 (L1 n.9), sans 是. Le chinois dit « être tard » là où le français dit « être en retard ».\n", "en": "你也很晚 \"you also (are) very late\": an adjective with 很 (L1 n.9), no 是.\n", "fr_t": "你也很晚 « toi aussi (tu es) très tard » : un adjectif avec 很 (L1 n.9), sans 是. Le chinois dit « être tard » là où le français dit « être en retard ».\n", "en_t": "你也很晚 \"you also (are) very late\": an adjective with 很 (L1 n.9), no 是.\n"}], "words": [{"w": "起床", "py": "qǐchuáng", "fr": "se lever", "en": "to get up", "t": "起床", "lvl": "1"}, {"w": "现在", "py": "xiànzài", "fr": "maintenant", "en": "now", "t  "後天", "p": "Hòutiān", "k": "后天"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "星期", "t": "星期", "p": "xīngqī", "k": "星期"}, {"s": "五", "t": "五", "p": "wǔ", "k": "五"}, {"s": "，", "t": "，"}, {"s": "不", "t": "不", "p": "bú", "k": "不"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "星期", "t": "星期", "p": "xīngqī", "k": "星期"}, {"s": "六", "t": "六", "p": "liù", "k": "六"}, {"s": "！", "t": "！"}]}, {"n": 14, "who": "小雨", "h": "哦！对不起，我真忙……星期六见！", "py": "Ò! Duìbuqǐ, wǒ zhēn máng…… Xīngqīliù jiàn!", "fr": "Oh ! Pardon, je suis débordée… À samedi !", "en": "Oh! Sorry, I'm so busy… See you Saturday!", "who_t": "小雨", "toks": [{"s": "哦", "t": "哦", "p": "Ò", "k": "哦"}, {"s": "！", "t": "！"}, {"s": "对不起", "t": "對不起", "p": "Duìbuqǐ", "k": "对不起"}, {"s": "，", "t": "，"}, {"s": "我", "t": "我", "p": "wǒ", "k": "我"}, {"s": "真", "t": "真", "p": "zhēn", "k": "真"}, {"s": "忙", "t": "忙", "p": "máng", "k": "忙"}, {"s": "……", "t": "……"}, {"s": "星期", "t": "星期", "p": "Xīngqī", "k": "星期"}, {"s": "六", "t": "六", "p": "liù", "k": "六"}, {"s": "见", "t": "見", "p": "jiàn", "k": "见"}, {"s": "！", "t": "！"}]}], "notes": [{"n": 1, "line": 1, "topic": "grammar", "fr": "La date : **月** yuè « mois » et **号** hào « numéro (du jour) », en allant du plus grand au plus petit : 十月十五号 « dix-mois quinze » = le 15 octobre. Les mois sont numérotés : 一月 janvier… 十二月 décembre. À l'écrit, on met 日 rì à la place de 号.\n", "en": "Dates: **月** yuè \"month\" and **号** hào \"number (of the day)\", from the largest unit to the smallest: 十月十五号 \"ten-month fifteen\" = 15 October. Months are numbered: 一月 January… 十二月 December. In writing, 日 rì replaces 号.\n", "fr_t": "La date : **月** yuè « mois » et **號** hào « numéro (du jour) », en allant du plus grand au plus petit : 十月十五號 « dix-mois quinze » = le 15 octobre. Les mois sont numérotés : 一月 janvier… 十二月 décembre. À l'écrit, on met 日 rì à la place de 號.\n", "en_t": "Dates: **月** yuè \"month\" and **號** hào \"number (of the day)\", from the largest unit to the smallest: 十月十五號 \"ten-month fifteen\" = 15 October. Months are numbered: 一月 January… 十二月 December. In writing, 日 rì replaces 號.\n"}, {"n": 2, "line": 3, "topic": "grammar", "fr": "Les jours de la semaine aussi sont numérotés : **星期** xīngqī « semaine » + un nombre. 星期一 lundi, 星期二 mardi… 星期六 samedi. Dimanche fait exception : 星期天 (ou 星期日). 星期几 « quel jour ? ».\n", "en": "Weekdays are numbered too: **星期** xīngqī \"week\" + a number. 星期一 Monday, 星期二 Tuesday… 星期六 Saturday. Sunday is the exception: 星期天 (or 星期日). 星期几 \"which day?\".\n", "fr_t": "Les jours de la semaine aussi sont numérotés : **星期** xīngqī « semaine » + un nombre. 星期一 lundi, 星期二 mardi… 星期六 samedi. Dimanche fait exception : 星期天 (ou 星期日). 星期幾 « quel jour ? ».\n", "en_t": "Weekdays are numbered too: **星期** xīngqī \"week\" + a number. 星期一 Monday, 星期二 Tuesday… 星期六 Saturday. Sunday is the exception: 星期天 (or 星期日). 星期幾 \"which day?\".\n"}, {"n": 3, "line": 4, "topic": "grammar", "fr": "Avec une date ou un jour, 是 peut tomber : 今天星期三 « aujourd'hui mercredi ». Mais à la négation il revient : 不是星期六 (ligne 13).\n", "en": "With a date or a day, 是 can drop: 今天星期三 \"today Wednesday\". In the negative it comes back: 不是星期六 (line 13).\n", "fr_t": "Avec une date ou un jour, 是 peut tomber : 今天星期三 « aujourd'hui mercredi ». Mais à la négation il revient : 不是星期六 (ligne 13).\n", "en_t": "With a date or a day, 是 can drop: 今天星期三 \"today Wednesday\". In the negative it comes back: 不是星期六 (line 13).\n"}, {"n": 4, "line": 4, "topic": "vocab", "fr": "昨天 zuótiān « hier », 今天 jīntiān « aujourd'hui », 明天 míngtiān « demain » (L10), 后天 hòutiān « après-demain ». Tous en 天 « jour » (L10 n.5).\n", "en": "昨天 zuótiān \"yesterday\", 今天 jīntiān \"today\", 明天 míngtiān \"tomorrow\" (L10), 后天 hòutiān \"the day after tomorrow\". All built on 天 \"day\" (L10 n.5).\n", "fr_t": "昨天 zuótiān « hier », 今天 jīntiān « aujourd'hui », 明天 míngtiān « demain » (L10), 後天 hòutiān « après-demain ». Tous en 天 « jour » (L10 n.5).\n", "en_t": "昨天 zuótiān \"yesterday\", 今天 jīntiān \"today\", 明天 míngtiān \"tomorrow\" (L10), 後天 hòutiān \"the day after tomorrow\". All built on 天 \"day\" (L10 n.5).\n"}, {"n": 5, "line": 6, "topic": "vocab", "fr": "是吗？« ah bon ? », litt. « c'est ça ? » : on marque la surprise, sans vraiment douter.\n", "en": "是吗？\"really?\", lit. \"is that so?\": it shows surprise, without real doubt.\n", "fr_t": "是嗎？« ah bon ? », litt. « c'est ça ? » : on marque la surprise, sans vraiment douter.\n", "en_t": "是嗎？\"really?\", lit. \"is that so?\": it shows surprise, without real doubt.\n"}, {"n": 6, "line": 7, "topic": "grammar", "fr": "Plusieurs mots de temps se suivent du plus grand au plus petit : 星期六晚上 « samedi soir ». Ils restent devant le verbe (L10 n.3). 有时间 « avoir du temps » = être libre.\n", "en": "Several time words go from largest to smallest: 星期六晚上 \"Saturday evening\". They stay before the verb (L10 n.3). 有时间 \"to have time\" = to be free.\n", "fr_t": "Plusieurs mots de temps se suivent du plus grand au plus petit : 星期六晚上 « samedi soir ». Ils restent devant le verbe (L10 n.3). 有時間 « avoir du temps » = être libre.\n", "en_t": "Several time words go from largest to smallest: 星期六晚上 \"Saturday evening\". They stay before the verb (L10 n.3). 有時間 \"to have time\" = to be free.\n"}, {"n": 7, "line": 8, "topic": "culture", "fr": "**唱歌** chàng gē « chanter (des chansons) » : pour un anniversaire entre jeunes collègues, on va souvent au KTV, des salons de karaoké qu'on loue entre amis.\n", "en": "**唱歌** chàng gē \"to sing (songs)\": for a birthday among young colleagues, people often go to KTV, private karaoke rooms rented with friends.\n", "fr_t": "**唱歌** chàng gē « chanter (des chansons) » : pour un anniversaire entre jeunes collègues, on va souvent au KTV, des salons de karaoké qu'on loue entre amis.\n", "en_t": "**唱歌** chàng gē \"to sing (songs)\": for a birthday among young colleagues, people often go to KTV, private karaoke rooms rented with friends.\n"}, {"n": 8, "line": 10, "topic": "grammar", "fr": "Deux phrases côte à côte peuvent former une condition, sans « si » : 你来，我就很高兴 « (si) tu viens, alors je suis contente ». 就 (L8 n.5) marque ici la conséquence.\n", "en": "Two clauses side by side can make a condition, with no \"if\": 你来，我就很高兴 \"(if) you come, then I'm happy\". 就 (L8 n.5) marks the result here.\n", "fr_t": "Deux phrases côte à côte peuvent former une condition, sans « si » : 你來，我就很高興 « (si) tu viens, alors je suis contente ». 就 (L8 n.5) marque ici la conséquence.\n", "en_t": "Two clauses side by side can make a condition, with no \"if\": 你來，我就很高興 \"(if) you come, then I'm happy\". 就 (L8 n.5) marks the result here.\n"}, {"n": 9, "line": 14, "topic": "vocab", "fr": "**见** jiàn « voir, rencontrer » : 星期六见 « à samedi », litt. « samedi se-voir ». De même 明天见 « à demain ». 再见 zàijiàn « au revoir » = « se revoir ».\n", "en": "**见** jiàn \"to see, meet\": 星期六见 \"see you Saturday\", lit. \"Saturday meet\". Likewise 明天见 \"see you tomorrow\". 再见 zàijiàn \"goodbye\" = \"see again\".\n", "fr_t": "**見** jiàn « voir, rencontrer » : 星期六見 « à samedi », litt. « samedi se-voir ». De même 明天見 « à demain ». 再見 zàijiàn « au revoir » = « se revoir ».\n", "en_t": "**見** jiàn \"to see, meet\": 星期六見 \"see you Saturday\", lit. \"Saturday meet\". Likewise 明天見 \"see you tomorrow\". 再見 zàijiàn \"goodbye\" = \"see again\".\n"}], "words": [{"w": "今天", "py": "jīntiān", "fr": "aujourd'hui", "en": "today", "t": "今天", "lvl": "1"}, {"w": "号", "py": "hào", "fr": "numéro ; (jour du mois)", "en": "number; (day of the month)", "t": "號", "lvl": "1"}, {"w": "月", "py": "yuè", "fr": "mois ; lune", "en": "month; moon", "t": "月", "lvl": "1"}, {"w": "星期", "py": "xīngqī", "fr": "semaine", "en": "week", "t": "星期", "lvl": "1"}, {"w": "昨天", "py": "zuótiān", "fr": "hier", "en": "yesterday", "t": "昨天", "lvl": "1"}, {"w": "生日", "py": "shēngrì", "fr": "anniversaire", "en": "birthday", "t": "生日", "lvl": "2"}, {"w": "晚上", "py": "wǎnshang", "fr": "le soir", "en": "evening", "t": "晚上", "lvl": "1"}, {"w": "时间", "py": "shíjiān", "fr": "temps", "e our « manger, prendre un repas ».\n", "en_t": "**喫** chī \"to eat\" and **喝** hē \"to drink\". Chinese likes to name the object: 喫飯 \"eat rice\" is the usual way to say \"have a meal\".\n"}, {"n": 2, "line": 2, "topic": "grammar", "fr": "**喜欢** xǐhuan « aimer » + verbe : 喜欢吃 « aimer manger ». Avec un nom : 我喜欢中国菜. Pour dire « beaucoup », 很 se place devant : 很喜欢 (ligne 5).\n", "en": "**喜欢** xǐhuan \"to like\" + verb: 喜欢吃 \"like eating\". With a noun: 我喜欢中国菜. For \"a lot\", put 很 in front: 很喜欢 (line 5).\n", "fr_t": "**喜歡** xǐhuan « aimer » + verbe : 喜歡喫 « aimer manger ». Avec un nom : 我喜歡中國菜. Pour dire « beaucoup », 很 se place devant : 很喜歡 (ligne 5).\n", "en_t": "**喜歡** xǐhuan \"to like\" + verb: 喜歡喫 \"like eating\". With a noun: 我喜歡中國菜. For \"a lot\", put 很 in front: 很喜歡 (line 5).\n"}, {"n": 3, "line": 3, "topic": "grammar", "fr": "L'objet peut venir en tête pour être mis en avant, puis 都 le reprend : 饺子、鱼、肉……都喜欢 « raviolis, poisson, viande… (j')aime tout ». 都 regarde toujours vers ce qui précède (L6 n.2). La virgule d'énumération 、 sépare les éléments d'une liste.\n", "en": "The object can come first for emphasis, then 都 picks it up: 饺子、鱼、肉……都喜欢 \"dumplings, fish, meat… (I) like them all\". 都 always looks back (L6 n.2). The enumeration comma 、 separates items in a list.\n", "fr_t": "L'objet peut venir en tête pour être mis en avant, puis 都 le reprend : 餃子、魚、肉……都喜歡 « raviolis, poisson, viande… (j')aime tout ». 都 regarde toujours vers ce qui précède (L6 n.2). La virgule d'énumération 、 sépare les éléments d'une liste.\n", "en_t": "The object can come first for emphasis, then 都 picks it up: 餃子、魚、肉……都喜歡 \"dumplings, fish, meat… (I) like them all\". 都 always looks back (L6 n.2). The enumeration comma 、 separates items in a list.\n"}, {"n": 4, "line": 3, "topic": "vocab", "fr": "**菜** cài « plat ; légume ; cuisine » : 中国菜 « cuisine chinoise ». Au restaurant, on compte les plats avec 个 : 一个鱼 « un (plat de) poisson » (ligne 6).\n", "en": "**菜** cài \"dish; vegetable; cuisine\": 中国菜 \"Chinese food\". In a restaurant, dishes are counted with 个: 一个鱼 \"a fish (dish)\" (line 6).\n", "fr_t": "**菜** cài « plat ; légume ; cuisine » : 中國菜 « cuisine chinoise ». Au restaurant, on compte les plats avec 個 : 一個魚 « un (plat de) poisson » (ligne 6).\n", "en_t": "**菜** cài \"dish; vegetable; cuisine\": 中國菜 \"Chinese food\". In a restaurant, dishes are counted with 個: 一個魚 \"a fish (dish)\" (line 6).\n"}, {"n": 5, "line": 5, "topic": "grammar", "fr": "On répond encore avec le verbe (L1 n.4) : 你吃辣的吗？— 吃。« Tu manges épicé ? — (J'en) mange. »\n", "en": "Again, the answer is the verb (L1 n.4): 你吃辣的吗？— 吃。\"Do you eat spicy? — (I) eat.\"\n", "fr_t": "On répond encore avec le verbe (L1 n.4) : 你喫辣的嗎？— 喫。« Tu manges épicé ? — (J'en) mange. »\n", "en_t": "Again, the answer is the verb (L1 n.4): 你喫辣的嗎？— 喫。\"Do you eat spicy? — (I) eat.\"\n"}, {"n": 6, "line": 8, "topic": "grammar", "fr": "**碗** wǎn « bol » sert lui-même de classificateur : 两碗米饭 « deux bols de riz ». Pas de 个 entre les deux.\n", "en": "**碗** wǎn \"bowl\" is itself a measure word: 两碗米饭 \"two bowls of rice\". No 个 in between.\n", "fr_t": "**碗** wǎn « bol » sert lui-même de classificateur : 兩碗米飯 « deux bols de riz ». Pas de 個 entre les deux.\n", "en_t": "**碗** wǎn \"bowl\" is itself a measure word: 兩碗米飯 \"two bowls of rice\". No 個 in between.\n"}, {"n": 7, "line": 9, "topic": "grammar", "fr": "**还是** háishi « ou bien » dans une question de choix : 茶还是咖啡？ Pas de 吗 : la question est déjà dans le choix. Dans une phrase affirmative, « ou » se dit autrement (on le verra plus tard).\n", "en": "**还是** háishi \"or\" in a choice question: 茶还是咖啡？ No 吗: the choice already makes it a question. In a statement, \"or\" is said differently (later).\n", "fr_t": "**還是** háishi « ou bien » dans une question de choix : 茶還是咖啡？ Pas de 嗎 : la question est déjà dans le choix. Dans une phrase affirmative, « ou » se dit autrement (on le verra plus tard).\n", "en_t": "**還是** háishi \"or\" in a choice question: 茶還是咖啡？ No 嗎: the choice already makes it a question. In a statement, \"or\" is said differently (later).\n"}, {"n": 8, "line": 13, "topic": "grammar", "fr": "**吧** en fin de question demande confirmation : 不错吧？« pas mal, non ? ». C'est le même 吧 que pour proposer (L1 n.10) : il adoucit toujours.\n", "en": "**吧** at the end of a question asks for agreement: 不错吧？\"not bad, right?\". The same 吧 as in suggestions (L1 n.10): it always softens.\n", "fr_t": "**吧** en fin de question demande confirmation : 不錯吧？« pas mal, non ? ». C'est le même 吧 que pour proposer (L1 n.10) : il adoucit toujours.\n", "en_t": "**吧** at the end of a question asks for agreement: 不錯吧？\"not bad, right?\". The same 吧 as in suggestions (L1 n.10): it always softens.\n"}, {"n": 9, "line": 13, "topic": "vocab", "fr": "**不错** búcuò « pas mal », litt. « pas faux » : en chinois, c'est un vrai compliment, un peu plus fort que le français « pas mal ».\n", "en": "**不错** búcuò \"not bad\", lit. \"not wrong\": a real compliment in Chinese, a little warmer than the English.\n", "fr_t": "**不錯** búcuò « pas mal », litt. « pas faux » : en chinois, c'est un vrai compliment, un peu plus fort que le français « pas mal ».\n", "en_t": "**不錯** búcuò \"not bad\", lit. \"not wrong\": a real compliment in Chinese, a little warmer than the English.\n"}, {"n": 10, "line": 14, "topic": "grammar", "fr": "每天都 « tous les jours sans exception » : avec 每, on ajoute presque toujours 都 devant le verbe.\n", "en": "每天都 \"every single day\": with 每, 都 almost always goes before the verb too.\n", "fr_t": "每天都 « tous les jours sans exception » : avec 每, on ajoute presque toujours 都 devant le verbe.\n", "en_t": "每天都 \"every single day\": with 每, 都 almost always goes before the verb too.\n"}], "words": [{"w": "吃", "py": "chī", "fr": "manger", "en": "to eat", "t": "吃", "lvl": "1"}, {"w": "喜欢", "py": "xǐhuan", "fr": "aimer (bien)", "en": "to like", "t": "喜歡", "lvl": "1"}, {"w": "菜", "py": "cài", "fr": "plat ; cuisine ; légume", "en": "dish; food; vegetable", be = « comment (faire) » : 怎么去？« comment y aller ? ». Comme les autres mots interrogatifs, il reste devant le verbe, là où serait la réponse (ligne 2).\n", "en": "**怎么** zěnme + verb = \"how (to do)\": 怎么去？\"how do I get there?\". Like other question words, it stays before the verb, where the answer goes (line 2).\n", "fr_t": "**怎麼** zěnme + verbe = « comment (faire) » : 怎麼去？« comment y aller ? ». Comme les autres mots interrogatifs, il reste devant le verbe, là où serait la réponse (ligne 2).\n", "en_t": "**怎麼** zěnme + verb = \"how (to do)\": 怎麼去？\"how do I get there?\". Like other question words, it stays before the verb, where the answer goes (line 2).\n"}, {"n": 3, "line": 2, "topic": "grammar", "fr": "Le moyen vient **avant** le verbe principal : 坐地铁去 « (en) s'asseyant-dans le métro, aller ». **坐** zuò « s'asseoir » sert pour tous les transports où l'on est passager : 坐地铁, 坐出租车. Pour conduire soi-même : 开车 kāichē (ligne 8).\n", "en": "The means comes **before** the main verb: 坐地铁去 \"sitting-in the metro, go\". **坐** zuò \"to sit\" is used for any transport you ride as a passenger: 坐地铁, 坐出租车. For driving yourself: 开车 kāichē (line 8).\n", "fr_t": "Le moyen vient **avant** le verbe principal : 坐地鐵去 « (en) s'asseyant-dans le métro, aller ». **坐** zuò « s'asseoir » sert pour tous les transports où l'on est passager : 坐地鐵, 坐出租車. Pour conduire soi-même : 開車 kāichē (ligne 8).\n", "en_t": "The means comes **before** the main verb: 坐地鐵去 \"sitting-in the metro, go\". **坐** zuò \"to sit\" is used for any transport you ride as a passenger: 坐地鐵, 坐出租車. For driving yourself: 開車 kāichē (line 8).\n"}, {"n": 4, "line": 4, "topic": "vocab", "fr": "**分钟** fēnzhōng « minute » pour une durée, à distinguer de 分 (L10 n.1) pour l'heure : 十分钟 « dix minutes », mais 九点十分 « neuf heures dix ». 走路 zǒulù « marcher, à pied », litt. « marcher la route ».\n", "en": "**分钟** fēnzhōng \"minute\" for a length of time, unlike 分 (L10 n.1) for clock time: 十分钟 \"ten minutes\", but 九点十分 \"ten past nine\". 走路 zǒulù \"walk, on foot\", lit. \"walk the road\".\n", "fr_t": "**分鐘** fēnzhōng « minute » pour une durée, à distinguer de 分 (L10 n.1) pour l'heure : 十分鐘 « dix minutes », mais 九點十分 « neuf heures dix ». 走路 zǒulù « marcher, à pied », litt. « marcher la route ».\n", "en_t": "**分鐘** fēnzhōng \"minute\" for a length of time, unlike 分 (L10 n.1) for clock time: 十分鐘 \"ten minutes\", but 九點十分 \"ten past nine\". 走路 zǒulù \"walk, on foot\", lit. \"walk the road\".\n"}, {"n": 5, "line": 5, "topic": "grammar", "fr": "**到** dào « arriver à, jusqu'à » + lieu. 要 (L9 n.1) devant une durée = « il faut, ça prend » : 要多少分钟 « ça prend combien de minutes ».\n", "en": "**到** dào \"to arrive at, to\" + place. 要 (L9 n.1) before an amount of time = \"it takes\": 要多少分钟 \"how many minutes does it take\".\n", "fr_t": "**到** dào « arriver à, jusqu'à » + lieu. 要 (L9 n.1) devant une durée = « il faut, ça prend » : 要多少分鐘 « ça prend combien de minutes ».\n", "en_t": "**到** dào \"to arrive at, to\" + place. 要 (L9 n.1) before an amount of time = \"it takes\": 要多少分鐘 \"how many minutes does it take\".\n"}, {"n": 6, "line": 10, "topic": "grammar", "fr": "**可是** kěshì « mais » ouvre la deuxième phrase. 车很多 « les voitures (sont) nombreuses » : 多 duō « nombreux » est un adjectif comme un autre, avec 很.\n", "en": "**可是** kěshì \"but\" starts the second clause. 车很多 \"cars (are) many\": 多 duō \"many\" is an adjective like any other, with 很.\n", "fr_t": "**可是** kěshì « mais » ouvre la deuxième phrase. 車很多 « les voitures (sont) nombreuses » : 多 duō « nombreux » est un adjectif comme un autre, avec 很.\n", "en_t": "**可是** kěshì \"but\" starts the second clause. 車很多 \"cars (are) many\": 多 duō \"many\" is an adjective like any other, with 很.\n"}, {"n": 7, "line": 11, "topic": "grammar", "fr": "**那** nà en tête de phrase = « alors, dans ce cas » : 那我坐地铁 « alors je prends le métro ». C'est le même caractère que 那 « cela » (L6 n.1).\n", "en": "**那** nà at the start of a sentence = \"then, in that case\": 那我坐地铁 \"then I'll take the metro\". The same character as 那 \"that\" (L6 n.1).\n", "fr_t": "**那** nà en tête de phrase = « alors, dans ce cas » : 那我坐地鐵 « alors je prends le métro ». C'est le même caractère que 那 « cela » (L6 n.1).\n", "en_t": "**那** nà at the start of a sentence = \"then, in that case\": 那我坐地鐵 \"then I'll take the metro\". The same character as 那 \"that\" (L6 n.1).\n"}, {"n": 8, "line": 12, "topic": "grammar", "fr": "**在** devant un verbe marque l'action en cours : 小雨在等你 « Xiaoyu est en train de t'attendre ». On le reverra en leçon 17 ; c'est le même 在 que « se trouver » (L8 n.3).\n", "en": "**在** before a verb marks an action in progress: 小雨在等你 \"Xiaoyu is waiting for you\". It comes back in lesson 17; it's the same 在 as \"to be at\" (L8 n.3).\n", "fr_t": "**在** devant un verbe marque l'action en cours : 小雨在等你 « Xiaoyu est en train de t'attendre ». On le reverra en leçon 17 ; c'est le même 在 que « se trouver » (L8 n.3).\n", "en_t": "**在** before a verb marks an action in progress: 小雨在等你 \"Xiaoyu is waiting for you\". It comes back in lesson 17; it's the same 在 as \"to be at\" (L8 n.3).\n"}], "words": [{"w": "去", "py": "qù", "fr": "aller", "en": "to go", "t": "去", "lvl": "1"}, {"w": "怎么", "py": "zěnme", "fr": "comment", "en": "how", "t": "怎麼", "lvl": "1"}, {"w": "坐", "py": "zuò", "fr": "s'asseoir ; prendre (un transport)", "en": "to sit; to take (transport)", "t": "坐", "lvl": "1"}, {"w": "地铁", "py": "dìtiě", "fr": "métro", "en": "metro, subway", "t": "地鐵", "lvl": "2"}, {"w": "站", "py": "zhàn", "fr": "station, arrêt", "en": "station, stop", "t": "站", "lvl": "2"}, {"w": "走路", "py": "zǒulù", "fr": "marcher, à pied", "en": "to walk, on foot", "t": "走路", "lvl": "2"}, {"w": "分钟", "py": "fēnzhōng", "fr": "minute (durée)", "en": "minute (duration)", "t": "分鐘", "lvl": "1"}, {"w": "到", "py": "dào", "fr": "arriver à, jusqu'à", "en": "to arrive, to (a place)", "t": "到", "lvl": "1"}, {"w": "出租车", "py": "chūzūchē", "fr": "taxi", "en": "taxi", "t": "出租車", "lvl": "1"}, {"w": ", "setting": {"fr": "Pas de mot nouveau. Relisez ces points et leurs notes, puis le dialogue du dimanche matin, au lendemain de l'anniversaire de Xiaoyu.", "en": "No new words. Go over these points and their notes, then the Sunday-morning dialogue, the day after Xiaoyu's birthday."}, "recap": [{"fr": "**Où ?** Lieu + 有 + chose présente quelque chose de nouveau ; chose + 在 + lieu situe ce qu'on connaît (L8 n.2, L8 n.3, L8 n.9). Les mots de position suivent le nom : 银行旁边, 这儿附近 (L8 n.4). 哪儿, 这儿, 那儿 et leur « r » pékinois (L8 n.6).\n", "en": "**Where?** Place + 有 + thing brings in something new; thing + 在 + place locates something known (L8 n.2, L8 n.3, L8 n.9). Position words follow the noun: 银行旁边, 这儿附近 (L8 n.4). 哪儿, 这儿, 那儿 and their Beijing \"r\" (L8 n.6).\n", "fr_t": "**Où ?** Lieu + 有 + chose présente quelque chose de nouveau ; chose + 在 + lieu situe ce qu'on connaît (L8 n.2, L8 n.3, L8 n.9). Les mots de position suivent le nom : 銀行旁邊, 這兒附近 (L8 n.4). 哪兒, 這兒, 那兒 et leur « r » pékinois (L8 n.6).\n", "en_t": "**Where?** Place + 有 + thing brings in something new; thing + 在 + place locates something known (L8 n.2, L8 n.3, L8 n.9). Position words follow the noun: 銀行旁邊, 這兒附近 (L8 n.4). 哪兒, 這兒, 那兒 and their Beijing \"r\" (L8 n.6).\n"}, {"fr": "**Quand ?** L'heure : 点, 分, 半 (L10 n.1). La date du plus grand au plus petit : 十月十五号, 星期六晚上 (L11 n.1, L11 n.6) ; les jours numérotés (L11 n.2). Le temps se met devant le verbe (L10 n.3), et le verbe ne change pas (L10 n.5).\n", "en": "**When?** Clock time: 点, 分, 半 (L10 n.1). Dates from largest to smallest: 十月十五号, 星期六晚上 (L11 n.1, L11 n.6); numbered weekdays (L11 n.2). Time goes before the verb (L10 n.3), and the verb never changes (L10 n.5).\n", "fr_t": "**Quand ?** L'heure : 點, 分, 半 (L10 n.1). La date du plus grand au plus petit : 十月十五號, 星期六晚上 (L11 n.1, L11 n.6) ; les jours numérotés (L11 n.2). Le temps se met devant le verbe (L10 n.3), et le verbe ne change pas (L10 n.5).\n", "en_t": "**When?** Clock time: 點, 分, 半 (L10 n.1). Dates from largest to smallest: 十月十五號, 星期六晚上 (L11 n.1, L11 n.6); numbered weekdays (L11 n.2). Time goes before the verb (L10 n.3), and the verb never changes (L10 n.5).\n"}, {"fr": "**Combien ?** 几 pour un petit nombre avec un classificateur, 多少 pour tout le reste (L9 n.3). L'argent : 块, 毛 (L9 n.4). Certains noms servent de classificateur : 两碗米饭 (L12 n.6). Durée : 分钟, pas 分 (L13 n.4).\n", "en": "**How many?** 几 for a small number with a measure word, 多少 for the rest (L9 n.3). Money: 块, 毛 (L9 n.4). Some nouns are measure words: 两碗米饭 (L12 n.6). Duration: 分钟, not 分 (L13 n.4).\n", "fr_t": "**Combien ?** 幾 pour un petit nombre avec un classificateur, 多少 pour tout le reste (L9 n.3). L'argent : 塊, 毛 (L9 n.4). Certains noms servent de classificateur : 兩碗米飯 (L12 n.6). Durée : 分鐘, pas 分 (L13 n.4).\n", "en_t": "**How many?** 幾 for a small number with a measure word, 多少 for the rest (L9 n.3). Money: 塊, 毛 (L9 n.4). Some nouns are measure words: 兩碗米飯 (L12 n.6). Duration: 分鐘, not 分 (L13 n.4).\n"}, {"fr": "**Vouloir, aimer.** 要 pour commander ou décider (L9 n.1), 想 + verbe pour un souhait (L9 n.2), 喜欢 + nom ou verbe (L12 n.2).\n", "en": "**Wanting and liking.** 要 to order or decide (L9 n.1), 想 + verb for a wish (L9 n.2), 喜欢 + noun or verb (L12 n.2).\n", "fr_t": "**Vouloir, aimer.** 要 pour commander ou décider (L9 n.1), 想 + verbe pour un souhait (L9 n.2), 喜歡 + nom ou verbe (L12 n.2).\n", "en_t": "**Wanting and liking.** 要 to order or decide (L9 n.1), 想 + verb for a wish (L9 n.2), 喜歡 + noun or verb (L12 n.2).\n"}, {"fr": "**D'autres questions.** 还是 pour un choix, sans 吗 (L12 n.7) ; 怎么 + verbe, « comment » (L13 n.2) ; 吧 pour demander confirmation (L12 n.8) ; 是吗 « ah bon ? » (L11 n.5).\n", "en": "**More questions.** 还是 for a choice, with no 吗 (L12 n.7); 怎么 + verb, \"how\" (L13 n.2); 吧 to ask for agreement (L12 n.8); 是吗 \"really?\" (L11 n.5).\n", "fr_t": "**D'autres questions.** 還是 pour un choix, sans 嗎 (L12 n.7) ; 怎麼 + verbe, « comment » (L13 n.2) ; 吧 pour demander confirmation (L12 n.8) ; 是嗎 ": "好吃", "t": "好吃", "lvl": "1", "py": "hǎochī", "seen": [12], "fr": "bon (à manger)", "en": "tasty", "first": 12}, "饭馆": {"s": "饭馆", "t": "飯館", "lvl": "2", "py": "fànguǎn", "seen": [12, 14], "fr": "restaurant", "en": "restaurant", "first": 12}, "不错": {"s": "不错", "t": "不錯", "lvl": "2", "py": "búcuò", "seen": [12, 14], "fr": "pas mal, bien", "en": "not bad, good", "first": 12}, "饭": {"s": "饭", "t": "飯", "lvl": "1", "py": "fàn", "auto": "meal; cooked rice; (loanword) fan", "seen": [12]}, "去": {"s": "去", "t": "去", "lvl": "1", "py": "qù", "seen": [13, 14], "fr": "aller", "en": "to go", "first": 13}, "五道口": {"s": "五道口", "t": "五道口", "lvl": null, "py": "Wǔdàokǒu", "seen": [13], "name": true, "fr": "Wudaokou", "en": "Wudaokou"}, "怎么": {"s": "怎么", "t": "怎麼", "lvl": "1", "py": "zěnme", "seen": [13, 14], "fr": "comment", "en": "how", "first": 13}, "坐": {"s": "坐", "t": "坐", "lvl": "1", "py": "zuò", "seen": [13, 14], "fr": "s'asseoir ; prendre (un transport)", "en": "to sit; to take (transport)", "first": 13}, "地铁": {"s": "地铁", "t": "地鐵", "lvl": "2", "py": "dìtiě", "seen": [13, 14], "fr": "métro", "en": "metro, subway", "first": 13}, "站": {"s": "站", "t": "站", "lvl": "2", "py": "zhàn", "seen": [13, 14], "fr": "station, arrêt", "en": "station, stop", "first": 13}, "走路": {"s": "走路", "t": "走路", "lvl": "2", "py": "zǒulù", "seen": [13, 14], "fr": "marcher, à pied", "en": "to walk, on foot", "first": 13}, "分钟": {"s": "分钟", "t": "分鐘", "lvl": "1", "py": "fēnzhōng", "seen": [13, 14], "fr": "minute (durée)", "en": "minute (duration)", "first": 13}, "到": {"s": "到", "t": "到", "lvl": "1", "py": "dào", "seen": [13, 14], "fr": "arriver à, jusqu'à", "en": "to arrive, to (a place)", "first": 13}, "出租车": {"s": "出租车", "t": "出租車", "lvl": "1", "py": "chūzūchē", "seen": [13, 14], "fr": "taxi", "en": "taxi", "first": 13}, "开车": {"s": "开车", "t": "開車", "lvl": "1", "py": "kāichē", "seen": [13], "fr": "conduire", "en": "to drive", "first": 13}, "车": {"s": "车", "t": "車", "lvl": "1", "py": "chē", "seen": [13], "fr": "voiture, véhicule", "en": "car, vehicle", "first": 13}, "可是": {"s": "可是", "t": "可是", "lvl": "3", "py": "kěshì", "seen": [13], "fr": "mais", "en": "but", "first": 13}, "慢": {"s": "慢", "t": "慢", "lvl": "2", "py": "màn", "seen": [13], "fr": "lent", "en": "slow", "first": 13}, "等": {"s": "等", "t": "等", "lvl": "2", "py": "děng", "seen": [13], "fr": "attendre", "en": "to wait", "first": 13}, "十分": {"s": "十分", "t": "十分", "lvl": "4", "py": "shí fēn", "auto": "very; completely; utterly", "seen": [13]}, "钟": {"s": "钟", "t": "鍾", "lvl": "7-9", "py": "zhōng", "auto": "a (large) bell; clock; amount of time", "seen": [13]}}, "nhsk_total": {"1": 300, "2": 197, "3": 493, "4": 990}}, {"key": "wenyan", "zh": "文言", "en": "Classical", "about": "Classical Chinese through real texts: fables first, then the 論語, argument, narrative and verse.", "lessons": [{"id": 1, "slug": "shou-zhu", "title": "守株待兔", "title_py": "Shǒu zhū dài tù", "title_en": "Waiting by the Stump for a Hare", "source": {"work": "韓非子·五蠹", "author": "韓非 (c. 280–233 BC)", "period": "Warring States", "text_from": "《韓非子·五蠹》, as printed in the Hong Kong EDB recommended classical passages (KS1-01); checked against the 古汉语常用字字典 citations", "work_s": "韩非子·五蠹"}, "status": "draft", "intro": "Han Fei was the great theorist of Legalism, the school that held a state should be run by clear laws and not by appeals to the ancient sage-kings. In the essay \"The Five Vermin\" (五蠹) he tells this little story to mock rulers who cling to the old ways. It is the most famous fable in Chinese: almost every Chinese schoolchild learns it, and its title became an idiom. Six of the most important words in Classical Chinese appear in its 57 characters: 者, 而, 其, 為, 之, 也.\n", "lines": [{"h": "宋人有耕者，", "py": "Sòng rén yǒu gēng zhě,", "en": "Among the people of Song there was a man who ploughed his fields.", "lit": "Song people there-was plough-one", "h_s": "宋人有耕者，"}, {"h": "田中有株，", "py": "tián zhōng yǒu zhū,", "en": "In his field there was a tree stump.", "h_s": "田中有株，"}, {"h": "兔走觸株，", "py": "tù zǒu chù zhū,", "en": "A hare, running, struck the stump,", "h_s": "兔走触株，"}, {"h": "折頸而死。", "py": "zhé jǐng ér sǐ.", "en": "broke its neck and died.", "h_s": "折颈而死。"}, {"h": "因釋其耒而守株，", "py": "Yīn shì qí lěi ér shǒu zhū,", "en": "So he put down his plough and kept watch by the stump,", "h_s": "因释其耒而守株，"}, {"h": "冀復得兔。", "py": "jì fù dé tù.", "en": "hoping to get another hare.", "lit": "hoping again to-get hare", "h_s": "冀复得兔。"}, {"h": "兔不可復得，", "py": "Tù bù kě fù dé,", "en": "Hares could not be got again,", "h_s": "兔不可复得，"}, {"h": "而身為宋國笑。", "py": "ér shēn wéi Sòng guó xiào.", "en": "and he himself became the laughing-stock of Song.", "lit": "and himself was-by Song state laughed-at", "h_s": "而身为宋国笑。"}, {"h": "今欲以先王之政，", "py": "Jīn yù yǐ xiān wáng zhī zhèng,", "en": "Now, to want to use the government of the former kings", "h_s": "今欲以先王之政，"}, {"h": "治當世之民，", "py": "zhì dāng shì zhī mín,", "en": "to rule the people of the present age —", "h_s": "治当世之民，"}, {"h": "皆守株之類也。", "py": "jiē shǒu zhū zhī lèi yě.", "en": "that is all of the stump-watching kind.", "h_s": "皆守株之类也。"}], "notes": [{"n": 1, "line": 0, "at": "宋", "text": "**宋** Sòng, a small state in present-day Henan, ruled by descendants of the fallen Shang dynasty. In Warring States anecdotes \"a man of Song\" is the stock fool: the farmer who pulls up his sprouts to help them grow (揠苗助長, in 孟子) is also from Song.\n", "at_s": "宋"}, {"n": 2, "line": 0, "at": "有耕者", "text": "**有 … 者**, \"there was one who …\". 者 turns the verb 耕 *to plough* into a noun, \"one who ploughs\" (compare English *-er*: plough → plough**er**). 有 + V + 者 is the standard way to bring a character on stage: 宋人有耕者 = \"among the people of Song, there was a plougher\". The place or group (宋人) comes first, as the topic.\n", "at_s": "有耕者"}, {"n": 3, "line": 2, "at": "走", "text": "**走 = to run**, not \"to walk\". This is the classic trap of 古今詞義 (old vs. modern meaning): Classical Chinese *walks* with 行 and 步, *runs* with 走, and *hurries* with 趨. Modern 走 has slowed down by one gear. The 說文 already defines 走 as 趨也 \"to hurry\".\n", "at_s": "走"}, {"n": 4, "line": 3, "at": "而", "text": "**而** links two verbs or verb phrases: 折頸**而**死 \"broke its neck *and (so)* died\". It never links two nouns (that's 與). The second 而 in line 5 works the same way: 釋其耒 **而**守株 \"put down his plough *and* watched the stump\". In line 8, 而 marks a contrast: see n. 9.\n", "at_s": "而"}, {"n": 5, "line": 4, "at": "因", "text": "**因** here is an adverb, \"thereupon, and so\", linking the event to what came before. Its core meaning is \"to rely on, to follow from\", which you will meet as a verb and preposition.\n", "at_s": "因"}, {"n": 6, "line": 4, "at": "其", "text": "**其** = *his / her / its / their*. In Classical Chinese 其 is mainly a third-person possessive (其耒 \"his plough\"), not the modern \"that, other\" of 其他. 耒 lěi is a wooden digging fork, the ancestor of the plough (說文: 手耕曲木也 \"a curved wood for tilling by hand\").\n", "at_s": "其"}, {"n": 7, "line": 5, "at": "冀復", "text": "**冀** jì = \"to hope\" (modern 希望). **復** fù = \"again\" (adverb before a verb). *Simplified-character warning:* 复 stands for three different classical words: 復 \"return, again\", 複 \"double, lined (garment)\" and 覆 \"overturn\". Classical texts keep them apart, so the traditional form tells you which word you're reading.\n", "at_s": "冀复"}, {"n": 8, "line": 6, "at": "不可復得", "text": "**可 + verb** has a passive sense: 不可復得 \"could not be got again\". When 可 stands before a transitive verb, the subject is what *receives* the action (兔 the hare is what is \"got\"). Compare 朽木不可雕也 \"rotten wood cannot be carved\" (exercise 3).\n", "at_s": "不可复得"}, {"n": 9, "line": 7, "at": "而身為宋國笑", "text": "Three things in one line: **而** here means \"and yet / and as a result\", with a turn in the story. **身** = \"himself, his own person\" (not \"body\"): the hares didn't come back, but *he* became the joke. **為 A V** is a passive: 為宋國笑 \"was laughed at by the state of Song\" (為 wéi + agent + verb). Later prose often adds 所: 為天下所笑. The 所-less form here is the older one.\n", "at_s": "而身为宋国笑"}, {"n": 10, "line": 8, "at": "以先王之政", "text": "**以 X V Y** = \"to use X to V Y\": 以先王之政，治當世之民 \"to use the government of the former kings to rule the people of today\". **之** between two nouns marks the first as modifying the second, like modern 的: 先王**之**政 \"the former kings' government\", 當世**之**民 \"the present age's people\".\n", "at_s": "以先王之政"}, {"n": 11, "line": 10, "at": "也", "text": "**A，B 也** is the basic Classical judgment sentence, \"A is B\", with no verb \"to be\". The whole of lines 9–10 is A; 皆守株之類 \"all of the stump-watching kind\" is B; 也 closes the judgment. 是 as a copula (\"is\") is a later development; in Han Fei's time 是 means \"this\".\n", "at_s": "也"}, {"n": 12, "line": 10, "at": "守株", "text": "The idiom is 守株待兔 \"watch the stump, wait for the hare\", but 待 *to wait* is not in the original: the four-character form was shaped later. Today it describes anyone who waits for luck instead of working, which is not quite Han Fei's point: he was attacking rulers who apply old policies to a changed world.\n", "at_s": "守株"}], "glossary": [{"w": "宋", "py": "Sòng", "en": "Song, a Warring States state (in present-day Henan)", "checked": [], "w_s": "宋"}, {"w": "耕", "py": "gēng", "en": "to plough", "till": null, "checked": [], "w_s": "耕"}, {"w": "者", "py": "zhě", "en": "nominaliser: 'one who …'", "checked": ["cyz"], "w_s": "者"}, {"w": "田", "py": "tián", "en": "field (under cultivation)", "checked": ["cyz"], "w_s": "田"}, {"w": "株", "py": "zhū", "en": "tree stump; root showing above the ground", "sw": "株，木根也。", "checked": ["cyz", "sw"], "w_s": "株"}, {"w": "兔", "py": "tù", "en": "hare", "rabbit": null, "checked": [], "w_s": "兔"}, {"w": "走", "py": "zǒu", "en": "to run", "sw": "走，趨也。", "checked": ["cyz", "sw"], "w_s": "走"}, {"w": "觸", "py": "chù", "en": "to bump into", "strike": null, "checked": ["cyz"], "w_s": "触"}, {"w": "折", "py": "zhé", "en": "to break", "snap": null, "checked": ["cyz"], "w_s": "折"}, {"w": "頸", "py": "jǐng", "en": "neck", "checked": [], "w_s": "颈"}, {"w": "而", "py": "ér", "en": "and (then); and yet — links verb phrases", "checked": ["cyz"], "w_s": "而"}, {"w": "因", "py": "yīn", "en": "thereupon, and so", "checked": ["cyz"], "w_s": "因"}, {"w": "釋", "py": "shì", "en": "to put down", "let go of": null, "checked": ["cyz"], "w_s": "释"}, {"w": "其", "py": "qí", "en": "his, her, its, their", "checked": ["cyz"], "w_s": "其"}, {"w": "耒", "py": "lěi", "en": "wooden digging fork", "early plough": null, "sw": "耒，手耕曲木也。", "checked": ["cyz", "sw"], "w_s": "耒"}, {"w": "守", "py": "shǒu", "en": "to guard", "keep watch over": null, "checked": ["cyz"], "w_s": "守"}, {"w": "冀", "py": "jì", "en": "to hope", "checked": ["cyz"], "w_s": "冀"}, {"w": "復", "py": "fù", "en": "again", "checked": ["cyz"], "w_s": "复"}, {"w": "得", "py": "dé", "en": "to get", "obtain": null, "checked": ["cyz"], "w_s": "得"}, {"w": "可", "py": "kě", "en": "can (be V-ed)", "checked": ["cyz"], "w_s": "可"}, {"w": "身", "py": "shēn", "en": "oneself, one's own person", "checked": ["cyz"], "w_s": "身"}, {"w": "為", "py": "wéi", "en": "passive marker: 為 A V 'be V-ed by A'", "checked": ["cyz"], "w_s": "为"}, {"w": "國", "py": "guó", "en": "state", "country": null, "checked": ["cyz"], "w_s": "国"}, {"w": "笑", "py": "xiào", "en": "to laugh at", "checked": [], "w_s": "笑"}, {"w": "欲", "py": "yù", "en": "to want to", "checked": ["cyz"], "w_s": "欲"}, {"w": "以", "py": "yǐ", "en": "to use, with (以 X V: use X to V)", "checked": ["cyz"], "w_s": "以"}, {"w": "先王", "py": "xiān wáng", "en": "the former kings (the sage-rulers of antiquity)", "checked": ["cyz"], "w_s": "先王"}, {"w": "之", "py": "zhī", "en": "attributive particle, like modern 的", "checked": ["cyz"], "w_s": "之"}, {"w": "政", "py": "zhèng", "en": "government", "policies": null, "checked": ["cyz"], "w_s": "政"}, {"w": "治", "py": "zhì", "en": "to govern", "rule": null, "checked": ["cyz"], "w_s": "治"}, {"w": "當世", "py": "dāng shì", "en": "the present age", "checked": ["cyz"], "w_s": "当世"}, {"w": "民", "py": "mín", "en": "the people", "commoners": null, "checked": ["cyz"], "w_s": "民"}, {"w": "皆", "py": "jiē", "en": "all, in every case", "checked": ["cyz"], "w_s": "皆"}, {"w": "類", "py": "lèi", "en": "kind", "category": null, "checked": ["cyz"], "w_s": "类"}, {"w": "也", "py": "yě", "en": "final particle closing a judgment ('A is B')", "checked": ["cyz"], "w_s": "也"}], "exercise": [{"h": "兵刃既接，棄甲曳兵而走。", "py": "Bīng rèn jì jiē, qì jiǎ yè bīng ér zǒu.", "src": "孟子·梁惠王上", "en": "When the blades had crossed, they threw off their armour, dragged their weapons and ran.", "tests": "走 = run, 而", "h_s": "兵刃既接，弃甲曳兵而走。"}, {"h": "學而時習之，不亦說乎？", "py": "Xué ér shí xí zhī, bú yì yuè hū?", "src": "論語·學而", "en": "To learn and practise it at the right times — is that not a pleasure?", "tests": "而 linking two verbs (說 = 悅 yuè, \"to be pleased\")", "h_s": "学而时习之，不亦说乎？"}, {"h": "朽木不可雕也，糞土之牆不可杇也。", "py": "Xiǔ mù bù kě diāo yě, fèn tǔ zhī qiáng bù kě wū yě.", "src": "論語·公冶長", "en": "Rotten wood cannot be carved; a wall of dung and earth cannot be plastered.", "tests": "可 + verb (passive sense), 之, 也", "h_s": "朽木不可雕也，粪土之墙不可杇也。"}, {"h": "久矣吾不復夢見周公。", "py": "Jiǔ yǐ wú bú fù mèng jiàn Zhōugōng.", "src": "論語·述而", "en": "For a long time now I have not dreamed again of the Duke of Zhou.", "tests": "復 = again", "h_s": "久矣吾不复梦见周公。"}, {"h": "身死人手，為天下笑者，何也？", "py": "Shēn sǐ rén shǒu, wéi tiānxià xiào zhě, hé yě?", "src": "賈誼·過秦論", "en": "That he died by other men's hands and became the laughing-stock of the world — why?", "tests": "身, 為 A 笑 passive, 者", "h_s": "身死人手，为天下笑者，何也？"}], "culture": "Han Fei (韓非) was a prince of the state of Han and a student of the Confucian Xunzi, yet he became the sharpest critic of Confucian nostalgia. The First Emperor of Qin admired his writings; Han Fei died in a Qin prison in 233 BC, but Qin built its empire on Legalist ideas. \"The Five Vermin\" names the five kinds of people Han Fei thought were eating the state away: scholars, wandering orators, private swordsmen, courtiers who sell influence, and merchants and artisans.\n", "title_s": "守株待兔"}, {"id": 2, "slug": "mao-dun", "title": "自相矛盾", "title_py": "Zì xiāng máo dùn", "title_en": "The Spear and the Shield", "source": {"work": "韓非子·難一", "author": "韓非 (c. 280–233 BC)", "period": "Warring States", "text_from": "《韓非子·難一》, as in Japanese Wikibooks 中学校国語 漢文/矛盾 (CC BY-SA), punctuation modernised; closing sentence matched verbatim against several editions. Many Chinese school editions write 盾 for 楯 and read 物莫能陷也 in line 3 (see n. 1, n. 4).\n", "work_s": "韩非子·难一"}, "status": "draft", "intro": "Han Fei again. In the chapter \"Objections I\" (難一) he argues that the Confucians can't praise the sage-king Yao as a perfect ruler *and* praise Shun for fixing the problems of Yao's reign: one of the two claims must be false. To make the point he tells this story, which gave Chinese its word for \"contradiction\", 矛盾 \"spear-shield\". This lesson's big new idea is the little word 之 placed between a subject and its predicate.\n", "lines": [{"h": "楚人有鬻楯與矛者，", "py": "Chǔ rén yǒu yù dùn yǔ máo zhě,", "en": "There was a man of Chu who sold shields and spears.", "h_s": "楚人有鬻楯与矛者，"}, {"h": "譽之曰：", "py": "yù zhī yuē:", "en": "He praised them, saying:", "h_s": "誉之曰："}, {"h": "「吾楯之堅，莫能陷也。」", "py": "Wú dùn zhī jiān, mò néng xiàn yě.", "en": "\"My shields are so hard that nothing can pierce them.\"", "lit": "my shield 's hardness, nothing can pierce", "h_s": "「吾楯之坚，莫能陷也。」"}, {"h": "又譽其矛曰：", "py": "Yòu yù qí máo yuē:", "en": "Then he praised his spears, saying:", "h_s": "又誉其矛曰："}, {"h": "「吾矛之利，於物無不陷也。」", "py": "Wú máo zhī lì, yú wù wú bù xiàn yě.", "en": "\"My spears are so sharp that there is nothing they can't pierce.\"", "lit": "my spear 's sharpness, among things there-is-none not pierced", "h_s": "「吾矛之利，于物无不陷也。」"}, {"h": "或曰：", "py": "Huò yuē:", "en": "Someone said:", "h_s": "或曰："}, {"h": "「以子之矛，陷子之楯，何如？」", "py": "Yǐ zǐ zhī máo, xiàn zǐ zhī dùn, hé rú?", "en": "\"What if you used your spear to pierce your shield?\"", "h_s": "「以子之矛，陷子之楯，何如？」"}, {"h": "其人弗能應也。", "py": "Qí rén fú néng yìng yě.", "en": "The man could not answer.", "h_s": "其人弗能应也。"}, {"h": "夫不可陷之楯與無不陷之矛，", "py": "Fú bù kě xiàn zhī dùn yǔ wú bù xiàn zhī máo,", "en": "Now, a shield that cannot be pierced and a spear that pierces everything", "h_s": "夫不可陷之楯与无不陷之矛，"}, {"h": "不可同世而立。", "py": "bù kě tóng shì ér lì.", "en": "cannot stand together in the same world.", "h_s": "不可同世而立。"}], "notes": [{"n": 1, "line": 0, "at": "鬻楯", "text": "**鬻** yù = \"to sell\" (the everyday word is 賣). **楯** dùn = \"shield\", written with the wood radical because shields were wooden; later editions and the idiom write **盾**. Both are the same word. 與 joins two nouns: 楯**與**矛 \"shields *and* spears\" (compare 而, which joins verbs: → L1 n.4).\n", "at_s": "鬻楯"}, {"n": 2, "line": 1, "at": "譽之", "text": "**之 as an object pronoun**: 譽**之** \"praised *them*\". After a verb, 之 means him / her / it / them; it can never be a subject. Expect it constantly: 揠之 \"pull at them\", 求之 \"look for it\", 飲之 \"drink it\" in the next lessons. **曰** yuē \"to say\" introduces direct speech.\n", "at_s": "誉之"}, {"n": 3, "line": 2, "at": "吾楯之堅", "text": "**Subject + 之 + predicate.** 吾楯堅 would be a sentence: \"my shield is hard\". Put 之 between subject and predicate — 吾楯**之**堅 — and the sentence becomes a noun phrase, \"the hardness of my shield\", which can then be commented on: \"(as for) the hardness of my shield — nothing can pierce it\". This is one of the most frequent patterns in Classical Chinese; you'll meet it in almost every lesson from now on (吾矛之利 in line 5).\n", "at_s": "吾楯之坚"}, {"n": 4, "line": 2, "at": "莫能陷", "text": "**莫** mò = \"nothing / no one\": 莫能陷 \"nothing can pierce (it)\". 莫 is a pronoun that contains its own negation, so there is no 不. 陷 xiàn = \"to pierce, break into\" (its core meaning is \"to fall into a pit\"). Many editions read 物莫能陷也, \"of things, none can pierce it\", with no change in meaning.\n", "at_s": "莫能陷"}, {"n": 5, "line": 4, "at": "於物無不陷", "text": "**無不 = \"there is none that does not\" = everything.** 無 \"there is no …\", 不 \"not\": two negatives make a strong positive. **於** yú \"among, with regard to\": 於物 \"among things\". Compare 莫 in n. 4: the merchant's two boasts are built as mirror images.\n", "at_s": "于物无不陷"}, {"n": 6, "line": 5, "at": "或", "text": "**或** huò as a subject = \"someone\". (In modern Chinese 或 means \"or\"; that sense exists too, but at the head of a clause 或曰 is \"someone said\".)\n", "at_s": "或"}, {"n": 7, "line": 6, "at": "子之矛", "text": "**子** zǐ = \"you\", a polite address between equals (\"sir\"). 子之矛 \"your spear\": here 之 is the ordinary attributive 之 (→ L1 n.10). 以 X V Y \"use X to V Y\" (→ L1 n.10). **何如** hé rú \"how would it be?\": the question word 何 comes *before* the verb 如.\n", "at_s": "子之矛"}, {"n": 8, "line": 7, "at": "弗能應", "text": "**弗** fú is a negative like 不, but typically used before a transitive verb whose object is left out (\"could not answer *it*\"). 其人 \"that man\" — 其 as a demonstrative here, not \"his\" (→ L1 n.6). 應 yìng \"to respond\".\n", "at_s": "弗能应"}, {"n": 9, "line": 8, "at": "夫", "text": "**夫** fú at the start of a sentence announces a general statement or comment: \"Now, …\". Read fú, not fū (\"man, husband\"). Then 不可陷之楯 \"a shield that cannot be pierced\": a whole verb phrase + 之 + noun = a relative clause (→ L1 n.8 for 不可 + verb).\n", "at_s": "夫"}, {"n": 10, "line": 9, "at": "同世而立", "text": "**同世而立** \"stand in the same age\". 而 links the manner (同世 \"sharing an age\") to the verb 立 \"to stand\" (→ L1 n.4). The idiom 自相矛盾 \"to contradict oneself\" (lit. \"self mutually spear-shield\") is a later coinage; the story itself never uses 自相.\n", "at_s": "同世而立"}], "glossary": [{"w": "楚", "py": "Chǔ", "en": "Chu, the great southern state", "checked": ["cyz"], "w_s": "楚"}, {"w": "鬻", "py": "yù", "en": "to sell", "checked": ["cyz"], "w_s": "鬻"}, {"w": "楯", "py": "dùn", "en": "shield (= 盾)", "checked": ["cyz"], "w_s": "楯"}, {"w": "與", "py": "yǔ", "en": "and (joins nouns)", "checked": ["cyz"], "w_s": "与"}, {"w": "矛", "py": "máo", "en": "spear", "checked": ["cyz"], "w_s": "矛"}, {"w": "譽", "py": "yù", "en": "to praise", "extol": null, "checked": ["cyz"], "w_s": "誉"}, {"w": "曰", "py": "yuē", "en": "to say", "checked": ["cyz"], "w_s": "曰"}, {"w": "吾", "py": "wú", "en": "I, my", "checked": ["cyz"], "w_s": "吾"}, {"w": "堅", "py": "jiān", "en": "hard", "solid": null, "checked": ["cyz"], "w_s": "坚"}, {"w": "莫", "py": "mò", "en": "nothing, no one", "checked": ["cyz"], "w_s": "莫"}, {"w": "能", "py": "néng", "en": "can", "be able to": null, "checked": ["cyz"], "w_s": "能"}, {"w": "陷", "py": "xiàn", "en": "to pierce", "break through": null, "checked": ["cyz"], "w_s": "陷"}, {"w": "又", "py": "yòu", "en": "again, then also", "checked": ["cyz"], "w_s": "又"}, {"w": "利", "py": "lì", "en": "sharp", "checked": ["cyz"], "w_s": "利"}, {"w": "於", "py": "yú", "en": "among, with regard to", "checked": ["cyz"], "w_s": "于"}, {"w": "物", "py": "wù", "en": "thing(s)", "checked": ["cyz"], "w_s": "物"}, {"w": "無", "py": "wú", "en": "there is no …", "checked": ["cyz"], "w_s": "无"}, {"w": "或", "py": "huò", "en": "someone", "checked": ["cyz"], "w_s": "或"}, {"w": "子", "py": "zǐ", "en": "you (polite)", "checked": ["cyz"], "w_s": "子"}, {"w": "何如", "py": "hé rú", "en": "how is it? what about …?", "checked": [], "w_s": "何如"}, {"w": "弗", "py": "fú", "en": "not (before a verb, object left out)", "checked": ["cyz"], "w_s": "弗"}, {"w": "應", "py": "yìng", "en": "to respond", "answer": null, "checked": ["cyz"], "w_s": "应"}, {"w": "夫", "py": "fú", "en": "now (opens a general statement)", "checked": ["cyz"], "w_s": "夫"}, {"w": "同", "py": "tóng", "en": "same; together", "checked": ["cyz"], "w_s": "同"}, {"w": "世", "py": "shì", "en": "age, generation, world", "checked": ["cyz"], "w_s": "世"}, {"w": "立", "py": "lì", "en": "to stand", "checked": ["cyz"], "w_s": "立"}], "exercise": [{"h": "莫我知也夫！", "py": "Mò wǒ zhī yě fú!", "src": "論語·憲問", "en": "No one understands me!", "tests": "莫 = no one (note the object 我 moves before the verb after 莫)", "h_s": "莫我知也夫！"}, {"h": "民無信不立。", "py": "Mín wú xìn bù lì.", "src": "論語·顏淵", "en": "Without trust, the people cannot stand.", "tests": "無, 立", "h_s": "民无信不立。"}, {"h": "燕雀安知鴻鵠之志哉！", "py": "Yàn què ān zhī hóng hú zhī zhì zāi!", "src": "史記·陳涉世家", "en": "How could swallows and sparrows know the ambitions of a swan!", "tests": "之 (attributive)", "h_s": "燕雀安知鸿鹄之志哉！"}, {"h": "道不同，不相為謀。", "py": "Dào bù tóng, bù xiāng wéi móu.", "src": "論語·衛靈公", "en": "Those whose ways differ do not make plans together.", "tests": "同", "h_s": "道不同，不相为谋。"}], "culture": "The story is a weapon in a debate. Han Fei's opponents praised both Yao and Shun as perfect sage-kings; Han Fei answers that if Shun had to correct Yao's mistakes, Yao wasn't perfect, and if Yao was perfect, Shun had nothing to correct: \"you cannot praise both\". The word 矛盾 entered modern Chinese (and Japanese, *mujun*) as the standard term for \"contradiction\", including the Marxist \"contradiction\" of Mao's essay 《矛盾論》.\n", "title_s": "自相矛盾"}, {"id": 3, "slug": "ya-miao", "title": "揠苗助長", "title_py": "Yà miáo zhù zhǎng", "title_en": "Pulling Up the Sprouts to Help Them Grow", "source": {"work": "孟子·公孫丑上", "author": "孟子 Mencius (c. 372–289 BC)", "period": "Warring States", "text_from": "《孟子·公孫丑上》, as quoted on Wiktionary 揠苗助長 (CC BY-SA); lines 1–7 also match the Hong Kong EDB edition.\n", "work_s": "孟子·公孙丑上"}, "status": "draft", "intro": "Mencius, the second great Confucian, is explaining to a disciple how to nourish one's \"flood-like qi\" (浩然之氣), the moral courage that grows from always doing what is right. You can't force it, he says, and you mustn't neglect it either, and he tells this story of yet another man of Song. New in this lesson: the particle 矣, which marks something that *has happened* or *has become* the case, and the reading 長 zhǎng \"to grow\".\n", "lines": [{"h": "宋人有閔其苗之不長而揠之者，", "py": "Sòng rén yǒu mǐn qí miáo zhī bù zhǎng ér yà zhī zhě,", "en": "There was a man of Song who, worried that his sprouts weren't growing, tugged at them.", "lit": "Song people there-was worried his sprouts' not growing and pulled them one", "h_s": "宋人有闵其苗之不长而揠之者，"}, {"h": "芒芒然歸。", "py": "máng máng rán guī.", "en": "He came home, worn out,", "h_s": "芒芒然归。"}, {"h": "謂其人曰：", "py": "Wèi qí rén yuē:", "en": "and said to his family:", "h_s": "谓其人曰："}, {"h": "「今日病矣，", "py": "Jīn rì bìng yǐ,", "en": "\"I'm exhausted today:", "h_s": "「今日病矣，"}, {"h": "予助苗長矣。」", "py": "yú zhù miáo zhǎng yǐ.", "en": "I've been helping the sprouts grow!\"", "h_s": "予助苗长矣。」"}, {"h": "其子趨而往視之，", "py": "Qí zǐ qū ér wǎng shì zhī,", "en": "His son hurried off to look at them;", "h_s": "其子趋而往视之，"}, {"h": "苗則槁矣。", "py": "miáo zé gǎo yǐ.", "en": "the sprouts had withered.", "h_s": "苗则槁矣。"}, {"h": "天下之不助苗長者寡矣。", "py": "Tiān xià zhī bù zhù miáo zhǎng zhě guǎ yǐ.", "en": "In this world, few are those who don't help their sprouts grow.", "h_s": "天下之不助苗长者寡矣。"}, {"h": "以為無益而捨之者，", "py": "Yǐ wéi wú yì ér shě zhī zhě,", "en": "Those who think it's no use and leave them alone", "h_s": "以为无益而舍之者，"}, {"h": "不耘苗者也；", "py": "bù yún miáo zhě yě;", "en": "are those who don't weed their sprouts;", "h_s": "不耘苗者也；"}, {"h": "助之長者，", "py": "zhù zhī zhǎng zhě,", "en": "those who help them grow", "h_s": "助之长者，"}, {"h": "揠苗者也。", "py": "yà miáo zhě yě.", "en": "are those who tug at their sprouts.", "h_s": "揠苗者也。"}, {"h": "非徒無益，", "py": "Fēi tú wú yì,", "en": "Not only is that no use —", "h_s": "非徒无益，"}, {"h": "而又害之。", "py": "ér yòu hài zhī.", "en": "it actually harms them.", "h_s": "而又害之。"}], "notes": [{"n": 1, "line": 0, "at": "閔其苗之不長", "text": "A long first line, built like L1's 宋人有耕者: 宋人 **有** [ … ] **者** \"among the people of Song there was one who …\" (→ L1 n.2). Inside the brackets: 閔 mǐn \"to worry about\" (later written 憫) + its object 其苗之不長 \"his sprouts' not growing\", the subject + 之 + predicate pattern of → L2 n.3. Then 而揠之 \"and pulled at them\" (→ L1 n.4, L2 n.2).\n", "at_s": "闵其苗之不长"}, {"n": 2, "line": 0, "at": "長", "text": "**長** has two readings. zhǎng = \"to grow; to be the elder, to lead\"; cháng = \"long\". Here, and in the idiom 揠苗助長, it is zhǎng. Chinese often marks a change of word by a change of tone or initial (破音字); the dictionary entry for 長 lists them separately.\n", "at_s": "长"}, {"n": 3, "line": 1, "at": "芒芒然", "text": "**-然** rán turns a word into a description of manner: 芒芒然 \"in a weary way, worn out\". 芒芒 is a reduplicated descriptive word; commentators gloss it as 疲倦的樣子 \"looking tired\". You'll meet many ~然 words: 忽然, 果然 and 自然 all come from this pattern.\n", "at_s": "芒芒然"}, {"n": 4, "line": 2, "at": "謂其人", "text": "**謂 A 曰** \"said to A\": 謂 takes the person spoken to as its object. **其人** here is \"his household, his family\". Compare L2 n.8, where 其人 meant \"that man\": context decides.\n", "at_s": "谓其人"}, {"n": 5, "line": 3, "at": "病矣", "text": "**病** = \"exhausted, worn out\", not \"ill\" (古今詞義 → L1 n.3). In early texts 疾 is the ordinary word for illness and 病 a *serious* illness or extreme fatigue. **矣** yǐ marks a new situation: \"I'm (now) exhausted\". 也 states what *is* (→ L1 n.11); 矣 states what *has come to be*. The story turns on three 矣 (lines 4, 5 and 7): he is tired now, the sprouts have been \"helped\", and by then they have withered.\n", "at_s": "病矣"}, {"n": 6, "line": 4, "at": "予", "text": "**予** yú = \"I, me\". Classical Chinese has several first-person pronouns: 吾 (L2), 我, 予/余. Here the farmer is boasting.\n", "at_s": "予"}, {"n": 7, "line": 5, "at": "趨而往視之", "text": "**趨** qū \"to hurry, walk fast\" — the middle gear between 行 \"walk\" and 走 \"run\" (→ L1 n.3). **往** \"to go (to)\", **視** \"to look at\". 而 again links the manner to the action.\n", "at_s": "趋而往视之"}, {"n": 8, "line": 6, "at": "則", "text": "**則** zé \"then, and so\": here it marks what the son *found*: \"the sprouts — (by then) they had withered\". 槁 gǎo \"dried up, withered\".\n", "at_s": "则"}, {"n": 9, "line": 7, "at": "天下之不助苗長者寡矣", "text": "Mencius turns to the moral. The subject is a long 者-phrase: 天下之 [不助苗長] 者 \"those in the world who don't help their sprouts grow\", and the predicate is 寡矣 \"are few\". **寡** guǎ \"few\" (its opposite is 眾). In other words: almost everyone forces things.\n", "at_s": "天下之不助苗长者寡矣"}, {"n": 10, "line": 8, "at": "以為", "text": "**以為** yǐ wéi \"to think, consider that\". Here it introduces a whole clause: 以為無益 \"think it is no use\". (In L6 you will see 以 A 為 B \"regard A as B\" split around its object.) **捨** shě \"to give up, leave alone\" (also written 舍).\n", "at_s": "以为"}, {"n": 11, "line": 9, "at": "者也", "text": "**A 者，B 者也** — the classic definition sentence: \"A is B\". Both halves are 者 phrases (\"those who …\"), and 也 closes the judgment (→ L1 n.11). Lines 9–12 give two of them in parallel: neglecting = not weeding; forcing = tugging.\n", "at_s": "者也"}, {"n": 12, "line": 12, "at": "非徒", "text": "**非徒 … 而又 …** \"not only … but also …\". 非 fēi negates a whole statement or a noun (\"it is not that …\"), whereas 不 negates a verb. 徒 tú \"merely, only\". 害 \"to harm\".\n", "at_s": "非徒"}], "glossary": [{"w": "閔", "py": "mǐn", "en": "to worry about, pity (= 憫)", "checked": ["cyz"], "w_s": "闵"}, {"w": "苗", "py": "miáo", "en": "sprout", "young crop": null, "checked": ["cyz"], "w_s": "苗"}, {"w": "長", "py": "zhǎng", "en": "to grow", "checked": ["cyz"], "w_s": "长"}, {"w": "揠", "py": "yà", "en": "to pull up", "tug at": null, "checked": ["cyz"], "w_s": "揠"}, {"w": "芒芒然", "py": "máng máng rán", "en": "worn out, weary", "checked": [], "w_s": "芒芒然"}, {"w": "歸", "py": "guī", "en": "to return home", "checked": ["cyz"], "w_s": "归"}, {"w": "謂", "py": "wèi", "en": "to say to; to call", "checked": ["cyz"], "w_s": "谓"}, {"w": "今日", "py": "jīn rì", "en": "today", "checked": [], "w_s": "今日"}, {"w": "病", "py": "bìng", "en": "exhausted; (seriously) ill", "checked": [], "w_s": "病"}, {"w": "矣", "py": "yǐ", "en": "final particle: new situation, completed change", "checked": ["cyz"], "w_s": "矣"}, {"w": "予", "py": "yú", "en": "I, me", "checked": ["cyz"], "w_s": "予"}, {"w": "助", "py": "zhù", "en": "to help", "checked": [], "w_s": "助"}, {"w": "趨", "py": "qū", "en": "to hurry", "walk fast": null, "checked": ["cyz"], "w_s": "趋"}, {"w": "往", "py": "wǎng", "en": "to go to", "checked": ["cyz"], "w_s": "往"}, {"w": "視", "py": "shì", "en": "to look at", "checked": ["cyz"], "w_s": "视"}, {"w": "則", "py": "zé", "en": "then; (only to find that)", "checked": ["cyz"], "w_s": "则"}, {"w": "槁", "py": "gǎo", "en": "withered", "dried up": null, "checked": ["cyz"], "w_s": "槁"}, {"w": "天下", "py": "tiān xià", "en": "the world (lit. under heaven)", "checked": [], "w_s": "天下"}, {"w": "寡", "py": "guǎ", "en": "few", "checked": ["cyz"], "w_s": "寡"}, {"w": "以為", "py": "yǐ wéi", "en": "to think, consider that", "checked": [], "w_s": "以为"}, {"w": "益", "py": "yì", "en": "benefit, use", "checked": ["cyz"], "w_s": "益"}, {"w": "捨", "py": "shě", "en": "to give up, leave alone (= 舍)", "checked": ["cyz"], "w_s": "舍"}, {"w": "耘", "py": "yún", "en": "to weed", "checked": ["cyz"], "w_s": "耘"}, {"w": "非", "py": "fēi", "en": "it is not (negates a statement)", "checked": ["cyz"], "w_s": "非"}, {"w": "徒", "py": "tú", "en": "merely, only", "checked": ["cyz"], "w_s": "徒"}, {"w": "害", "py": "hài", "en": "to harm", "checked": ["cyz"], "w_s": "害"}], "exercise": [{"h": "學而不思則罔，思而不學則殆。", "py": "Xué ér bù sī zé wǎng, sī ér bù xué zé dài.", "src": "論語·為政", "en": "To learn without thinking is to be lost; to think without learning is dangerous.", "tests": "而, 則", "h_s": "学而不思则罔，思而不学则殆。"}, {"h": "甚矣吾衰也！久矣吾不復夢見周公。", "py": "Shèn yǐ wú shuāi yě! Jiǔ yǐ wú bù fù mèng jiàn Zhōugōng.", "src": "論語·述而", "en": "How far I have declined! For a long time now I have not dreamed of the Duke of Zhou.", "tests": "矣, 也, 復 (→ L1)", "h_s": "甚矣吾衰也！久矣吾不复梦见周公。"}, {"h": "天生德於予，桓魋其如予何？", "py": "Tiān shēng dé yú yú, Huán Tuí qí rú yú hé?", "src": "論語·述而", "en": "Heaven gave birth to the virtue in me — what can Huan Tui do to me?", "tests": "予", "h_s": "天生德于予，桓魋其如予何？"}, {"h": "子謂顏淵曰：「用之則行，舍之則藏，惟我與爾有是夫！」", "py": "Zǐ wèi Yán Yuān yuē: Yòng zhī zé xíng, shě zhī zé cáng, wéi wǒ yǔ ěr yǒu shì fú!", "src": "論語·述而", "en": "The Master said to Yan Yuan: \"When employed, act; when set aside, withdraw — only you and I have this!\"", "tests": "謂 A 曰, 則, 舍", "h_s": "子谓颜渊曰：「用之则行，舍之则藏，惟我与尔有是夫！」"}], "culture": "This passage is the second half of Mencius's famous answer on 浩然之氣 (Mencius 2A:2). His advice: keep working at righteousness, \"don't forget it, but don't help it grow\" (勿忘，勿助長也). The idiom 揠苗助長 (also 拔苗助長 in modern mainland usage) means to spoil something by being too eager, often said of pushy parents and over-ambitious reforms.\n", "title_s": "揠苗助长"}, {"id": 4, "slug": "ke-zhou", "title": "刻舟求劍", "title_py": "Kè zhōu qiú jiàn", "title_en": "Notching the Boat to Find the Sword", "source": {"work": "呂氏春秋·察今", "author": "compiled under 呂不韋 Lü Buwei (d. 235 BC)", "period": "late Warring States (c. 239 BC)", "text_from": "《呂氏春秋·慎大覽·察今》; first sentence as quoted in 王力《古代漢語》 (with 於 for its 于), the rest matched against two published editions.\n", "work_s": "吕氏春秋·察今"}, "status": "draft", "intro": "The *Springs and Autumns of Master Lü* is an encyclopedia commissioned by Lü Buwei, chancellor of Qin, from the scholars he kept at his court. The chapter \"Examining the Present\" (察今) argues the same point as L1: laws must change with the times. This fable brings two important new tools: 所, which turns a verb into \"the place / thing that …\", and the rhetorical question 不亦…乎.\n", "lines": [{"h": "楚人有涉江者，", "py": "Chǔ rén yǒu shè jiāng zhě,", "en": "A man of Chu was crossing the river.", "lit": "Chu people there-was crossing river one", "h_s": "楚人有涉江者，"}, {"h": "其劍自舟中墜於水，", "py": "qí jiàn zì zhōu zhōng zhuì yú shuǐ,", "en": "His sword fell from the boat into the water.", "h_s": "其剑自舟中坠于水，"}, {"h": "遽契其舟，曰：", "py": "jù qì qí zhōu, yuē:", "en": "At once he cut a notch in the boat, saying:", "h_s": "遽契其舟，曰："}, {"h": "「是吾劍之所從墜。」", "py": "Shì wú jiàn zhī suǒ cóng zhuì.", "en": "\"This is where my sword fell from.\"", "lit": "this my sword 's place-from-which fell", "h_s": "「是吾剑之所从坠。」"}, {"h": "舟止，", "py": "Zhōu zhǐ,", "en": "When the boat stopped,", "h_s": "舟止，"}, {"h": "從其所契者入水求之。", "py": "cóng qí suǒ qì zhě rù shuǐ qiú zhī.", "en": "he went into the water from the place he had notched, to look for it.", "h_s": "从其所契者入水求之。"}, {"h": "舟已行矣，", "py": "Zhōu yǐ xíng yǐ,", "en": "The boat had moved on,", "h_s": "舟已行矣，"}, {"h": "而劍不行，", "py": "ér jiàn bù xíng,", "en": "but the sword had not.", "h_s": "而剑不行，"}, {"h": "求劍若此，", "py": "qiú jiàn ruò cǐ,", "en": "To look for a sword like this —", "h_s": "求剑若此，"}, {"h": "不亦惑乎？", "py": "bù yì huò hū?", "en": "isn't that foolish?", "h_s": "不亦惑乎？"}, {"h": "以此故法為其國，", "py": "Yǐ cǐ gù fǎ wéi qí guó,", "en": "To run one's state with these old laws", "h_s": "以此故法为其国，"}, {"h": "與此同。", "py": "yǔ cǐ tóng.", "en": "is just the same.", "h_s": "与此同。"}, {"h": "時已徙矣，", "py": "Shí yǐ xǐ yǐ,", "en": "The times have moved on,", "h_s": "时已徙矣，"}, {"h": "而法不徙，", "py": "ér fǎ bù xǐ,", "en": "but the laws have not;", "h_s": "而法不徙，"}, {"h": "以此為治，", "py": "yǐ cǐ wéi zhì,", "en": "to govern like this —", "h_s": "以此为治，"}, {"h": "豈不難哉！", "py": "qǐ bù nán zāi!", "en": "how could it not be hard!", "h_s": "岂不难哉！"}], "notes": [{"n": 1, "line": 0, "at": "涉江", "text": "**涉** shè \"to cross (a river), wade\". **江** jiāng is *the* River, the Yangzi, just as 河 is the Yellow River. Only later did 江 and 河 become general words for \"river\" (古今詞義). 楚人有涉江者 has the same shape as L1's opening (→ L1 n.2).\n", "at_s": "涉江"}, {"n": 2, "line": 1, "at": "自舟中墜於水", "text": "Two prepositions: **自** \"from\" (自舟中 \"from inside the boat\") and **於** \"into, at\" (墜於水 \"fell into the water\"). Notice the order: 自 phrases come *before* the verb, 於 phrases *after* it. 墜 zhuì \"to fall, drop\".\n", "at_s": "自舟中坠于水"}, {"n": 3, "line": 2, "at": "遽契", "text": "**遽** jù \"at once, hastily\" (modern 立刻 or 急忙); it shows the man's panic. **契** qì \"to carve, notch\" (the same word is written 鍥). The modern meaning \"contract\" comes from notched wooden tallies.\n", "at_s": "遽契"}, {"n": 4, "line": 3, "at": "是", "text": "**是 = \"this\"**, not \"is\" (→ L1 n.11). 是吾劍之所從墜 is a judgment sentence with no verb: \"this [is] the place my sword fell from\".\n", "at_s": "是"}, {"n": 5, "line": 3, "at": "所從墜", "text": "**所 + (preposition) + verb = \"the place / thing that …\"**. 所 makes a verb into a noun phrase that refers to its object or circumstance: 所墜 \"what fell\"; 所從墜 \"where (something) fell *from*\". Put a subject + 之 in front: 吾劍之所從墜 \"the place my sword fell from\". In line 6, 其所契者 \"the place he had notched\" adds 者 at the end, with no change of meaning.\n", "at_s": "所从坠"}, {"n": 6, "line": 6, "at": "已行矣", "text": "**已 … 矣** \"already … (now)\": 已 yǐ \"already\" before the verb, 矣 (→ L3 n.5) at the end for the completed change. Two different characters both read yǐ. And **行** here is \"to move, go\", not \"to walk\" — it's used of the boat (→ L1 n.3).\n", "at_s": "已行矣"}, {"n": 7, "line": 8, "at": "若此", "text": "**若此** \"like this\" (若 = 如 \"to be like\"; 此 \"this\"). 此 is the ordinary demonstrative \"this\"; 是 (n. 4) is \"this\" used to sum up or point back.\n", "at_s": "若此"}, {"n": 8, "line": 9, "at": "不亦惑乎", "text": "**不亦 … 乎** is a rhetorical question expecting \"yes\": \"isn't it (also) …?\". You already met it in the first line of the 論語 (→ L1 exercise 2: 不亦說乎). **乎** hū is the question particle; **惑** huò \"confused, deluded, foolish\".\n", "at_s": "不亦惑乎"}, {"n": 9, "line": 10, "at": "故法為其國", "text": "**故** gù here = \"old, former\" (故法 \"old laws\"; compare 故鄉 \"old home\"). **為** wéi \"to manage, run\": 為國 \"to run a state\". 以 A 為 B would be \"regard A as B\", but
