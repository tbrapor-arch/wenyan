<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Wenyan 文言</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Serif+SC:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* Always light, whatever the phone says; night is a manual switch in Settings. */
:root{
  color-scheme:only light;
  --paper:#f6f1e7; --paper-2:#efe7d6; --card:#fbf8f1; --ink:#24201b; --ink-2:#6b6257; --rule:#d9cdb6;
  --seal:#a8321e; --seal-soft:#a8321e1a; --hl:#e9d9a8; --ok:#3d6b4f;
  --zh:"Noto Serif TC","Noto Serif SC",serif; --en:"Source Serif 4",Georgia,serif;
  --nav-h:58px;
}
:root[data-theme="dark"]{
  color-scheme:only dark;
  --paper:#1b1916; --paper-2:#24211d; --card:#211e1a; --ink:#ece4d4; --ink-2:#a69b8a; --rule:#3a352e;
  --seal:#e0664c; --seal-soft:#e0664c22; --hl:#5a4a22; --ok:#7fb894;
}
html.simp{--zh:"Noto Serif SC","Noto Serif TC",serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 var(--en);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
main.wrap{padding-bottom:120px;min-height:70vh}

/* top bar + tabs (tabs drop to the bottom of the screen on a phone) */
header.bar{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
header.bar .wrap{display:flex;align-items:center;gap:18px;height:54px}
.brand{font:600 20px var(--zh);letter-spacing:.08em;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand small{font:400 13px var(--en);color:var(--ink-2);letter-spacing:0;margin-left:6px}
nav.tabs{display:flex;gap:2px;position:fixed;z-index:8;top:0;right:max(16px,calc(50vw - 504px));height:54px;align-items:center}
nav.tabs a{display:flex;align-items:baseline;gap:6px;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:13px;position:relative}
nav.tabs a b{font:600 17px var(--zh);color:var(--ink);letter-spacing:.04em}
nav.tabs a[aria-current="page"]{background:var(--seal-soft);color:var(--seal)}
nav.tabs a[aria-current="page"] b{color:var(--seal)}
@media (max-width:720px){
  .brand small{display:none}
  header.bar .wrap{height:46px}
  nav.tabs{top:auto;left:0;right:0;bottom:0;height:auto;gap:0;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs a{flex:1;flex-direction:column;align-items:center;gap:0;padding:7px 2px 6px;border-radius:0;font-size:10.5px;letter-spacing:.02em;height:var(--nav-h);justify-content:center}
  nav.tabs a[aria-current="page"]{background:transparent;box-shadow:inset 0 2px 0 var(--seal)}
  }

/* shared pieces */
.kicker{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--seal)}
h1{font:600 clamp(32px,6vw,50px)/1.1 var(--zh);margin:6px 0 4px;letter-spacing:.06em}
h2{font:600 13px var(--en);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:40px 0 14px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--rule)}
.sub{color:var(--ink-2);font-style:italic}
.btn{text-decoration:none;display:inline-block;text-align:center;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 20px;cursor:pointer;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.red{background:var(--seal);border-color:var(--seal)}
.btn:disabled{opacity:.4;cursor:default}
.tg{font:13px var(--en);border:1px solid var(--rule);background:transparent;color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.badge{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:0 6px;margin-left:6px}
.seal{width:76px;height:76px;border:2px solid var(--seal);color:var(--seal);border-radius:6px;display:grid;grid-template-columns:1fr 1fr;place-items:center;font:600 26px/1 var(--zh);padding:6px;transform:rotate(-2deg);flex:none}
.seal.one{grid-template-columns:1fr}
.empty{border:1px dashed var(--rule);border-radius:10px;padding:22px;color:var(--ink-2);max-width:640px}
.empty b{color:var(--ink)}
code{font:13px ui-monospace,Menlo,monospace;background:var(--paper-2);padding:1px 5px;border-radius:4px}

/* track home */
.thead{display:flex;gap:20px;align-items:flex-start;padding:34px 0 20px}
.thead p{margin:6px 0 0;max-width:560px;color:var(--ink-2);font-size:15.5px}
.next{display:flex;gap:16px;align-items:center;border:1px solid var(--rule);border-left:4px solid var(--seal);border-radius:10px;background:var(--card);padding:16px 18px;margin:6px 0 4px}
.next .t{flex:1;min-width:0}
.next .t .zh1{font:600 24px/1.25 var(--zh);letter-spacing:.05em}
.next .t .te{color:var(--ink-2);font-size:14.5px}
.prog{font-size:13px;color:var(--ink-2);margin:10px 2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;text-align:left;border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:12px 12px 11px;cursor:pointer;text-decoration:none;color:var(--ink);display:block;min-height:104px}
.tile:hover{border-color:var(--ink-2)}
.tile .n{font:600 12px var(--en);color:var(--ink-2);letter-spacing:.08em}
.tile .z{font:600 20px/1.25 var(--zh);letter-spacing:.04em;margin:5px 0 3px}
.tile .te{font-size:12.5px;line-height:1.3;color:var(--ink-2)}
.tile.done{background:var(--paper-2)}
.tile.done::after{content:"✓";position:absolute;top:9px;right:11px;color:var(--ok);font-weight:600}
.tile.rev{border-style:dashed}

/* lesson bar */
.lbar{position:sticky;top:54px;z-index:5;background:color-mix(in srgb,var(--paper) 96%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);margin:0 -16px;padding:7px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbar .ttl{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbar .ttl b{font:600 16px var(--zh);margin-left:4px}
.ic{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:transparent;cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center;text-decoration:none;color:var(--ink);flex:none}
.ic[aria-disabled="true"]{opacity:.3;pointer-events:none}
.toggles{display:flex;gap:6px}
@media (max-width:720px){.lbar{top:46px}.lbar .toggles{order:5;width:100%}}

/* lesson */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:end;padding:36px 0 24px;border-bottom:1px solid var(--rule)}
.intro{max-width:720px;margin:22px 0 0}
.meta{font-size:13px;color:var(--ink-2);margin-top:10px}
.pages{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--paper-2)}
.page{padding:22px 24px}
.page.left{border-right:1px solid var(--rule);background:var(--paper)}
.ln{padding:9px 0;border-bottom:1px dashed var(--rule);min-height:64px}
.ln:last-child{border-bottom:0}
.ln.p:not(:first-child){border-top:1px solid var(--rule);margin-top:-1px;padding-top:18px}
.zh{font:400 26px/1.5 var(--zh);letter-spacing:.06em}
.prose .zh{font-size:22px;line-height:1.65;letter-spacing:.03em}
.py{font-size:14px;color:var(--ink-2);font-style:italic;margin-top:2px}
.en{font-size:16px}
.lit{font-size:13px;color:var(--ink-2);margin-top:2px}
html.nopy .py{display:none}
html.cover .page.right .ln > *,html.cover .en-inline{filter:blur(6px);opacity:.5;transition:.2s}
html.cover .page.right .ln.peek > *,html.cover .ln.peek .en-inline{filter:none;opacity:1}
.w{cursor:pointer;border-radius:3px;transition:background .15s;text-decoration:underline dotted var(--rule);text-underline-offset:6px}
.w:hover,.w.on{background:var(--hl)}
sup.nn{font:600 11px var(--en);color:var(--seal);margin-left:1px;cursor:pointer;vertical-align:super;padding:0 2px;border-radius:3px}
sup.nn.on{background:var(--seal);color:var(--paper)}
.notes{columns:2 340px;column-gap:34px}
.note{break-inside:avoid;margin:0 0 18px;padding-left:34px;position:relative}
.num{width:24px;height:24px;border-radius:50%;background:var(--seal-soft);color:var(--seal);font:600 12px/24px var(--en);text-align:center;display:inline-block;flex:none}
.note > .num{position:absolute;left:0;top:2px}
.note .at{font-family:var(--zh);font-size:18px;margin-right:4px}
.note.flash{animation:fl 1.6s}
@keyframes fl{0%{background:var(--hl)}100%{background:transparent}}
.note p{margin:0}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.g{border:1px solid var(--rule);border-radius:8px;padding:8px 12px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;background:var(--card)}
.g .c{font:600 24px/1.2 var(--zh);grid-row:span 2}
.g .p{font-size:13px;color:var(--ink-2);font-style:italic}
.g .d{font-size:14px;line-height:1.35}
.gl.known .g{background:transparent}
.gl.known .g .c{font-size:20px;font-weight:400}
.g .sw{grid-column:1/-1;font:13px var(--zh);color:var(--ink-2);border-top:1px dotted var(--rule);padding-top:4px;margin-top:4px}
.g .sw b{font:600 11px var(--en);letter-spacing:.06em;color:var(--seal);margin-right:6px}
.ex{display:grid;gap:10px}
.e{border-left:3px solid var(--seal);padding:8px 0 8px 16px}
.e .zh{font-size:22px}
.e .src{font-size:12px;color:var(--ink-2);letter-spacing:.04em}
.e details summary{cursor:pointer;color:var(--seal);font-size:14px;margin-top:4px}
.e details p{margin:4px 0 0}
.e .tests{font-size:13px;color:var(--ink-2)}
.culture{max-width:760px;font-size:16px;background:var(--paper-2);border-radius:10px;padding:18px 22px}
.recap{display:grid;gap:14px}
.rc{display:grid;grid-template-columns:34px 1fr;gap:14px;border:1px solid var(--rule);border-radius:10px;padding:16px 18px;background:var(--card)}
.rc .num{width:30px;height:30px;line-height:30px;font-size:14px}
.rc h3{margin:2px 0 6px;font:600 17px var(--en)}
.rc p{margin:0 0 10px;font-size:15.5px}
.rx{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px}
.rx span{font:20px/1.4 var(--zh);letter-spacing:.04em}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.ref{font:12px var(--en);color:var(--seal);background:var(--seal-soft);border:0;border-radius:999px;padding:3px 10px;cursor:pointer;white-space:nowrap}
p .ref,.nb .ref{padding:1px 8px}
.finish{margin-top:44px;border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:18px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.finish .msg{flex:1;min-width:200px;font-size:15px}
.finish .msg small{display:block;color:var(--ink-2)}
.en-inline{display:none;font-size:15px;margin-top:4px}
footer{margin-top:48px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:14px}
@media (max-width:720px){
  .pages{grid-template-columns:1fr}
  .page.left{border-right:0}
  .page{padding:12px 16px}
  .page.right{display:none}
  .en-inline{display:block}
  .hero{grid-template-columns:1fr;gap:14px;padding-top:24px}
  .seal{width:60px;height:60px;font-size:20px}
  .zh{font-size:23px}
  .prose .zh{font-size:20px}
  .thead{padding-top:22px;gap:14px}
  .thead .seal{margin-top:6px}
}

/* 成語 lesson: the reading lessons' two-column card. Each 成語 is two rows:
   成語 | meaning, then example | translation (stacked in that order on a phone). */
.frames{border:1px solid var(--rule);border-radius:10px;background:var(--card)}
.frame{display:grid;grid-template-columns:10em 1fr;gap:2px 16px;padding:9px 16px;border-top:1px dashed var(--rule);font-size:15px}
.frame:first-child{border-top:0}
.frame b{font:400 18px var(--zh);color:var(--seal)}
.frame .fx{grid-column:2;font:15px var(--zh);color:var(--ink-2)}
.cys{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--paper)}
.cy{border-top:1.5px solid var(--rule)}
.cy:first-child{border-top:0}
.cyr{display:grid;grid-template-columns:1fr 1fr}
.cyr + .cyr{border-top:1px dotted var(--rule)}
.cl{padding:16px 22px}
.cr{padding:16px 22px;background:var(--paper-2);border-left:1px solid var(--rule)}
.cy .hw{font:600 30px/1.25 var(--zh);letter-spacing:.04em}
.cy .hw .cn{font:12px var(--en);color:var(--seal);vertical-align:super;margin-right:5px;letter-spacing:0}
.cy .hw .alt{font-weight:400;font-size:16px;color:var(--ink-2);margin-left:8px}
.cy .py small{font-style:normal;font-size:12px;margin-left:6px}
.cy .mean{font-size:17.5px;font-weight:600}
.cy .nt{font-size:15px;color:var(--ink-2);margin-top:6px}
.cy .or{font-size:14px;margin-top:8px;color:var(--seal)}
.cy .or .zh{font-size:15px}
.cy .or .ow{color:var(--ink-2)}
.cy .xz{font:19px/1.75 var(--zh)}
.cy .xz mark{background:none;color:var(--seal);font-weight:600}
.cy .xe{font-size:16px}
.cy .xs{font-size:12px;color:var(--ink-2)}
@media (max-width:720px){
  .cyr{grid-template-columns:1fr}
  .cr{border-left:0;border-top:1px solid var(--rule)}
  .cl,.cr{padding:13px 16px}
  .frame{grid-template-columns:1fr}
  .frame .fx{grid-column:1}
}
.auto{font:600 9px var(--en);letter-spacing:.08em;border:1px solid var(--ink-2);color:var(--ink-2);border-radius:3px;padding:0 3px;margin-left:5px;vertical-align:middle}

/* settings */
.set{max-width:620px;padding-top:26px}
.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--rule)}
.row .l{flex:1}
.row .l small{display:block;color:var(--ink-2);font-size:13.5px;line-height:1.4}

/* pop-up */
#pop{position:fixed;z-index:20;max-width:300px;background:var(--ink);color:var(--paper);border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.4;box-shadow:0 8px 28px #0004;display:none}
#pop .c{font:600 26px var(--zh)}
#pop .p{font-style:italic;opacity:.75;margin-left:8px}
#pop .sw{font-family:var(--zh);opacity:.8;margin-top:6px;font-size:13px}
#pop.note-pop{max-width:min(420px,calc(100vw - 16px));max-height:60vh;overflow:auto;padding:14px 16px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-top:3px solid var(--seal)}
#pop .nh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#pop .nh .c{font-size:22px}
#pop .nb{font-size:15px;line-height:1.5}
#pop .goto{margin-top:10px;font:13px var(--en);color:var(--seal);background:none;border:0;padding:0;cursor:pointer}
/* 入門: the Tsheh-tû lesson layout (dialogue lines with speakers, tappable words with pinyin above,
   numbered notes under each line, word card and notes in a bottom sheet) */
.setting{max-width:720px;margin:18px 0 0;font-style:italic;color:var(--ink-2)}
.lnav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 0}
.lnav button{font:13px var(--en);border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:4px 12px;cursor:pointer}
.wavecard{display:block;margin:16px 0 0;border:1px dashed var(--seal);border-radius:10px;padding:12px 16px;background:var(--card);text-decoration:none;color:var(--ink);font-size:15px}
.dlg{margin-top:8px}
.sent{display:grid;grid-template-columns:7.5em 1fr;gap:4px 18px;padding:14px 0;border-bottom:1px dashed var(--rule)}
.sent:last-child{border-bottom:0}
.sent.noted{background:linear-gradient(90deg,var(--seal-soft),transparent 70%)}
.who{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:7px;padding-top:12px;font-family:var(--zh)}
.who .n{margin-left:auto;font:600 11px var(--en);color:var(--rule)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--seal);color:var(--paper);font:600 13px var(--zh);flex:none}
.av.b{background:var(--ink-2)}
.av.c{background:#3d6b4f}
.txt{font:400 25px/1.5 var(--zh);letter-spacing:.03em}
.tok{cursor:pointer;border-radius:4px;display:inline-block;padding:0 1px;transition:background .15s}
.tok:hover,.tok.sel{background:var(--hl)}
.tok ruby{ruby-position:over}
.tok rt{font:italic 12.5px var(--en);color:var(--ink-2);letter-spacing:0;padding-bottom:1px}
html.rm-han .tok rt,html.rm-tap .tok:not(.show) rt{visibility:hidden}
.tr{grid-column:2;font-size:16px}
.tr .lit{display:block}
html.cover .tr:not(.peek){filter:blur(6px);opacity:.5;cursor:pointer}
.under{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nlink{width:24px;height:24px;border-radius:50%;border:0;background:var(--seal-soft);color:var(--seal);font:600 12px var(--en);cursor:pointer;padding:0}
.showzh{font:13px var(--en);border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:3px 12px;cursor:pointer;justify-self:start}
details.allnotes summary{cursor:pointer;font:600 13px var(--en);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:40px 0 14px}
.rnote{display:grid;grid-template-columns:34px 1fr;gap:4px 10px;margin:0 0 16px;max-width:760px}
.rnote .tag,.ntag{font:600 10.5px var(--en);letter-spacing:.1em;text-transform:uppercase;color:var(--seal)}
.rnote p{margin:2px 0 0;grid-column:2}
.ntext .wt{cursor:pointer;font-family:var(--zh);border-bottom:1px dotted var(--ink-2)}
.ntext .wt:hover{background:var(--hl)}
.ntext b{font-weight:600}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.wchip{text-align:left;border:1px solid var(--rule);border-radius:8px;background:var(--card);padding:8px 12px;cursor:pointer;display:grid;gap:1px}
.wchip b{font:600 22px/1.25 var(--zh)}
.wchip .r{font-size:13px;font-style:italic;color:var(--ink-2)}
.wchip .g{font-size:14px;line-height:1.3}
.lv{font:600 10px var(--en);letter-spacing:.06em;color:var(--seal);border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.lv.off{color:var(--ink-2)}
.prac{display:grid;gap:12px;max-width:760px}
.q{border-left:3px solid var(--seal);padding:6px 0 6px 16px}
.q .txt{font-size:22px}
.q .ans{margin-top:4px}
.q .ans summary{cursor:pointer;color:var(--seal);font-size:14px}
.gap{display:inline-block;min-width:2.2em;border-bottom:2px solid var(--seal);text-align:center;color:var(--seal)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.opt{font:22px var(--zh);border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:4px 16px;cursor:pointer;min-width:2.6em}
.opt.ok{background:var(--ok);color:var(--paper);border-color:var(--ok)}
.opt.no{opacity:.35;text-decoration:line-through}
.q .after{margin-top:6px;font-size:15px}
.planned{opacity:.55;cursor:default;border-style:dotted}
.planned .z{font-weight:400}
.cov{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;max-width:520px;font-size:13px;color:var(--ink-2);margin-top:14px}
.cov .bar{height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden}
.cov .bar i{display:block;height:100%;background:var(--seal)}
#sheet{position:fixed;z-index:30;left:50%;bottom:0;transform:translate(-50%,105%);width:min(620px,100vw);max-height:78vh;overflow:auto;background:var(--paper);border:1px solid var(--rule);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -10px 40px #0003;padding:6px 20px calc(22px + env(safe-area-inset-bottom));transition:transform .22s ease,visibility .22s;visibility:hidden}

<script id="course-data" type="application/json">{"tracks": [{"key": "rumen", "zh": "入門", "en": "Start", "about": "Mandarin from zero, the Assimil way: 100 lessons that follow Marc through a year in Beijing, up to NHSK 4 (2,000 words). Explanations in French or English.", "lessons": [{"id": 1, "slug": "ni-hao", "title": "你好！", "title_py": "Nǐ hǎo!", "title_fr": "Bonjour !", "title_en": "Hello!", "status": "draft", "setting": {"fr": "Aéroport de Pékin, hall des arrivées. Marc, français, vient faire un stage d'un an. Une jeune femme l'attend avec une pancarte.", "en": "Beijing airport, arrivals hall. Marc, who is French, has come for a one-year internship. A young woman is waiting with a sign."}, "names": [{"w": "马克", "py": "Mǎkè", "fr": "Marc", "en": "Marc"}, {"w": "王小雨", "py": "Wáng Xiǎoyǔ", "fr": "Wang Xiaoyu", "en": "Wang Xiaoyu"}, {"w": "小雨", "py": "Xiǎoyǔ", "fr": "Xiaoyu", "en": "Xiaoyu"}], "lines": [{"n": 1, "who": "小雨", "h": "你好！你是马克吗？", "py": "Nǐ hǎo! Nǐ shì Mǎkè ma?", "fr": "Bonjour ! Tu es Marc ?", "en": "Hello! Are you Marc?", "who_t": "小雨", "toks": [{"s": "你好", "t": "你好", "p": "Nǐ hǎo", "k": "你好"}, {"s": "！", "t": "！"}, {"s": "你", "t": "你", "p": "Nǐ", "k": "你"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "马克", "t": "馬克", "p": "Mǎkè", "k": "马克"}, {"s": "吗", "t": "嗎", "p": "ma", "k": "吗"}, {"s": "？", "t": "？"}]}, {"n": 2, "who": "马克", "h": "是，我是马克。你是……？", "py": "Shì, wǒ shì Mǎkè. Nǐ shì……?", "fr": "Oui, je suis Marc. Et tu es… ?", "en": "Yes, I'm Marc. And you are…?", "lit_fr": "(Être, je être Marc. Tu être… ?)", "lit_en": "(Be, I be Marc. You be…?)", "who_t": "馬克", "toks": [{"s": "是", "t": "是", "p": "Shì", "k": "是"}, {"s": "，", "t": "，"}, {"s": "我", "t": "我", "p": "wǒ", "k": "我"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "马克", "t": "馬克", "p": "Mǎkè", "k": "马克"}, {"s": "。", "t": "。"}, {"s": "你", "t": "你", "p": "Nǐ", "k": "你"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "……？", "t": "……？"}]}, {"n": 3, "who": "小雨", "h": "我是王小雨，你的同事。", "py": "Wǒ shì Wáng Xiǎoyǔ, nǐ de tóngshì.", "fr": "Je suis Wang Xiaoyu, ta collègue.", "en": "I'm Wang Xiaoyu, your colleague.", "who_t": "小雨", "toks": [{"s": "我", "t": "我", "p": "Wǒ", "k": "我"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "王小雨", "t": "王小雨", "p": "Wáng Xiǎoyǔ", "k": "王小雨"}, {"s": "，", "t": "，"}, {"s": "你", "t": "你", "p": "nǐ", "k": "你"}, {"s": "的", "t": "的", "p": "de", "k": "的"}, {"s": "同事", "t": "同事", "p": "tóngshì", "k": "同事"}, {"s": "。", "t": "。"}]}, {"n": 4, "who": "马克", "h": "你好，小雨！谢谢！", "py": "Nǐ hǎo, Xiǎoyǔ! Xièxie!", "fr": "Bonjour, Xiaoyu ! Merci !", "en": "Hello, Xiaoyu! Thank you!", "who_t": "馬克", "toks": [{"s": "你好", "t": "你好", "p": "Nǐ hǎo", "k": "你好"}, {"s": "，", "t": "，"}, {"s": "小雨", "t": "小雨", "p": "Xiǎoyǔ", "k": "小雨"}, {"s": "！", "t": "！"}, {"s": "谢谢", "t": "謝謝", "p": "Xièxie", "k": "谢谢"}, {"s": "！", "t": "！"}]}, {"n": 5, "who": "小雨", "h": "你累吗？", "py": "Nǐ lèi ma?", "fr": "Tu es fatigué ?", "en": "Are you tired?", "lit_fr": "(Tu fatigué ?)", "lit_en": "(You tired?)", "who_t": "小雨", "toks": [{"s": "你", "t": "你", "p": "Nǐ", "k": "你"}, {"s": "累", "t": "累", "p": "lèi", "k": "累"}, {"s": "吗", "t": "嗎", "p": "ma", "k": "吗"}, {"s": "？", "t": "？"}]}, {"n": 6, "who": "马克", "h": "不累，我很好。", "py": "Bú lèi, wǒ hěn hǎo.", "fr": "Non, ça va très bien.", "en": "No, I'm fine.", "lit_fr": "(Pas fatigué, je très bien.)", "lit_en": "(Not tired, I very good.)", "who_t": "馬克", "toks": [{"s": "不", "t": "不", "p": "Bú", "k": "不"}, {"s": "累", "t": "累", "p": "lèi", "k": "累"}, {"s": "，", "t": "，"}, {"s": "我", "t": "我", "p": "wǒ", "k": "我"}, {"s": "很", "t": "很", "p": "hěn", "k": "很"}, {"s": "好", "t": "好", "p": "hǎo", "k": "好"}, {"s": "。", "t": "。"}]}, {"n": 7, "who": "小雨", "h": "好，我们走吧！", "py": "Hǎo, wǒmen zǒu ba!", "fr": "Bon, on y va !", "en": "Right, let's go!", "lit_fr": "(Bien, nous partir donc !)", "lit_en": "(Good, we go then!)", "who_t": "小雨", "toks": [{"s": "好", "t": "好", "p": "Hǎo", "k": "好"}, {"s": "，", "t": "，"}, {"s": "我们", "t": "我們", "p": "wǒmen", "k": "我们"}, {"s": "走", "t": "走", "p": "zǒu", "k": "走"}, {"s": "吧", "t": "吧", "p": "ba", "k": "吧"}, {"s": "！", "t": "！"}]}, {"n": 8, "who": "马克", "h": "走吧！", "py": "Zǒu ba!", "fr": "Allons-y !", "en": "Let's go!", "who_t": "馬克", "toks": [{"s": "走", "t": "走", "p": "Zǒu", "k": "走"}, {"s": "吧", "t": "吧", "p": "ba", "k": "吧"}, {"s": "！", "t": "！"}]}], "notes": [{"n": 1, "line": 1, "topic": "pron", "fr": "Le mandarin a **quatre tons** : mā (haut et plat), má (montant), mǎ (bas), mà (descendant), plus un ton neutre, court et léger, sans accent : ma. Le ton fait partie du mot : 马 mǎ « cheval », 吗 ma (particule). Écoutez-vous le dire, et exagérez au début.\n", "en": "Mandarin has **four tones**: mā (high and level), má (rising), mǎ (low), mà (falling), plus a short, light neutral tone with no mark: ma. The tone is part of the word: 马 mǎ \"horse\", 吗 ma (a particle). Exaggerate them at first.\n", "fr_t": "Le mandarin a **quatre tons** : mā (haut et plat), má (montant), mǎ (bas), mà (descendant), plus un ton neutre, court et léger, sans accent : ma. Le ton fait partie du mot : 馬 mǎ « cheval », 嗎 ma (particule). Écoutez-vous le dire, et exagérez au début.\n", "en_t": "Mandarin has **four tones**: mā (high and level), má (rising), mǎ (low), mà (falling), plus a short, light neutral tone with no mark: ma. The tone is part of the word: 馬 mǎ \"horse\", 嗎 ma (a particle). Exaggerate them at first.\n"}, {"n": 2, "line": 1, "topic": "pron", "fr": "你好 s'écrit nǐ hǎo mais se dit **ní hǎo** : quand deux troisièmes tons se suivent, le premier devient montant. Le pinyin garde le ton du dictionnaire ; c'est à vous de faire le changement (même chose pour 很好 hěn hǎo, dit hén hǎo).\n", "en": "你好 is written nǐ hǎo but said **ní hǎo**: when two third tones meet, the first one rises. Pinyin keeps the dictionary tone and leaves the change to you (likewise 很好 hěn hǎo, said hén hǎo).\n", "fr_t": "你好 s'écrit nǐ hǎo mais se dit **ní hǎo** : quand deux troisièmes tons se suivent, le premier devient montant. Le pinyin garde le ton du dictionnaire ; c'est à vous de faire le changement (même chose pour 很好 hěn hǎo, dit hén hǎo).\n", "en_t": "你好 is written nǐ hǎo but said **ní hǎo**: when two third tones meet, the first one rises. Pinyin keeps the dictionary tone and leaves the change to you (likewise 很好 hěn hǎo, said hén hǎo).\n"}, {"n": 3, "line": 1, "topic": "grammar", "fr": "**吗** ma à la fin d'une phrase en fait une question fermée (oui / non), sans rien changer d'autre : 你是马克。« Tu es Marc. » → 你是马克吗？« Tu es Marc ? »\n", "en": "**吗** ma at the end of a sentence turns it into a yes / no question, with nothing else changed: 你是马克。\"You are Marc.\" → 你是马克吗？\"Are you Marc?\"\n", "fr_t": "**嗎** ma à la fin d'une phrase en fait une question fermée (oui / non), sans rien changer d'autre : 你是馬克。« Tu es Marc. » → 你是馬克嗎？« Tu es Marc ? »\n", "en_t": "**嗎** ma at the end of a sentence turns it into a yes / no question, with nothing else changed: 你是馬克。\"You are Marc.\" → 你是馬克嗎？\"Are you Marc?\"\n"}, {"n": 4, "line": 2, "topic": "grammar", "fr": "**是** shì « être » relie deux noms. Le verbe ne se conjugue jamais : 我是, 你是 (je suis, tu es). Pour répondre « oui », on reprend le verbe de la question : 是 « (je) suis ».\n", "en": "**是** shì \"to be\" links two nouns. Verbs never change: 我是, 你是 (I am, you are). To answer \"yes\", repeat the verb of the question: 是 \"(I) am\".\n", "fr_t": "**是** shì « être » relie deux noms. Le verbe ne se conjugue jamais : 我是, 你是 (je suis, tu es). Pour répondre « oui », on reprend le verbe de la question : 是 « (je) suis ».\n", "en_t": "**是** shì \"to be\" links two nouns. Verbs never change: 我是, 你是 (I am, you are). To answer \"yes\", repeat the verb of the question: 是 \"(I) am\".\n"}, {"n": 5, "line": 3, "topic": "culture", "fr": "Le nom de famille vient en premier : 王 Wáng est le nom, 小雨 Xiǎoyǔ (« petite pluie ») le prénom. Ses amis et ses collègues l'appellent 小雨.\n", "en": "The surname comes first: 王 Wáng is the family name, 小雨 Xiǎoyǔ (\"light rain\") the given name. Friends and colleagues call her 小雨.\n", "fr_t": "Le nom de famille vient en premier : 王 Wáng est le nom, 小雨 Xiǎoyǔ (« petite pluie ») le prénom. Ses amis et ses collègues l'appellent 小雨.\n", "en_t": "The surname comes first: 王 Wáng is the family name, 小雨 Xiǎoyǔ (\"light rain\") the given name. Friends and colleagues call her 小雨.\n"}, {"n": 6, "line": 3, "topic": "grammar", "fr": "**的** de marque l'appartenance, comme « de » mais dans l'ordre inverse : 你的同事 « ta collègue » (litt. « toi-de collègue »). Le possesseur d'abord, la chose ensuite.\n", "en": "**的** de marks possession, like the English 's: 你的同事 \"your colleague\" (lit. \"you-'s colleague\"). The owner first, then the thing.\n", "fr_t": "**的** de marque l'appartenance, comme « de » mais dans l'ordre inverse : 你的同事 « ta collègue » (litt. « toi-de collègue »). Le possesseur d'abord, la chose ensuite.\n", "en_t": "**的** de marks possession, like the English 's: 你的同事 \"your colleague\" (lit. \"you-'s colleague\"). The owner first, then the thing.\n"}, {"n": 7, "line": 5, "topic": "grammar", "fr": "Pas de 是 devant un adjectif : 你累吗？« Tu (es) fatigué ? ». En chinois, l'adjectif fonctionne comme un verbe. Pour le nier, **不** bù devant : 不累 « pas fatigué ».\n", "en": "No 是 before an adjective: 你累吗？\"You tired?\". In Chinese an adjective works like a verb. To negate it, put **不** bù in front: 不累 \"not tired\".\n", "fr_t": "Pas de 是 devant un adjectif : 你累嗎？« Tu (es) fatigué ? ». En chinois, l'adjectif fonctionne comme un verbe. Pour le nier, **不** bù devant : 不累 « pas fatigué ».\n", "en_t": "No 是 before an adjective: 你累嗎？\"You tired?\". In Chinese an adjective works like a verb. To negate it, put **不** bù in front: 不累 \"not tired\".\n"}, {"n": 8, "line": 6, "topic": "pron", "fr": "不 se lit bù, mais **bú** devant un quatrième ton : 不累 bú lèi, 不是 bú shì. Contrairement au 你好 de la note 2, ce changement-là s'écrit dans les leçons.\n", "en": "不 is read bù, but **bú** before a fourth tone: 不累 bú lèi, 不是 bú shì. Unlike 你好 in note 2, this change is written in the lessons.\n", "fr_t": "不 se lit bù, mais **bú** devant un quatrième ton : 不累 bú lèi, 不是 bú shì. Contrairement au 你好 de la note 2, ce changement-là s'écrit dans les leçons.\n", "en_t": "不 is read bù, but **bú** before a fourth tone: 不累 bú lèi, 不是 bú shì. Unlike 你好 in note 2, this change is written in the lessons.\n"}, {"n": 9, "line": 6, "topic": "grammar", "fr": "**很** hěn « très » se met presque toujours devant un adjectif dans une phrase affirmative, et il y perd son sens : 我很好 « je vais bien ». Sans 很, la phrase sonne comme une comparaison inachevée.\n", "en": "**很** hěn \"very\" almost always goes before an adjective in a plain statement, and loses its meaning there: 我很好 \"I'm fine\". Without 很 the sentence sounds like an unfinished comparison.\n", "fr_t": "**很** hěn « très » se met presque toujours devant un adjectif dans une phrase affirmative, et il y perd son sens : 我很好 « je vais bien ». Sans 很, la phrase sonne comme une comparaison inachevée.\n", "en_t": "**很** hěn \"very\" almost always goes before an adjective in a plain statement, and loses its meaning there: 我很好 \"I'm fine\". Without 很 the sentence sounds like an unfinished comparison.\n"}, {"n": 10, "line": 7, "topic": "grammar", "fr": "**们** men fait le pluriel des pronoms : 我 « je », 我们 « nous ». **吧** ba en fin de phrase propose : 我们走吧 « allons-y ». Comparez 吗 (question) et 吧 (suggestion).\n", "en": "**们** men makes pronouns plural: 我 \"I\", 我们 \"we\". **吧** ba at the end makes a suggestion: 我们走吧 \"let's go\". Compare 吗 (question) and 吧 (suggestion).\n", "fr_t": "**們** men fait le pluriel des pronoms : 我 « je », 我們 « nous ». **吧** ba en fin de phrase propose : 我們走吧 « allons-y ». Comparez 嗎 (question) et 吧 (suggestion).\n", "en_t": "**們** men makes pronouns plural: 我 \"I\", 我們 \"we\". **吧** ba at the end makes a suggestion: 我們走吧 \"let's go\". Compare 嗎 (question) and 吧 (suggestion).\n"}], "words": [{"w": "你", "py": "nǐ", "fr": "tu", "en": "you", "t": "你", "lvl": "1"}, {"w": "好", "py": "hǎo", "fr": "bon, bien", "en": "good, well", "t": "好", "lvl": "1"}, {"w": "你好", "py": "nǐ hǎo", "fr": "bonjour", "en": "hello", "t": "你好", "lvl": "1"}, {"w": "是", "py": "shì", "fr": "être ; oui", "en": "to be; yes", "t": "是", "lvl": "1"}, {"w": "吗", "py": "ma", "fr": "(question oui / non)", "en": "(yes / no question)", "t": "嗎", "lvl": "1"}, {"w": "我", "py": "wǒ", "fr": "je, moi", "en": "I, me", "t": "我", "lvl": "1"}, {"w": "的", "py": "de", "fr": "(possession) de", "en": "(possession) 's", "t": "的", "lvl": "1"}, {"w": "同事", "py": "tóngshì", "fr": "collègue", "en": "colleague", "t": "同事", "lvl": "3"}, {"w": "谢谢", "py": "xièxie", "fr": "merci", "en": "thank you", "t": "謝謝", "lvl": "1"}, {"w": "累", "py": "lèi", "fr": "fatigué", "en": "tired", "t": "累", "lvl": "2"}, {"w": "不", "py": "bù", "fr": "ne… pas", "en": "not", "t": "不", "lvl": "1"}, {"w": "很", "py": "hěn", "fr": "très", "en": "very", "t": "很", "lvl": "1"}, {"w": "我们", "py": "wǒmen", "fr": "nous", "en": "we, us", "t": "我們", "lvl": "1"}, {"w": "走", "py": "zǒu", "fr": "partir ; marcher", "en": "to go, leave; to walk", "t": "走", "lvl": "2"}, {"w": "吧", "py": "ba", "fr": "(suggestion) donc", "en": "(suggestion) then", "t": "吧", "lvl": "1"}], "exercise": {"translate": [{"h": "你是王小雨吗？", "py": "Nǐ shì Wáng Xiǎoyǔ ma?", "fr": "Tu es Wang Xiaoyu ?", "en": "Are you Wang Xiaoyu?", "toks": [{"s": "你", "t": "你", "p": "Nǐ", "k": "你"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "王小雨", "t": "王小雨", "p": "Wáng Xiǎoyǔ", "k": "王小雨"}, {"s": "吗", "t": "嗎", "p": "ma", "k": "吗"}, {"s": "？", "t": "？"}]}, {"h": "我不累。", "py": "Wǒ bú lèi.", "fr": "Je ne suis pas fatigué.", "en": "I'm not tired.", "toks": [{"s": "我", "t": "我", "p": "Wǒ", "k": "我"}, {"s": "不", "t": "不", "p": "bú", "k": "不"}, {"s": "累", "t": "累", "p": "lèi", "k": "累"}, {"s": "。", "t": "。"}]}, {"h": "小雨是我的同事。", "py": "Xiǎoyǔ shì wǒ de tóngshì.", "fr": "Xiaoyu est ma collègue.", "en": "Xiaoyu is my colleague.", "toks": [{  "我也很高兴。", "py": "Wǒ yě hěn gāoxìng.", "fr": "Moi aussi.", "en": "Likewise.", "lit_fr": "(Je aussi très content.)", "lit_en": "(I also very glad.)", "who_t": "李老師", "toks": [{"s": "我", "t": "我", "p": "Wǒ", "k": "我"}, {"s": "也", "t": "也", "p": "yě", "k": "也"}, {"s": "很", "t": "很", "p": "hěn", "k": "很"}, {"s": "高兴", "t": "高興", "p": "gāoxìng", "k": "高兴"}, {"s": "。", "t": "。"}]}, {"n": 9, "who": "马克", "h": "她是你的老师吗？", "py": "Tā shì nǐ de lǎoshī ma?", "fr": "C'est ta prof ?", "en": "Is she your teacher?", "who_t": "馬克", "toks": [{"s": "她", "t": "她", "p": "Tā", "k": "她"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "你", "t": "你", "p": "nǐ", "k": "你"}, {"s": "的", "t": "的", "p": "de", "k": "的"}, {"s": "老师", "t": "老師", "p": "lǎoshī", "k": "老师"}, {"s": "吗", "t": "嗎", "p": "ma", "k": "吗"}, {"s": "？", "t": "？"}]}, {"n": 10, "who": "小雨", "h": "是啊，她也是我的老师！", "py": "Shì a, tā yě shì wǒ de lǎoshī!", "fr": "Eh oui, c'est aussi ma prof !", "en": "Yes, she's my teacher too!", "who_t": "小雨", "toks": [{"s": "是", "t": "是", "p": "Shì", "k": "是"}, {"s": "啊", "t": "啊", "p": "a", "k": "啊"}, {"s": "，", "t": "，"}, {"s": "她", "t": "她", "p": "tā", "k": "她"}, {"s": "也", "t": "也", "p": "yě", "k": "也"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "我", "t": "我", "p": "wǒ", "k": "我"}, {"s": "的", "t": "的", "p": "de", "k": "的"}, {"s": "老师", "t": "老師", "p": "lǎoshī", "k": "老师"}, {"s": "！", "t": "！"}]}], "notes": [{"n": 1, "line": 1, "topic": "culture", "fr": "On s'adresse à un professeur par son nom suivi de **老师** lǎoshī : 李老师 « professeur Li », jamais par le prénom. **您** nín est le « vous » de politesse ; entre collègues du même âge, 你 suffit.\n", "en": "A teacher is addressed by surname + **老师** lǎoshī: 李老师 \"Teacher Li\", never by the given name. **您** nín is the polite \"you\"; between colleagues of the same age, 你 is enough.\n", "fr_t": "On s'adresse à un professeur par son nom suivi de **老師** lǎoshī : 李老師 « professeur Li », jamais par le prénom. **您** nín est le « vous » de politesse ; entre collègues du même âge, 你 suffit.\n", "en_t": "A teacher is addressed by surname + **老師** lǎoshī: 李老師 \"Teacher Li\", never by the given name. **您** nín is the polite \"you\"; between colleagues of the same age, 你 is enough.\n"}, {"n": 2, "line": 2, "topic": "writing", "fr": "**他** « il » et **她** « elle » se prononcent tous deux tā. À l'oral rien ne les distingue ; à l'écrit, la partie gauche change : 亻 (personne) pour 他, 女 (femme) pour 她.\n", "en": "**他** \"he\" and **她** \"she\" are both pronounced tā. Speech doesn't tell them apart; in writing the left part differs: 亻 (person) in 他, 女 (woman) in 她.\n", "fr_t": "**他** « il » et **她** « elle » se prononcent tous deux tā. À l'oral rien ne les distingue ; à l'écrit, la partie gauche change : 亻 (personne) pour 他, 女 (femme) pour 她.\n", "en_t": "**他** \"he\" and **她** \"she\" are both pronounced tā. Speech doesn't tell them apart; in writing the left part differs: 亻 (person) in 他, 女 (woman) in 她.\n"}, {"n": 3, "line": 4, "topic": "grammar", "fr": "Le mot interrogatif reste à la place de la réponse : 你叫**什么**名字？ → 我叫**马克**。Pas d'inversion, pas de 吗 : 什么 shénme suffit à faire la question.\n", "en": "The question word stays where the answer goes: 你叫**什么**名字？ → 我叫**马克**。No inversion and no 吗: 什么 shénme is enough to make it a question.\n", "fr_t": "Le mot interrogatif reste à la place de la réponse : 你叫**什麼**名字？ → 我叫**馬克**。Pas d'inversion, pas de 嗎 : 什麼 shénme suffit à faire la question.\n", "en_t": "The question word stays where the answer goes: 你叫**什麼**名字？ → 我叫**馬克**。No inversion and no 嗎: 什麼 shénme is enough to make it a question.\n"}, {"n": 4, "line": 5, "topic": "grammar", "fr": "**呢** ne après un nom ou un pronom renvoie la question : 您呢？« Et vous ? ». Il évite de répéter toute la phrase.\n", "en": "**呢** ne after a noun or pronoun bounces the question back: 您呢？\"And you?\". It saves repeating the whole sentence.\n", "fr_t": "**呢** ne après un nom ou un pronom renvoie la question : 您呢？« Et vous ? ». Il évite de répéter toute la phrase.\n", "en_t": "**呢** ne after a noun or pronoun bounces the question back: 您呢？\"And you?\". It saves repeating the whole sentence.\n"}, {"n": 5, "line": 6, "topic": "vocab", "fr": "**姓** xìng « avoir pour nom de famille » est un verbe : 我姓李。Pour le nom complet ou le prénom, on utilise **叫** jiào « s'appeler » : 我叫王小雨。\n", "en": "**姓** xìng \"to be surnamed\" is a verb: 我姓李。For the full name or the given name, use **叫** jiào \"to be called\": 我叫王小雨。\n", "fr_t": "**姓** xìng « avoir pour nom de famille » est un verbe : 我姓李。Pour le nom complet ou le prénom, on utilise **叫** jiào « s'appeler » : 我叫王小雨。\n", "en_t": "**姓** xìng \"to be surnamed\" is a verb: 我姓李。For the full name or the given name, use **叫** jiào \"to be called\": 我叫王小雨。\n"}, {"n": 6, "line": 7, "topic": "grammar", "fr": "认识您很高兴 « vous connaître, très content » est la formule figée pour « enchanté ». 认识 rènshi = connaître (une personne), avec un ton neutre sur 识.\n", "en": "认识您很高兴 \"knowing you, very glad\" is the set phrase for \"pleased to meet you\". 认识 rènshi = to know (a person), with a neutral tone on 识.\n", "fr_t": "認識您很高興 « vous connaître, très content » est la formule figée pour « enchanté ». 認識 rènshi = connaître (une personne), avec un ton neutre sur 識.\n", "en_t": "認識您很高興 \"knowing you, very glad\" is the set phrase for \"pleased to meet you\". 認識 rènshi = to know (a person), with a neutral tone on 識.\n"}, {"n": 7, "line": 8, "topic": "grammar", "fr": "**也** yě « aussi » se place devant le verbe ou l'adjectif, jamais en fin de phrase : 我也很高兴, 她也是我的老师。\n", "en": "**也** yě \"also\" goes before the verb or adjective, never at the end: 我也很高兴, 她也是我的老师。\n", "fr_t": "**也** yě « aussi » se place devant le verbe ou l'adjectif, jamais en fin de phrase : 我也很高興, 她也是我的老師。\n", "en_t": "**也** yě \"also\" goes before the verb or adjective, never at the end: 我也很高興, 她也是我的老師。\n"}, {"n": 8, "line": 10, "topic": "vocab", "fr": "**啊** a en fin de phrase adoucit ou appuie la réponse : 是啊 « eh ", "fr": "Oh, pas du tout…", "en": "Oh, not really…", "lit_fr": "(Où ça, où ça…)", "lit_en": "(Where, where…)", "who_t": "馬克", "toks": [{"s": "哪里", "t": "哪裏", "p": "Nǎli", "k": "哪里"}, {"s": "，", "t": "，"}, {"s": "哪里", "t": "哪裏", "p": "nǎli", "k": "哪里"}, {"s": "……", "t": "……"}]}], "notes": [{"n": 1, "line": 1, "topic": "grammar", "fr": "哪国人 « personne de quel pays » : **哪** nǎ « quel » + **国** guó « pays » + **人** rén « personne ». Comme 什么 (L2 n.3), 哪 reste à la place de la réponse : 你是**哪国**人？ → 我是**法国**人。\n", "en": "哪国人 \"person of which country\": **哪** nǎ \"which\" + **国** guó \"country\" + **人** rén \"person\". Like 什么 (L2 n.3), 哪 stays where the answer goes: 你是**哪国**人？ → 我是**法国**人。\n", "fr_t": "哪國人 « personne de quel pays » : **哪** nǎ « quel » + **國** guó « pays » + **人** rén « personne ». Comme 什麼 (L2 n.3), 哪 reste à la place de la réponse : 你是**哪國**人？ → 我是**法國**人。\n", "en_t": "哪國人 \"person of which country\": **哪** nǎ \"which\" + **國** guó \"country\" + **人** rén \"person\". Like 什麼 (L2 n.3), 哪 stays where the answer goes: 你是**哪國**人？ → 我是**法國**人。\n"}, {"n": 2, "line": 2, "topic": "vocab", "fr": "Nationalité = pays + 人 : 法国人 « Français », 中国人 « Chinois ». Même chose pour une ville : 巴黎人 « Parisien », 北京人 « Pékinois ». Un seul mot pour le nom et l'adjectif, et ni genre ni nombre.\n", "en": "Nationality = country + 人: 法国人 \"French person\", 中国人 \"Chinese person\". Same with a city: 巴黎人 \"Parisian\", 北京人 \"Beijinger\". No gender, no plural.\n", "fr_t": "Nationalité = pays + 人 : 法國人 « Français », 中國人 « Chinois ». Même chose pour une ville : 巴黎人 « Parisien », 北京人 « Pékinois ». Un seul mot pour le nom et l'adjectif, et ni genre ni nombre.\n", "en_t": "Nationality = country + 人: 法國人 \"French person\", 中國人 \"Chinese person\". Same with a city: 巴黎人 \"Parisian\", 北京人 \"Beijinger\". No gender, no plural.\n"}, {"n": 3, "line": 3, "topic": "vocab", "fr": "Les noms étrangers sont transcrits par le son : 巴黎 Bālí (Paris), 里昂 Lǐ'áng (Lyon), 马克 Mǎkè (Marc). L'apostrophe de Lǐ'áng sépare deux syllabes, pour ne pas lire « li-ang » en une.\n", "en": "Foreign names are spelled by sound: 巴黎 Bālí (Paris), 里昂 Lǐ'áng (Lyon), 马克 Mǎkè (Marc). The apostrophe in Lǐ'áng splits two syllables, so it isn't read as one.\n", "fr_t": "Les noms étrangers sont transcrits par le son : 巴黎 Bālí (Paris), 里昂 Lǐ'áng (Lyon), 馬克 Mǎkè (Marc). L'apostrophe de Lǐ'áng sépare deux syllabes, pour ne pas lire « li-ang » en une.\n", "en_t": "Foreign names are spelled by sound: 巴黎 Bālí (Paris), 里昂 Lǐ'áng (Lyon), 馬克 Mǎkè (Marc). The apostrophe in Lǐ'áng splits two syllables, so it isn't read as one.\n"}, {"n": 4, "line": 4, "topic": "grammar", "fr": "Pour répondre « non » à une question en 是…吗, on nie le verbe : 不是 bú shì « (ce n'est) pas ». Le chinois n'a pas de vrai « oui » ni de vrai « non » : on reprend le verbe (L1 n.4, L1 n.8).\n", "en": "To answer \"no\" to a 是…吗 question, negate the verb: 不是 bú shì \"(it) is not\". Chinese has no all-purpose yes or no: you repeat the verb (L1 n.4, L1 n.8).\n", "fr_t": "Pour répondre « non » à une question en 是…嗎, on nie le verbe : 不是 bú shì « (ce n'est) pas ». Le chinois n'a pas de vrai « oui » ni de vrai « non » : on reprend le verbe (L1 n.4, L1 n.8).\n", "en_t": "To answer \"no\" to a 是…嗎 question, negate the verb: 不是 bú shì \"(it) is not\". Chinese has no all-purpose yes or no: you repeat the verb (L1 n.4, L1 n.8).\n"}, {"n": 5, "line": 5, "topic": "grammar", "fr": "**你们** nǐmen « vous » (pluriel), avec le 们 de 我们 (L1 n.10). Le « vous » de politesse, lui, est 您 (L2 n.1), qui ne prend pas 们 à l'oral.\n", "en": "**你们** nǐmen \"you\" (plural), with the 们 of 我们 (L1 n.10). The polite singular \"you\" is 您 (L2 n.1), which doesn't take 们 in speech.\n", "fr_t": "**你們** nǐmen « vous » (pluriel), avec le 們 de 我們 (L1 n.10). Le « vous » de politesse, lui, est 您 (L2 n.1), qui ne prend pas 們 à l'oral.\n", "en_t": "**你們** nǐmen \"you\" (plural), with the 們 of 我們 (L1 n.10). The polite singular \"you\" is 您 (L2 n.1), which doesn't take 們 in speech.\n"}, {"n": 6, "line": 7, "topic": "grammar", "fr": "Un nom placé devant un autre le qualifie, sans 的 : 中国朋友 « ami(s) chinois », 法国朋友 « ami français ». Le 的 de possession (L1 n.6) reste devant le tout : 我的中国朋友 « mes amis chinois ».\n", "en": "A noun in front of another describes it, with no 的: 中国朋友 \"Chinese friend(s)\", 法国朋友 \"French friend\". The possessive 的 (L1 n.6) goes before the whole: 我的中国朋友 \"my Chinese friends\".\n", "fr_t": "Un nom placé devant un autre le qualifie, sans 的 : 中國朋友 « ami(s) chinois », 法國朋友 « ami français ». Le 的 de possession (L1 n.6) reste devant le tout : 我的中國朋友 « mes amis chinois ».\n", "en_t": "A noun in front of another describes it, with no 的: 中國朋友 \"Chinese friend(s)\", 法國朋友 \"French friend\". The possessive 的 (L1 n.6) goes before the whole: 我的中國朋友 \"my Chinese friends\".\n"}, {"n": 7, "line": 8, "topic": "vocab", "fr": "**对** duì « juste, c'est ça » : la façon la plus courante d'approuver ce qu'on vient de dire.\n", "en": "**对** duì \"right, correct\": the usual way to agree with what was just said.\n", "fr_t": "**對** duì « juste, c'est ça » : la façon la plus courante d'approuver ce qu'on vient de dire.\n", "en_t": "**對** duì \"right, correct\": the usual way to agree with what was just said.\n"}, {"n": 8, "line": 9, "topic": "vocab", "fr": "**汉语** Hànyǔ « la langue chinoise » (litt. « langue des Han », l'ethnie majoritaire). On dit aussi 中文 Zhōngwén, plutôt pour l'écrit.\n", "en": "**汉语** Hànyǔ \"the Chinese language\" (lit. \"language of the Han\", the majority people). 中文 Zhōngwén is also used, more for the written language.\n", "fr_t": "**漢語** Hànyǔ « la langue chinoise » (litt. « langue des Han », l'ethnie majoritaire). On dit aussi 中文 Zhōngwén, plutôt pour l'écrit.\n", "en_t": "**漢語** Hànyǔ \"the Chinese language\" (lit. \"language of the Han\", the majority people). 中文 Zhōngwén is also used, more for the written language.\n"}, {"n": 9, "line": 10, "topic": "culture", "fr": "**哪里，哪里** « où ça, où ça » : on refuse un compliment, comme si on ne voyait pas où est la qualité. Dire « merci » sonne un peu prétentieux pour certains, même si les jeunes le font de plus en plus.\n", "en": "**哪里，哪里** \"where, where\": you turn down a compliment, as if you couldn't see where the merit is. Saying \"thank you\" sounds a bit vain to some, though young people do it more and more.\n", "fr_t": "**哪裏，哪裏** « où ça, où ça » : on refuse un compliment, comme si on ne voyait pas où est la qualité. Dire « merci » sonne un peu prétentieux pour certains, même si les jeunes le font de plus en plus.\n", "en_t": "**哪裏，哪裏** \"where, where\": you turn down a compliment, as if you couldn't see where the merit is. Saying \"thank you\" sounds a bit vain to some, though young people do it more and more.\n"}], "words": [{"w": "哪", "py": "nǎ", "fr": "quel", "en": "which", "t": "哪", "lvl": "1"}, {"w": "国", "py": "guó", "fr": "pays", "en": "country", "t": "國", "lvl": "1"}, {"w": "人", "py": "rén", "fr": "personne", "en": "person, people", "t": "人", "lvl": "1"}, {"w": "法国", "py": "Fǎguó", "fr": "France", "en": "France", "t": "法國", "lvl": null}, {"w": "你们", "py": "nǐmen", "fr": "vous (pluriel)", "en": "you (plural)", "t": "你們", "lvl": "1"}, {"w": "中国", "py": "Zhōngguó", "fr": "Chine", "en": "China", "t": "中國", "lvl": "1"}, {"w": "朋友", "py": "péngyou", "fr": "ami", "en": "friend", "t": "朋友", "lvl": "1"}, {"w": "对", "py": "duì", "fr": "juste, c'est ça", "en": "right, correct", "t": "對", "lvl": "1"}, {"w": "汉语", "py": "Hànyǔ", "fr": "chinois (la langue)", "en": "Chinese (the language)", "t": "漢語", "lvl": "1"}, {"w": "哪里", "py": "nǎli", "fr": "où ; (modestie) pas du tout", "en": "where; (modest) not at all", "t": "哪裏", "lvl": "1"}], "exercise": {"translate": [{"h": "他是哪国人？", "py": "Tā shì nǎ guó rén?", "fr": "Il est de quel pays ?", "en": "Where is he from?", "toks": [{"s": "他", "t": "他", "p": "Tā", "k": "他"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "哪", "t": "哪", "p": "nǎ", "k": "哪"}, {"s": "国", "t": "國", "p": "guó", "k": y?", "lit_fr": "(Marc, ta famille avoir combien [unité] personnes ?)", "lit_en": "(Marc, your family have how-many [unit] people?)", "who_t": "小雨", "toks": [{"s": "马克", "t": "馬克", "p": "Mǎkè", "k": "马克"}, {"s": "，", "t": "，"}, {"s": "你", "t": "你", "p": "nǐ", "k": "你"}, {"s": "家", "t": "家", "p": "jiā", "k": "家"}, {"s": "有", "t": "有", "p": "yǒu", "k": "有"}, {"s": "几", "t": "幾", "p": "jǐ", "k": "几"}, {"s": "个", "t": "個", "p": "ge", "k": "个"}, {"s": "人", "t": "人", "p": "rén", "k": "人"}, {"s": "？", "t": "？"}]}, {"n": 2, "who": "马克", "h": "我家有五个人：爸爸、妈妈、两个妹妹和我。", "py": "Wǒ jiā yǒu wǔ ge rén：bàba、māma、liǎng ge mèimei hé wǒ.", "fr": "Nous sommes cinq : mon père, ma mère, mes deux petites sœurs et moi.", "en": "There are five of us: my dad, my mum, my two younger sisters and me.", "who_t": "馬克", "toks": [{"s": "我", "t": "我", "p": "Wǒ", "k": "我"}, {"s": "家", "t": "家", "p": "jiā", "k": "家"}, {"s": "有", "t": "有", "p": "yǒu", "k": "有"}, {"s": "五", "t": "五", "p": "wǔ", "k": "五"}, {"s": "个", "t": "個", "p": "ge", "k": "个"}, {"s": "人", "t": "人", "p": "rén", "k": "人"}, {"s": "：", "t": "："}, {"s": "爸爸", "t": "爸爸", "p": "bàba", "k": "爸爸"}, {"s": "、", "t": "、"}, {"s": "妈妈", "t": "媽媽", "p": "māma", "k": "妈妈"}, {"s": "、", "t": "、"}, {"s": "两", "t": "兩", "p": "liǎng", "k": "两"}, {"s": "个", "t": "個", "p": "ge", "k": "个"}, {"s": "妹妹", "t": "妹妹", "p": "mèimei", "k": "妹妹"}, {"s": "和", "t": "和", "p": "hé", "k": "和"}, {"s": "我", "t": "我", "p": "wǒ", "k": "我"}, {"s": "。", "t": "。"}]}, {"n": 3, "who": "马克", "h": "你看！", "py": "Nǐ kàn!", "fr": "Regarde !", "en": "Look!", "who_t": "馬克", "toks": [{"s": "你", "t": "你", "p": "Nǐ", "k": "你"}, {"s": "看", "t": "看", "p": "kàn", "k": "看"}, {"s": "！", "t": "！"}]}, {"n": 4, "who": "小雨", "h": "你妹妹很漂亮！你有哥哥吗？", "py": "Nǐ mèimei hěn piàoliang! Nǐ yǒu gēge ma?", "fr": "Tes sœurs sont très jolies ! Tu as un grand frère ?", "en": "Your sisters are very pretty! Do you have an older brother?", "who_t": "小雨", "toks": [{"s": "你", "t": "你", "p": "Nǐ", "k": "你"}, {"s": "妹妹", "t": "妹妹", "p": "mèimei", "k": "妹妹"}, {"s": "很", "t": "很", "p": "hěn", "k": "很"}, {"s": "漂亮", "t": "漂亮", "p": "piàoliang", "k": "漂亮"}, {"s": "！", "t": "！"}, {"s": "你", "t": "你", "p": "Nǐ", "k": "你"}, {"s": "有", "t": "有", "p": "yǒu", "k": "有"}, {"s": "哥哥", "t": "哥哥", "p": "gēge", "k": "哥哥"}, {"s": "吗", "t": "嗎", "p": "ma", "k": "吗"}, {"s": "？", "t": "？"}]}, {"n": 5, "who": "马克", "h": "没有。你呢？你有哥哥姐姐吗？", "py": "Méiyǒu. Nǐ ne? Nǐ yǒu gēge jiějie ma?", "fr": "Non. Et toi ? Tu as des grands frères, des grandes sœurs ?", "en": "No. And you? Do you have older brothers or sisters?", "who_t": "馬克", "toks": [{"s": "没有", "t": "沒有", "p": "Méiyǒu", "k": "没有"}, {"s": "。", "t": "。"}, {"s": "你", "t": "你", "p": "Nǐ", "k": "你"}, {"s": "呢", "t": "呢", "p": "ne", "k": "呢"}, {"s": "？", "t": "？"}, {"s": "你", "t": "你", "p": "Nǐ", "k": "你"}, {"s": "有", "t": "有", "p": "yǒu", "k": "有"}, {"s": "哥哥", "t": "哥哥", "p": "gēge", "k": "哥哥"}, {"s": "姐姐", "t": "姐姐", "p": "jiějie", "k": "姐姐"}, {"s": "吗", "t": "嗎", "p": "ma", "k": "吗"}, {"s": "？", "t": "？"}]}, {"n": 6, "who": "小雨", "h": "我没有哥哥，也没有姐姐。我有一个弟弟。", "py": "Wǒ méiyǒu gēge, yě méiyǒu jiějie. Wǒ yǒu yí ge dìdi.", "fr": "Je n'ai ni grand frère ni grande sœur. J'ai un petit frère.", "en": "I have no older brother and no older sister. I have a younger brother.", "who_t": "小雨", "toks": [{"s": "我", "t": "我", "p": "Wǒ", "k": "我"}, {"s": "没有", "t": "沒有", "p": "méiyǒu", "k": "没有"}, {"s": "哥哥", "t": "哥哥", "p": "gēge", "k": "哥哥"}, {"s": "，", "t": "，"}, {"s": "也", "t": "也", "p": "yě", "k": "也"}, {"s": "没有", "t": "沒有", "p": "méiyǒu", "k": "没有"}, {"s": "姐姐", "t": "姐姐", "p": "jiějie", "k": "姐姐"}, {"s": "。", "t": "。"}, {"s": "我", "t": "我", "p": "Wǒ", "k": "我"}, {"s": "有", "t": "有", "p": "yǒu", "k": "有"}, {"s": "一", "t": "一", "p": "yí", "k": "一"}, {"s": "个", "t": "個", "p": "ge", "k": "个"}, {"s": "弟弟", "t": "弟弟", "p": "dìdi", "k": "弟弟"}, {"s": "。", "t": "。"}]}, {"n": 7, "who": "小雨", "h": "他是大学生。", "py": "Tā shì dàxuéshēng.", "fr": "Il est étudiant.", "en": "He's at university.", "who_t": "小雨", "toks": [{"s": "他", "t": "他", "p": "Tā", "k": "他"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "大学生", "t": "大學生", "p": "dàxuéshēng", "k": "大学生"}, {"s": "。", "t": "。"}]}, {"n": 8, "who": "马克", "h": "你爸爸妈妈是老师吗？", "py": "Nǐ bàba māma shì lǎoshī ma?", "fr": "Tes parents sont professeurs ?", "en": "Are your parents teachers?", "who_t": "馬克", "toks": [{"s": "你", "t": "你", "p": "Nǐ", "k": "你"}, {"s": "爸爸", "t": "爸爸", "p": "bàba", "k": "爸爸"}, {"s": "妈妈", "t": "媽媽", "p": "māma", "k": "妈妈"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "老师", "t": "老師", "p": "lǎoshī", "k": "老师"}, {"s": "吗", "t": "嗎", "p": "ma", "k": "吗"}, {"s": "？", "t": "？"}]}, {"n": 9, "who": "小雨", "h": "我妈妈是老师，我爸爸是医生。", "py": "Wǒ māma shì lǎoshī, wǒ bàba shì yīshēng.", "fr": "Ma mère est professeur, mon père est médecin.", "en": "My mum is a teacher, my dad is a doctor.", "who_t": "小雨", "toks": [{"s": "我", "t": "我", "p": "Wǒ", "k": "我"}, {"s": "妈妈", "t": "媽媽", "p": "māma", "k": "妈妈"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "老师", "t": "老師", "p": "lǎoshī", "k": "老师"}, {"s": "，", "t": "，"}, {"s": "我", "t": "我", "p": "wǒ", "k": "我"}, {"s": "爸爸", "t": "爸爸", "p": "bàba", "k": "爸爸"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "医生", "t": "醫生", "p": "yīshēng", "k": "医生"}, {"s": "。", "t": "。"}]}, {"n": 10, "who": "马克", "h": "我爸爸也是医生！", "py": "Wǒ bàba yě shì yīshēng!", "fr": "Mon père aussi est médecin !", "en": "My dad's a doctor too!", "who_t": "馬克", "toks": [{"s": "我", "t": "我", "p": "Wǒ", "k": "我"}, {"s": "爸爸", "t": "爸爸", "p": "bàba", "k": "爸爸"}, {"s": "也", "t": "也", "p": "yě", "k": "也"}, {"s": "是", "t": "是", "p": "shì", "k": "是"}, {"s": "医生", "t": "醫生", "p": "yīshēng", "k": "医生"}, {"s": "！", "t": "！"}]}], "notes": [{"n": 1, "line": 1, "topic": "grammar", "fr": "Entre un nombre et un nom, il faut un **classificateur** (量词 liàngcí). Le plus courant est **个** ge : 几个人 « combien de personnes », 五个人 « cinq personnes ». Jamais 五人 à l'oral courant.\n", "en": "Between a number and a noun you need a **measure word** (量词 liàngcí). The most common is **个** ge: 几个人 \"how many people\", 五个人 \"five people\". Never just 五人 in ordinary speech.\n", "fr_t": "Entre un nombre et un nom, il faut un **classificateur** (量詞 liàngcí). Le plus courant est **個** ge : 幾個人 « combien de personnes », 五個人 « cinq personnes ». Jamais 五人 à l'oral courant.\n", "en_t": "Between a number and a noun you need a **measure word** (量詞 liàngcí). The most common is **個** ge: 幾個人 \"how many people\", 五個人 \"five people\". Never just 五人 in ordinary speech.\n"}, {"n": 2, "line": 1, "topic": "grammar", "fr": "**几** jǐ « combien » attend une petite réponse (moins de dix, en gros) et prend toujours un classificateur : 几个人。Pour un grand nombre, on verra 多少 (leçon 9).\n", "en": "**几** jǐ \"how many\" expects a small answer (under ten or so) and always takes a measure word: 几个人。For a big number, 多少 comes in lesson 9.\n", "fr_t": "**幾** jǐ « combien » attend une petite réponse (moins de dix, en gros) et prend toujours un classificateur : 幾個人。Pour un grand nombre, on verra 多少 (leçon 9).\n", "en_t": "**幾** jǐ \"how many\" expects a small answer (under ten or so) and always takes a measure word: 幾個人。For a big number, 多少 comes in lesson 9.\n"}, {"n": 3, "line": 1, "topic": "grammar", "fr": "Avec la famille, le 的 de possession (L1 n.6) tombe : 你家 « ta famille », 你妹妹 « ta sœur », 我爸爸 « mon père ». 家 jiā veut dire « maison » et « famille ».\n", "en": "With family, the possessive 的 (L1 n.6) drops: 你家 \"your family\", 你妹妹 \"your sister\", 我爸爸 \"my dad\". 家 jiā means both \"home\" and \"family\".\n", "fr_t": "Avec la famille, le 的 de possession (L1 n.6) tombe : 你家 « ta famille », 你妹妹 « ta sœur », 我爸爸 « mon père ». 家 jiā veut dire « maison » et « famille ».\n", "en_t": "With family, the possessive 的 (L1 n.6) drops: 你家 \"your family\", 你妹妹 \"your sister\", 我爸爸 \"my dad\". 家 jiā means both \"home\" and \"family\".\n"}, {"n": 4, "line": 2, "topic": "grammar", "fr": "**两** liǎng « deux » devant un classificateur : 两个妹妹. Pour compter (un, deux, trois) ou dans un nombre (十二), on dit 二 èr. **和** hé « et » relie des noms, jamais des phrases.\n", "en": "**两** liǎng \"two\" before a measure word: 两个妹妹. When counting (one, two, three) or inside a number (十二), say 二 èr. **和** hé \"and\" joins nouns, never sentences.\n", "fr_t": "**兩** liǎng « deux » devant un classificateur : 兩個妹妹. Pour compter (un, deux, trois) ou dans un nombre (十二), on dit 二 èr. **和** hé « et » relie des noms, jamais des phrases.\n", "en_t": "**兩** liǎng \"two\" before a measure word: 兩個妹妹. When counting (one, two, three) or inside a number (十二), say 二 èr. **和** hé \"and\" joins nouns, never sentences.\n"}, {"n": 5, "line": 2, "topic": "culture", "fr": "Le chinois distingue aîné et cadet : 哥哥 gēge « grand frère », 姐姐 jiějie « grande sœur », 弟弟 dìdi « petit frère », 妹妹 mèimei « petite sœur ». Il n'y a pas de mot courant pour « frère » tout court.\n", "en": "Chinese tells older from younger: 哥哥 gēge \"older brother\", 姐姐 jiějie \"older sister\", 弟弟 dìdi \"younger brother\", 妹妹 mèimei \"younger sister\". There's no everyday word for just \"brother\".\n", "fr_t": "Le chinois distingue aîné et cadet : 哥哥 gēge « grand frère », 姐姐 jiějie « grande sœur », 弟弟 dìdi « petit frère », 妹妹 mèimei « petite sœur ». Il n'y a pas de mot courant pour « frère » tout court.\n", "en_t": "Chinese tells older from younger: 哥哥 gēge \"older brother\", 姐姐 jiějie \"older sister\", 弟弟 dìdi \"younger brother\", 妹妹 mèimei \"younger sister\". There's no everyday word for just \"brother\".\n"}, {"n": 6, "line": 5, "topic": "grammar", "fr": "**有** yǒu « avoir » se nie avec **没** méi, jamais avec 不 : 没有 « ne pas avoir ». Comme pour 是 (L3 n.4), on répond en reprenant le verbe : 有 « oui », 没有 « non ».\n", "en": "**有** yǒu \"to have\" is negated with **没** méi, never with 不: 没有 \"not have\". As with 是 (L3 n.4), you answer with the verb: 有 \"yes\", 没有 \"no\".\n", "fr_t": "**有** yǒu « avoir » se nie avec **沒** méi, jamais avec 不 : 沒有 « ne pas avoir ». Comme pour 是 (L3 n.4), on répond en reprenant le verbe : 有 « oui », 沒有 « non ».\n", "en_t": "**有** yǒu \"to have\" is negated with **沒** méi, never with 不: 沒有 \"not have\". As with 是 (L3 n.4), you answer with the verb: 有 \"yes\", 沒有 \"no\".\n"}, {"n": 7, "line": 6, "topic": "pron", "fr": "一 yī change de ton comme 不 (L1 n.8) : **yí** devant un quatrième ton, **yì** devant les autres, et yī seul ou dans un nombre. 一个 se dit yí ge, car 个 est à l'origine un quatrième ton (gè).\n", "en": "一 yī changes tone like 不 (L1 n.8): **yí** before a fourth tone, **yì** before the others, and yī on its own or inside a number. 一个 is said yí ge, since 个 is a fourth tone at heart (gè).\n", "fr_t": "一 yī change de ton comme 不 (L1 n.8) : **yí** devant un quatrième ton, **yì** devant les autres, et yī seul ou dans un nombre. 一個 se dit yí ge, car 個 est à l'origine un quatrième ton (gè).\n", "en_t": "一 yī changes tone like 不 (L1 n.8): **yí** before a fourth tone, **yì** before the others, and yī on its own or inside a number. 一個 is said yí ge, since 個 is a fourth tone at heart (gè).\n"}, {"n": 8, "line": 7, "topic": "vocab", "fr": "大学生 dàxuéshēng « étudiant d'université » : 大学 « université » (litt. « grande étude ») + 生 « élève ».\n", "en": "大学生 dàxuéshēng \"university student\": 大学 \"university\" (lit. \"great learning\") + 生 \"pupil\".\n", "fr_t": "大學生 dàxuéshēng « étudiant d'université » : 大學 « université » (litt. « grande étude ») + 生 « élève ».\n", "en_t": "大學生 dàxuéshēng \"university student\": 大學 \"university\" (lit. \"great learning\") + 生 \"pupil\".\n"}, {"n": 9, "line": 9, "topic": "grammar", "fr": "Pas d'article ni d'« un » devant un métier : 我爸爸是医生 « mon père est médecin ». Les noms n'ont pas de pluriel non plus : 老师 = « professeur » ou « professeurs ».\n", "en": "No article before a job: 我爸爸是医生 \"my dad is a doctor\". Nouns have no plural either: 老师 = \"teacher\" or \"teachers\".\n", "fr_t": "Pas d'article ni d'« un » devant un métier : 我爸爸是醫生 « mon  "en": "Xiaoyu, how old are you?", "who_t": "馬克", "toks": [{"s": "小雨", "t": "小雨", "p": "Xiǎoyǔ", "k": "小雨"}, {"s": "，", "t": "，"}, {"s": "你", "t": "你", "p": "nǐ", "k": "你"}, {"s": "多", "t": "多", "p": "duō", "k": "多"}, {"s": "大", "t": "大", "p": "dà", "k": "大"}, {"s": "？", "t": "？"}]}, {"n": 11, "who": "小雨", "h": "你猜！", "py": "Nǐ cāi!", "fr": "Devine !", "en": "Guess!", "who_t": "小雨", "toks": [{"s": "你", "t": "你", "p": "Nǐ", "k": "你"}, {"s": "猜", "t": "猜", "p": "cāi", "k": "猜"}, {"s": "！", "t": "！"}]}, {"n": 12, "who": "马克", "h": "二十二？", "py": "Èrshí'èr?", "fr": "Vingt-deux ?", "en": "Twenty-two?", "who_t": "馬克", "toks": [{"s": "二", "t": "二", "p": "Èr", "k": "二"}, {"s": "十", "t": "十", "p": "shí", "k": "十"}, {"s": "二", "t": "二", "p": "èr", "k": "二"}, {"s": "？", "t": "？"}]}, {"n": 13, "who": "小雨", "h": "谢谢！我二十九岁。", "py": "Xièxie! Wǒ èrshíjiǔ suì.", "fr": "Merci ! J'ai vingt-neuf ans.", "en": "Thank you! I'm twenty-nine.", "who_t": "小雨", "toks": [{"s": "谢谢", "t": "謝謝", "p": "Xièxie", "k": "谢谢"}, {"s": "！", "t": "！"}, {"s": "我", "t": "我", "p": "Wǒ", "k": "我"}, {"s": "二", "t": "二", "p": "èr", "k": "二"}, {"s": "十", "t": "十", "p": "shí", "k": "十"}, {"s": "九", "t": "九", "p": "jiǔ", "k": "九"}, {"s": "岁", "t": "歲", "p": "suì", "k": "岁"}, {"s": "。", "t": "。"}]}], "notes": [{"n": 1, "line": 1, "topic": "grammar", "fr": "**多大** duō dà « combien grand » demande l'âge d'un adulte ou d'un jeune. Pour un petit enfant, on dit **几岁** jǐ suì (ligne 6), puisque 几 attend un petit nombre (L4 n.2). À une personne âgée, on demande 多大年纪 avec respect.\n", "en": "**多大** duō dà \"how big\" asks the age of an adult or a young person. For a small child, say **几岁** jǐ suì (line 6), since 几 expects a small number (L4 n.2). An elderly person is asked 多大年纪, politely.\n", "fr_t": "**多大** duō dà « combien grand » demande l'âge d'un adulte ou d'un jeune. Pour un petit enfant, on dit **幾歲** jǐ suì (ligne 6), puisque 幾 attend un petit nombre (L4 n.2). À une personne âgée, on demande 多大年紀 avec respect.\n", "en_t": "**多大** duō dà \"how big\" asks the age of an adult or a young person. For a small child, say **幾歲** jǐ suì (line 6), since 幾 expects a small number (L4 n.2). An elderly person is asked 多大年紀, politely.\n"}, {"n": 2, "line": 1, "topic": "grammar", "fr": "Les mots de temps se placent **devant le verbe** (ou en tête de phrase), jamais à la fin : 我今年二十五岁 « je, cette année, (ai) vingt-cinq ans ». 今年 jīnnián = « cette année ».\n", "en": "Time words go **before the verb** (or at the start), never at the end: 我今年二十五岁 \"I, this year, (am) twenty-five\". 今年 jīnnián = \"this year\".\n", "fr_t": "Les mots de temps se placent **devant le verbe** (ou en tête de phrase), jamais à la fin : 我今年二十五歲 « je, cette année, (ai) vingt-cinq ans ». 今年 jīnnián = « cette année ».\n", "en_t": "Time words go **before the verb** (or at the start), never at the end: 我今年二十五歲 \"I, this year, (am) twenty-five\". 今年 jīnnián = \"this year\".\n"}, {"n": 3, "line": 2, "topic": "grammar", "fr": "Les nombres se construisent comme ils se lisent : 十 « dix », 十二 « dix-deux » = 12, 二十 « deux-dix » = 20, 二十五 = 25, 九十九 = 99. Pas de mot spécial pour 70 ou 80 : 七十, 八十.\n", "en": "Numbers are built as they read: 十 \"ten\", 十二 \"ten-two\" = 12, 二十 \"two-ten\" = 20, 二十五 = 25, 九十九 = 99.\n", "fr_t": "Les nombres se construisent comme ils se lisent : 十 « dix », 十二 « dix-deux » = 12, 二十 « deux-dix » = 20, 二十五 = 25, 九十九 = 99. Pas de mot spécial pour 70 ou 80 : 七十, 八十.\n", "en_t": "Numbers are built as they read: 十 \"ten\", 十二 \"ten-two\" = 12, 二十 \"two-ten\" = 20, 二十五 = 25, 九十九 = 99.\n"}, {"n": 4, "line": 2, "topic": "grammar", "fr": "L'âge se dit sans verbe : 我二十五岁 « je vingt-cinq ans ». Comme l'adjectif (L1 n.7), le nombre + 岁 fonctionne seul. 岁 suì = « an (d'âge) ».\n", "en": "Age needs no verb: 我二十五岁 \"I twenty-five years\". Like an adjective (L1 n.7), number + 岁 stands on its own. 岁 suì = \"year (of age)\".\n", "fr_t": "L'âge se dit sans verbe : 我二十五歲 « je vingt-cinq ans ». Comme l'adjectif (L1 n.7), le nombre + 歲 fonctionne seul. 歲 suì = « an (d'âge) ».\n", "en_t": "Age needs no verb: 我二十五歲 \"I twenty-five years\". Like an adjective (L1 n.7), number + 歲 stands on its own. 歲 suì = \"year (of age)\".\n"}, {"n": 5, "line": 5, "topic": "pron", "fr": "L'apostrophe de nǚ'ér (comme Lǐ'áng, L3 n.3) marque le début d'une syllabe qui commence par a, o ou e. Le ü de nǚ garde ses deux points après n et l.\n", "en": "The apostrophe in nǚ'ér (like Lǐ'áng, L3 n.3) marks a new syllable starting with a, o or e. The ü in nǚ keeps its dots after n and l.\n", "fr_t": "L'apostrophe de nǚ'ér (comme Lǐ'áng, L3 n.3) marque le début d'une syllabe qui commence par a, o ou e. Le ü de nǚ garde ses deux points après n et l.\n", "en_t": "The apostrophe in nǚ'ér (like Lǐ'áng, L3 n.3) marks a new syllable starting with a, o or e. The ü in nǚ keeps its dots after n and l.\n"}, {"n": 6, "line": 9, "topic": "grammar", "fr": "**知道** zhīdào « savoir (un fait) », à distinguer de 认识 « connaître (une personne) » (L2 n.6). Ici 不 garde son ton bù, car 知 est un premier ton.\n", "en": "**知道** zhīdào \"to know (a fact)\", unlike 认识 \"to know (a person)\" (L2 n.6). 不 keeps its bù tone here, since 知 is a first tone.\n", "fr_t": "**知道** zhīdào « savoir (un fait) », à distinguer de 認識 « connaître (une personne) » (L2 n.6). Ici 不 garde son ton bù, car 知 est un premier ton.\n", "en_t": "**知道** zhīdào \"to know (a fact)\", unlike 認識 \"to know (a person)\" (L2 n.6). 不 keeps its bù tone here, since 知 is a first tone.\n"}, {"n": 7, "line": 9, "topic": "grammar", "fr": "Encore **吧** (L1 n.10) : 你问她吧 « demande-lui donc ». Avec 你, il adoucit un conseil ou un ordre.\n", "en": "**吧** again (L1 n.10): 你问她吧 \"go on, ask her\". With 你, it softens advice or an order.\n", "fr_t": "Encore **吧** (L1 n.10) : 你問她吧 « demande-lui donc ». Avec 你, il adoucit un conseil ou un ordre.\n", "en_t": "**吧** again (L1 n.10): 你問她吧 \"go on, ask her\". With 你, it softens advice or an order.\n"}, {"n": 8, "line": 11, "topic": "culture", "fr": "Demander  ceci, ici » et **那** nà « cela, là-bas » : 这是你的房间 « ceci est ta chambre ». Pas besoin de nom après 这 / 那 devant 是.\n", "en": "**这** zhè \"this\" and **那** nà \"that\": 这是你的房间 \"this is your room\". No noun is needed after 这 / 那 in front of 是.\n", "fr_t": "**這** zhè « ceci, ici » et **那** nà « cela, là-bas » : 這是你的房間 « ceci est ta chambre ». Pas besoin de nom après 這 / 那 devant 是.\n", "en_t": "**這** zhè \"this\" and **那** nà \"that\": 這是你的房間 \"this is your room\". No noun is needed after 這 / 那 in front of 是.\n"}, {"n": 2, "line": 4, "topic": "grammar", "fr": "**都** dōu « tous, tout » se place devant le verbe et reprend ce qui précède : 这些东西都是新的 « ces choses sont toutes neuves ». Jamais devant le nom comme le « tous » français.\n", "en": "**都** dōu \"all\" goes before the verb and points back to what came before: 这些东西都是新的 \"these things are all new\". Never in front of the noun, as \"all\" is in English.\n", "fr_t": "**都** dōu « tous, tout » se place devant le verbe et reprend ce qui précède : 這些東西都是新的 « ces choses sont toutes neuves ». Jamais devant le nom comme le « tous » français.\n", "en_t": "**都** dōu \"all\" goes before the verb and points back to what came before: 這些東西都是新的 \"these things are all new\". Never in front of the noun, as \"all\" is in English.\n"}, {"n": 3, "line": 4, "topic": "grammar", "fr": "**这些** zhèxiē « ces… (ci) », **那些** nàxiē « ces… (là) » : le pluriel de 这 et 那. 东西 dōngxi « chose, affaire », litt. « est-ouest ».\n", "en": "**这些** zhèxiē \"these\", **那些** nàxiē \"those\": the plurals of 这 and 那. 东西 dōngxi \"thing, stuff\", lit. \"east-west\".\n", "fr_t": "**這些** zhèxiē « ces… (ci) », **那些** nàxiē « ces… (là) » : le pluriel de 這 et 那. 東西 dōngxi « chose, affaire », litt. « est-ouest ».\n", "en_t": "**這些** zhèxiē \"these\", **那些** nàxiē \"those\": the plurals of 這 and 那. 東西 dōngxi \"thing, stuff\", lit. \"east-west\".\n"}, {"n": 4, "line": 4, "topic": "grammar", "fr": "**的** après un adjectif en fait un nom : 新的 « (du) neuf, des neufs ». 是新的 « est du neuf ». Même 的 que dans 我的 (L1 n.6) : « ce qui est à moi, ce qui est neuf ».\n", "en": "**的** after an adjective makes it a noun: 新的 \"new one(s)\". 是新的 \"is a new one\". The same 的 as in 我的 (L1 n.6): \"that of mine, that which is new\".\n", "fr_t": "**的** après un adjectif en fait un nom : 新的 « (du) neuf, des neufs ». 是新的 « est du neuf ». Même 的 que dans 我的 (L1 n.6) : « ce qui est à moi, ce qui est neuf ».\n", "en_t": "**的** after an adjective makes it a noun: 新的 \"new one(s)\". 是新的 \"is a new one\". The same 的 as in 我的 (L1 n.6): \"that of mine, that which is new\".\n"}, {"n": 5, "line": 6, "topic": "grammar", "fr": "**这个 / 那个 / 哪个** : avec un classificateur, 这 / 那 / 哪 se mettent devant un nom : 那个房间 « cette chambre-là », 哪个 « lequel ». Seuls, ils remplacent le nom : 那个 « celui-là ». On dit souvent zhèige, nèige à l'oral.\n", "en": "**这个 / 那个 / 哪个**: with a measure word, 这 / 那 / 哪 go before a noun: 那个房间 \"that room\", 哪个 \"which one\". On their own they stand for the noun: 那个 \"that one\". In speech you often hear zhèige, nèige.\n", "fr_t": "**這個 / 那個 / 哪個** : avec un classificateur, 這 / 那 / 哪 se mettent devant un nom : 那個房間 « cette chambre-là », 哪個 « lequel ». Seuls, ils remplacent le nom : 那個 « celui-là ». On dit souvent zhèige, nèige à l'oral.\n", "en_t": "**這個 / 那個 / 哪個**: with a measure word, 這 / 那 / 哪 go before a noun: 那個房間 \"that room\", 哪個 \"which one\". On their own they stand for the noun: 那個 \"that one\". In speech you often hear zhèige, nèige.\n"}, {"n": 6, "line": 6, "topic": "grammar", "fr": "**谁** shéi « qui » reste à la place de la réponse (L2 n.3) ; 谁的 « à qui ». Le dictionnaire donne aussi shuí, plus rare à l'oral.\n", "en": "**谁** shéi \"who\" stays where the answer goes (L2 n.3); 谁的 \"whose\". Dictionaries also give shuí, rarer in speech.\n", "fr_t": "**誰** shéi « qui » reste à la place de la réponse (L2 n.3) ; 誰的 « à qui ». Le dictionnaire donne aussi shuí, plus rare à l'oral.\n", "en_t": "**誰** shéi \"who\" stays where the answer goes (L2 n.3); 誰的 \"whose\". Dictionaries also give shuí, rarer in speech.\n"}, {"n": 7, "line": 6, "topic": "vocab", "fr": "**真** zhēn « vraiment » sert aux exclamations : 真好看！« que c'est joli ! ». Contrairement à 很 (L1 n.9), il garde toute sa force. 好看 « beau à voir » : 好 + 看.\n", "en": "**真** zhēn \"really\" makes exclamations: 真好看！\"how nice!\". Unlike 很 (L1 n.9), it keeps its full force. 好看 \"nice to look at\": 好 + 看.\n", "fr_t": "**真** zhēn « vraiment » sert aux exclamations : 真好看！« que c'est joli ! ». Contrairement à 很 (L1 n.9), il garde toute sa force. 好看 « beau à voir » : 好 + 看.\n", "en_t": "**真** zhēn \"really\" makes exclamations: 真好看！\"how nice!\". Unlike 很 (L1 n.9), it keeps its full force. 好看 \"nice to look at\": 好 + 看.\n"}, {"n": 8, "line": 7, "topic": "vocab", "fr": "**住** zhù « habiter » se construit ici directement avec le lieu. On verra en leçon 8 la tournure plus courante avec 在 : 住在北京 « habiter à Pékin ».\n", "en": "**住** zhù \"to live (somewhere)\" takes the place directly here. Lesson 8 brings the more usual form with 在: 住在北京 \"live in Beijing\".\n", "fr_t": "**住** zhù « habiter » se construit ici directement avec le lieu. On verra en leçon 8 la tournure plus courante avec 在 : 住在北京 « habiter à Pékin ».\n", "en_t": "**住** zhù \"to live (somewhere)\" takes the place directly here. Lesson 8 brings the more usual form with 在: 住在北京 \"live in Beijing\".\n"}], "words": [{"w": "这", "py": "zhè", "fr": "ceci, ce…-ci", "en": "this", "t": "這", "lvl": "1"}, {"w": "房间", "py": "fángjiān", "fr": "chambre, pièce", "en": "room", "t": "房間", "lvl": "1"}, {"w": "那", "py": "nà", "fr": "cela, ce…-là", "en": "that", "t": "那", "lvl": "1"}, {"w": "床", "py": "chuáng", "fr": "lit", "en": "bed", "t": "床", "lvl": "2"}, {"w": "桌子", "py": "zhuōzi", "fr": "table, bureau", "en": "table, desk", "t": "桌子", "lvl": "1"}, {"w": "椅子", "py": "yǐzi", "fr": "chaise", "en": "chair", "t": "椅子", "lvl": "1"}, {"w": "这些", "py": "zhèxiē", "fr": "ces… -ci", "en": "these", "t": "這些", "lvl": "1"} (L1 n.3). Question words stay where the answer goes, with no 嗎: 什麼 (L2 n.3), 哪 (L3 n.1), 幾 (L4 n.2), 多大 (L5 n.1), 誰 (L6 n.6). 呢 bounces the question back: 你呢？ (L2 n.4). You answer yes or no with the verb: 是 / 不是, 有 / 沒有 (L1 n.4, L4 n.6).\n"}, {"fr": "**La négation.** 不 devant les verbes et les adjectifs (L1 n.7), mais 没 devant 有 (L4 n.6). 不 et 一 changent de ton devant un quatrième ton : 不是 bú shì, 一个 yí ge (L1 n.8, L4 n.7).\n", "en": "**Negation.** 不 before verbs and adjectives (L1 n.7), but 没 before 有 (L4 n.6). 不 and 一 change tone before a fourth tone: 不是 bú shì, 一个 yí ge (L1 n.8, L4 n.7).\n", "fr_t": "**La négation.** 不 devant les verbes et les adjectifs (L1 n.7), mais 沒 devant 有 (L4 n.6). 不 et 一 changent de ton devant un quatrième ton : 不是 bú shì, 一個 yí ge (L1 n.8, L4 n.7).\n", "en_t": "**Negation.** 不 before verbs and adjectives (L1 n.7), but 沒 before 有 (L4 n.6). 不 and 一 change tone before a fourth tone: 不是 bú shì, 一個 yí ge (L1 n.8, L4 n.7).\n"}, {"fr": "**Être.** 是 relie deux noms (L1 n.4). Devant un adjectif, pas de 是 mais souvent 很 (L1 n.7, L1 n.9) ; pour s'exclamer, 真 (L6 n.7). L'âge se dit sans verbe : 我二十五岁 (L5 n.4).\n", "en": "**Being.** 是 links two nouns (L1 n.4). Before an adjective, no 是 but usually 很 (L1 n.7, L1 n.9); to exclaim, 真 (L6 n.7). Age needs no verb: 我二十五岁 (L5 n.4).\n", "fr_t": "**Être.** 是 relie deux noms (L1 n.4). Devant un adjectif, pas de 是 mais souvent 很 (L1 n.7, L1 n.9) ; pour s'exclamer, 真 (L6 n.7). L'âge se dit sans verbe : 我二十五歲 (L5 n.4).\n", "en_t": "**Being.** 是 links two nouns (L1 n.4). Before an adjective, no 是 but usually 很 (L1 n.7, L1 n.9); to exclaim, 真 (L6 n.7). Age needs no verb: 我二十五歲 (L5 n.4).\n"}, {"fr": "**Le 的.** Possession : 你的同事 (L1 n.6), mais pas avec la famille ni la maison : 我妈妈, 你家 (L4 n.3). Après un adjectif, il fait un nom : 新的 (L6 n.4).\n", "en": "**的.** Possession: 你的同事 (L1 n.6), but not with family or home: 我妈妈, 你家 (L4 n.3). After an adjective it makes a noun: 新的 (L6 n.4).\n", "fr_t": "**Le 的.** Possession : 你的同事 (L1 n.6), mais pas avec la famille ni la maison : 我媽媽, 你家 (L4 n.3). Après un adjectif, il fait un nom : 新的 (L6 n.4).\n", "en_t": "**的.** Possession: 你的同事 (L1 n.6), but not with family or home: 我媽媽, 你家 (L4 n.3). After an adjective it makes a noun: 新的 (L6 n.4).\n"}, {"fr": "**Compter.** Nombre + classificateur + nom : 五个人 (L4 n.1). 两 devant un classificateur, 二 pour compter (L4 n.4). Les nombres jusqu'à 99 (L5 n.3). 这个, 那个, 哪个 (L6 n.5).\n", "en": "**Counting.** Number + measure word + noun: 五个人 (L4 n.1). 两 before a measure word, 二 when counting (L4 n.4). Numbers up to 99 (L5 n.3). 这个, 那个, 哪个 (L6 n.5).\n", "fr_t": "**Compter.** Nombre + classificateur + nom : 五個人 (L4 n.1). 兩 devant un classificateur, 二 pour compter (L4 n.4). Les nombres jusqu'à 99 (L5 n.3). 這個, 那個, 哪個 (L6 n.5).\n", "en_t": "**Counting.** Number + measure word + noun: 五個人 (L4 n.1). 兩 before a measure word, 二 when counting (L4 n.4). Numbers up to 99 (L5 n.3). 這個, 那個, 哪個 (L6 n.5).\n"}, {"fr": "**L'ordre des mots.** Sujet, puis temps, puis adverbe, puis verbe : 我今年也二十五岁. Les mots de temps (L5 n.2), 也 (L2 n.7) et 都 (L6 n.2) se mettent tous devant le verbe.\n", "en": "**Word order.** Subject, then time, then adverb, then verb: 我今年也二十五岁. Time words (L5 n.2), 也 (L2 n.7) and 都 (L6 n.2) all go before the verb.\n", "fr_t": "**L'ordre des mots.** Sujet, puis temps, puis adverbe, puis verbe : 我今年也二十五歲. Les mots de temps (L5 n.2), 也 (L2 n.7) et 都 (L6 n.2) se mettent tous devant le verbe.\n", "en_t": "**Word order.** Subject, then time, then adverb, then verb: 我今年也二十五歲. Time words (L5 n.2), 也 (L2 n.7) and 都 (L6 n.2) all go before the verb.\n"}], "lines": [{"n": 1, "who": "张伟", "h": "马克，你累吗？", "py": "Mǎkè, nǐ lèi ma?", "fr": "Marc, tu es fatigué ?", "en": "Marc, are you tired?", "who_t": "張偉", "toks": [{"s": "马克", "t": "馬克", "p": "Mǎkè", "k": "马克"}, {"s": "，", "t": "，"}, {"s": "你", "t": "你", "p": "nǐ", "k": "你"}, {"s": "累", "t": "累", "p": "lèi", "k": "累"}, {"s": "吗", "t": "嗎", "p": "ma", "k": "吗"}, {"s": "？", "t
