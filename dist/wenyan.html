可施"}, {"w": "屈指可數", "py": "qū zhǐ kě shǔ", "lit": "bend-fingers-can-count", "en": "very few, can be counted on one's fingers", "origin": {"work": "三國志·張郃傳", "text": "屈指計亮糧不至十日", "checked": ["moe"], "text_s": "屈指计亮粮不至十日"}, "ex": {"h": "王哲执法的国际比赛屈指可数，仅有東亞盃和一些友谊赛。", "py": "Wáng Zhé zhí fǎ de guó jì bǐ sài qū zhǐ kě shǔ, jǐn yǒu Dōngyà Bēi hé yī xiē yǒu yì sài.", "py_auto": true, "src": "wikipedia: 王哲 (足球裁判)", "en": "Wang Zhe has refereed very few international matches: only the East Asian Cup and some friendlies.", "h_t": "王哲執法的國際比賽屈指可數，僅有東亞盃和一些友誼賽。", "h_s": "王哲执法的国际比赛屈指可数，仅有东亚杯和一些友谊赛。"}, "w_s": "屈指可数"}, {"w": "與日俱增", "py": "yǔ rì jù zēng", "lit": "with-days-together-grow", "en": "to grow day by day", "note": "與…俱 \"together with\": it grows as the days go by.", "ex": {"h": "缅甸社会趋于崩溃，饥贫交加，公序良俗不再，罪案与日俱增。", "py": "Miǎndiàn shè huì qū yú bēng kuì, jī pín jiāo jiā, gōng xù liáng sú bù zài, zuì àn yǔ rì jù zēng.", "py_auto": true, "src": "wikipedia: 英屬緬甸", "en": "Burmese society was close to collapse: hunger and poverty spread, public order broke down, and crime grew day by day.", "h_t": "緬甸社會趨於崩潰，飢貧交加，公序良俗不再，罪案與日俱增。", "h_s": "缅甸社会趋于崩溃，饥贫交加，公序良俗不再，罪案与日俱增。"}, "w_s": "与日俱增"}], "title_s": "虚词（二）"}, {"id": 8, "slug": "feelings", "title": "心情", "title_py": "Xīnqíng", "title_en": "Feelings and reactions", "status": "draft", "intro": "How people feel and react: pleased, delighted, gloating, hesitant, suddenly enlightened, indifferent, worried, exasperated, caught off guard. Several share the 心 \"heart, mind\" family (心滿意足, 漠不關心, 憂心忡忡) and the 不忍 \"cannot bear to\" construction (忍無可忍, 慘不忍睹). The last group is about urgency and shock (刻不容緩, 迫在眉睫, 駭人聽聞).\n", "frames": [{"f": "心X意Y", "en": "heart and mind together", "ex": ["心滿意足"], "f_s": "心X意Y", "ex_s": ["心满意足"]}, {"f": "X然大Y", "en": "然 makes an adverb: 'suddenly, all at once'", "ex": ["恍然大悟", "安然無恙"], "f_s": "X然大Y", "ex_s": ["恍然大悟", "安然无恙"]}, {"f": "X不忍Y / 忍無可忍", "en": "忍 'bear, endure'", "ex": ["忍無可忍", "慘不忍睹"], "f_s": "X不忍Y / 忍无可忍", "ex_s": ["忍无可忍", "惨不忍睹"]}, {"f": "X不及 / X不容Y", "en": "'not in time' / 'does not allow'", "ex": ["措手不及", "刻不容緩"], "f_s": "X不及 / X不容Y", "ex_s": ["措手不及", "刻不容缓"]}], "items": [{"w": "心滿意足", "py": "xīn mǎn yì zú", "lit": "heart-full-mind-satisfied", "en": "perfectly content", "origin": {"work": "漢書·王莽傳中", "text": "豐等爵位已盛，心意既滿", "checked": ["moe"], "text_s": "丰等爵位已盛，心意既满"}, "ex": {"h": "他對自己感到心滿意足。", "py": "Tā duì zì jǐ gǎn dào xīn mǎn yì zú.", "py_auto": true, "src": "tatoeba", "en": "He is perfectly satisfied with himself.", "h_t": "他對自己感到心滿意足。", "h_s": "他对自己感到心满意足。"}, "w_s": "心满意足"}, {"w": "興高采烈", "py": "xìng gāo cǎi liè", "lit": "mood-high-spirit-fierce", "en": "in high spirits, delighted", "origin": {"work": "劉勰《文心雕龍·體性》", "text": "叔夜俊俠，故興高而采烈", "checked": ["moe"], "text_s": "叔夜俊侠，故兴高而采烈"}, "note": "Liu Xie was describing the poet Xi Kang's style, \"lofty in feeling, fierce in colour\". Only later did it come to mean \"cheerful\".", "ex": {"h": "當桂英興高采烈的找尋降龍木時，赫然發現它不翼而飛了！", "py": "Dāng Guìyīng xìng gāo cǎi liè de zhǎo xún xiáng lóng mù shí, hè rán fā xiàn tā bù yì ér fēi le!", "py_auto": true, "src": "wikipedia: 穆桂英掛帥 (2012年電視劇)", "en": "When Guiying went happily to look for the Dragon-Taming Wood, she found to her shock that it had vanished!", "h_t": "當桂英興高采烈的找尋降龍木時，赫然發現它不翼而飛了！", "h_s": "当桂英兴高采烈的找寻降龙木时，赫然发现它不翼而飞了！"}, "w_s": "兴高采烈"}, {"w": "幸災樂禍", "py": "xìng zāi lè huò", "lit": "rejoice-disaster-enjoy-misfortune", "en": "to gloat over others' misfortune", "origin": {"work": "左傳·僖公十四年", "text": "背施無親，幸災不仁", "checked": ["moe"], "text_s": "背施无亲，幸灾不仁"}, "note": "The German word Schadenfreude is usually translated with this 成語.", "ex": {"h": "“幸灾乐祸”一词只在德语中有。", "py": "“Xìng zāi lè huò” yī cí zhǐ zài Déyǔ zhōng yǒu.", "py_auto": true, "src": "tatoeba", "en": "Only German has a single word for 'Schadenfreude'.", "h_t": "“幸災樂禍”一詞只在德語中有。", "h_s": "“幸灾乐祸”一词只在德语中有。"}, "w_s": "幸灾乐祸"}, {"w": "猶豫不決", "py": "yóu yù bù jué", "lit": "hesitate-not-decide", "en": "unable to make up one's mind", "origin": {"work": "戰國策·趙策三", "text": "平原君猶豫未有所決", "checked": ["moe"], "text_s": "平原君犹豫未有所决"}, "ex": {"h": "对于是否要去医院探望Mary,Tom有点犹豫不决。", "py": "Duì yú shì fǒu yào qù yī yuàn tàn wàng Mary, Tom yǒu diǎn yóu yù bù jué.", "py_auto": true, "src": "tatoeba", "en": "Tom couldn't quite decide whether to visit Mary in hospital.", "h_t": "對於是否要去醫院探望Mary,Tom有點猶豫不決。", "h_s": "对于是否要去医院探望Mary,Tom有点犹豫不决。"}, "w_s": "犹豫不决"}, {"w": "恍然大悟", "py": "huǎng rán dà wù", "lit": "suddenly-greatly-awaken", "en": "to suddenly understand", "origin": {"work": "高彥休《唐闕史》", "text": "裴公恍然始悟", "checked": ["moe"], "text_s": "裴公恍然始悟"}, "ex": {"h": "短短数天之后，珍珠港事变爆发，美方才恍然大悟。", "py": "Duǎn duǎn shù tiān zhī hòu, Zhēnzhūgǎng shì biàn bào fā, měi fāng cái huǎng rán dà wù.", "py_auto": true, "src": "wikipedia: 毛庆祥", "en": "Only a few days later Pearl Harbor was attacked, and the Americans suddenly understood.", "h_t": "短短數天之後，珍珠港事變爆發，美方才恍然大悟。", "h_s": "短短数天之后，珍珠港事变爆发，美方才恍然大悟。"}, "w_s": "恍然大悟"}, {"w": "漠不關心", "py": "mò bù guān xīn", "lit": "cold-not-concern-heart", "en": "completely indifferent", "ex": {"h": "她對她丈夫的死漠不關心。", "py": "Tā duì tā zhàng fū de sǐ mò bù guān xīn.", "py_auto": true, "src": "tatoeba", "en": "She was indifferent to her husband's death.", "h_t": "她對她丈夫的死漠不關心。", "h_s": "她对她丈夫的死漠不关心。"}, "w_s": "漠不关心"}, {"w": "憂心忡忡", "py": "yōu xīn chōng chōng", "lit": "worried-heart-anxious-anxious", "en": "deeply worried", "origin": {"work": "詩經·召南·草蟲", "text": "未見君子，憂心忡忡", "checked": ["moe_app"], "text_s": "未见君子，忧心忡忡"}, "note": "忡忡 \"troubled\", a reduplicated adjective typical of the 詩經.", "ex": {"h": "我想变富，不再因钱忧心忡忡。", "py": "Wǒ xiǎng biàn fù, bù zài yīn qián yōu xīn chōng chōng.", "py_auto": true, "src": "tatoeba", "en": "I want to get rich and stop worrying about money.", "h_t": "我想變富，不再因錢憂心忡忡。", "h_s": "我想变富，不再因钱忧心忡忡。"}, "w_s": "忧心忡忡"}, {"w": "忍無可忍", "py": "rěn wú kě rěn", "lit": "endure-without-can-endure", "en": "to be pushed beyond endurance", "origin": {"work": "三國志·孫禮傳", "text": "且止，忍不 ote": "The opposite of 舉足輕重 (lesson 5).", "ex": {"h": "莫洛迪被苏联政府给了一个无足轻重的职位，并且经常饮酒为乐。", "py": "Mòluòdí bèi Sūlián zhèng fǔ gěi le yī gè wú zú qīng zhòng de zhí wèi, bìng qiě jīng cháng yǐn jiǔ wéi lè.", "py_auto": true, "src": "wikipedia: 科伦·莫洛迪", "en": "The Soviet government gave Molody an insignificant post, and he often drank for pleasure.", "h_t": "莫洛迪被蘇聯政府給了一個無足輕重的職位，並且經常飲酒為樂。", "h_s": "莫洛迪被苏联政府给了一个无足轻重的职位，并且经常饮酒为乐。"}, "w_s": "无足轻重"}, {"w": "不堪一擊", "py": "bù kān yī jī", "py_tw": "bù kān yī jí", "lit": "not-withstand-one-blow", "en": "to collapse at the first blow", "ex": {"h": "然而，轉入學園之後，才發現自己是多麼不堪一擊。", "py": "Rán ér, zhuǎn rù xué yuán zhī hòu, cái fā xiàn zì jǐ shì duō me bù kān yī jī.", "py_auto": true, "src": "wikipedia: PRAVE!", "en": "But only after moving to the academy did they find out how easily they could be beaten.", "h_t": "然而，轉入學園之後，才發現自己是多麼不堪一擊。", "h_s": "然而，转入学园之后，才发现自己是多么不堪一击。"}, "w_s": "不堪一击"}, {"w": "直截了當", "py": "zhí jié liǎo dàng", "lit": "straight-cut-finished-proper", "en": "straightforward, blunt", "ex": {"h": "他是个直截了当的人，说得到，做得到。", "py": "Tā shì gè zhí jié liǎo dàng de rén, shuō de dào, zuò de dào.", "py_auto": true, "src": "tatoeba", "en": "He's a straightforward man: he does what he says.", "h_t": "他是個直截了當的人，說得到，做得到。", "h_s": "他是个直截了当的人，说得到，做得到。"}, "w_s": "直截了当"}, {"w": "百花齊放", "py": "bǎi huā qí fàng", "lit": "hundred-flowers-together-bloom", "en": "a hundred flowers bloom, a flourishing variety", "origin": {"work": "李汝珍《鏡花緣》第三回", "text": "那知下界帝王忽有御旨命他百花齊放", "checked": ["dcd"], "text_s": "那知下界帝王忽有御旨命他百花齐放"}, "note": "In the novel, Empress Wu orders every flower to bloom at once in winter. Later a political slogan (1956), with 百家爭鳴.", "ex": {"h": "民間為了保護自己，紛紛習武，知名武術家百花齊放，當中最廣為人知的如「廣東十虎」。", "py": "Mín jiān wèi le bǎo hù zì jǐ, fēn fēn xí wǔ, zhī míng wǔ shù jiā bǎi huā qí fàng, dāng zhōng zuì guǎng wéi rén zhī de rú “Guǎngdōng Shí Hǔ”.", "py_auto": true, "src": "wikipedia: 華南海盜", "en": "To protect themselves people took up martial arts, and famous masters flourished everywhere, the best known being the Ten Tigers of Canton.", "h_t": "民間為了保護自己，紛紛習武，知名武術家百花齊放，當中最廣為人知的如「廣東十虎」。", "h_s": "民间为了保护自己，纷纷习武，知名武术家百花齐放，当中最广为人知的如「广东十虎」。"}, "w_s": "百花齐放"}], "title_s": "描写"}]}]}</script>
<script>
(() => {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const H = document.documentElement, app = $("#app"), pop = $("#pop");
  const store = {
    get(k, d){ try{ const v = localStorage.getItem("wy." + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem("wy." + k, JSON.stringify(v)); }catch(e){} }
  };
  const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const REF = /(?:(文言|白話) )?L(\d+) n\.(\d+)/g, TRACK_OF = {"文言": "wenyan", "白話": "baihua"};
  // **bold**, *italic*, and cross-references (L3 n.5 · 文言 L1 n.4) as buttons.
  const md = (t, own) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>")
    .replace(REF, (m, tr, l, n) => `<button class="ref" data-to="${TRACK_OF[tr] || own}/${l}/n${n}">${m}</button>`);
  const today = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  let course, T, L;
  let simp = store.get("simp", false), py = store.get("py", true), cover = store.get("cover", false);
  let done = store.get("done", {});
  let rmode = store.get("rmode", "py"), rlang = store.get("rlang", "fr"), rtrad = store.get("rtrad", false);
  const Z = (o, k) => simp && o[k + "_s"] ? o[k + "_s"] : o[k];
  const track = k => course.tracks.find(t => t.key === k);
  const isDone = (t, l) => !!done[t.key + ":" + l.id];

  /* ---------- routing ---------- */
  // Every route maps to a tab here, so a redrawn tab bar keeps its highlight.
  const TABS = [["rumen", "入門", "Start"], ["wenyan", "文言", "Classical"], ["baihua", "白話", "Prose"], ["chengyu", "成語", "Idioms"],
                ["settings", "設定", "Settings"]];
  const route = () => { const p = location.hash.replace(/^#\/?/, "").split("/"); return {tab: TABS.some(t => t[0] === p[0]) ? p[0] : store.get("tab", "rumen"), id: p[1] ? +p[1] : null, note: p[2] || null}; };
  function drawTabs(tab){
    $("#tabs").innerHTML = TABS.map(([k, zh, en]) => `<a href="#${k}" ${k === tab ? 'aria-current="page"' : ""}><b>${zh}</b>${en}</a>`).join("");
  }
  function go(){
    hidePop(); closeSheet();
    const r = route();
    H.classList.toggle("simp", simp); H.classList.toggle("nopy", !py); H.classList.toggle("cover", cover);
    H.dataset.theme = store.get("night", false) ? "dark" : "light";
    H.classList.toggle("rm-han", r.tab === "rumen" && rmode === "han"); H.classList.toggle("rm-tap", r.tab === "rumen" && rmode === "tap");
    drawTabs(r.tab); L = null;
    if (r.tab === "settings") return settings();
    store.set("tab", r.tab);
    T = track(r.tab); L = r.id ? T.lessons.find(l => l.id === r.id) : null;
    if (!L) return T.key === "rumen" ? rHome() : home();
    if (T.key === "rumen"){ rLesson(r.note === "wave"); if (r.note && r.note !== "wave") rJump(r.note); else scrollTo(0, 0); return; }
    lesson();
    if (r.note){ const n = $("#" + r.note); if (n){ n.scrollIntoView({block: "center"}); n.classList.add("flash"); } }
    else scrollTo(0, 0);
  }

  /* ---------- track home ---------- */
  const sealHTML = (t, cls = "") => { const cs = [...t].filter(c => /\p{Script=Han}/u.test(c)).slice(0, 4); return `<div class="seal ${cs.length < 2 ? "one" : ""} ${cls}" aria-hidden="true">${cs.map(c => `<span>${esc(c)}</span>`).join("")}</div>`; };
  function home(){
    const ls = T.lessons, nDone = ls.filter(l => isDone(T, l)).length, next = ls.find(l => !isDone(T, l));
    let body;
    if (!ls.length) body = `<div class="empty"><b>No ${esc(T.zh)} lessons in this build yet.</b><br>
      The tab is ready: put the lesson files in <code>${T.key === "wenyan" ? "lessons" : T.key}/</code> and run <code>python3 tools/build.py</code>.</div>`;
    else body = `
      ${next ? `<div class="next"><div class="t"><div class="kicker">${nDone ? "Next lesson" : "Start here"} · ${next.id}</div>
          <div class="zh1">${esc(Z(next, "title"))}</div><div class="te">${esc(next.title_en)}</div></div>
          <a class="btn red" href="#${T.key}/${next.id}">${nDone ? "Continue" : "Start"}</a></div>`
        : `<div class="next"><div class="t"><div class="kicker">All done</div><div class="te">Every lesson written so far is marked as done.</div></div></div>`}
      <div class="prog">${nDone} of ${ls.length} done</div>
      <h2>Lessons</h2>
      <div class="grid">${ls.map(l => `<a class="tile ${isDone(T, l) ? "done" : ""} ${l.kind === "review" ? "rev" : ""}" href="#${T.key}/${l.id}">
        <div class="n">${l.id}${l.kind === "review" ? " · REVIEW" : ""}</div><div class="z">${esc(Z(l, "title"))}</div><div class="te">${esc(l.title_en)}</div></a>`).join("")}</div>`;
    app.innerHTML = `<section class="thead">${sealHTML(T.zh)}<div><div class="kicker">${esc(T.en)}</div><h1>${esc(T.zh)}</h1><p>${esc(T.about)}</p></div></section>${body}
      <footer>Course content CC BY-SA 4.0 · code MIT · classical and pre-1950s texts are in the public domain.</footer>`;
    scrollTo(0, 0);
  }

  /* ---------- lesson ---------- */
  function bar(){
    const i = T.lessons.indexOf(L), p = T.lessons[i - 1], n = T.lessons[i + 1], reading = T.key !== "chengyu" && L.kind !== "review";
    return `<div class="lbar">
      <a class="ic" href="#${T.key}" aria-label="Back to ${esc(T.en)} lessons">←</a>
      <div class="ttl">${esc(T.zh)} ${L.id} ·<b>${esc(Z(L, "title"))}</b></div>
      <a class="ic" id="prev" ${p ? `href="#${T.key}/${p.id}"` : 'aria-disabled="true"'} aria-label="Previous lesson">‹</a>
      <a class="ic" id="next" ${n ? `href="#${T.key}/${n.id}"` : 'aria-disabled="true"'} aria-label="Next lesson">›</a>
      <div class="toggles">
        <button class="tg" id="tScript" aria-pressed="${simp}" title="Traditional / simplified">${simp ? "简 → 繁" : "繁 → 简"}</button>
        ${T.key === "wenyan" || T.key === "chengyu" ? `<button class="tg" id="tPy" aria-pressed="${py}">Pinyin</button>` : ""}
        ${reading ? `<button class="tg" id="tCover" aria-pressed="${cover}" title="Hide the English; tap a line to check">Cover</button>` : ""}
      </div></div>`;
  }
  function finish(){
    const d = done[T.key + ":" + L.id], i = T.lessons.indexOf(L), n = T.lessons[i + 1];
    return `<div class="finish"><div class="msg">${d ? `<b>Done</b> on ${esc(d)}.` : `<b>Finished reading?</b><small>Mark it done to keep your place.</small>`}</div>
      ${d ? `<button class="btn ghost" id="undo">Undo</button>` : `<button class="btn red" id="markdone">Mark as done</button>`}
      ${n ? `<a class="btn ghost" href="#${T.key}/${n.id}">Next lesson ›</a>` : ""}</div>`;
  }
  // Mark glossary words (longest match first) and note anchors in a line.
  function markLine(line, i){
    const t = Z(line, "h");
    const words = L.glossary.map((g, gi) => ({w: Z(g, "w"), gi})).sort((a, b) => b.w.length - a.w.length);
    const ends = {};
    L.notes.filter(n => n.line === i).forEach(n => { const at = Z(n, "at"), p = t.indexOf(at); if (p >= 0) (ends[p + at.length - 1] ||= []).push(n.n); });
    let out = "", k = 0;
    while (k < t.length){
      const m = words.find(x => t.startsWith(x.w, k)), len = m ? m.w.length : 1, seg = t.slice(k, k + len);

      ${L.words && L.words.length ? `<h2 id="sec-words">${t_("words")} · ${L.words.length}</h2>
        <div class="wgrid">${L.words.map(x => `<button class="wchip" data-k="${esc(x.w)}"><b>${esc(rtrad ? x.t : x.w)}</b><span class="r">${esc(x.py)}${x.lvl ? `<span class="lv">NHSK ${esc(x.lvl)}</span>` : `<span class="lv off">${t_("outside")}</span>`}</span><span class="g">${esc(RT(x))}</span></button>`).join("")}</div>` : ""}
      ${ex.translate || ex.choose ? `<h2 id="sec-ex">${t_("practice")}</h2><div class="prac">
        ${ex.translate ? `<div class="ntag">1 · ${t_("translate")}</div>${ex.translate.map(e => `<div class="q"><div class="txt">${sentHTML(e.toks)}</div>
          <details class="ans"><summary>${t_("answer")}</summary><p>${esc(RT(e))}</p></details></div>`).join("")}` : ""}
        ${ex.choose ? `<div class="ntag">2 · ${t_("choose")}</div>${ex.choose.map((e, qi) => `<div class="q" data-q="${qi}"><div class="txt">${esc(R(e, "h")).split("＿＿").join('<span class="gap">？</span>')}</div>
          <div class="opts">${(rtrad ? e.opts_t : e.opts).map((o, oi) => `<button class="opt" data-q="${qi}" data-o="${oi}">${esc(o)}</button>`).join("")}</div>
          <div class="after" hidden><div class="txt">${sentHTML(e.toks)}</div><div>${esc(RT(e))}</div></div></div>`).join("")}` : ""}
      </div>` : ""}`}
      ${rFinish(wave)}
      <footer>${rlang === "fr" ? "Dialogues écrits pour le cours" : "Dialogues written for the course"} · CC BY-SA 4.0 · NHSK list: bezlant/hsk-3-vocabulary, CC BY-SA 4.0.</footer>`;
  }
  function rFinish(wave){
    const key = "rumen:" + L.id + (wave ? ":wave" : ""), d = done[key], tr = track("rumen"), n = tr.lessons[tr.lessons.indexOf(L) + 1];
    return `<div class="finish"><div class="msg">${d ? `<b>${t_("doneOn")}</b> ${esc(d)}.` : `<b>${t_("finished")}</b><small>${t_("keep")}</small>`}</div>
      ${d ? `<button class="btn ghost" id="rUndo" data-key="${key}">${t_("undo")}</button>` : `<button class="btn red" id="rDone" data-key="${key}">${t_("markDone")}</button>`}
      ${n && !wave ? `<a class="btn ghost" href="#rumen/${n.id}">${t_("next")} ›</a>` : ""}</div>`;
  }
  function rJump(id){
    const el = $("#" + id); if (!el) return;
    if (el.closest("details")) el.closest("details").open = true;
    flash(el);
  }

  /* bottom sheet: word card, note */
  function openSheet(html){
    const sh = $("#sheet"); sh.innerHTML = `<div class="grab"></div>` + html;
    sh.classList.add("open"); sh.setAttribute("aria-hidden", "false"); sh.scrollTop = 0;
  }
  function closeSheet(){
    const sh = $("#sheet"); if (!sh) return;
    sh.classList.remove("open"); sh.setAttribute("aria-hidden", "true");
    $$(".tok.sel").forEach(x => x.classList.remove("sel")); $$(".sent.noted").forEach(x => x.classList.remove("noted"));
  }
  function openCard(k){
    const D = rDict(), d = D[k]; if (!d) return;
    const main = rtrad ? d.t : d.s, other = rtrad ? d.s : d.t;
    const gloss = d[rlang] || d.en || "";
    const chars = [...d.s].length > 1 ? [...d.s].map(c => D[c] ? `<button data-k="${esc(c)}"><span class="han">${esc(rtrad ? D[c].t : c)}</span> ${esc(D[c].py)}${D[c][rlang] || D[c].en ? " · " + esc(D[c][rlang] || D[c].en) : ""}</button>` : "").join("") : "";
    const seen = (d.seen || []).filter(x => x !== d.first && x !== L?.id);
    openSheet(`<div class="top"><div class="hd"><div class="wh">${esc(main)}${other !== main ? `<small>${esc(other)}</small>` : ""}</div>
        <div class="wp">${esc(d.py)} ${lvHTML(d)}</div></div><button class="x" aria-label="Close">×</button></div>
      ${gloss ? `<h3>${t_("meaning")}</h3><div class="gloss">${esc(gloss)}</div>` : d.auto ? `<h3>${t_("meaning")}</h3><div class="gloss">${esc(d.auto)}</div><div class="src">${t_("auto")}</div>` : ""}
      ${d.first ? `<h3>${t_("taught")}</h3><div class="chips"><button data-to="rumen/${d.first}">${t_("lesson")} ${d.first}</button></div>` : ""}
      ${seen.length ? `<h3>${t_("usedIn")}</h3><div class="chips">${seen.map(x => `<button data-to="rumen/${x}">${t_("lesson")} ${x}</button>`).join("")}</div>` : ""}
      ${chars ? `<h3>${t_("chars")}</h3><div class="chips">${chars}</div>` : ""}`);
  }
  function openNote(i){
    const n = L.notes[i], total = L.notes.length;
    $$(".sent.noted").forEach(x => x.classList.remove("noted")); $("#line-" + n.line)?.classList.add("noted");
    openSheet(`<div class="top"><div class="hd"><span class="ntag">${t_("note")} ${i + 1} ${t_("of")} ${total} · ${esc(t_("topics")[n.topic] || n.topic)} · ${t_("line")} ${n.line}</span></div><button class="x" aria-label="Close">×</button></div>
      <p class="ntext" style="font-size:16.5px">${noteHTML(rtrad ? n[rlang + "_t"] : n[rlang])}</p>
      <div class="nrow"><button class="btn ghost" data-note="${i - 1}" ${i < 1 ? "disabled" : ""}>${t_("prev")}</button>
        <button class="btn" data-note="${i + 1}" ${i >= total - 1 ? "disabled" : ""}>${t_("nextN")}</button></div>`);
  }
  // a click inside 入門; returns true when handled
  function rClick(e){
    const t = e.target, b = t.closest("button,a,.tok,.wt,.tr");
    if (!b) return false;
    if (b.classList.contains("x")){ closeSheet(); return true; }
    if (b.dataset.to && b.tagName === "BUTTON" && !b.classList.contains("ref")){ closeSheet(); location.hash = b.dataset.to; return true; }
    if (b.classList.contains("tok")){
      if (rmode === "tap" && !b.classList.contains("show")){ b.classList.add("show"); return true; }
      $$(".tok.sel").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); openCard(b.dataset.k); return true;
    }
    if (b.classList.contains("wt") || b.classList.contains("wchip") || (b.dataset.k && b.closest("#sheet"))){ openCard(b.dataset.k); return true; }
    if (b.dataset.note != null && b.tagName === "BUTTON"){ openNote(+b.dataset.note); return true; }
    if (b.dataset.line){ closeSheet(); const el = $("#line-" + b.dataset.line); el?.classList.add("noted"); flash(el); return true; }
    if (b.dataset.jump){ rJump(b.dataset.jump); return true; }
    if (b.classList.contains("tr") && cover){ b.classList.toggle("peek"); return true; }
    if (b.dataset.show){ $("#zh-" + b.dataset.show).hidden = false; b.remove(); return true; }
    if (b.id === "showAll"){ $$(".txt[hidden]").forEach(x => x.hidden = false); $$(".showzh").forEach(x => x.remove()); return true; }
    if (b.classList.contains("opt")){
      const e2 = L.exercise.choose[+b.dataset.q], q = b.closest(".q"), right = +b.dataset.o === e2.opts.indexOf(e2.a);
      if (q.dataset.ok) return true;
      b.classList.add(right ? "ok" : "no");
      if (right){ q.dataset.ok = 1; q.querySelectorAll(".gap").forEach(g => g.textContent = rtrad ? e2.opts_t[e2.opts.indexOf(e2.a)] : e2.a); q.querySelector(".after").hidden = false; }
      return true;
    }
    if (b.id === "rMode"){ rmode = {py: "tap", tap: "han", han: "py"}[rmode]; store.set("rmode", rmode); go(); return true; }
    if (b.id === "rScript" || b.id === "sRtrad"){ rtrad = !rtrad; store.set("rtrad", rtrad); go(); return true; }
    if (b.id === "rLang" || b.id === "sRlang"){ rlang = rlang === "fr" ? "en" : "fr"; store.set("rlang", rlang); go(); return true; }
    if (b.id === "rDone"){ done[b.dataset.key] = today(); saveDone(); const y = scrollY; go(); scrollTo(0, y); return true; }
    if (b.id === "rUndo"){ delete done[b.dataset.key]; saveDone(); const y = scrollY; go(); scrollTo(0, y); return true; }
    return false;
  }

  /* ---------- settings ---------- */
  function settings(){
    const sw = (id, on) => `<button class="tg" id="${id}" aria-pressed="${on}">${on ? "On" : "Off"}</button>`;
    app.innerHTML = `<div class="set"><div class="kicker">Settings</div><h1>設定</h1>
      <div class="row"><div class="l">Simplified characters<small>The course is written in traditional characters; simplified is derived from it.</small></div>${sw("sSimp", simp)}</div>
      <div class="row"><div class="l">Pinyin under each line<small>文言 and 成語. In 白話 lessons, tap a word to see its reading.</small></div>${sw("sPy", py)}</div>
      <div class="row"><div class="l">Cover the English<small>Read the Chinese first; tap a line to check yourself.</small></div>${sw("sCover", cover)}</div>
      <div class="row"><div class="l">入門 · explanations in<small>French or English, for the beginner course.</small></div><button class="tg" id="sRlang">${rlang === "fr" ? "Français" : "English"}</button></div>
      <div class="row"><div class="l">入門 · traditional characters<small>The beginner course is written in simplified characters; traditional is derived from it.</small></div>${sw("sRtrad", rtrad)}</div>
      <div class="row"><div class="l">Night mode<small>The app stays light unless you switch this on.</small></div>${sw("sNight", store.get("night", false))}</div>
      <h2>Progress</h2>
      <div class="row"><div class="l">${Object.keys(done).length} lessons done<small>Kept in this browser only. Save a file to move it to another device.</small></div>
        <button class="btn ghost" id="save">Save</button><button class="btn ghost" id="load">Load</button><input type="file" id="file" accept="application/json,.json" hidden></div>
      <footer>Wenyan 文言 · lessons, notes and translations CC BY-SA 4.0 · code MIT.</footer></div>`;
    scrollTo(0, 0);
  }

  /* ---------- events ---------- */
  document.addEventListener("click", e => {
    const t = e.target, id = t.closest("button,a")?.id;
    const ref = t.closest(".ref");
    if (ref && ref.dataset.to){ closeSheet(); location.hash = ref.dataset.to; return; }
    if (T && T.key === "rumen" && rClick(e)) return;
    if (t.closest("#sheet")) return;
    closeSheet();
    if (t.closest("#pop .goto")){ const n = $("#n" + t.closest(".goto").dataset.n); hidePop(); flash(n); return; }
    if (t.closest("#pop")) return;
    if (t.closest("sup.nn")){ showNote(t.closest("sup.nn")); return; }
    if (t.closest(".w")){ showWord(t.closest(".w")); return; }
    hidePop();
    if (id === "tScript" || id === "sSimp"){ simp = !simp; store.set("simp", simp); return go(); }
    if (id === "tPy" || id === "sPy"){ py = !py; store.set("py", py); return go(); }
    if (id === "tCover" || id === "sCover"){ cover = !cover; store.set("cover", cover); return go(); }
    if (id === "sRlang"){ rlang = rlang === "fr" ? "en" : "fr"; store.set("rlang", rlang); return go(); }
    if (id === "sRtrad"){ rtrad = !rtrad; store.set("rtrad", rtrad); return go(); }
    if (id === "sNight"){ store.set("night", !store.get("night", false)); return go(); }
    if (id === "markdone"){ done[T.key + ":" + L.id] = today(); saveDone(); const y = scrollY; go(); scrollTo(0, y); return; }
    if (id === "undo"){ delete done[T.key + ":" + L.id]; saveDone(); const y = scrollY; go(); scrollTo(0, y); return; }
    if (id === "save"){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({app: "wenyan", saved: today(), done}, null, 1)], {type: "application/json"})); a.download = `wenyan-progress-${today()}.json`; a.click(); return; }
    if (id === "load") return $("#file").click();
    const ln = t.closest(".ln"), cy = t.closest(".cy");
    if (ln && cover) $$(`.ln[data-i="${ln.dataset.i}"]`).forEach(x => x.classList.toggle("peek"));
  });
  document.addEventListener("change", async e => {
    if (e.target.id !== "file" || !e.target.files[0]) return;
    try{ const d = JSON.parse(await e.target.files[0].text()); if (d.app !== "wenyan") throw 0;
      // merge: keep the earliest finish date of each lesson (a "deck" in an older file is ignored)
      for (const k in d.done) if (!done[k] || d.done[k] < done[k]) done[k] = d.done[k];
      saveDone(); go();
    }catch(x){ alert("That file is not a Wenyan progress file."); }
  });
  addEventListener("keydown", e => {
    if (e.target.closest("input,textarea,select") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape"){ hidePop(); closeSheet(); }
    if (L && e.key === "ArrowLeft") $("#prev")?.click();
    if (L && e.key === "ArrowRight") $("#next")?.click();
  });
  // A word pop-up closes once the page has really moved (a few pixels of font-loading shift don't count).
  addEventListener("scroll", () => { if (!pop.classList.contains("note-pop") && Math.abs(scrollY - popY) > 30) hidePop(); }, {passive: true});
  addEventListener("resize", () => { if (L) syncHeights(); });
  addEventListener("hashchange", go);

  (async () => {
    const inline = $("#course-data").textContent.trim();
    course = inline ? JSON.parse(inline) : await (await fetch("course.json")).json();
    if (!store.get("migrated", false)){ store.set("migrated", true); const old = store.get("lesson", null); if (old !== null && !location.hash && course.tracks[0].lessons[old]) location.hash = "wenyan/" + course.tracks[0].lessons[old].id; }
    go();
    if (document.fonts) document.fonts.ready.then(() => { if (L) syncHeights(); });
  })();
})();
</script>
</body>
</html>
