<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Wenyan 文言</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Serif+SC:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* Always light, whatever the phone says; night is a manual switch in Settings. */
:root{
  color-scheme:only light;
  --paper:#f6f1e7; --paper-2:#efe7d6; --card:#fbf8f1; --ink:#24201b; --ink-2:#6b6257; --rule:#d9cdb6;
  --seal:#a8321e; --seal-soft:#a8321e1a; --hl:#e9d9a8; --ok:#3d6b4f;
  --zh:"Noto Serif TC","Noto Serif SC",serif; --en:"Source Serif 4",Georgia,serif;
  --nav-h:58px;
}
:root[data-theme="dark"]{
  color-scheme:only dark;
  --paper:#1b1916; --paper-2:#24211d; --card:#211e1a; --ink:#ece4d4; --ink-2:#a69b8a; --rule:#3a352e;
  --seal:#e0664c; --seal-soft:#e0664c22; --hl:#5a4a22; --ok:#7fb894;
}
html.simp{--zh:"Noto Serif SC","Noto Serif TC",serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 var(--en);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
main.wrap{padding-bottom:120px;min-height:70vh}

/* top bar + tabs (tabs drop to the bottom of the screen on a phone) */
header.bar{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
header.bar .wrap{display:flex;align-items:center;gap:18px;height:54px}
.brand{font:600 20px var(--zh);letter-spacing:.08em;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand small{font:400 13px var(--en);color:var(--ink-2);letter-spacing:0;margin-left:6px}
nav.tabs{display:flex;gap:2px;position:fixed;z-index:8;top:0;right:max(16px,calc(50vw - 504px));height:54px;align-items:center}
nav.tabs a{display:flex;align-items:baseline;gap:6px;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:13px;position:relative}
nav.tabs a b{font:600 17px var(--zh);color:var(--ink);letter-spacing:.04em}
nav.tabs a[aria-current="page"]{background:var(--seal-soft);color:var(--seal)}
nav.tabs a[aria-current="page"] b{color:var(--seal)}
@media (max-width:720px){
  .brand small{display:none}
  header.bar .wrap{height:46px}
  nav.tabs{top:auto;left:0;right:0;bottom:0;height:auto;gap:0;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs a{flex:1;flex-direction:column;align-items:center;gap:0;padding:7px 2px 6px;border-radius:0;font-size:10.5px;letter-spacing:.02em;height:var(--nav-h);justify-content:center}
  nav.tabs a[aria-current="page"]{background:transparent;box-shadow:inset 0 2px 0 var(--seal)}
  }

/* shared pieces */
.kicker{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--seal)}
h1{font:600 clamp(32px,6vw,50px)/1.1 var(--zh);margin:6px 0 4px;letter-spacing:.06em}
h2{font:600 13px var(--en);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:40px 0 14px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--rule)}
.sub{color:var(--ink-2);font-style:italic}
.btn{text-decoration:none;display:inline-block;text-align:center;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 20px;cursor:pointer;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.red{background:var(--seal);border-color:var(--seal)}
.btn:disabled{opacity:.4;cursor:default}
.tg{font:13px var(--en);border:1px solid var(--rule);background:transparent;color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.badge{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:0 6px;margin-left:6px}
.seal{width:76px;height:76px;border:2px solid var(--seal);color:var(--seal);border-radius:6px;display:grid;grid-template-columns:1fr 1fr;place-items:center;font:600 26px/1 var(--zh);padding:6px;transform:rotate(-2deg);flex:none}
.seal.one{grid-template-columns:1fr}
.empty{border:1px dashed var(--rule);border-radius:10px;padding:22px;color:var(--ink-2);max-width:640px}
.empty b{color:var(--ink)}
code{font:13px ui-monospace,Menlo,monospace;background:var(--paper-2);padding:1px 5px;border-radius:4px}

/* track home */
.thead{display:flex;gap:20px;align-items:flex-start;padding:34px 0 20px}
.thead p{margin:6px 0 0;max-width:560px;color:var(--ink-2);font-size:15.5px}
.next{display:flex;gap:16px;align-items:center;border:1px solid var(--rule);border-left:4px solid var(--seal);border-radius:10px;background:var(--card);padding:16px 18px;margin:6px 0 4px}
.next .t{flex:1;min-width:0}
.next .t .zh1{font:600 24px/1.25 var(--zh);letter-spacing:.05em}
.next .t .te{color:var(--ink-2);font-size:14.5px}
.prog{font-size:13px;color:var(--ink-2);margin:10px 2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;text-align:left;border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:12px 12px 11px;cursor:pointer;text-decoration:none;color:var(--ink);display:block;min-height:104px}
.tile:hover{border-color:var(--ink-2)}
.tile .n{font:600 12px var(--en);color:var(--ink-2);letter-spacing:.08em}
.tile .z{font:600 20px/1.25 var(--zh);letter-spacing:.04em;margin:5px 0 3px}
.tile .te{font-size:12.5px;line-height:1.3;color:var(--ink-2)}
.tile.done{background:var(--paper-2)}
.tile.done::after{content:"✓";position:absolute;top:9px;right:11px;color:var(--ok);font-weight:600}
.tile.rev{border-style:dashed}

/* lesson bar */
.lbar{position:sticky;top:54px;z-index:5;background:color-mix(in srgb,var(--paper) 96%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);margin:0 -16px;padding:7px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbar .ttl{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbar .ttl b{font:600 16px var(--zh);margin-left:4px}
.ic{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:transparent;cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center;text-decoration:none;color:var(--ink);flex:none}
.ic[aria-disabled="true"]{opacity:.3;pointer-events:none}
.toggles{display:flex;gap:6px}
@media (max-width:720px){.lbar{top:46px}.lbar .toggles{order:5;width:100%}}

/* lesson */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:end;padding:36px 0 24px;border-bottom:1px solid var(--rule)}
.intro{max-width:720px;margin:22px 0 0}
.meta{font-size:13px;color:var(--ink-2);margin-top:10px}
.pages{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--paper-2)}
.page{padding:22px 24px}
.page.left{border-right:1px solid var(--rule);background:var(--paper)}
.ln{padding:9px 0;border-bottom:1px dashed var(--rule);min-height:64px}
.ln:last-child{border-bottom:0}
.ln.p:not(:first-child){border-top:1px solid var(--rule);margin-top:-1px;padding-top:18px}
.zh{font:400 26px/1.5 var(--zh);letter-spacing:.06em}
.prose .zh{font-size:22px;line-height:1.65;letter-spacing:.03em}
.py{font-size:14px;color:var(--ink-2);font-style:italic;margin-top:2px}
.en{font-size:16px}
.lit{font-size:13px;color:var(--ink-2);margin-top:2px}
html.nopy .py{display:none}
html.cover .page.right .ln > *,html.cover .en-inline,html.cover .cy .mean{filter:blur(6px);opacity:.5;transition:.2s}
html.cover .page.right .ln.peek > *,html.cover .ln.peek .en-inline,html.cover .cy.peek .mean{filter:none;opacity:1}
.w{cursor:pointer;border-radius:3px;transition:background .15s;text-decoration:underline dotted var(--rule);text-underline-offset:6px}
.w:hover,.w.on{background:var(--hl)}
sup.nn{font:600 11px var(--en);color:var(--seal);margin-left:1px;cursor:pointer;vertical-align:super;padding:0 2px;border-radius:3px}
sup.nn.on{background:var(--seal);color:var(--paper)}
.notes{columns:2 340px;column-gap:34px}
.note{break-inside:avoid;margin:0 0 18px;padding-left:34px;position:relative}
.num{width:24px;height:24px;border-radius:50%;background:var(--seal-soft);color:var(--seal);font:600 12px/24px var(--en);text-align:center;display:inline-block;flex:none}
.note > .num{position:absolute;left:0;top:2px}
.note .at{font-family:var(--zh);font-size:18px;margin-right:4px}
.note.flash{animation:fl 1.6s}
@keyframes fl{0%{background:var(--hl)}100%{background:transparent}}
.note p{margin:0}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.g{border:1px solid var(--rule);border-radius:8px;padding:8px 12px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;background:var(--card)}
.g .c{font:600 24px/1.2 var(--zh);grid-row:span 2}
.g .p{font-size:13px;color:var(--ink-2);font-style:italic}
.g .d{font-size:14px;line-height:1.35}
.gl.known .g{background:transparent}
.gl.known .g .c{font-size:20px;font-weight:400}
.g .sw{grid-column:1/-1;font:13px var(--zh);color:var(--ink-2);border-top:1px dotted var(--rule);padding-top:4px;margin-top:4px}
.g .sw b{font:600 11px var(--en);letter-spacing:.06em;color:var(--seal);margin-right:6px}
.ex{display:grid;gap:10px}
.e{border-left:3px solid var(--seal);padding:8px 0 8px 16px}
.e .zh{font-size:22px}
.e .src{font-size:12px;color:var(--ink-2);letter-spacing:.04em}
.e details summary{cursor:pointer;color:var(--seal);font-size:14px;margin-top:4px}
.e details p{margin:4px 0 0}
.e .tests{font-size:13px;color:var(--ink-2)}
.culture{max-width:760px;font-size:16px;background:var(--paper-2);border-radius:10px;padding:18px 22px}
.recap{display:grid;gap:14px}
.rc{display:grid;grid-template-columns:34px 1fr;gap:14px;border:1px solid var(--rule);border-radius:10px;padding:16px 18px;background:var(--card)}
.rc .num{width:30px;height:30px;line-height:30px;font-size:14px}
.rc h3{margin:2px 0 6px;font:600 17px var(--en)}
.rc p{margin:0 0 10px;font-size:15.5px}
.rx{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px}
.rx span{font:20px/1.4 var(--zh);letter-spacing:.04em}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.ref{font:12px var(--en);color:var(--seal);background:var(--seal-soft);border:0;border-radius:999px;padding:3px 10px;cursor:pointer;white-space:nowrap}
p .ref,.nb .ref{padding:1px 8px}
.finish{margin-top:44px;border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:18px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.finish .msg{flex:1;min-width:200px;font-size:15px}
.finish .msg small{display:block;color:var(--ink-2)}
.en-inline{display:none;font-size:15px;margin-top:4px}
footer{margin-top:48px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:14px}
@media (max-width:720px){
  .pages{grid-template-columns:1fr}
  .page.left{border-right:0}
  .page{padding:12px 16px}
  .page.right{display:none}
  .en-inline{display:block}
  .hero{grid-template-columns:1fr;gap:14px;padding-top:24px}
  .seal{width:60px;height:60px;font-size:20px}
  .zh{font-size:23px}
  .prose .zh{font-size:20px}
  .thead{padding-top:22px;gap:14px}
  .thead .seal{margin-top:6px}
}

/* 成語 lesson */
.frames{display:flex;flex-wrap:wrap;gap:8px}
.frame{border:1px solid var(--rule);border-radius:8px;padding:6px 12px;background:var(--card);font-size:14px}
.frame b{font:600 18px var(--zh);margin-right:8px}
.cys{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.cy{border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:14px 16px}
.cy .hw{font:600 27px/1.3 var(--zh);letter-spacing:.08em}
.cy .lit{font-size:13px}
.cy .mean{font-size:16px;margin-top:6px}
.cy .nt,.cy .or,.cy .xs{font-size:14px;margin-top:8px;padding-top:8px;border-top:1px dotted var(--rule)}
.cy .or .zh,.cy .xs .zh{font-size:17px;letter-spacing:.02em}
.cy .lab{font:600 11px var(--en);letter-spacing:.08em;text-transform:uppercase;color:var(--seal);margin-right:6px}
.auto{font:600 9px var(--en);letter-spacing:.08em;border:1px solid var(--ink-2);color:var(--ink-2);border-radius:3px;padding:0 3px;margin-left:5px;vertical-align:middle}

/* settings */
.set{max-width:620px;padding-top:26px}
.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--rule)}
.row .l{flex:1}
.row .l small{display:block;color:var(--ink-2);font-size:13.5px;line-height:1.4}

/* pop-up */
#pop{position:fixed;z-index:20;max-width:300px;background:var(--ink);color:var(--paper);border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.4;box-shadow:0 8px 28px #0004;display:none}
#pop .c{font:600 26px var(--zh)}
#pop .p{font-style:italic;opacity:.75;margin-left:8px}
#pop .sw{font-family:var(--zh);opacity:.8;margin-top:6px;font-size:13px}
#pop.note-pop{max-width:min(420px,calc(100vw - 16px));max-height:60vh;overflow:auto;padding:14px 16px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-top:3px solid var(--seal)}
#pop .nh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#pop .nh .c{font-size:22px}
#pop .nb{font-size:15px;line-height:1.5}
#pop .goto{margin-top:10px;font:13px var(--en);color:var(--seal);background:none;border:0;padding:0;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">

</div></header>

<main class="wrap" id="app"></main>

<script id="course-data" type="application/json">{"tracks": [{"key": "wenyan", "zh": "文言", "en": "Classical", "about": "Classical Chinese through real texts: fables first, then the 論語, argument, narrative and verse.", "lessons": [{"id": 1, "slug": "shou-zhu", "title": "守株待兔", "title_py": "Shǒu zhū dài tù", "title_en": "Waiting by the Stump for a Hare", "source": {"work": "韓非子·五蠹", "author": "韓非 (c. 280–233 BC)", "period": "Warring States", "text_from": "《韓非子·五蠹》, as printed in the Hong Kong EDB recommended classical passages (KS1-01); checked against the 古汉语常用字字典 citations", "work_s": "韩非子·五蠹"}, "status": "draft", "intro": "Han Fei was the great theorist of Legalism, the school that held a state should be run by clear laws and not by appeals to the ancient sage-kings. In the essay \"The Five Vermin\" (五蠹) he tells this little story to mock rulers who cling to the old ways. It is the most famous fable in Chinese: almost every Chinese schoolchild learns it, and its title became an idiom. Six of the most important words in Classical Chinese appear in its 57 characters: 者, 而, 其, 為, 之, 也.\n", "lines": [{"h": "宋人有耕者，", "py": "Sòng rén yǒu gēng zhě,", "en": "Among the people of Song there was a man who ploughed his fields.", "lit": "Song people there-was plough-one", "h_s": "宋人有耕者，"}, {"h": "田中有株，", "py": "tián zhōng yǒu zhū,", "en": "In his field there was a tree stump.", "h_s": "田中有株，"}, {"h": "兔走觸株，", "py": "tù zǒu chù zhū,", "en": "A hare, running, struck the stump,", "h_s": "兔走触株，"}, {"h": "折頸而死。", "py": "zhé jǐng ér sǐ.", "en": "broke its neck and died.", "h_s": "折颈而死。"}, {"h": "因釋其耒而守株，", "py": "Yīn shì qí lěi ér shǒu zhū,", "en": "So he put down his plough and kept watch by the stump,", "h_s": "因释其耒而守株，"}, {"h": "冀復得兔。", "py": "jì fù dé tù.", "en": "hoping to get another hare.", "lit": "hoping again to-get hare", "h_s": "冀复得兔。"}, {"h": "兔不可復得，", "py": "Tù bù kě fù dé,", "en": "Hares could not be got again,", "h_s": "兔不可复得，"}, {"h": "而身為宋國笑。", "py": "ér shēn wéi Sòng guó xiào.", "en": "and he himself became the laughing-stock of Song.", "lit": "and himself was-by Song state laughed-at", "h_s": "而身为宋国笑。"}, {"h": "今欲以先王之政，", "py": "Jīn yù yǐ xiān wáng zhī zhèng,", "en": "Now, to want to use the government of the former kings", "h_s": "今欲以先王之政，"}, {"h": "治當世之民，", "py": "zhì dāng shì zhī mín,", "en": "to rule the people of the present age —", "h_s": "治当世之民，"}, {"h": "皆守株之類也。", "py": "jiē shǒu zhū zhī lèi yě.", "en": "that is all of the stump-watching kind.", "h_s": "皆守株之类也。"}], "notes": [{"n": 1, "line": 0, "at": "宋", "text": "**宋** Sòng, a small state in present-day Henan, ruled by descendants of the fallen Shang dynasty. In Warring States anecdotes \"a man of Song\" is the stock fool: the farmer who pulls up his sprouts to help them grow (揠苗助長, in 孟子) is also from Song.\n", "at_s": "宋"}, {"n": 2, "line": 0, "at": "有耕者", "text": "**有 … 者**, \"there was one who …\". 者 turns the verb 耕 *to plough* into a noun, \"one who ploughs\" (compare English *-er*: plough → plough**er**). 有 + V + 者 is the standard way to bring a character on stage: 宋人有耕者 = \"among the people of Song, there was a plougher\". The place or group (宋人) comes first, as the topic.\n", "at_s": "有耕者"}, {"n": 3, "line": 2, "at": "走", "text": "**走 = to run**, not \"to walk\". This is the classic trap of 古今詞義 (old vs. modern meaning): Classical Chinese *walks* with 行 and 步, *runs* with 走, and *hurries* with 趨. Modern 走 has slowed down by one gear. The 說文 already defines 走 as 趨也 \"to hurry\".\n", "at_s": "走"}, {"n": 4, "line": 3, "at": "而", "text": "**而** links two verbs or verb phrases: 折頸**而**死 \"broke its neck *and (so)* died\". It never links two nouns (that's 與). The second 而 in line 5 works the same way: 釋其耒 **而**守株 \"put down his plough *and* watched the stump\". In line 8, 而 marks a contrast: see n. 9.\n", "at_s": "而"}, {"n": 5, "line": 4, "at": "因", "text": "**因** here is an adverb, \"thereupon, and so\", linking the event to what came before. Its core meaning is \"to rely on, to follow from\", which you will meet as a verb and preposition.\n", "at_s": "因"}, {"n": 6, "line": 4, "at": "其", "text": "**其** = *his / her / its / their*. In Classical Chinese 其 is mainly a third-person possessive (其耒 \"his plough\"), not the modern \"that, other\" of 其他. 耒 lěi is a wooden digging fork, the ancestor of the plough (說文: 手耕曲木也 \"a curved wood for tilling by hand\").\n", "at_s": "其"}, {"n": 7, "line": 5, "at": "冀復", "text": "**冀** jì = \"to hope\" (modern 希望). **復** fù = \"again\" (adverb before a verb). *Simplified-character warning:* 复 stands for three different classical words: 復 \"return, again\", 複 \"double, lined (garment)\" and 覆 \"overturn\". Classical texts keep them apart, so the traditional form tells you which word you're reading.\n", "at_s": "冀复"}, {"n": 8, "line": 6, "at": "不可復得", "text": "**可 + verb** has a passive sense: 不可復得 \"could not be got again\". When 可 stands before a transitive verb, the subject is what *receives* the action (兔 the hare is what is \"got\"). Compare 朽木不可雕也 \"rotten wood cannot be carved\" (exercise 3).\n", "at_s": "不可复得"}, {"n": 9, "line": 7, "at": "而身為宋國笑", "text": "Three things in one line: **而** here means \"and yet / and as a result\", with a turn in the story. **身** = \"himself, his own person\" (not \"body\"): the hares didn't come back, but *he* became the joke. **為 A V** is a passive: 為宋國笑 \"was laughed at by the state of Song\" (為 wéi + agent + verb). Later prose often adds 所: 為天下所笑. The 所-less form here is the older one.\n", "at_s": "而身为宋国笑"}, {"n": 10, "line": 8, "at": "以先王之政", "text": "**以 X V Y** = \"to use X to V Y\": 以先王之政，治當世之民 \"to use the government of the former kings to rule the people of today\". **之** between two nouns marks the first as modifying the second, like modern 的: 先王**之**政 \"the former kings' government\", 當世**之**民 \"the present age's people\".\n", "at_s": "以先王之政"}, {"n": 11, "line": 10, "at": "也", "text": "**A，B 也** is the basic Classical judgment sentence, \"A is B\", with no verb \"to be\". The whole of lines 9–10 is A; 皆守株之類 \"all of the stump-watching kind\" is B; 也 closes the judgment. 是 as a copula (\"is\") is a later development; in Han Fei's time 是 means \"this\".\n", "at_s": "也"}, {"n": 12, "line": 10, "at": "守株", "text": "The idiom is 守株待兔 \"watch the stump, wait for the hare\", but 待 *to wait* is not in the original: the four-character form was shaped later. Today it describes anyone who waits for luck instead of working, which is not quite Han Fei's point: he was attacking rulers who apply old policies to a changed world.\n", "at_s": "守株"}], "glossary": [{"w": "宋", "py": "Sòng", "en": "Song, a Warring States state (in present-day Henan)", "checked": [], "w_s": "宋"}, {"w": "耕", "py": "gēng", "en": "to plough", "till": null, "checked": [], "w_s": "耕"}, {"w": "者", "py": "zhě", "en": "nominaliser: 'one who …'", "checked": ["cyz"], "w_s": "者"}, {"w": "田", "py": "tián", "en": "field (under cultivation)", "checked": ["cyz"], "w_s": "田"}, {"w": "株", "py": "zhū", "en": "tree stump; root showing above the ground", "sw": "株，木根也。", "checked": ["cyz", "sw"], "w_s": "株"}, {"w": "兔", "py": "tù", "en": "hare", "rabbit": null, "checked": [], "w_s": "兔"}, {"w": "走", "py": "zǒu", "en": "to run", "sw": "走，趨也。", "checked": ["cyz", "sw"], "w_s": "走"}, {"w": "觸", "py": "chù", "en": "to bump into", "strike": null, "checked": ["cyz"], "w_s": "触"}, {"w": "折", "py": "zhé", "en": "to break", "snap": null, "checked": ["cyz"], "w_s": "折"}, {"w": "頸", "py": "jǐng", "en": "neck", "checked": [], "w_s": "颈"}, {"w": "而", "py": "ér", "en": "and (then); and yet — links verb phrases", "checked": ["cyz"], "w_s": "而"}, {"w": "因", "py": "yīn", "en": "thereupon, and so", "checked": ["cyz"], "w_s": "因"}, {"w": "釋", "py": "shì", "en": "to put down", "let go of": null, "checked": ["cyz"], "w_s": "释"}, {"w": "其", "py": "qí", "en": "his, her, its, their", "checked": ["cyz"], "w_s": "其"}, {"w": "耒", "py": "lěi", "en": "wooden digging fork", "early plough": null, "sw": "耒，手耕曲木也。", "checked": ["cyz", "sw"], "w_s": "耒"}, {"w": "守", "py": "shǒu", "en": "to guard", "keep watch over": null, "checked": ["cyz"], "w_s": "守"}, {"w": "冀", "py": "jì", "en": "to hope", "checked": ["cyz"], "w_s": "冀"}, {"w": "復", "py": "fù", "en": "again", "checked": ["cyz"], "w_s": "复"}, {"w": "得", "py": "dé", "en": "to get", "obtain": null, "checked": ["cyz"], "w_s": "得"}, {"w": "可", "py": "kě", "en": "can (be V-ed)", "checked": ["cyz"], "w_s": "可"}, {"w": "身", "py": "shēn", "en": "oneself, one's own person", "checked": ["cyz"], "w_s": "身"}, {"w": "為", "py": "wéi", "en": "passive marker: 為 A V 'be V-ed by A'", "checked": ["cyz"], "w_s": "为"}, {"w": "國", "py": "guó", "en": "state", "country": null, "checked": ["cyz"], "w_s": "国"}, {"w": "笑", "py": "xiào", "en": "to laugh at", "checked": [], "w_s": "笑"}, {"w": "欲", "py": "yù", "en": "to want to", "checked": ["cyz"], "w_s": "欲"}, {"w": "以", "py": "yǐ", "en": "to use, with (以 X V: use X to V)", "checked": ["cyz"], "w_s": "以"}, {"w": "先王", "py": "xiān wáng", "en": "the former kings (the sage-rulers of antiquity)", "checked": ["cyz"], "w_s": "先王"}, {"w": "之", "py": "zhī", "en": "attributive particle, like modern 的", "checked": ["cyz"], "w_s": "之"}, {"w": "政", "py": "zhèng", "en": "government", "policies": null, "checked": ["cyz"], "w_s": "政"}, {"w": "治", "py": "zhì", "en": "to govern", "rule": null, "checked": ["cyz"], "w_s": "治"}, {"w": "當世", "py": "dāng shì", "en": "the present age", "checked": ["cyz"], "w_s": "当世"}, {"w": "民", "py": "mín", "en": "the people", "commoners": null, "checked": ["cyz"], "w_s": "民"}, {"w": "皆", "py": "jiē", "en": "all, in every case", "checked": ["cyz"], "w_s": "皆"}, {"w": "類", "py": "lèi", "en": "kind", "category": null, "checked": ["cyz"], "w_s": "类"}, {"w": "也", "py": "yě", "en": "final particle closing a judgment ('A is B')", "checked": ["cyz"], "w_s": "也"}], "exercise": [{"h": "兵刃既接，棄甲曳兵而走。", "py": "Bīng rèn jì jiē, qì jiǎ yè bīng ér zǒu.", "src": "孟子·梁惠王上", "en": "When the blades had crossed, they threw off their armour, dragged their weapons and ran.", "tests": "走 = run, 而", "h_s": "兵刃既接，弃甲曳兵而走。"}, {"h": "學而時習之，不亦說乎？", "py": "Xué ér shí xí zhī, bú yì yuè hū?", "src": "論語·學而", "en": "To learn and practise it at the right times — is that not a pleasure?", "tests": "而 linking two verbs (說 = 悅 yuè, \"to be pleased\")", "h_s": "学而时习之，不亦说乎？"}, {"h": "朽木不可雕也，糞土之牆不可杇也。", "py": "Xiǔ mù bù kě diāo yě, fèn tǔ zhī qiáng bù kě wū yě.", "src": "論語·公冶長", "en": "Rotten wood cannot be carved; a wall of dung and earth cannot be plastered.", "tests": "可 + verb (passive sense), 之, 也", "h_s": "朽木不可雕也，粪土之墙不可杇也。"}, {"h": "久矣吾不復夢見周公。", "py": "Jiǔ yǐ wú bú fù mèng jiàn Zhōugōng.", "src": "論語·述而", "en": "For a long time now I have not dreamed again of the Duke of Zhou.", "tests": "復 = again", "h_s": "久矣吾不复梦见周公。"}, {"h": "身死人手，為天下笑者，何也？", "py": "Shēn sǐ rén shǒu, wéi tiānxià xiào zhě, hé yě?", "src": "賈誼·過秦論", "en": "That he died by other men's hands and became the laughing-stock of the world — why?", "tests": "身, 為 A 笑 passive, 者", "h_s": "身死人手，为天下笑者，何也？"}], "culture": "Han Fei (韓非) was a prince of the state of Han and a student of the Confucian Xunzi, yet he became the sharpest critic of Confucian nostalgia. The First Emperor of Qin admired his writings; Han Fei died in a Qin prison in 233 BC, but Qin built its empire on Legalist ideas. \"The Five Vermin\" names the five kinds of people Han Fei thought were eating the state away: scholars, wandering orators, private swordsmen, courtiers who sell influence, and merchants and artisans.\n", "title_s": "守株待兔"}, {"id": 2, "slug": "mao-dun", "title": "自相矛盾", "title_py": "Zì xiāng máo dùn", "title_en": "The Spear and the Shield", "source": {"work": "韓非子·難一", "author": "韓非 (c. 280–233 BC)", "period": "Warring States", "text_from": "《韓非子·難一》, as in Japanese Wikibooks 中学校国語 漢文/矛盾 (CC BY-SA), punctuation modernised; closing sentence matched verbatim against several editions. Many Chinese school editions write 盾 for 楯 and read 物莫能陷也 in line 3 (see n. 1, n. 4).\n", "work_s": "韩非子·难一"}, "status": "draft", "intro": "Han Fei again. In the chapter \"Objections I\" (難一) he argues that the Confucians can't praise the sage-king Yao as a perfect ruler *and* praise Shun for fixing the problems of Yao's reign: one of the two claims must be false. To make the point he tells this story, which gave Chinese its word for \"contradiction\", 矛盾 \"spear-shield\". This lesson's big new idea is the little word 之 placed between a subject and its predicate.\n", "lines": [{"h": "楚人有鬻楯與矛者，", "py": "Chǔ rén yǒu yù dùn yǔ máo zhě,", "en": "There was a man of Chu who sold shields and spears.", "h_s": "楚人有鬻楯与矛者，"}, {"h": "譽之曰：", "py": "yù zhī yuē:", "en": "He praised them, saying:", "h_s": "誉之曰："}, {"h": "「吾楯之堅，莫能陷也。」", "py": "Wú dùn zhī jiān, mò néng xiàn yě.", "en": "\"My shields are so hard that nothing can pierce them.\"", "lit": "my shield 's hardness, nothing can pierce", "h_s": "「吾楯之坚，莫能陷也。」"}, {"h": "又譽其矛曰：", "py": "Yòu yù qí máo yuē:", "en": "Then he praised his spears, saying:", "h_s": "又誉其矛曰："}, {"h": "「吾矛之利，於物無不陷也。」", "py": "Wú máo zhī lì, yú wù wú bù xiàn yě.", "en": "\"My spears are so sharp that there is nothing they can't pierce.\"", "lit": "my spear 's sharpness, among things there-is-none not pierced", "h_s": "「吾矛之利，于物无不陷也。」"}, {"h": "或曰：", "py": "Huò yuē:", "en": "Someone said:", "h_s": "或曰："}, {"h": "「以子之矛，陷子之楯，何如？」", "py": "Yǐ zǐ zhī máo, xiàn zǐ zhī dùn, hé rú?", "en": "\"What if you used your spear to pierce your shield?\"", "h_s": "「以子之矛，陷子之楯，何如？」"}, {"h": "其人弗能應也。", "py": "Qí rén fú néng yìng yě.", "en": "The man could not answer.", "h_s": "其人弗能应也。"}, {"h": "夫不可陷之楯與無不陷之矛，", "py": "Fú bù kě xiàn zhī dùn yǔ wú bù xiàn zhī máo,", "en": "Now, a shield that cannot be pierced and a spear that pierces everything", "h_s": "夫不可陷之楯与无不陷之矛，"}, {"h": "不可同世而立。", "py": "bù kě tóng shì ér lì.", "en": "cannot stand together in the same world.", "h_s": "不可同世而立。"}], "notes": [{"n": 1, "line": 0, "at": "鬻楯", "text": "**鬻** yù = \"to sell\" (the everyday word is 賣). **楯** dùn = \"shield\", written with the wood radical because shields were wooden; later editions and the idiom write **盾**. Both are the same word. 與 joins two nouns: 楯**與**矛 \"shields *and* spears\" (compare 而, which joins verbs: → L1 n.4).\n", "at_s": "鬻楯"}, {"n": 2, "line": 1, "at": "譽之", "text": "**之 as an object pronoun**: 譽**之** \"praised *them*\". After a verb, 之 means him / her / it / them; it can never be a subject. Expect it constantly: 揠之 \"pull at them\", 求之 \"look for it\", 飲之 \"drink it\" in the next lessons. **曰** yuē \"to say\" introduces direct speech.\n", "at_s": "誉之"}, {"n": 3, "line": 2, "at": "吾楯之堅", "text": "**Subject + 之 + predicate.** 吾楯堅 would be a sentence: \"my shield is hard\". Put 之 between subject and predicate — 吾楯**之**堅 — and the sentence becomes a noun phrase, \"the hardness of my shield\", which can then be commented on: \"(as for) the hardness of my shield — nothing can pierce it\". This is one of the most frequent patterns in Classical Chinese; you'll meet it in almost every lesson from now on (吾矛之利 in line 5).\n", "at_s": "吾楯之坚"}, {"n": 4, "line": 2, "at": "莫能陷", "text": "**莫** mò = \"nothing / no one\": 莫能陷 \"nothing can pierce (it)\". 莫 is a pronoun that contains its own negation, so there is no 不. 陷 xiàn = \"to pierce, break into\" (its core meaning is \"to fall into a pit\"). Many editions read 物莫能陷也, \"of things, none can pierce it\", with no change in meaning.\n", "at_s": "莫能陷"}, {"n": 5, "line": 4, "at": "於物無不陷", "text": "**無不 = \"there is none that does not\" = everything.** 無 \"there is no …\", 不 \"not\": two negatives make a strong positive. **於** yú \"among, with regard to\": 於物 \"among things\". Compare 莫 in n. 4: the merchant's two boasts are built as mirror images.\n", "at_s": "于物无不陷"}, {"n": 6, "line": 5, "at": "或", "text": "**或** huò as a subject = \"someone\". (In modern Chinese 或 means \"or\"; that sense exists too, but at the head of a clause 或曰 is \"someone said\".)\n", "at_s": "或"}, {"n": 7, "line": 6, "at": "子之矛", "text": "**子** zǐ = \"you\", a polite address between equals (\"sir\"). 子之矛 \"your spear\": here 之 is the ordinary attributive 之 (→ L1 n.10). 以 X V Y \"use X to V Y\" (→ L1 n.10). **何如** hé rú \"how would it be?\": the question word 何 comes *before* the verb 如.\n", "at_s": "子之矛"}, {"n": 8, "line": 7, "at": "弗能應", "text": "**弗** fú is a negative like 不, but typically used before a transitive verb whose object is left out (\"could not answer *it*\"). 其人 \"that man\" — 其 as a demonstrative here, not \"his\" (→ L1 n.6). 應 yìng \"to respond\".\n", "at_s": "弗能应"}, {"n": 9, "line": 8, "at": "夫", "text": "**夫** fú at the start of a sentence announces a general statement or comment: \"Now, …\". Read fú, not fū (\"man, husband\"). Then 不可陷之楯 \"a shield that cannot be pierced\": a whole verb phrase + 之 + noun = a relative clause (→ L1 n.8 for 不可 + verb).\n", "at_s": "夫"}, {"n": 10, "line": 9, "at": "同世而立", "text": "**同世而立** \"stand in the same age\". 而 links the manner (同世 \"sharing an age\") to the verb 立 \"to stand\" (→ L1 n.4). The idiom 自相矛盾 \"to contradict oneself\" (lit. \"self mutually spear-shield\") is a later coinage; the story itself never uses 自相.\n", "at_s": "同世而立"}], "glossary": [{"w": "楚", "py": "Chǔ", "en": "Chu, the great southern state", "checked": ["cyz"], "w_s": "楚"}, {"w": "鬻", "py": "yù", "en": "to sell", "checked": ["cyz"], "w_s": "鬻"}, {"w": "楯", "py": "dùn", "en": "shield (= 盾)", "checked": ["cyz"], "w_s": "楯"}, {"w": "與", "py": "yǔ", "en": "and (joins nouns)", "checked": ["cyz"], "w_s": "与"}, {"w": "矛", "py": "máo", "en": "spear", "checked": ["cyz"], "w_s": "矛"}, {"w": "譽", "py": "yù", "en": "to praise", "extol": null, "checked": ["cyz"], "w_s": "誉"}, {"w": "曰", "py": "yuē", "en": "to say", "checked": ["cyz"], "w_s": "曰"}, {"w": "吾", "py": "wú", "en": "I, my", "checked": ["cyz"], "w_s": "吾"}, {"w": "堅", "py": "jiān", "en": "hard", "solid": null, "checked": ["cyz"], "w_s": "坚"}, {"w": "莫", "py": "mò", "en": "nothing, no one", "checked": ["cyz"], "w_s": "莫"}, {"w": "能", "py": "néng", "en": "can", "be able to": null, "checked": ["cyz"], "w_s": "能"}, {"w": "陷", "py": "xiàn", "en": "to pierce", "break through": null, "checked": ["cyz"], "w_s": "陷"}, {"w": "又", "py": "yòu", "en": "again, then also", "checked": ["cyz"], "w_s": "又"}, {"w": "利", "py": "lì", "en": "sharp", "checked": ["cyz"], "w_s": "利"}, {"w": "於", "py": "yú", "en": "among, with regard to", "checked": ["cyz"], "w_s": "于"}, {"w": "物", "py": "wù", "en": "thing(s)", "checked": ["cyz"], "w_s": "物"}, {"w": "無", "py": "wú", "en": "there is no …", "checked": ["cyz"], "w_s": "无"}, {"w": "或", "py": "huò", "en": "someone", "checked": ["cyz"], "w_s": "或"}, {"w": "子", "py": "zǐ", "en": "you (polite)", "checked": ["cyz"], "w_s": "子"}, {"w": "何如", "py": "hé rú", "en": "how is it? what about …?", "checked": [], "w_s": "何如"}, {"w": "弗", "py": "fú", "en": "not (before a verb, object left out)", "checked": ["cyz"], "w_s": "弗"}, {"w": "應", "py": "yìng", "en": "to respond", "answer": null, "checked": ["cyz"], "w_s": "应"}, {"w": "夫", "py": "fú", "en": "now (opens a general statement)", "checked": ["cyz"], "w_s": "夫"}, {"w": "同", "py": "tóng", "en": "same; together", "checked": ["cyz"], "w_s": "同"}, {"w": "世", "py": "shì", "en": "age, generation, world", "checked": ["cyz"], "w_s": "世"}, {"w": "立", "py": "lì", "en": "to stand", "checked": ["cyz"], "w_s": "立"}], "exercise": [{"h": "莫我知也夫！", "py": "Mò wǒ zhī yě fú!", "src": "論語·憲問", "en": "No one understands me!", "tests": "莫 = no one (note the object 我 moves before the verb after 莫)", "h_s": "莫我知也夫！"}, {"h": "民無信不立。", "py": "Mín wú xìn bù lì.", "src": "論語·顏淵", "en": "Without trust, the people cannot stand.", "tests": "無, 立", "h_s": "民无信不立。"}, {"h": "燕雀安知鴻鵠之志哉！", "py": "Yàn què ān zhī hóng hú zhī zhì zāi!", "src": "史記·陳涉世家", "en": "How could swallows and sparrows know the ambitions of a swan!", "tests": "之 (attributive)", "h_s": "燕雀安知鸿鹄之志哉！"}, {"h": "道不同，不相為謀。", "py": "Dào bù tóng, bù xiāng wéi móu.", "src": "論語·衛靈公", "en": "Those whose ways differ do not make plans together.", "tests": "同", "h_s": "道不同，不相为谋。"}], "culture": "The story is a weapon in a debate. Han Fei's opponents praised both Yao and Shun as perfect sage-kings; Han Fei answers that if Shun had to correct Yao's mistakes, Yao wasn't perfect, and if Yao was perfect, Shun had nothing to correct: \"you cannot praise both\". The word 矛盾 entered modern Chinese (and Japanese, *mujun*) as the standard term for \"contradiction\", including the Marxist \"contradiction\" of Mao's essay 《矛盾論》.\n", "title_s": "自相矛盾"}, {"id": 3, "slug": "ya-miao", "title": "揠苗助長", "title_py": "Yà miáo zhù zhǎng", "title_en": "Pulling Up the Sprouts to Help Them Grow", "source": {"work": "孟子·公孫丑上", "author": "孟子 Mencius (c. 372–289 BC)", "period": "Warring States", "text_from": "《孟子·公孫丑上》, as quoted on Wiktionary 揠苗助長 (CC BY-SA); lines 1–7 also match the Hong Kong EDB edition.\n", "work_s": "孟子·公孙丑上"}, "status": "draft", "intro": "Mencius, the second great Confucian, is explaining to a disciple how to nourish one's \"flood-like qi\" (浩然之氣), the moral courage that grows from always doing what is right. You can't force it, he says, and you mustn't neglect it either, and he tells this story of yet another man of Song. New in this lesson: the particle 矣, which marks something that *has happened* or *has become* the case, and the reading 長 zhǎng \"to grow\".\n", "lines": [{"h": "宋人有閔其苗之不長而揠之者，", "py": "Sòng rén yǒu mǐn qí miáo zhī bù zhǎng ér yà zhī zhě,", "en": "There was a man of Song who, worried that his sprouts weren't growing, tugged at them.", "lit": "Song people there-was worried his sprouts' not growing and pulled them one", "h_s": "宋人有闵其苗之不长而揠之者，"}, {"h": "芒芒然歸。", "py": "máng máng rán guī.", "en": "He came home, worn out,", "h_s": "芒芒然归。"}, {"h": "謂其人曰：", "py": "Wèi qí rén yuē:", "en": "and said to his family:", "h_s": "谓其人曰："}, {"h": "「今日病矣，", "py": "Jīn rì bìng yǐ,", "en": "\"I'm exhausted today:", "h_s": "「今日病矣，"}, {"h": "予助苗長矣。」", "py": "yú zhù miáo zhǎng yǐ.", "en": "I've been helping the sprouts grow!\"", "h_s": "予助苗长矣。」"}, {"h": "其子趨而往視之，", "py": "Qí zǐ qū ér wǎng shì zhī,", "en": "His son hurried off to look at them;", "h_s": "其子趋而往视之，"}, {"h": "苗則槁矣。", "py": "miáo zé gǎo yǐ.", "en": "the sprouts had withered.", "h_s": "苗则槁矣。"}, {"h": "天下之不助苗長者寡矣。", "py": "Tiān xià zhī bù zhù miáo zhǎng zhě guǎ yǐ.", "en": "In this world, few are those who don't help their sprouts grow.", "h_s": "天下之不助苗长者寡矣。"}, {"h": "以為無益而捨之者，", "py": "Yǐ wéi wú yì ér shě zhī zhě,", "en": "Those who think it's no use and leave them alone", "h_s": "以为无益而舍之者，"}, {"h": "不耘苗者也；", "py": "bù yún miáo zhě yě;", "en": "are those who don't weed their sprouts;", "h_s": "不耘苗者也；"}, {"h": "助之長者，", "py": "zhù zhī zhǎng zhě,", "en": "those who help them grow", "h_s": "助之长者，"}, {"h": "揠苗者也。", "py": "yà miáo zhě yě.", "en": "are those who tug at their sprouts.", "h_s": "揠苗者也。"}, {"h": "非徒無益，", "py": "Fēi tú wú yì,", "en": "Not only is that no use —", "h_s": "非徒无益，"}, {"h": "而又害之。", "py": "ér yòu hài zhī.", "en": "it actually harms them.", "h_s": "而又害之。"}], "notes": [{"n": 1, "line": 0, "at": "閔其苗之不長", "text": "A long first line, built like L1's 宋人有耕者: 宋人 **有** [ … ] **者** \"among the people of Song there was one who …\" (→ L1 n.2). Inside the brackets: 閔 mǐn \"to worry about\" (later written 憫) + its object 其苗之不長 \"his sprouts' not growing\", the subject + 之 + predicate pattern of → L2 n.3. Then 而揠之 \"and pulled at them\" (→ L1 n.4, L2 n.2).\n", "at_s": "闵其苗之不长"}, {"n": 2, "line": 0, "at": "長", "text": "**長** has two readings. zhǎng = \"to grow; to be the elder, to lead\"; cháng = \"long\". Here, and in the idiom 揠苗助長, it is zhǎng. Chinese often marks a change of word by a change of tone or initial (破音字); the dictionary entry for 長 lists them separately.\n", "at_s": "长"}, {"n": 3, "line": 1, "at": "芒芒然", "text": "**-然** rán turns a word into a description of manner: 芒芒然 \"in a weary way, worn out\". 芒芒 is a reduplicated descriptive word; commentators gloss it as 疲倦的樣子 \"looking tired\". You'll meet many ~然 words: 忽然, 果然 and 自然 all come from this pattern.\n", "at_s": "芒芒然"}, {"n": 4, "line": 2, "at": "謂其人", "text": "**謂 A 曰** \"said to A\": 謂 takes the person spoken to as its object. **其人** here is \"his household, his family\". Compare L2 n.8, where 其人 meant \"that man\": context decides.\n", "at_s": "谓其人"}, {"n": 5, "line": 3, "at": "病矣", "text": "**病** = \"exhausted, worn out\", not \"ill\" (古今詞義 → L1 n.3). In early texts 疾 is the ordinary word for illness and 病 a *serious* illness or extreme fatigue. **矣** yǐ marks a new situation: \"I'm (now) exhausted\". 也 states what *is* (→ L1 n.11); 矣 states what *has come to be*. The story turns on three 矣 (lines 4, 5 and 7): he is tired now, the sprouts have been \"helped\", and by then they have withered.\n", "at_s": "病矣"}, {"n": 6, "line": 4, "at": "予", "text": "**予** yú = \"I, me\". Classical Chinese has several first-person pronouns: 吾 (L2), 我, 予/余. Here the farmer is boasting.\n", "at_s": "予"}, {"n": 7, "line": 5, "at": "趨而往視之", "text": "**趨** qū \"to hurry, walk fast\" — the middle gear between 行 \"walk\" and 走 \"run\" (→ L1 n.3). **往** \"to go (to)\", **視** \"to look at\". 而 again links the manner to the action.\n", "at_s": "趋而往视之"}, {"n": 8, "line": 6, "at": "則", "text": "**則** zé \"then, and so\": here it marks what the son *found*: \"the sprouts — (by then) they had withered\". 槁 gǎo \"dried up, withered\".\n", "at_s": "则"}, {"n": 9, "line": 7, "at": "天下之不助苗長者寡矣", "text": "Mencius turns to the moral. The subject is a long 者-phrase: 天下之 [不助苗長] 者 \"those in the world who don't help their sprouts grow\", and the predicate is 寡矣 \"are few\". **寡** guǎ \"few\" (its opposite is 眾). In other words: almost everyone forces things.\n", "at_s": "天下之不助苗长者寡矣"}, {"n": 10, "line": 8, "at": "以為", "text": "**以為** yǐ wéi \"to think, consider that\". Here it introduces a whole clause: 以為無益 \"think it is no use\". (In L6 you will see 以 A 為 B \"regard A as B\" split around its object.) **捨** shě \"to give up, leave alone\" (also written 舍).\n", "at_s": "以为"}, {"n": 11, "line": 9, "at": "者也", "text": "**A 者，B 者也** — the classic definition sentence: \"A is B\". Both halves are 者 phrases (\"those who …\"), and 也 closes the judgment (→ L1 n.11). Lines 9–12 give two of them in parallel: neglecting = not weeding; forcing = tugging.\n", "at_s": "者也"}, {"n": 12, "line": 12, "at": "非徒", "text": "**非徒 … 而又 …** \"not only … but also …\". 非 fēi negates a whole statement or a noun (\"it is not that …\"), whereas 不 negates a verb. 徒 tú \"merely, only\". 害 \"to harm\".\n", "at_s": "非徒"}], "glossary": [{"w": "閔", "py": "mǐn", "en": "to worry about, pity (= 憫)", "checked": ["cyz"], "w_s": "闵"}, {"w": "苗", "py": "miáo", "en": "sprout", "young crop": null, "checked": ["cyz"], "w_s": "苗"}, {"w": "長", "py": "zhǎng", "en": "to grow", "checked": ["cyz"], "w_s": "长"}, {"w": "揠", "py": "yà", "en": "to pull up", "tug at": null, "checked": ["cyz"], "w_s": "揠"}, {"w": "芒芒然", "py": "máng máng rán", "en": "worn out, weary", "checked": [], "w_s": "芒芒然"}, {"w": "歸", "py": "guī", "en": "to return home", "checked": ["cyz"], "w_s": "归"}, {"w": "謂", "py": "wèi", "en": "to say to; to call", "checked": ["cyz"], "w_s": "谓"}, {"w": "今日", "py": "jīn rì", "en": "today", "checked": [], "w_s": "今日"}, {"w": "病", "py": "bìng", "en": "exhausted; (seriously) ill", "checked": [], "w_s": "病"}, {"w": "矣", "py": "yǐ", "en": "final particle: new situation, completed change", "checked": ["cyz"], "w_s": "矣"}, {"w": "予", "py": "yú", "en": "I, me", "checked": ["cyz"], "w_s": "予"}, {"w": "助", "py": "zhù", "en": "to help", "checked": [], "w_s": "助"}, {"w": "趨", "py": "qū", "en": "to hurry", "walk fast": null, "checked": ["cyz"], "w_s": "趋"}, {"w": "往", "py": "wǎng", "en": "to go to", "checked": ["cyz"], "w_s": "往"}, {"w": "視", "py": "shì", "en": "to look at", "checked": ["cyz"], "w_s": "视"}, {"w": "則", "py": "zé", "en": "then; (only to find that)", "checked": ["cyz"], "w_s": "则"}, {"w": "槁", "py": "gǎo", "en": "withered", "dried up": null, "checked": ["cyz"], "w_s": "槁"}, {"w": "天下", "py": "tiān xià", "en": "the world (lit. under heaven)", "checked": [], "w_s": "天下"}, {"w": "寡", "py": "guǎ", "en": "few", "checked": ["cyz"], "w_s": "寡"}, {"w": "以為", "py": "yǐ wéi", "en": "to think, consider that", "checked": [], "w_s": "以为"}, {"w": "益", "py": "yì", "en": "benefit, use", "checked": ["cyz"], "w_s": "益"}, {"w": "捨", "py": "shě", "en": "to give up, leave alone (= 舍)", "checked": ["cyz"], "w_s": "舍"}, {"w": "耘", "py": "yún", "en": "to weed", "checked": ["cyz"], "w_s": "耘"}, {"w": "非", "py": "fēi", "en": "it is not (negates a statement)", "checked": ["cyz"], "w_s": "非"}, {"w": "徒", "py": "tú", "en": "merely, only", "checked": ["cyz"], "w_s": "徒"}, {"w": "害", "py": "hài", "en": "to harm", "checked": ["cyz"], "w_s": "害"}], "exercise": [{"h": "學而不思則罔，思而不學則殆。", "py": "Xué ér bù sī zé wǎng, sī ér bù xué zé dài.", "src": "論語·為政", "en": "To learn without thinking is to be lost; to think without learning is dangerous.", "tests": "而, 則", "h_s": "学而不思则罔，思而不学则殆。"}, {"h": "甚矣吾衰也！久矣吾不復夢見周公。", "py": "Shèn yǐ wú shuāi yě! Jiǔ yǐ wú bù fù mèng jiàn Zhōugōng.", "src": "論語·述而", "en": "How far I have declined! For a long time now I have not dreamed of the Duke of Zhou.", "tests": "矣, 也, 復 (→ L1)", "h_s": "甚矣吾衰也！久矣吾不复梦见周公。"}, {"h": "天生德於予，桓魋其如予何？", "py": "Tiān shēng dé yú yú, Huán Tuí qí rú yú hé?", "src": "論語·述而", "en": "Heaven gave birth to the virtue in me — what can Huan Tui do to me?", "tests": "予", "h_s": "天生德于予，桓魋其如予何？"}, {"h": "子謂顏淵曰：「用之則行，舍之則藏，惟我與爾有是夫！」", "py": "Zǐ wèi Yán Yuān yuē: Yòng zhī zé xíng, shě zhī zé cáng, wéi wǒ yǔ ěr yǒu shì fú!", "src": "論語·述而", "en": "The Master said to Yan Yuan: \"When employed, act; when set aside, withdraw — only you and I have this!\"", "tests": "謂 A 曰, 則, 舍", "h_s": "子谓颜渊曰：「用之则行，舍之则藏，惟我与尔有是夫！」"}], "culture": "This passage is the second half of Mencius's famous answer on 浩然之氣 (Mencius 2A:2). His advice: keep working at righteousness, \"don't forget it, but don't help it grow\" (勿忘，勿助長也). The idiom 揠苗助長 (also 拔苗助長 in modern mainland usage) means to spoil something by being too eager, often said of pushy parents and over-ambitious reforms.\n", "title_s": "揠苗助长"}, {"id": 4, "slug": "ke-zhou", "title": "刻舟求劍", "title_py": "Kè zhōu qiú jiàn", "title_en": "Notching the Boat to Find the Sword", "source": {"work": "呂氏春秋·察今", "author": "compiled under 呂不韋 Lü Buwei (d. 235 BC)", "period": "late Warring States (c. 239 BC)", "text_from": "《呂氏春秋·慎大覽·察今》; first sentence as quoted in 王力《古代漢語》 (with 於 for its 于), the rest matched against two published editions.\n", "work_s": "吕氏春秋·察今"}, "status": "draft", "intro": "The *Springs and Autumns of Master Lü* is an encyclopedia commissioned by Lü Buwei, chancellor of Qin, from the scholars he kept at his court. The chapter \"Examining the Present\" (察今) argues the same point as L1: laws must change with the times. This fable brings two important new tools: 所, which turns a verb into \"the place / thing that …\", and the rhetorical question 不亦…乎.\n", "lines": [{"h": "楚人有涉江者，", "py": "Chǔ rén yǒu shè jiāng zhě,", "en": "A man of Chu was crossing the river.", "lit": "Chu people there-was crossing river one", "h_s": "楚人有涉江者，"}, {"h": "其劍自舟中墜於水，", "py": "qí jiàn zì zhōu zhōng zhuì yú shuǐ,", "en": "His sword fell from the boat into the water.", "h_s": "其剑自舟中坠于水，"}, {"h": "遽契其舟，曰：", "py": "jù qì qí zhōu, yuē:", "en": "At once he cut a notch in the boat, saying:", "h_s": "遽契其舟，曰："}, {"h": "「是吾劍之所從墜。」", "py": "Shì wú jiàn zhī suǒ cóng zhuì.", "en": "\"This is where my sword fell from.\"", "lit": "this my sword 's place-from-which fell", "h_s": "「是吾剑之所从坠。」"}, {"h": "舟止，", "py": "Zhōu zhǐ,", "en": "When the boat stopped,", "h_s": "舟止，"}, {"h": "從其所契者入水求之。", "py": "cóng qí suǒ qì zhě rù shuǐ qiú zhī.", "en": "he went into the water from the place he had notched, to look for it.", "h_s": "从其所契者入水求之。"}, {"h": "舟已行矣，", "py": "Zhōu yǐ xíng yǐ,", "en": "The boat had moved on,", "h_s": "舟已行矣，"}, {"h": "而劍不行，", "py": "ér jiàn bù xíng,", "en": "but the sword had not.", "h_s": "而剑不行，"}, {"h": "求劍若此，", "py": "qiú jiàn ruò cǐ,", "en": "To look for a sword like this —", "h_s": "求剑若此，"}, {"h": "不亦惑乎？", "py": "bù yì huò hū?", "en": "isn't that foolish?", "h_s": "不亦惑乎？"}, {"h": "以此故法為其國，", "py": "Yǐ cǐ gù fǎ wéi qí guó,", "en": "To run one's state with these old laws", "h_s": "以此故法为其国，"}, {"h": "與此同。", "py": "yǔ cǐ tóng.", "en": "is just the same.", "h_s": "与此同。"}, {"h": "時已徙矣，", "py": "Shí yǐ xǐ yǐ,", "en": "The times have moved on,", "h_s": "时已徙矣，"}, {"h": "而法不徙，", "py": "ér fǎ bù xǐ,", "en": "but the laws have not;", "h_s": "而法不徙，"}, {"h": "以此為治，", "py": "yǐ cǐ wéi zhì,", "en": "to govern like this —", "h_s": "以此为治，"}, {"h": "豈不難哉！", "py": "qǐ bù nán zāi!", "en": "how could it not be hard!", "h_s": "岂不难哉！"}], "notes": [{"n": 1, "line": 0, "at": "涉江", "text": "**涉** shè \"to cross (a river), wade\". **江** jiāng is *the* River, the Yangzi, just as 河 is the Yellow River. Only later did 江 and 河 become general words for \"river\" (古今詞義). 楚人有涉江者 has the same shape as L1's opening (→ L1 n.2).\n", "at_s": "涉江"}, {"n": 2, "line": 1, "at": "自舟中墜於水", "text": "Two prepositions: **自** \"from\" (自舟中 \"from inside the boat\") and **於** \"into, at\" (墜於水 \"fell into the water\"). Notice the order: 自 phrases come *before* the verb, 於 phrases *after* it. 墜 zhuì \"to fall, drop\".\n", "at_s": "自舟中坠于水"}, {"n": 3, "line": 2, "at": "遽契", "text": "**遽** jù \"at once, hastily\" (modern 立刻 or 急忙); it shows the man's panic. **契** qì \"to carve, notch\" (the same word is written 鍥). The modern meaning \"contract\" comes from notched wooden tallies.\n", "at_s": "遽契"}, {"n": 4, "line": 3, "at": "是", "text": "**是 = \"this\"**, not \"is\" (→ L1 n.11). 是吾劍之所從墜 is a judgment sentence with no verb: \"this [is] the place my sword fell from\".\n", "at_s": "是"}, {"n": 5, "line": 3, "at": "所從墜", "text": "**所 + (preposition) + verb = \"the place / thing that …\"**. 所 makes a verb into a noun phrase that refers to its object or circumstance: 所墜 \"what fell\"; 所從墜 \"where (something) fell *from*\". Put a subject + 之 in front: 吾劍之所從墜 \"the place my sword fell from\". In line 6, 其所契者 \"the place he had notched\" adds 者 at the end, with no change of meaning.\n", "at_s": "所从坠"}, {"n": 6, "line": 6, "at": "已行矣", "text": "**已 … 矣** \"already … (now)\": 已 yǐ \"already\" before the verb, 矣 (→ L3 n.5) at the end for the completed change. Two different characters both read yǐ. And **行** here is \"to move, go\", not \"to walk\" — it's used of the boat (→ L1 n.3).\n", "at_s": "已行矣"}, {"n": 7, "line": 8, "at": "若此", "text": "**若此** \"like this\" (若 = 如 \"to be like\"; 此 \"this\"). 此 is the ordinary demonstrative \"this\"; 是 (n. 4) is \"this\" used to sum up or point back.\n", "at_s": "若此"}, {"n": 8, "line": 9, "at": "不亦惑乎", "text": "**不亦 … 乎** is a rhetorical question expecting \"yes\": \"isn't it (also) …?\". You already met it in the first line of the 論語 (→ L1 exercise 2: 不亦說乎). **乎** hū is the question particle; **惑** huò \"confused, deluded, foolish\".\n", "at_s": "不亦惑乎"}, {"n": 9, "line": 10, "at": "故法為其國", "text": "**故** gù here = \"old, former\" (故法 \"old laws\"; compare 故鄉 \"old home\"). **為** wéi \"to manage, run\": 為國 \"to run a state\". 以 A 為 B would be \"regard A as B\", but here 以此故法 is simply \"with these old laws\" (→ L1 n.10).\n", "at_s": "故法为其国"}, {"n": 10, "line": 12, "at": "徙", "text": "**徙** xǐ \"to move, shift\" — used of people, capitals, and here of the times. The author mirrors the story: the boat moved, the sword didn't; the times moved, the laws didn't.\n", "at_s": "徙"}, {"n": 11, "line": 15, "at": "豈不難哉", "text": "**豈 … 哉** \"how could …?!\": 豈 qǐ starts a rhetorical question, 哉 zāi ends an exclamation. 豈不難哉 \"how could it not be difficult!\" = it is certainly difficult.\n", "at_s": "岂不难哉"}], "glossary": [{"w": "涉", "py": "shè", "en": "to cross (a river)", "checked": ["cyz"], "w_s": "涉"}, {"w": "江", "py": "jiāng", "en": "the Yangzi; (later) river", "checked": ["cyz"], "w_s": "江"}, {"w": "劍", "py": "jiàn", "en": "sword", "checked": [], "w_s": "剑"}, {"w": "自", "py": "zì", "en": "from", "checked": ["cyz"], "w_s": "自"}, {"w": "舟", "py": "zhōu", "en": "boat", "checked": ["cyz"], "w_s": "舟"}, {"w": "墜", "py": "zhuì", "en": "to fall", "drop": null, "checked": ["cyz"], "w_s": "坠"}, {"w": "遽", "py": "jù", "en": "at once, hastily", "checked": ["cyz"], "w_s": "遽"}, {"w": "契", "py": "qì", "en": "to carve a notch", "checked": ["cyz"], "w_s": "契"}, {"w": "是", "py": "shì", "en": "this (summing up)", "checked": ["cyz"], "w_s": "是"}, {"w": "所", "py": "suǒ", "en": "nominaliser: the place / thing that …", "checked": ["cyz"], "w_s": "所"}, {"w": "從", "py": "cóng", "en": "from", "checked": ["cyz"], "w_s": "从"}, {"w": "止", "py": "zhǐ", "en": "to stop", "checked": ["cyz"], "w_s": "止"}, {"w": "入", "py": "rù", "en": "to enter", "checked": ["cyz"], "w_s": "入"}, {"w": "求", "py": "qiú", "en": "to look for, seek", "checked": ["cyz"], "w_s": "求"}, {"w": "已", "py": "yǐ", "en": "already", "checked": ["cyz"], "w_s": "已"}, {"w": "行", "py": "xíng", "en": "to move, go", "checked": ["cyz"], "w_s": "行"}, {"w": "若", "py": "ruò", "en": "like, as", "checked": ["cyz"], "w_s": "若"}, {"w": "此", "py": "cǐ", "en": "this", "checked": ["cyz"], "w_s": "此"}, {"w": "亦", "py": "yì", "en": "also (不亦…乎 isn't it …?)", "checked": ["cyz"], "w_s": "亦"}, {"w": "惑", "py": "huò", "en": "deluded, foolish", "checked": ["cyz"], "w_s": "惑"}, {"w": "乎", "py": "hū", "en": "question particle", "checked": ["cyz"], "w_s": "乎"}, {"w": "故", "py": "gù", "en": "old, former", "checked": ["cyz"], "w_s": "故"}, {"w": "法", "py": "fǎ", "en": "law, method", "checked": ["cyz"], "w_s": "法"}, {"w": "時", "py": "shí", "en": "the times", "checked": ["cyz"], "w_s": "时"}, {"w": "徙", "py": "xǐ", "en": "to move, shift", "checked": ["cyz"], "w_s": "徙"}, {"w": "豈", "py": "qǐ", "en": "how could …? (rhetorical)", "checked": ["cyz"], "w_s": "岂"}, {"w": "難", "py": "nán", "en": "difficult", "checked": ["cyz"], "w_s": "难"}, {"w": "哉", "py": "zāi", "en": "exclamatory particle", "checked": ["cyz"], "w_s": "哉"}], "exercise": [{"h": "學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？", "py": "Xué ér shí xí zhī, bù yì yuè hū? Yǒu péng zì yuǎn fāng lái, bù yì lè hū?", "src": "論語·學而", "en": "To learn and practise it at the right times — is that not a pleasure? To have friends come from afar — is that not a joy?", "tests": "不亦…乎, 自", "h_s": "学而时习之，不亦说乎？有朋自远方来，不亦乐乎？"}, {"h": "己所不欲，勿施於人。", "py": "Jǐ suǒ bù yù, wù shī yú rén.", "src": "論語·衛靈公", "en": "What you yourself do not want, do not do to others.", "tests": "所 (所不欲 \"what one doesn't want\"), 於", "h_s": "己所不欲，勿施于人。"}, {"h": "是可忍也，孰不可忍也？", "py": "Shì kě rěn yě, shú bù kě rěn yě?", "src": "論語·八佾", "en": "If this can be tolerated, what cannot?", "tests": "是 = this, 可 + verb (→ L1 n.8)", "h_s": "是可忍也，孰不可忍也？"}, {"h": "逝者如斯夫！不舍晝夜。", "py": "Shì zhě rú sī fú! Bù shě zhòu yè.", "src": "論語·子罕", "en": "What passes away is like this, day and night without ceasing!", "tests": "如 = 若, 者, 夫 (exclamatory, at the end)", "h_s": "逝者如斯夫！不舍昼夜。"}], "culture": "Lü Buwei, a merchant, became chancellor of Qin and patron of the young king who would become the First Emperor. He had the book displayed at the gate of the Qin capital and offered a thousand pieces of gold to anyone who could add or remove a single character (一字千金). Like Han Fei, the authors of 察今 argue against copying the laws of the ancient kings: \"times change, so laws must change\".\n", "title_s": "刻舟求剑"}, {"id": 5, "slug": "hua-she", "title": "畫蛇添足", "title_py": "Huà shé tiān zú", "title_en": "Drawing Feet on the Snake", "source": {"work": "戰國策·齊策二", "author": "anonymous; compiled by 劉向 Liu Xiang (77–6 BC)", "period": "Warring States stories, Han compilation", "text_from": "《戰國策·齊策二·昭陽為楚伐魏》, the standard text, matched against a published edition and the 古汉语常用字字典's quotation of the last line; punctuation modernised.\n", "work_s": "战国策·齐策二"}, "status": "draft", "intro": "The *Intrigues of the Warring States* collects the speeches of travelling persuaders, men who went from court to court selling strategies. Here the persuader 陳軫 Chen Zhen meets a Chu general who has just won a great victory and wants to attack the state of Qi as well. He tells him this story to say: you already have the wine — stop while you're ahead. New in this lesson: the \"not yet\" negative 未, the question word 安 \"how\", and 為 meaning \"to make\".\n", "lines": [{"h": "楚有祠者，", "py": "Chǔ yǒu cí zhě,", "en": "In Chu there was a man who made a sacrifice to his ancestors.", "h_s": "楚有祠者，"}, {"h": "賜其舍人卮酒。", "py": "cì qí shè rén zhī jiǔ.", "en": "He gave his retainers a flagon of wine.", "h_s": "赐其舍人卮酒。"}, {"h": "舍人相謂曰：", "py": "Shè rén xiāng wèi yuē:", "en": "The retainers said to one another:", "h_s": "舍人相谓曰："}, {"h": "「數人飲之不足，", "py": "Shù rén yǐn zhī bù zú,", "en": "\"For several of us to drink it, it's not enough;", "h_s": "「数人饮之不足，"}, {"h": "一人飲之有餘。", "py": "yī rén yǐn zhī yǒu yú.", "en": "for one to drink it, there's more than enough.", "h_s": "一人饮之有余。"}, {"h": "請畫地為蛇，", "py": "Qǐng huà dì wéi shé,", "en": "Let's each draw a snake on the ground,", "h_s": "请画地为蛇，"}, {"h": "先成者飲酒。」", "py": "xiān chéng zhě yǐn jiǔ.", "en": "and whoever finishes first drinks the wine.\"", "h_s": "先成者饮酒。」"}, {"h": "一人蛇先成，", "py": "Yī rén shé xiān chéng,", "en": "One man's snake was done first.", "h_s": "一人蛇先成，"}, {"h": "引酒且飲之，", "py": "yǐn jiǔ qiě yǐn zhī,", "en": "He pulled the wine towards him and was about to drink it,", "h_s": "引酒且饮之，"}, {"h": "乃左手持卮，", "py": "nǎi zuǒ shǒu chí zhī,", "en": "but then, holding the flagon in his left hand,", "h_s": "乃左手持卮，"}, {"h": "右手畫蛇，曰：", "py": "yòu shǒu huà shé, yuē:", "en": "and drawing on the snake with his right, he said:", "h_s": "右手画蛇，曰："}, {"h": "「吾能為之足。」", "py": "Wú néng wéi zhī zú.", "en": "\"I can give it feet!\"", "lit": "I can make it feet", "h_s": "「吾能为之足。」"}, {"h": "未成，", "py": "Wèi chéng,", "en": "Before he had finished,", "h_s": "未成，"}, {"h": "一人之蛇成，", "py": "yī rén zhī shé chéng,", "en": "another man's snake was done.", "h_s": "一人之蛇成，"}, {"h": "奪其卮曰：", "py": "duó qí zhī yuē:", "en": "He snatched the flagon and said:", "h_s": "夺其卮曰："}, {"h": "「蛇固無足，", "py": "Shé gù wú zú,", "en": "\"Snakes have no feet, of course:", "h_s": "「蛇固无足，"}, {"h": "子安能為之足？」", "py": "zǐ ān néng wéi zhī zú?", "en": "how can you give it feet?\"", "h_s": "子安能为之足？」"}, {"h": "遂飲其酒。", "py": "Suì yǐn qí jiǔ.", "en": "And so he drank the wine.", "h_s": "遂饮其酒。"}, {"h": "為蛇足者，", "py": "Wéi shé zú zhě,", "en": "The one who drew feet on the snake", "h_s": "为蛇足者，"}, {"h": "終亡其酒。", "py": "zhōng wáng qí jiǔ.", "en": "lost his wine in the end.", "h_s": "终亡其酒。"}], "notes": [{"n": 1, "line": 0, "at": "祠", "text": "**祠** cí \"to make an offering (to ancestors or spirits)\". After the rite the sacrificial wine was shared out. 楚有祠者 \"in Chu there was one who sacrificed\": the 有…者 opening again (→ L1 n.2), this time with a place (楚) as the topic.\n", "at_s": "祠"}, {"n": 2, "line": 1, "at": "舍人卮酒", "text": "**舍人** shè rén \"retainers, household men\" (舍 \"lodging\": those who lodged in his house). **卮** zhī is a wine flagon; 卮酒 \"a flagon of wine\" — the container works as a measure word. **賜** cì \"to give (from a superior)\". 賜 + person + thing: two objects, as in English \"gave his men wine\".\n", "at_s": "舍人卮酒"}, {"n": 3, "line": 2, "at": "相謂", "text": "**相** xiāng before a verb = \"each other, mutually\": 相謂 \"said to each other\". (It can also mean \"to someone\", as in modern 相信, but here it's reciprocal.)\n", "at_s": "相谓"}, {"n": 4, "line": 3, "at": "數人飲之不足", "text": "**數** shù \"several\" (read shǔ as the verb \"to count\"). The two lines are a perfect parallel pair: 數人飲之 | 不足 / 一人飲之 | 有餘. **足** \"enough\" and **餘** \"surplus\". The whole story will pun on 足, which also means \"foot\".\n", "at_s": "数人饮之不足"}, {"n": 5, "line": 5, "at": "請", "text": "**請** qǐng \"please (let us) …\": a polite proposal. **畫地為蛇** \"draw on the ground to make a snake\": 為 wéi \"to make, to be (as)\".\n", "at_s": "请"}, {"n": 6, "line": 8, "at": "且", "text": "**且** qiě before a verb = \"about to\": 且飲之 \"was about to drink it\". (Elsewhere 且 means \"and, moreover\".) **引** yǐn \"to draw, pull towards oneself\".\n", "at_s": "且"}, {"n": 7, "line": 9, "at": "乃", "text": "**乃** nǎi \"then, thereupon\", often with a sense of surprise or contrast: \"but then he …\". Compare 因 (→ L1 n.5) and 遂 (n. 11).\n", "at_s": "乃"}, {"n": 8, "line": 11, "at": "為之足", "text": "**為之足** wéi zhī zú \"make feet for it\": 為 takes two objects, 之 \"it (the snake)\" and 足 \"feet\". Some editions and teachers read it wèi zhī zú \"draw feet *for* it\", with 為 as a preposition; the meaning is the same.\n", "at_s": "为之足"}, {"n": 9, "line": 12, "at": "未", "text": "**未** wèi = \"not yet\". 未成 \"(he had) not yet finished\". Compare 不 (simple \"not\") and 弗 (→ L2 n.8). 未 often implies \"but it will / should happen\".\n", "at_s": "未"}, {"n": 10, "line": 15, "at": "固", "text": "**固** gù \"certainly, by nature, of course\": 蛇固無足 \"snakes, by their nature, have no feet\". **安** ān in line 17 is a question word, \"how? where?\": 子安能 \"how can you …?\" — not \"peaceful\".\n", "at_s": "固"}, {"n": 11, "line": 17, "at": "遂", "text": "**遂** suì \"and so, thereupon, then (as a result)\". **飲其酒** \"drank *his* wine\": 其 is the would-be winner's — it was his by rights.\n", "at_s": "遂"}, {"n": 12, "line": 19, "at": "亡", "text": "**亡** wáng = \"to lose\" (and \"to flee, to perish\"), not only \"to die\". 終亡其酒 \"in the end lost his wine\". **終** zhōng \"in the end\". The idiom 畫蛇添足 \"draw a snake and add feet\" means to spoil something by overdoing it.\n", "at_s": "亡"}], "glossary": [{"w": "祠", "py": "cí", "en": "to make an offering (to ancestors)", "checked": ["cyz"], "w_s": "祠"}, {"w": "賜", "py": "cì", "en": "to give (to an inferior)", "checked": ["cyz"], "w_s": "赐"}, {"w": "舍人", "py": "shè rén", "en": "retainers, household men", "checked": [], "w_s": "舍人"}, {"w": "卮", "py": "zhī", "en": "wine flagon", "checked": ["cyz"], "w_s": "卮"}, {"w": "酒", "py": "jiǔ", "en": "wine", "checked": [], "w_s": "酒"}, {"w": "相", "py": "xiāng", "en": "each other", "checked": ["cyz"], "w_s": "相"}, {"w": "數", "py": "shù", "en": "several", "checked": ["cyz"], "w_s": "数"}, {"w": "飲", "py": "yǐn", "en": "to drink", "checked": ["cyz"], "w_s": "饮"}, {"w": "足", "py": "zú", "en": "enough; foot", "checked": ["cyz"], "w_s": "足"}, {"w": "餘", "py": "yú", "en": "surplus, more than enough", "checked": ["cyz"], "w_s": "余"}, {"w": "請", "py": "qǐng", "en": "please, let us …", "checked": ["cyz"], "w_s": "请"}, {"w": "畫", "py": "huà", "en": "to draw", "checked": ["cyz"], "w_s": "画"}, {"w": "蛇", "py": "shé", "en": "snake", "checked": [], "w_s": "蛇"}, {"w": "先", "py": "xiān", "en": "first", "checked": ["cyz"], "w_s": "先"}, {"w": "成", "py": "chéng", "en": "to complete, be finished", "checked": ["cyz"], "w_s": "成"}, {"w": "引", "py": "yǐn", "en": "to pull towards oneself", "checked": ["cyz"], "w_s": "引"}, {"w": "且", "py": "qiě", "en": "about to", "checked": ["cyz"], "w_s": "且"}, {"w": "乃", "py": "nǎi", "en": "then, thereupon", "checked": ["cyz"], "w_s": "乃"}, {"w": "持", "py": "chí", "en": "to hold", "checked": ["cyz"], "w_s": "持"}, {"w": "未", "py": "wèi", "en": "not yet", "checked": ["cyz"], "w_s": "未"}, {"w": "奪", "py": "duó", "en": "to snatch, seize", "checked": ["cyz"], "w_s": "夺"}, {"w": "固", "py": "gù", "en": "by nature, certainly", "checked": ["cyz"], "w_s": "固"}, {"w": "安", "py": "ān", "en": "how? (question word)", "checked": ["cyz"], "w_s": "安"}, {"w": "遂", "py": "suì", "en": "thereupon, and so", "checked": ["cyz"], "w_s": "遂"}, {"w": "終", "py": "zhōng", "en": "in the end", "checked": ["cyz"], "w_s": "终"}, {"w": "亡", "py": "wáng", "en": "to lose", "checked": ["cyz"], "w_s": "亡"}], "exercise": [{"h": "未知生，焉知死？", "py": "Wèi zhī shēng, yān zhī sǐ?", "src": "論語·先進", "en": "Not yet understanding life, how could one understand death?", "tests": "未, 焉 = 安 \"how\"", "h_s": "未知生，焉知死？"}, {"h": "亡羊而補牢，未為遲也。", "py": "Wáng yáng ér bǔ láo, wèi wéi chí yě.", "src": "戰國策·楚策四", "en": "To mend the pen after losing a sheep is not yet too late.", "tests": "亡 = lose, 未, 而", "h_s": "亡羊而补牢，未为迟也。"}, {"h": "泉涸，魚相與處於陸，相呴以濕，相濡以沫，不如相忘於江湖。", "py": "Quán hé, yú xiāng yǔ chǔ yú lù, xiāng xǔ yǐ shī, xiāng rú yǐ mò, bù rú xiāng wàng yú jiāng hú.", "src": "莊子·大宗師", "en": "When the spring dries up, the fish are left together on dry land; they moisten each other with their breath and wet each other with their spittle. Better to forget each other in the rivers and lakes.", "tests": "相 = each other, 於", "h_s": "泉涸，鱼相与处于陆，相呴以湿，相濡以沫，不如相忘于江湖。"}], "culture": "The frame story: 昭陽 Zhao Yang, chief minister and general of Chu, has crushed Wei and is marching on Qi. Qi sends 陳軫 Chen Zhen to him. After the fable Chen Zhen points out that Zhao Yang already holds the highest rank Chu can give; even if he wins, he gains nothing more, and if he loses, he loses everything — like the man who drew the feet. Zhao Yang turned back.\n", "title_s": "画蛇添足"}, {"id": 6, "slug": "hu-jia-hu-wei", "title": "狐假虎威", "title_py": "Hú jiǎ hǔ wēi", "title_en": "The Fox Borrows the Tiger's Might", "source": {"work": "戰國策·楚策一", "author": "anonymous; compiled by 劉向 Liu Xiang (77–6 BC)", "period": "Warring States stories, Han compilation", "text_from": "《戰國策·楚策一·江乙對荊宣王》, as printed in 王力《古代漢語》 unit 1; its dash before 猶 is replaced by a comma.\n", "work_s": "战国策·楚策一"}, "status": "draft", "intro": "The first fable told *inside* a conversation, the way persuaders actually used them. King Xuan of Chu (here called 荊, an old name for Chu) asks why the northern states fear his minister Zhao Xixu. Jiang Yi, a rival of Zhao's, answers with a story. Watch three things: the 之 of L2 doing heavy work in long sentences, 以 A 為 B \"to regard A as B\", and two words, 地方 and 其實, that look modern but aren't.\n", "lines": [{"h": "荊宣王問群臣曰：", "py": "Jīng Xuān wáng wèn qún chén yuē:", "en": "King Xuan of Jing asked his ministers:", "h_s": "荆宣王问群臣曰："}, {"h": "「吾聞北方之畏昭奚恤也，", "py": "Wú wén běi fāng zhī wèi Zhāo Xīxù yě,", "en": "\"I hear that the north fears Zhao Xixu.", "h_s": "「吾闻北方之畏昭奚恤也，"}, {"h": "果誠何如？」", "py": "guǒ chéng hé rú?", "en": "Is it really so?\"", "h_s": "果诚何如？」"}, {"h": "群臣莫對。", "py": "Qún chén mò duì.", "en": "None of the ministers answered.", "h_s": "群臣莫对。"}, {"h": "江乙對曰：", "py": "Jiāng Yǐ duì yuē:", "en": "Jiang Yi replied:", "h_s": "江乙对曰："}, {"h": "「虎求百獸而食之，", "py": "Hǔ qiú bǎi shòu ér shí zhī,", "en": "\"A tiger was hunting all the beasts to eat them,", "h_s": "「虎求百兽而食之，"}, {"h": "得狐。", "py": "dé hú.", "en": "and caught a fox.", "h_s": "得狐。"}, {"h": "狐曰：『子無敢食我也！", "py": "Hú yuē: Zǐ wú gǎn shí wǒ yě!", "en": "The fox said: 'Don't you dare eat me!", "h_s": "狐曰：『子无敢食我也！"}, {"h": "天帝使我長百獸，", "py": "Tiān dì shǐ wǒ zhǎng bǎi shòu,", "en": "The Lord of Heaven has made me chief of all the beasts;", "h_s": "天帝使我长百兽，"}, {"h": "今子食我，", "py": "jīn zǐ shí wǒ,", "en": "if you eat me now,", "h_s": "今子食我，"}, {"h": "是逆天帝命也。", "py": "shì nì tiān dì mìng yě.", "en": "that is defying the Lord of Heaven's command.", "h_s": "是逆天帝命也。"}, {"h": "子以我為不信，", "py": "Zǐ yǐ wǒ wéi bù xìn,", "en": "If you think I'm lying,", "lit": "you take me as not truthful", "h_s": "子以我为不信，"}, {"h": "吾為子先行，", "py": "wú wèi zǐ xiān xíng,", "en": "I'll walk ahead of you,", "h_s": "吾为子先行，"}, {"h": "子隨我後，", "py": "zǐ suí wǒ hòu,", "en": "you follow behind me,", "h_s": "子随我后，"}, {"h": "觀百獸之見我而敢不走乎？』", "py": "guān bǎi shòu zhī jiàn wǒ ér gǎn bù zǒu hū?", "en": "and see whether a single beast that sees me dares not run!'", "h_s": "观百兽之见我而敢不走乎？』"}, {"h": "虎以為然，", "py": "Hǔ yǐ wéi rán,", "en": "The tiger thought he was right,", "h_s": "虎以为然，"}, {"h": "故遂與之行，", "py": "gù suì yǔ zhī xíng,", "en": "so it went along with him.", "h_s": "故遂与之行，"}, {"h": "獸見之皆走。", "py": "shòu jiàn zhī jiē zǒu.", "en": "The beasts saw them and all ran.", "h_s": "兽见之皆走。"}, {"h": "虎不知獸畏己而走也，", "py": "Hǔ bù zhī shòu wèi jǐ ér zǒu yě,", "en": "The tiger didn't realise the beasts ran because they feared *it*;", "h_s": "虎不知兽畏己而走也，"}, {"h": "以為畏狐也。", "py": "yǐ wéi wèi hú yě.", "en": "it thought they feared the fox.", "h_s": "以为畏狐也。"}, {"h": "今王之地方五千里，", "py": "Jīn wáng zhī dì fāng wǔ qiān lǐ,", "en": "Now Your Majesty's land is five thousand li on each side,", "lit": "your land — square five-thousand li", "h_s": "今王之地方五千里，"}, {"h": "帶甲百萬，", "py": "dài jiǎ bǎi wàn,", "en": "with a million men in armour,", "h_s": "带甲百万，"}, {"h": "而專屬之昭奚恤。", "py": "ér zhuān zhǔ zhī Zhāo Xīxù.", "en": "and you have entrusted them all to Zhao Xixu.", "h_s": "而专属之昭奚恤。"}, {"h": "故北方之畏奚恤也，", "py": "Gù běi fāng zhī wèi Xīxù yě,", "en": "So when the north fears Xixu,", "h_s": "故北方之畏奚恤也，"}, {"h": "其實畏王之甲兵也，", "py": "qí shí wèi wáng zhī jiǎ bīng yě,", "en": "what it really fears is Your Majesty's army,", "h_s": "其实畏王之甲兵也，"}, {"h": "猶百獸之畏虎也。」", "py": "yóu bǎi shòu zhī wèi hǔ yě.", "en": "just as the beasts feared the tiger.\"", "h_s": "犹百兽之畏虎也。」"}], "notes": [{"n": 1, "line": 0, "at": "荊宣王", "text": "**荊** Jīng is another name for Chu (楚). 宣王 King Xuan reigned 369–340 BC. **群臣** \"the assembled ministers\". The 戰國策 is full of scenes like this: a king asks, the court falls silent, one adviser speaks.\n", "at_s": "荆宣王"}, {"n": 2, "line": 1, "at": "北方之畏昭奚恤也", "text": "**Subject + 之 + predicate as an object** (→ L2 n.3). 北方畏昭奚恤 would be a sentence, \"the north fears Zhao Xixu\"; with 之 it becomes a noun phrase, \"the north's fearing Zhao Xixu\", the object of 聞 \"I hear (of)\". The final 也 marks a pause before the question. The same pattern returns in lines 15, 24 and 26.\n", "at_s": "北方之畏昭奚恤也"}, {"n": 3, "line": 2, "at": "果誠何如", "text": "**果** and **誠** both mean \"really, truly\" (果 survives in 果然 \"sure enough\"). 何如 \"how is it?\" (→ L2 n.7).\n", "at_s": "果诚何如"}, {"n": 4, "line": 3, "at": "莫對", "text": "**莫** \"no one\" (→ L2 n.4). **對** duì = to reply *to a superior*: ministers 對 the king; the king 問 or 曰.\n", "at_s": "莫对"}, {"n": 5, "line": 5, "at": "食之", "text": "**食** shí \"to eat\" (the modern word is 吃). Read sì when it means \"to feed someone\". 求 here is \"to hunt for, look for\" (→ L4).\n", "at_s": "食之"}, {"n": 6, "line": 7, "at": "無敢", "text": "**無** here = **毋** wú \"don't!\": a prohibition. 子無敢食我也 \"don't you dare eat me\". Classical Chinese uses 無/毋 and 勿 for \"don't\", where modern Chinese says 別 or 不要.\n", "at_s": "无敢"}, {"n": 7, "line": 8, "at": "使我長百獸", "text": "**使 A V** \"make A do V, have A V\": a causative. **長** zhǎng (→ L3 n.2) \"chief\" used as a verb: 長百獸 \"to be chief of the hundred beasts\". 百獸 \"the hundred beasts\" = all animals.\n", "at_s": "使我长百兽"}, {"n": 8, "line": 10, "at": "是逆", "text": "**是** = \"this (that you'd be doing)\" (→ L4 n.4). 是逆天帝命也 \"this is defying the Lord of Heaven's command\" — 也 closes the judgment (→ L1 n.11). **逆** nì \"to go against, defy\".\n", "at_s": "是逆"}, {"n": 9, "line": 11, "at": "以我為不信", "text": "**以 A 為 B** \"to regard A as B\": 以我為不信 \"regard me as untruthful\". Two lines later, 以為 (→ L3 n.10) \"to think\" is the same structure with the A left out: 虎以為然 \"the tiger considered (it) right\". **信** xìn \"truthful, trustworthy\"; **然** rán \"so, right\".\n", "at_s": "以我为不信"}, {"n": 10, "line": 12, "at": "為子先行", "text": "**為** wèi \"for, on behalf of\": 為子先行 \"walk ahead for you\". Contrast 為 wéi \"to be, to make\" (L4, L5). And **行** = \"walk\" vs **走** = \"run\" (line 15): both in the same breath, the clearest proof of → L1 n.3.\n", "at_s": "为子先行"}, {"n": 11, "line": 14, "at": "敢不走乎", "text": "**敢不 V 乎** \"dare not V?\": a rhetorical question meaning \"none will dare *not* run\" = they will all run. **觀** guān \"to observe, watch\".\n", "at_s": "敢不走乎"}, {"n": 12, "line": 18, "at": "畏己而走", "text": "**己** jǐ \"oneself\": 畏己 \"feared *it* (the tiger itself)\". 己 refers back to the subject of the main clause, 虎.\n", "at_s": "畏己而走"}, {"n": 13, "line": 20, "at": "地方", "text": "**地方 is two words!** Read 地 | 方五千里: \"(your) land — five thousand li square\", i.e. five thousand li from east to west and from north to south. Modern 地方 \"place\" is a later compound; reading it here would be a classic 古今 mistake. (A 里 lǐ was roughly 400 m.)\n", "at_s": "地方"}, {"n": 14, "line": 21, "at": "帶甲", "text": "**帶甲** \"wearing armour\" = armoured soldiers. **屬** zhǔ (line 23) \"to entrust\": 專屬之昭奚恤 \"entrust them solely to Zhao Xixu\", with 之 = \"them\" (the million soldiers) and 昭奚恤 as the second object.\n", "at_s": "带甲"}, {"n": 15, "line": 24, "at": "其實", "text": "**其實** = \"the reality of it\", not the modern adverb \"actually\". The sentence is: [北方之畏 奚恤也] subject, [其實] \"its reality\", [畏王之甲兵也] predicate: \"the north's fearing Xixu — the truth of it is fearing Your Majesty's armies\". 甲兵 \"armour and weapons\" = the army.\n", "at_s": "其实"}, {"n": 16, "line": 25, "at": "猶", "text": "**猶** yóu \"to be like, just as\" (also \"still\"). Jiang Yi closes by mapping the fable onto the court: king = tiger, Zhao Xixu = fox. That's the persuader's art: never say it directly.\n", "at_s": "犹"}], "glossary": [{"w": "荊", "py": "Jīng", "en": "Jing (= Chu)", "checked": ["cyz"], "w_s": "荆"}, {"w": "問", "py": "wèn", "en": "to ask", "checked": ["cyz"], "w_s": "问"}, {"w": "群臣", "py": "qún chén", "en": "the ministers, the court", "checked": [], "w_s": "群臣"}, {"w": "聞", "py": "wén", "en": "to hear (of)", "checked": ["cyz"], "w_s": "闻"}, {"w": "北方", "py": "běi fāng", "en": "the north (the Central States)", "checked": [], "w_s": "北方"}, {"w": "畏", "py": "wèi", "en": "to fear", "checked": ["cyz"], "w_s": "畏"}, {"w": "果", "py": "guǒ", "en": "really, sure enough", "checked": ["cyz"], "w_s": "果"}, {"w": "誠", "py": "chéng", "en": "truly, really", "checked": ["cyz"], "w_s": "诚"}, {"w": "對", "py": "duì", "en": "to reply (to a superior)", "checked": ["cyz"], "w_s": "对"}, {"w": "虎", "py": "hǔ", "en": "tiger", "checked": [], "w_s": "虎"}, {"w": "獸", "py": "shòu", "en": "beast, wild animal", "checked": [], "w_s": "兽"}, {"w": "食", "py": "shí", "en": "to eat", "checked": ["cyz"], "w_s": "食"}, {"w": "狐", "py": "hú", "en": "fox", "checked": ["cyz"], "w_s": "狐"}, {"w": "敢", "py": "gǎn", "en": "to dare", "checked": ["cyz"], "w_s": "敢"}, {"w": "天帝", "py": "tiān dì", "en": "the Lord of Heaven", "checked": [], "w_s": "天帝"}, {"w": "使", "py": "shǐ", "en": "to make (someone do)", "checked": ["cyz"], "w_s": "使"}, {"w": "逆", "py": "nì", "en": "to go against, defy", "checked": ["cyz"], "w_s": "逆"}, {"w": "命", "py": "mìng", "en": "command", "checked": ["cyz"], "w_s": "命"}, {"w": "信", "py": "xìn", "en": "truthful, trustworthy", "checked": ["cyz"], "w_s": "信"}, {"w": "隨", "py": "suí", "en": "to follow", "checked": ["cyz"], "w_s": "随"}, {"w": "後", "py": "hòu", "en": "behind", "checked": ["cyz"], "w_s": "后"}, {"w": "觀", "py": "guān", "en": "to watch, observe", "checked": ["cyz"], "w_s": "观"}, {"w": "見", "py": "jiàn", "en": "to see", "checked": ["cyz"], "w_s": "见"}, {"w": "然", "py": "rán", "en": "so, right", "checked": ["cyz"], "w_s": "然"}, {"w": "己", "py": "jǐ", "en": "oneself", "checked": ["cyz"], "w_s": "己"}, {"w": "方", "py": "fāng", "en": "square; on each side", "checked": ["cyz"], "w_s": "方"}, {"w": "里", "py": "lǐ", "en": "li (unit of distance)", "checked": ["cyz"], "w_s": "里"}, {"w": "帶甲", "py": "dài jiǎ", "en": "armoured soldiers", "checked": [], "w_s": "带甲"}, {"w": "專", "py": "zhuān", "en": "solely, exclusively", "checked": ["cyz"], "w_s": "专"}, {"w": "屬", "py": "zhǔ", "en": "to entrust", "checked": ["cyz"], "w_s": "属"}, {"w": "其實", "py": "qí shí", "en": "the reality of it", "checked": [], "w_s": "其实"}, {"w": "甲兵", "py": "jiǎ bīng", "en": "armour and weapons; the army", "checked": [], "w_s": "甲兵"}, {"w": "猶", "py": "yóu", "en": "just as, like", "checked": ["cyz"], "w_s": "犹"}], "exercise": [{"h": "知之為知之，不知為不知，是知也。", "py": "Zhī zhī wéi zhī zhī, bù zhī wéi bù zhī, shì zhī yě.", "src": "論語·為政", "en": "To count what you know as knowing it, and what you don't know as not knowing it — that is knowledge.", "tests": "為 = count as, 是 = this, 也", "h_s": "知之为知之，不知为不知，是知也。"}, {"h": "人而無信，不知其可也。", "py": "Rén ér wú xìn, bù zhī qí kě yě.", "src": "論語·為政", "en": "A person without trustworthiness — I don't know how that could work.", "tests": "信, 無, 其", "h_s": "人而无信，不知其可也。"}, {"h": "過猶不及。", "py": "Guò yóu bù jí.", "src": "論語·先進", "en": "Going too far is just like falling short.", "tests": "猶", "h_s": "过犹不及。"}], "culture": "The fox's trick gave Chinese the idiom 狐假虎威 \"the fox borrows the tiger's majesty\" (假 jiǎ \"to borrow\" — the word itself is not in the story). It is used of underlings who throw their weight around on the strength of a powerful patron. Jiang Yi's real target was his rival Zhao Xixu: by reminding the king whose power it really was, he cut Zhao down to size.\n", "title_s": "狐假虎威"}, {"id": 7, "slug": "review-1", "kind": "review", "title": "複習一", "title_py": "Fùxí yī", "title_en": "Review 1: Lessons 1–6", "status": "draft", "intro": "Six fables, about 300 characters, and most of the machinery of Classical Chinese prose is already in place. Re-read the six texts once more, aloud, with Cover on. Then go through the points below: each one sends you back to the note where it was first explained. Finish with the exercise: six new sentences from the 論語, using only what you've met.\n", "recap": [{"topic": "有 … 者: bringing a character on stage", "refs": ["L1 n.2", "L3 n.1", "L4 n.1", "L5 n.1"], "text": "Place or group + 有 + verb phrase + 者 = \"there was one (from X) who …\". Every fable but L6 opens this way: 宋人有耕者 · 楚人有鬻楯與矛者 · 宋人有閔其苗之不長而揠之者 · 楚人有涉江者 · 楚有祠者.\n", "examples": ["宋人有耕者", "楚人有涉江者", "楚有祠者"], "examples_s": ["宋人有耕者", "楚人有涉江者", "楚有祠者"]}, {"topic": "The four faces of 之", "refs": ["L1 n.10", "L2 n.2", "L2 n.3", "L6 n.2"], "text": "(1) between two nouns, like 的: 先王之政. (2) after a verb, \"him / it / them\": 譽之, 求之. (3) between subject and predicate, turning a sentence into a noun phrase: 吾楯之堅 \"the hardness of my shield\", 北方之畏昭奚恤 \"the north's fearing Zhao Xixu\". (4) as a verb, \"to go to\" — not seen yet, but coming.\n", "examples": ["先王之政", "譽之", "吾楯之堅", "北方之畏昭奚恤也"], "examples_s": ["先王之政", "誉之", "吾楯之坚", "北方之畏昭奚恤也"]}, {"topic": "也 and 矣", "refs": ["L1 n.11", "L3 n.5", "L3 n.11"], "text": "也 closes a statement of what *is*: 皆守株之類也, A者 B者也. 矣 marks what *has come to be*: 今日病矣, 苗則槁矣, 舟已行矣. A sentence with no verb + 也 is the Classical \"A is B\"; 是 still means \"this\".\n", "examples": ["皆守株之類也", "不耘苗者也", "苗則槁矣", "是吾劍之所從墜"], "examples_s": ["皆守株之类也", "不耘苗者也", "苗则槁矣", "是吾剑之所从坠"]}, {"topic": "Five negatives", "refs": ["L2 n.4", "L2 n.8", "L3 n.12", "L5 n.9", "L6 n.6"], "text": "不 plain \"not\" · 弗 \"not (it)\" · 未 \"not yet\" · 非 \"it is not that\" · 無/毋 \"there is no; don't!\" — plus 莫 \"no one / nothing\", a pronoun with the negation built in. Double negatives make strong positives: 無不陷 \"pierces everything\".\n", "examples": ["其人弗能應也", "未成", "非徒無益", "子無敢食我也", "莫能陷也"], "examples_s": ["其人弗能应也", "未成", "非徒无益", "子无敢食我也", "莫能陷也"]}, {"topic": "所 and 者", "refs": ["L1 n.2", "L4 n.5", "L3 n.9"], "text": "者 follows a verb phrase: \"one who V's\" (耕者, 先成者, 為蛇足者). 所 precedes a verb: \"what / where one V's\" (所從墜 \"where it fell from\", 所契 \"what he'd notched\").\n", "examples": ["先成者飲酒", "吾劍之所從墜", "其所契者"], "examples_s": ["先成者饮酒", "吾剑之所从坠", "其所契者"]}, {"topic": "Words that changed meaning (古今詞義)", "refs": ["L1 n.3", "L3 n.5", "L4 n.1", "L5 n.12", "L6 n.13", "L6 n.15"], "text": "走 run (not walk) · 行 walk / move · 趨 hurry · 病 exhausted · 江 the Yangzi · 亡 lose · 身 oneself · 地方 \"land … square\" · 其實 \"the reality of it\".\n", "examples": ["兔走觸株", "今日病矣", "終亡其酒", "今王之地方五千里"], "examples_s": ["兔走触株", "今日病矣", "终亡其酒", "今王之地方五千里"]}, {"topic": "Rhetorical questions", "refs": ["L4 n.8", "L4 n.11", "L5 n.10", "L6 n.11"], "text": "不亦…乎 \"isn't it …?\" · 豈…哉 \"how could …!\" · 安 \"how?\" · 敢不…乎 \"would dare not …?\". All of them expect the listener to agree.\n", "examples": ["不亦惑乎", "豈不難哉", "子安能為之足"], "examples_s": ["不亦惑乎", "岂不难哉", "子安能为之足"
