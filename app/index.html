<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wenyan 文言</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Serif+SC:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f1e7; --paper-2:#efe7d6; --ink:#24201b; --ink-2:#6b6257; --rule:#d9cdb6;
  --seal:#a8321e; --seal-soft:#a8321e1a; --hl:#e9d9a8;
  --zh:"Noto Serif TC","Noto Serif SC",serif; --en:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1b1916; --paper-2:#24211d; --ink:#ece4d4; --ink-2:#a69b8a; --rule:#3a352e;
    --seal:#e0664c; --seal-soft:#e0664c22; --hl:#5a4a22;
  }
}
:root[data-theme="dark"]{
  --paper:#1b1916; --paper-2:#24211d; --ink:#ece4d4; --ink-2:#a69b8a; --rule:#3a352e;
  --seal:#e0664c; --seal-soft:#e0664c22; --hl:#5a4a22;
}
html.simp{--zh:"Noto Serif SC","Noto Serif TC",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 var(--en);-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 80px}
header.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
header.bar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--zh);font-weight:600;font-size:20px;letter-spacing:.08em}
.brand small{font-family:var(--en);font-weight:400;font-size:13px;color:var(--ink-2);letter-spacing:0;margin-left:6px}
.sp{flex:1}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{font:13px var(--en);border:1px solid var(--rule);background:transparent;color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
select.tg{appearance:none;padding-right:12px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:end;padding:44px 0 26px;border-bottom:1px solid var(--rule)}
.seal{width:76px;height:76px;border:2px solid var(--seal);color:var(--seal);border-radius:6px;display:grid;grid-template-columns:1fr 1fr;place-items:center;font:600 26px/1 var(--zh);padding:6px;transform:rotate(-2deg)}
.kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--seal)}
h1{font:600 clamp(34px,6vw,52px)/1.1 var(--zh);margin:6px 0 4px;letter-spacing:.06em}
.sub{color:var(--ink-2);font-style:italic}
.intro{max-width:720px;margin:22px 0 0;color:var(--ink)}
.meta{font-size:13px;color:var(--ink-2);margin-top:10px}
.badge{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:0 6px;margin-left:6px}
h2{font:600 13px var(--en);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:42px 0 14px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--rule)}
.pages{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--paper-2)}
.page{padding:22px 24px}
.page.left{border-right:1px solid var(--rule);background:var(--paper)}
.row{display:contents}
.ln{padding:9px 0;border-bottom:1px dashed var(--rule);min-height:64px}
.ln:last-child{border-bottom:0}
.zh{font:400 26px/1.5 var(--zh);letter-spacing:.06em}
.py{font-size:14px;color:var(--ink-2);font-style:italic;margin-top:2px}
.en{font-size:16px}
.lit{font-size:13px;color:var(--ink-2);margin-top:2px}
html.nopy .py{display:none}
html.cover .page.right .ln > *{filter:blur(6px);opacity:.5;transition:.2s}
html.cover .page.right .ln:hover > *, html.cover .page.right .ln.peek > *{filter:none;opacity:1}
.w{cursor:pointer;border-radius:3px;transition:background .15s}
.w:hover,.w.on{background:var(--hl)}
sup.nn{font:600 11px var(--en);color:var(--seal);margin-left:1px;cursor:pointer;vertical-align:super}
.notes{columns:2 340px;column-gap:34px}
.note{break-inside:avoid;margin:0 0 18px;padding-left:34px;position:relative}
.note .num{position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;background:var(--seal-soft);color:var(--seal);font:600 12px/24px var(--en);text-align:center}
.note .at{font-family:var(--zh);font-size:18px;margin-right:4px}
.note.flash{animation:fl 1.2s}
@keyframes fl{0%{background:var(--hl)}100%{background:transparent}}
.note p{margin:0}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.g{border:1px solid var(--rule);border-radius:8px;padding:8px 12px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;background:var(--paper)}
.g .c{font:600 24px/1.2 var(--zh);grid-row:span 2}
.g .p{font-size:13px;color:var(--ink-2);font-style:italic}
.g .d{font-size:14px;line-height:1.35}
.g .sw{grid-column:1/-1;font:13px var(--zh);color:var(--ink-2);border-top:1px dotted var(--rule);padding-top:4px;margin-top:4px}
.g .sw b{font-family:var(--en);font-weight:600;font-size:11px;letter-spacing:.06em;color:var(--seal);margin-right:6px}
.ex{counter-reset:ex;display:grid;gap:10px}
.e{border-left:3px solid var(--seal);padding:8px 0 8px 16px}
.e .zh{font-size:22px}
.e .src{font-size:12px;color:var(--ink-2);letter-spacing:.04em}
.e details summary{cursor:pointer;color:var(--seal);font-size:14px;margin-top:4px}
.e details p{margin:4px 0 0}
.e .tests{font-size:13px;color:var(--ink-2)}
.culture{max-width:760px;font-size:16px;background:var(--paper-2);border-radius:10px;padding:18px 22px}
.recap{display:grid;gap:14px}
.rc{display:grid;grid-template-columns:34px 1fr;gap:14px;border:1px solid var(--rule);border-radius:10px;padding:16px 18px;background:var(--paper)}
.rn{width:30px;height:30px;border-radius:50%;background:var(--seal-soft);color:var(--seal);font:600 14px/30px var(--en);text-align:center}
.rc h3{margin:2px 0 6px;font:600 17px var(--en)}
.rc p{margin:0 0 10px;font-size:15.5px}
.rx{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px}
.rx span{font:20px/1.4 var(--zh);letter-spacing:.04em}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.ref{font:12px var(--en);color:var(--seal);background:var(--seal-soft);border:0;border-radius:999px;padding:3px 10px;cursor:pointer}
#pop{position:fixed;z-index:20;max-width:300px;background:var(--ink);color:var(--paper);border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.4;box-shadow:0 8px 28px #0004;display:none}
#pop .c{font:600 26px var(--zh)}
#pop .p{font-style:italic;opacity:.75;margin-left:8px}
#pop .sw{font-family:var(--zh);opacity:.8;margin-top:6px;font-size:13px}
#pop.note-pop{max-width:min(420px,calc(100vw - 16px));max-height:60vh;overflow:auto;padding:14px 16px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-top:3px solid var(--seal)}
#pop .nh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#pop .nh .num{width:24px;height:24px;border-radius:50%;background:var(--seal-soft);color:var(--seal);font:600 12px/24px var(--en);text-align:center}
#pop .nh .c{font-size:22px}
#pop .nb{font-size:15px;line-height:1.5}
#pop .goto{margin-top:10px;font:13px var(--en);color:var(--seal);background:none;border:0;padding:0;cursor:pointer}
sup.nn{padding:0 2px;border-radius:3px}
sup.nn.on{background:var(--seal);color:var(--paper)}
footer{margin-top:60px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:14px}
@media (max-width:720px){
  .pages{grid-template-columns:1fr}
  .page.left{border-right:0}
  .page{padding:14px 16px}
  .page.right{display:none}
  .brand small{display:none}
  .tg{padding:5px 8px}
  .ln .en-inline{display:block}
  .hero{grid-template-columns:1fr;padding-top:28px}
  .seal{width:60px;height:60px;font-size:20px}
  .zh{font-size:23px}
}
.en-inline{display:none;font-size:15px;margin-top:4px}
html.cover .en-inline{filter:blur(6px);opacity:.5}
html.cover .ln.peek .en-inline{filter:none;opacity:1}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="brand">文言<small>Wenyan</small></div>
  <div class="sp"></div>
  <div class="toggles">
    <select class="tg" id="lesson" aria-label="Lesson"></select>
    <button class="tg" id="tScript" aria-pressed="false" title="Traditional / simplified">繁 → 简</button>
    <button class="tg" id="tPy" aria-pressed="true">Pinyin</button>
    <button class="tg" id="tCover" aria-pressed="false" title="Hide the translation; hover or tap a line to peek">Cover</button>
  </div>
</div></header>
<main class="wrap" id="app"></main>
<div id="pop" role="tooltip"></div>
<script id="course-data" type="application/json"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const H = document.documentElement;
  const store = {
    get(k, d){ try{ const v = localStorage.getItem("wy."+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
    set(k, v){ try{ localStorage.setItem("wy."+k, JSON.stringify(v)); }catch(e){} }
  };
  let course, L, simp = store.get("simp", false), py = store.get("py", true), cover = store.get("cover", false);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const md = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
  const Z = (o, k) => simp && o[k + "_s"] ? o[k + "_s"] : o[k];

  function apply(){
    H.classList.toggle("simp", simp); H.classList.toggle("nopy", !py); H.classList.toggle("cover", cover);
    $("#tScript").setAttribute("aria-pressed", simp); $("#tScript").textContent = simp ? "简 → 繁" : "繁 → 简";
    $("#tPy").setAttribute("aria-pressed", py); $("#tCover").setAttribute("aria-pressed", cover);
  }

  // Mark glossary words (longest match first) and note anchors in a line.
  function markLine(line, i){
    const t = Z(line, "h");
    const words = L.glossary.map((g, gi) => ({w: Z(g, "w"), gi})).sort((a, b) => b.w.length - a.w.length);
    const ends = {}; // char index -> note numbers placed after it
    L.notes.filter(n => n.line === i).forEach(n => {
      const at = Z(n, "at"), p = t.indexOf(at);
      if (p >= 0) (ends[p + at.length - 1] ||= []).push(n.n);
    });
    let out = "", k = 0;
    while (k < t.length){
      const m = words.find(x => t.startsWith(x.w, k));
      const len = m ? m.w.length : 1;
      const seg = t.slice(k, k + len);
      out += m ? `<span class="w" data-g="${m.gi}">${esc(seg)}</span>` : esc(seg);
      for (let j = k; j < k + len; j++) if (ends[j]) out += ends[j].map(n => `<sup class="nn" data-n="${n}">${n}</sup>`).join("");
      k += len;
    }
    return out;
  }

  const exerciseHTML = () => L.exercise ? `<h2>Exercise · translate</h2><div class="ex">${L.exercise.map(e => `
        <div class="e"><div class="zh">${esc(Z(e, "h"))}</div><div class="py">${esc(e.py)}</div>
        <div class="src">${esc(e.src)}</div>
        <details><summary>Answer</summary><p>${esc(e.en)}</p><p class="tests">Practises: ${esc(e.tests || "")}</p></details></div>`).join("")}</div>` : "";

  function renderReview(seal){
    $("#app").innerHTML = `
      <section class="hero">
        <div class="seal" aria-hidden="true">${seal}</div>
        <div>
          <div class="kicker">Lesson ${L.id} · Review</div>
          <h1>${esc(Z(L, "title"))}</h1>
          <div class="sub">${esc(L.title_py)} — ${esc(L.title_en)}</div>
        </div>
      </section>
      <p class="intro">${md(L.intro)}</p>
      <div class="meta"><span class="badge" title="draft → good → solid">${esc(L.status)}</span></div>
      <h2>What you've learned</h2>
      <div class="recap">${L.recap.map((r, i) => `
        <div class="rc"><div class="rn">${i + 1}</div><div>
          <h3>${md(r.topic)}</h3><p>${md(r.text)}</p>
          ${r.examples ? `<div class="rx">${(simp ? r.examples_s : r.examples).map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
          <div class="refs">${(r.refs || []).map(x => `<button class="ref" data-ref="${esc(x)}">${esc(x)}</button>`).join("")}</div>
        </div></div>`).join("")}</div>
      ${exerciseHTML()}
      <footer>Exercise texts: public domain. Course content CC BY-SA 4.0.</footer>`;
  }

  function goRef(ref){
    const m = /^L(\d+) n\.(\d+)$/.exec(ref); if (!m) return;
    const idx = course.lessons.findIndex(l => l.id === +m[1]); if (idx < 0) return;
    L = course.lessons[idx]; $("#lesson").value = idx; store.set("lesson", idx); render();
    const n = $("#n" + m[2]); if (!n) return;
    n.scrollIntoView({block: "center"}); n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash");
  }

  function render(){
    const seal = [...L.title_s && simp ? L.title_s : L.title].slice(0, 4).map(c => `<span>${esc(c)}</span>`).join("");
    if (L.kind === "review") return renderReview(seal);
    const lines = L.lines;
    $("#app").innerHTML = `
      <section class="hero">
        <div class="seal" aria-hidden="true">${seal}</div>
        <div>
          <div class="kicker">Lesson ${L.id} · ${esc(simp && L.source.work_s ? L.source.work_s : L.source.work)}</div>
          <h1>${esc(Z(L, "title"))}</h1>
          <div class="sub">${esc(L.title_py)} — ${esc(L.title_en)}</div>
        </div>
      </section>
      <p class="intro">${md(L.intro)}</p>
      <div class="meta">${esc(L.source.author)} · ${esc(L.source.period)}<span class="badge" title="draft → good → solid">${esc(L.status)}</span></div>

      <h2>Text</h2>
      <div class="pages">
        <div class="page left">${lines.map((l, i) => `
          <div class="ln" data-i="${i}"><div class="zh">${markLine(l, i)}</div><div class="py">${esc(l.py)}</div>
          <div class="en-inline">${esc(l.en)}</div></div>`).join("")}</div>
        <div class="page right">${lines.map((l, i) => `
          <div class="ln" data-i="${i}"><div class="en">${esc(l.en)}</div>${l.lit ? `<div class="lit">lit. ${esc(l.lit)}</div>` : ""}</div>`).join("")}</div>
      </div>

      <h2>Notes</h2>
      <div class="notes">${L.notes.map(n => `
        <div class="note" id="n${n.n}"><span class="num">${n.n}</span><p><span class="at">${esc(Z(n, "at"))}</span>${md(n.text)}</p></div>`).join("")}</div>

      <h2>Glossary</h2>
      <div class="gl">${L.glossary.map(g => `
        <div class="g"><span class="c">${esc(Z(g, "w"))}</span><span class="p">${esc(g.py)}</span><span class="d">${esc(g.en)}</span>
        ${g.sw ? `<div class="sw"><b>說文</b>${esc(g.sw)}</div>` : ""}</div>`).join("")}</div>

      ${exerciseHTML()}

      ${L.culture ? `<h2>Context</h2><div class="culture">${md(L.culture)}</div>` : ""}
      <footer>Text: public domain (${esc(L.source.text_from)}). Course content CC BY-SA 4.0.</footer>`;
    syncHeights();
  }

  // Keep left/right lines aligned on wide screens.
  function syncHeights(){
    const left = document.querySelectorAll(".page.left .ln"), right = document.querySelectorAll(".page.right .ln");
    left.forEach((l, i) => { l.style.minHeight = ""; right[i].style.minHeight = ""; });
    if (innerWidth <= 720) return;
    left.forEach((l, i) => { const h = Math.max(l.offsetHeight, right[i].offsetHeight); l.style.minHeight = right[i].style.minHeight = h + "px"; });
  }

  const pop = $("#pop");
  function showPop(el){
    const g = L.glossary[+el.dataset.g];
    document.querySelectorAll(".w.on").forEach(x => x.classList.remove("on"));
    el.classList.add("on");
    pop.className = "";
    pop.innerHTML = `<span class="c">${esc(Z(g, "w"))}</span><span class="p">${esc(g.py)}</span><div>${esc(g.en)}</div>${g.sw ? `<div class="sw">說文：${esc(g.sw)}</div>` : ""}`;
    place(el);
  }
  function place(el){
    pop.style.display = "block";
    const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(innerWidth - pw - 8, r.left + r.width / 2 - pw / 2)) + "px";
    pop.style.top = Math.max(8, r.bottom + 8 + ph > innerHeight ? r.top - ph - 8 : r.bottom + 8) + "px";
  }
  function showNote(el){
    const n = L.notes.find(x => x.n === +el.dataset.n);
    document.querySelectorAll(".w.on,sup.nn.on").forEach(x => x.classList.remove("on"));
    el.classList.add("on");
    pop.className = "note-pop";
    pop.innerHTML = `<div class="nh"><span class="num">${n.n}</span><span class="c">${esc(Z(n, "at"))}</span></div>
      <div class="nb">${md(n.text)}</div><button class="goto" data-n="${n.n}">All notes ↓</button>`;
    place(el);
  }
  function hidePop(){ pop.style.display = "none"; pop.className = ""; document.querySelectorAll(".w.on,sup.nn.on").forEach(x => x.classList.remove("on")); }

  document.addEventListener("click", e => {
    const w = e.target.closest(".w"), nn = e.target.closest("sup.nn"), ln = e.target.closest(".ln");
    if (e.target.closest("#pop .goto")){ const n = $("#n" + e.target.closest(".goto").dataset.n); hidePop(); n.scrollIntoView({behavior: "smooth", block: "center"}); n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash"); return; }
    if (e.target.closest("#pop")) return;
    const ref = e.target.closest(".ref");
    if (ref){ goRef(ref.dataset.ref); return; }
    if (nn){ showNote(nn); e.stopPropagation(); return; }
    if (w){ showPop(w); e.stopPropagation(); return; }
    hidePop();
    if (ln && cover) document.querySelectorAll(`.ln[data-i="${ln.dataset.i}"]`).forEach(x => x.classList.toggle("peek"));
  });
  addEventListener("scroll", () => { if (!pop.classList.contains("note-pop")) hidePop(); }, {passive: true});
  addEventListener("resize", syncHeights);
  $("#tScript").onclick = () => { simp = !simp; store.set("simp", simp); apply(); render(); };
  $("#tPy").onclick = () => { py = !py; store.set("py", py); apply(); syncHeights(); };
  $("#tCover").onclick = () => { cover = !cover; store.set("cover", cover); apply(); };
  $("#lesson").onchange = e => { L = course.lessons[+e.target.value]; store.set("lesson", +e.target.value); render(); scrollTo(0, 0); };

  async function boot(){
    const inline = $("#course-data").textContent.trim();
    course = inline ? JSON.parse(inline) : await (await fetch("course.json")).json();
    const idx = Math.min(store.get("lesson", 0), course.lessons.length - 1);
    $("#lesson").innerHTML = course.lessons.map((l, i) => `<option value="${i}">${l.id}. ${esc(l.title)}</option>`).join("");
    $("#lesson").value = idx; L = course.lessons[idx];
    apply(); render();
    if (document.fonts) document.fonts.ready.then(syncHeights);
  }
  boot();
})();
</script>
</body>
</html>
