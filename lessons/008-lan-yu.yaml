exercise:
  - h: "近者說，遠者來。"
    py: "Jìn zhě yuè, yuǎn zhě lái."
    src: 論語·子路
    en: "(Govern so that) those near are pleased and those far away come."
    tests: "說 = 悅 yuè, 者"
  - h: "知之者不如好之者，好之者不如樂之者。"
    py: "Zhī zhī zhě bù rú hào zhī zhě, hào zhī zhě bù rú lè zhī zhě."
    src: 論語·雍也
    en: "Those who know it are not as good as those who love it; those who love it are not as good as those who delight in it."
    tests: "好 hào, 者"
  - h: "不知命，無以為君子也；不知禮，無以立也；不知言，無以知人也。"
    py: "Bù zhī mìng, wú yǐ wéi jūnzǐ yě; bù zhī lǐ, wú yǐ lì yě; bù zhī yán, wú yǐ zhī rén yě."
    src: 論語·堯曰
    en: "Without understanding fate, one has no way to be a gentleman; without understanding the rites, no way to take one's stand; without understanding words, no way to understand people."
    tests: "無以 ×3, 立"
  - h: "王說曰：「詩云：『他人有心，予忖度之。』夫子之謂也。」"
    py: "Wáng yuè yuē: Shī yún: Tā rén yǒu xīn, yú cǔn duó zhī. Fūzǐ zhī wèi yě."
    src: 孟子·梁惠王上
    en: "The king was pleased and said: \"The Songs say: 'Another man has a heart; I guess at it and measure it.' That is what you have done, Master.\""
    tests: "說 = 悅 yuè, 予 (→ L3 n.6); 齊宣王 again, talking to Mencius"

culture: >
  The idiom 濫竽充數 "an unqualified yu (player) filling up the numbers" (濫 "excessive, unworthy")
  is said of anyone who holds a place without the skill for it, and very often of oneself, out of
  modesty: 我只是濫竽充數 "I'm only here to make up the numbers". Han Fei's point was harder: a
  ruler who never tests his officials one by one will feed hundreds of impostors.
