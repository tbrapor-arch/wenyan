exercise:
  - h: "父母唯其疾之憂。"
    py: "Fùmǔ wéi qí jí zhī yōu."
    src: 論語·為政
    en: "Your father and mother should have nothing to worry about but your falling ill."
    tests: "唯 X 之 V, the object before its verb (n. 12)"
  - h: "浴乎沂，風乎舞雩，詠而歸。"
    py: "Yù hū Yí, fēng hū Wǔyú, yǒng ér guī."
    src: 論語·先進
    en: "To bathe in the Yi, enjoy the breeze at the Rain Altar, and come home singing."
    tests: "乎 = 於 (n. 1); 風 \"wind\" as a verb, \"to take the air\""
  - h: "默而識之，學而不厭，誨人不倦，何有於我哉？"
    py: "Mò ér zhì zhī, xué ér bù yàn, huì rén bù juàn, hé yǒu yú wǒ zāi?"
    src: 論語·述而
    en: "To remember things in silence, to study without tiring of it, to teach others without growing weary: which of these can I claim?"
    tests: "誨; 而; 識 zhì \"to remember\"; 何有於我 \"what of this is there in me?\""

culture: >
  Weiqi (圍棋, Japanese *go*) is one of the oldest board games in the world; this chapter and a line
  in the 論語 (不有博弈者乎 "are there not board games?") are among its earliest mentions. Yi Qiu, the
  "best player in the state", is the first player of the game known by name. The two idioms of the
  chapter are a pair: 專心致志 is what learning needs, 一暴十寒 is how most people go about it.
