exercise:
  - h: "禍兮福之所倚，福兮禍之所伏。"
    py: "Huò xī fú zhī suǒ yǐ, fú xī huò zhī suǒ fú."
    src: 老子·五十八章
    en: "Misfortune — that is what good fortune leans on; good fortune — that is where misfortune lies hidden."
    tests: "禍, 福, 所 (→ L4 n.5); 兮 xī is a pause particle"
  - h: "老吾老，以及人之老；幼吾幼，以及人之幼。"
    py: "Lǎo wú lǎo, yǐ jí rén zhī lǎo; yòu wú yòu, yǐ jí rén zhī yòu."
    src: 孟子·梁惠王上
    en: "Treat your own elders as elders and extend it to other people's elders; treat your own young as the young and extend it to other people's young."
    tests: "word-class shift: 老, 幼 as verbs (n. 10); 及 \"to reach\" (→ L9 n.10)"
  - h: "我善養吾浩然之氣。"
    py: "Wǒ shàn yǎng wú hào rán zhī qì."
    src: 孟子·公孫丑上
    en: "I am good at nourishing my flood-like qi."
    tests: "善 = be good at, -然 (→ L3 n.3)"
  - h: "吾所以為此者，以先國家之急而後私讎也。"
    py: "Wú suǒ yǐ wéi cǐ zhě, yǐ xiān guó jiā zhī jí ér hòu sī chóu yě."
    src: 史記·廉頗藺相如列傳
    en: "The reason I act like this is that I put the urgent needs of the state first and private feuds last."
    tests: "以 = because; 先 and 後 used as verbs; 所以 … 者 \"the reason why\""

culture: >
  The idiom is usually quoted in full, 塞翁失馬，焉知非福 "the old man at the frontier lost his
  horse — how could one know it wasn't a blessing?", a later wording: 焉 "how" replaces the story's
  何遽. It is the classical form of "every cloud has a silver lining", but the Huainanzi's point is
  bleaker and more Daoist: fortune and misfortune keep turning into each other, and no one can see
  where the chain ends.
