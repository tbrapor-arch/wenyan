exercise:
  - h: "未知生，焉知死？"
    py: "Wèi zhī shēng, yān zhī sǐ?"
    src: 論語·先進
    en: "Not yet understanding life, how could one understand death?"
    tests: "未, 焉 = 安 \"how\""
  - h: "亡羊而補牢，未為遲也。"
    py: "Wáng yáng ér bǔ láo, wèi wéi chí yě."
    src: 戰國策·楚策四
    en: "To mend the pen after losing a sheep is not yet too late."
    tests: "亡 = lose, 未, 而"
  - h: "泉涸，魚相與處於陸，相呴以濕，相濡以沫，不如相忘於江湖。"
    py: "Quán hé, yú xiāng yǔ chǔ yú lù, xiāng xǔ yǐ shī, xiāng rú yǐ mò, bù rú xiāng wàng yú jiāng hú."
    src: 莊子·大宗師
    en: "When the spring dries up, the fish are left together on dry land; they moisten each other with their breath and wet each other with their spittle. Better to forget each other in the rivers and lakes."
    tests: "相 = each other, 於"


culture: >
  The frame story: 昭陽 Zhao Yang, chief minister and general of Chu, has crushed Wei and is
  marching on Qi. Qi sends 陳軫 Chen Zhen to him. After the fable Chen Zhen points out that
  Zhao Yang already holds the highest rank Chu can give; even if he wins, he gains nothing more,
  and if he loses, he loses everything — like the man who drew the feet. Zhao Yang turned back.
