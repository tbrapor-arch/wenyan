exercise:
  - h: "知之為知之，不知為不知，是知也。"
    py: "Zhī zhī wéi zhī zhī, bù zhī wéi bù zhī, shì zhī yě."
    src: 論語·為政
    en: "To count what you know as knowing it, and what you don't know as not knowing it — that is knowledge."
    tests: "為 = count as, 是 = this, 也"
  - h: "人而無信，不知其可也。"
    py: "Rén ér wú xìn, bù zhī qí kě yě."
    src: 論語·為政
    en: "A person without trustworthiness — I don't know how that could work."
    tests: "信, 無, 其"
  - h: "過猶不及。"
    py: "Guò yóu bù jí."
    src: 論語·先進
    en: "Going too far is just like falling short."
    tests: "猶"

culture: >
  The fox's trick gave Chinese the idiom 狐假虎威 "the fox borrows the tiger's majesty" (假 jiǎ
  "to borrow" — the word itself is not in the story). It is used of underlings who throw their
  weight around on the strength of a powerful patron. Jiang Yi's real target was his rival Zhao
  Xixu: by reminding the king whose power it really was, he cut Zhao down to size.
