exercise:
  - h: "有美玉於斯，韞匵而藏諸？求善賈而沽諸？"
    py: "Yǒu měi yù yú sī, yùn dú ér cáng zhū? Qiú shàn jià ér gū zhū?"
    src: 論語·子罕
    en: "Here is a beautiful piece of jade: should one put it in a box and keep it, or look for a good price and sell it?"
    tests: "有 X 於斯 (斯 = 此) setting up a case; 諸 = 之乎, twice, in a choice question"
  - h: "子行三軍，則誰與？"
    py: "Zǐ xíng sān jūn, zé shuí yǔ?"
    src: 論語·述而
    en: "If you were leading the three armies, whom would you take with you?"
    tests: "誰與 \"with whom\" (n. 12); 則; 行 \"to lead, conduct\""
  - h: "無為而治者，其舜也與？夫何為哉？恭己正南面而已矣。"
    py: "Wú wéi ér zhì zhě, qí Shùn yě yú? Fú hé wéi zāi? Gōng jǐ zhèng nán miàn ér yǐ yǐ."
    src: 論語·衛靈公
    en: "The one who ruled by doing nothing: was it not Shun? What did he do? He made himself reverent and sat facing due south, that is all."
    tests: "final 與 yú; 何為 \"do what\" (→ L16 n.11); modal 其 (→ L13 n.5); 南面 \"face south\", a noun used as a verb"
  - h: "子謂韶，盡美矣，又盡善也；謂武，盡美矣，未盡善也。"
    py: "Zǐ wèi Sháo, jìn měi yǐ, yòu jìn shàn yě; wèi Wǔ, jìn měi yǐ, wèi jìn shàn yě."
    src: 論語·八佾
    en: "The Master said of the Shao music that it was perfectly beautiful and perfectly good as well; of the Wu music, that it was perfectly beautiful but not yet perfectly good."
    tests: "謂 + person or thing + comment (n. 9); 矣 and 也; 未"

culture: >
  The idiom 一傅眾咻 "one tutor and a crowd of hecklers" describes any effort swamped by its
  surroundings; it is often quoted about learning a language, which is exactly Mencius's example. A
  learner of Qi among Chu speakers will not learn it however hard he is beaten; two years in the
  streets of the Qi capital and he will speak nothing else. Mencius's advice to Dai Busheng is the
  same: change the whole court, or nothing will change.
