exercise:
  - h: "樊遲曰：「何謂也？」子曰：「生，事之以禮；死，葬之以禮，祭之以禮。」"
    py: "Fán Chí yuē: Hé wèi yě? Zǐ yuē: Shēng, shì zhī yǐ lǐ; sǐ, zàng zhī yǐ lǐ, jì zhī yǐ lǐ."
    src: 論語·為政
    en: "Fan Chi said: \"What do you mean?\" The Master said: \"While they live, serve them according to the rites; when they die, bury them according to the rites and sacrifice to them according to the rites.\""
    tests: "何謂 (n. 4); V 之以 X three times (→ L9 n.12)"
  - h: "然則夫子既聖矣乎？"
    py: "Rán zé fūzǐ jì shèng yǐ hū?"
    src: 孟子·公孫丑上
    en: "In that case, Master, are you already a sage?"
    tests: "然則 (n. 7); 既 \"already\"; 矣乎"
  - h: "敏而好學，不恥下問，是以謂之文也。"
    py: "Mǐn ér hào xué, bù chǐ xià wèn, shì yǐ wèi zhī Wén yě."
    src: 論語·公冶長
    en: "He was quick and loved learning, and was not ashamed to ask those beneath him: that is why he is called Wen, \"the Cultured\"."
    tests: "是以 (n. 12); 謂 A B (n. 3); 好 hào"
  - h: "富貴不能淫，貧賤不能移，威武不能屈，此之謂大丈夫。"
    py: "Fù guì bù néng yín, pín jiàn bù néng yí, wēi wǔ bù néng qū, cǐ zhī wèi dà zhàngfū."
    src: 孟子·滕文公下
    en: "Wealth and rank cannot corrupt him, poverty and low station cannot move him, force and might cannot bend him: this is what is called a great man."
    tests: "此之謂 X, the object before 謂 (n. 15); 貧 (→ L16 n.1)"

culture: >
  The idiom 朝三暮四 first meant tricking people with a change that changes nothing, as the keeper
  does; today it more often means "to blow hot and cold, keep changing one's mind". The *Liezi*
  (chapter 黃帝) tells the same story at more length, about a man of Song who loved his monkeys so
  much that he fed them from his own family's food, and draws a plainer moral: "the sage uses his
  wits to keep the crowd of fools in hand, just as the monkey keeper did with his monkeys".
