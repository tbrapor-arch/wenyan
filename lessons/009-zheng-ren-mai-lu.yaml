exercise:
  - h: "王見之，曰：「牛何之？」"
    py: "Wáng jiàn zhī, yuē: Niú hé zhī?"
    src: 孟子·梁惠王上
    en: "The king saw it and said: \"Where is the ox going?\""
    tests: "之 = to go; the question word 何 before the verb"
  - h: "權，然後知輕重；度，然後知長短。"
    py: "Quán, rán hòu zhī qīng zhòng; duó, rán hòu zhī cháng duǎn."
    src: 孟子·梁惠王上
    en: "Weigh, and then you know what is light and heavy; measure, and then you know what is long and short."
    tests: "度 duó, the noun 權 \"steelyard\" used as the verb \"to weigh\""
  - h: "見賢思齊焉，見不賢而內自省也。"
    py: "Jiàn xián sī qí yān, jiàn bù xián ér nèi zì xǐng yě."
    src: 論語·里仁
    en: "When you see a worthy man, think of becoming his equal; when you see an unworthy one, look inside and examine yourself."
    tests: "自 + verb (自省 \"examine oneself\"), 而"
  - h: "禮，與其奢也，寧儉。"
    py: "Lǐ, yǔ qí shē yě, nìng jiǎn."
    src: 論語·八佾
    en: "In ritual, rather than be lavish, be frugal."
    tests: "寧 nìng \"rather\""
  - h: "殺人以梃與刃，有以異乎？"
    py: "Shā rén yǐ tǐng yǔ rèn, yǒu yǐ yì hū?"
    src: 孟子·梁惠王上
    en: "Killing a man with a club or with a blade: is there anything that makes them different?"
    tests: "以 phrase after the verb, 有以 (→ L8 n.11), 與, 乎"

culture: >
  Han Fei tells the story in a section on scholars who argue from ancient texts instead of from the
  case in front of them. The idiom 鄭人買履 (also 買履忘度) mocks anyone who sticks to a rule or a
  document even when the plain facts are at hand: the feet were there all along.
