culture: >
  The places are real: the Taihang and Wangwu mountains stand between the Yellow River plain and the
  Shanxi plateau, and the story explains why the way south is open today. (The ending, in L13, tells
  who moved them.) On 11 June 1945 Mao Zedong closed the Seventh Party Congress with a speech called
  "The Foolish Old Man Who Removed the Mountains": the two mountains weighing on China, he said, are
  imperialism and feudalism, and "God" is the Chinese people.
