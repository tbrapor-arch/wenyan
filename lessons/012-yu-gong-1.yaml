exercise:
  - h: "君子求諸己，小人求諸人。"
    py: "Jūnzǐ qiú zhū jǐ, xiǎo rén qiú zhū rén."
    src: 論語·衛靈公
    en: "The gentleman looks for it in himself; the small man looks for it in others."
    tests: "諸 = 之於, 己 (→ L6 n.12)"
  - h: "女與回也孰愈？"
    py: "Rǔ yǔ Huí yě shú yù?"
    src: 論語·公冶長
    en: "Which is the better, you or Hui?"
    tests: "女 = 汝 rǔ \"you\"; 孰 shú \"which (of the two)?\""
  - h: "有事，弟子服其勞；有酒食，先生饌，曾是以為孝乎？"
    py: "Yǒu shì, dìzǐ fú qí láo; yǒu jiǔ sì, xiānshēng zhuàn, zēng shì yǐ wéi xiào hū?"
    src: 論語·為政
    en: "When there is work, the young do the toil; when there is wine and food, their elders are served: can that really be counted as filial piety?"
    tests: "曾 zēng; 以為 (→ L3 n.10); 食 sì \"food\""
  - h: "眾惡之，必察焉；眾好之，必察焉。"
