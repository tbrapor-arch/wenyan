exercise:
  - h: "學而不思則罔，思而不學則殆。"
    py: "Xué ér bù sī zé wǎng, sī ér bù xué zé dài."
    src: 論語·為政
    en: "To learn without thinking is to be lost; to think without learning is dangerous."
    tests: "而, 則"
  - h: "甚矣吾衰也！久矣吾不復夢見周公。"
    py: "Shèn yǐ wú shuāi yě! Jiǔ yǐ wú bù fù mèng jiàn Zhōugōng."
    src: 論語·述而
    en: "How far I have declined! For a long time now I have not dreamed of the Duke of Zhou."
    tests: "矣, 也, 復 (→ L1)"
  - h: "天生德於予，桓魋其如予何？"
    py: "Tiān shēng dé yú yú, Huán Tuí qí rú yú hé?"
    src: 論語·述而
    en: "Heaven gave birth to the virtue in me — what can Huan Tui do to me?"
    tests: "予"
  - h: "子謂顏淵曰：「用之則行，舍之則藏，惟我與爾有是夫！」"
    py: "Zǐ wèi Yán Yuān yuē: Yòng zhī zé xíng, shě zhī zé cáng, wéi wǒ yǔ ěr yǒu shì fú!"
    src: 論語·述而
    en: "The Master said to Yan Yuan: \"When employed, act; when set aside, withdraw — only you and I have this!\""
    tests: "謂 A 曰, 則, 舍"

culture: >
  This passage is the second half of Mencius's famous answer on 浩然之氣 (Mencius 2A:2). His
  advice: keep working at righteousness, "don't forget it, but don't help it grow" (勿忘，勿助長也).
  The idiom 揠苗助長 (also 拔苗助長 in modern mainland usage) means to spoil something by being too
  eager, often said of pushy parents and over-ambitious reforms.
