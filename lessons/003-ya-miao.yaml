id: 3
slug: ya-miao
title: 揠苗助長
title_py: Yà miáo zhù zhǎng
title_en: Pulling Up the Sprouts to Help Them Grow
source:
  work: 孟子·公孫丑上
  author: 孟子 Mencius (c. 372–289 BC)
  period: Warring States
  text_from: >
    《孟子·公孫丑上》, as quoted on Wiktionary 揠苗助長 (CC BY-SA); lines 1–7 also match the
    Hong Kong EDB edition.
status: draft

intro: >
  Mencius, the second great Confucian, is explaining to a disciple how to nourish one's "flood-like
  qi" (浩然之氣), the moral courage that grows from always doing what is right. You can't force it,
  he says, and you mustn't neglect it either, and he tells this story of yet another man of Song.
  New in this lesson: the particle 矣, which marks something that *has happened* or *has become*
  the case, and the reading 長 zhǎng "to grow".

lines:
  - h: "宋人有閔其苗之不長而揠之者，"
    py: "Sòng rén yǒu mǐn qí miáo zhī bù zhǎng ér yà zhī zhě,"
    en: "There was a man of Song who, worried that his sprouts weren't growing, tugged at them."
    lit: "Song people there-was worried his sprouts' not growing and pulled them one"
  - h: "芒芒然歸。"
    py: "máng máng rán guī."
    en: "He came home, worn out,"
  - h: "謂其人曰："
    py: "Wèi qí rén yuē:"
    en: "and said to his family:"
  - h: "「今日病矣，"
    py: "Jīn rì bìng yǐ,"
    en: "\"I'm exhausted today:"
  - h: "予助苗長矣。」"
    py: "yú zhù miáo zhǎng yǐ."
    en: "I've been helping the sprouts grow!\""
  - h: "其子趨而往視之，"
    py: "Qí zǐ qū ér wǎng shì zhī,"
    en: "His son hurried off to look at them;"
  - h: "苗則槁矣。"
    py: "miáo zé gǎo yǐ."
    en: "the sprouts had withered."
  - h: "天下之不助苗長者寡矣。"
    py: "Tiān xià zhī bù zhù miáo zhǎng zhě guǎ yǐ."
    en: "In this world, few are those who don't help their sprouts grow."
  - h: "以為無益而捨之者，"
    py: "Yǐ wéi wú yì ér shě zhī zhě,"
    en: "Those who think it's no use and leave them alone"
  - h: "不耘苗者也；"
    py: "bù yún miáo zhě yě;"
    en: "are those who don't weed their sprouts;"
  - h: "助之長者，"
    py: "zhù zhī zhǎng zhě,"
    en: "those who help them grow"
  - h: "揠苗者也。"
    py: "yà miáo zhě yě."
    en: "are those who tug at their sprouts."
  - h: "非徒無益，"
    py: "Fēi tú wú yì,"
    en: "Not only is that no use —"
  - h: "而又害之。"
    py: "ér yòu hài zhī."
    en: "it actually harms them."

notes:
  - n: 1
    line: 0
    at: 閔其苗之不長
    text: >
      A long first line, built like L1's 宋人有耕者: 宋人 **有** [ … ] **者** "among the people
      of Song there was one who …" (→ L1 n.2). Inside the brackets: 閔 mǐn "to worry about"
      (later written 憫) + its object 其苗之不長 "his sprouts' not growing", the subject + 之 +
      predicate pattern of → L2 n.3. Then 而揠之 "and pulled at them" (→ L1 n.4, L2 n.2).
  - n: 2
    line: 0
    at: 長
    text: >
      **長** has two readings. zhǎng = "to grow; to be the elder, to lead"; cháng = "long". Here,
      and in the idiom 揠苗助長, it is zhǎng. Chinese often marks a change of word by a change of
      tone or initial (破音字); the dictionary entry for 長 lists them separately.
  - n: 3
    line: 1
    at: 芒芒然
    text: >
      **-然** rán turns a word into a description of manner: 芒芒然 "in a weary way, worn out".
      芒芒 is a reduplicated descriptive word; commentators gloss it as 疲倦的樣子 "looking tired".
      You'll meet many ~然 words: 忽然, 果然 and 自然 all come from this pattern.
  - n: 4
    line: 2
    at: 謂其人
    text: >
      **謂 A 曰** "said to A": 謂 takes the person spoken to as its object. **其人** here is "his
      household, his family". Compare L2 n.8, where 其人 meant "that man": context decides.
  - n: 5
    line: 3
    at: 病矣
    text: >
      **病** = "exhausted, worn out", not "ill" (古今詞義 → L1 n.3). In early texts 疾 is the
      ordinary word for illness and 病 a *serious* illness or extreme fatigue.
      **矣** yǐ marks a new situation: "I'm (now) exhausted". 也 states what *is* (→ L1 n.11);
      矣 states what *has come to be*. The story turns on three 矣 (lines 4, 5 and 7): he is
      tired now, the sprouts have been "helped", and by then they have withered.
  - n: 6
    line: 4
    at: 予
    text: >
      **予** yú = "I, me". Classical Chinese has several first-person pronouns: 吾 (L2), 我, 予/余.
      Here the farmer is boasting.
  - n: 7
    line: 5
    at: 趨而往視之
    text: >
      **趨** qū "to hurry, walk fast" — the middle gear between 行 "walk" and 走 "run" (→ L1 n.3).
      **往** "to go (to)", **視** "to look at". 而 again links the manner to the action.
  - n: 8
    line: 6
    at: 則
    text: >
      **則** zé "then, and so": here it marks what the son *found*: "the sprouts — (by then) they had
      withered". 槁 gǎo "dried up, withered".
  - n: 9
    line: 7
    at: 天下之不助苗長者寡矣
    text: >
      Mencius turns to the moral. The subject is a long 者-phrase: 天下之 [不助苗長] 者 "those in
      the world who don't help their sprouts grow", and the predicate is 寡矣 "are few". **寡** guǎ
      "few" (its opposite is 眾). In other words: almost everyone forces things.
  - n: 10
    line: 8
    at: 以為
    text: >
      **以為** yǐ wéi "to think, consider that". Here it introduces a whole clause: 以為無益 "think
      it is no use". (In L6 you will see 以 A 為 B "regard A as B" split around its object.)
      **捨** shě "to give up, leave alone" (also written 舍).
  - n: 11
    line: 9
    at: 者也
    text: >
      **A 者，B 者也** — the classic definition sentence: "A is B". Both halves are 者 phrases
      ("those who …"), and 也 closes the judgment (→ L1 n.11). Lines 9–12 give two of them in
      parallel: neglecting = not weeding; forcing = tugging.
  - n: 12
    line: 12
    at: 非徒
    text: >
      **非徒 … 而又 …** "not only … but also …". 非 fēi negates a whole statement or a noun
      ("it is not that …"), whereas 不 negates a verb. 徒 tú "merely, only". 害 "to harm".

