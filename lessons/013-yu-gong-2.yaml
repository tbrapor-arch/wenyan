id: 13
slug: yu-gong-2
title: 愚公移山（下）
title_py: Yú gōng yí shān (xià)
title_en: "The Foolish Old Man Moves the Mountains (2)"
source:
  work: 列子·湯問
  author: attributed to 列禦寇 Lie Yukou (Warring States); the text as we have it was edited by 張湛 (4th c. AD)
  period: compiled by the 4th century AD from older material
  text_from: >
    《列子·湯問》, second half (from 河曲智叟). Words as in the 四部叢刊 text (Kanseki Repository
    KR5c0049), compared line by line, 2026-11-19, with the 四庫全書 文淵閣 text with 張湛's commentary
    (KR5c0125), the Hong Kong EDB recommended-passage edition (KS3-03) and the English Wiktionary
    citation (Citations:愚公移山, CC BY-SA). Punctuation follows Wiktionary and the EDB edition.
    Variants: 夸娥 (文淵閣, EDB; 四部叢刊 and Wiktionary 夸蛾, see n. 19); 告之於 (Wiktionary 于);
    the EDB text reads 長歎, 我雖死 and 自是 for 長息, 雖我之死 and 自此, and Wiktionary has a slip,
    汝心不固, for 汝心之固. Both old editions write 笑 in a variant form the transcriptions could not
    encode.
status: draft

intro: >
  The second half is an argument and a miracle. The Wise Old Man of the River Bend laughs at the
  project; the Foolish Old Man answers with the most famous speech in the *Liezi*, a chain of sons
  and grandsons that never ends. Watch the conjunction 雖 "even if", 其 as the subject of a clause
  and as a rhetorical "how ever", the inverted exclamation 甚矣，汝之不惠, and 已 meaning "to stop".

lines:
  - h: "河曲智叟笑而止之曰："
    py: "Héqū Zhìsǒu xiào ér zhǐ zhī yuē:"
    en: "The Wise Old Man of the River Bend laughed and tried to stop him, saying:"
  - h: "「甚矣，汝之不惠！"
    py: "Shèn yǐ, rǔ zhī bù huì!"
    en: "\"How great is your folly!"
    lit: "extreme — your not-wise!"
  - h: "以殘年餘力，"
    py: "Yǐ cán nián yú lì,"
    en: "With the years and the strength you have left,"
  - h: "曾不能毀山之一毛，"
    py: "zēng bù néng huǐ shān zhī yī máo,"
    en: "you can't even destroy a single hair of the mountain:"
  - h: "其如土石何？」"
    py: "qí rú tǔ shí hé?"
    en: "what can you ever do with all that earth and rock?\""
  - h: "北山愚公長息曰："
    py: "Běishān Yúgōng cháng xī yuē:"
    en: "The Foolish Old Man of North Mountain heaved a long sigh and said:"
  - h: "「汝心之固，"
    py: "Rǔ xīn zhī gù,"
    en: "\"The stubbornness of your mind"
  - h: "固不可徹，"
    py: "gù bù kě chè,"
    en: "is past all getting through;"
  - h: "曾不若孀妻弱子。"
    py: "zēng bù ruò shuāng qī ruò zǐ."
    en: "you're not even as wise as the widow and her little boy."
  - h: "雖我之死，"
    py: "Suī wǒ zhī sǐ,"
    en: "Even if I die,"
    lit: "even-granting my dying"
  - h: "有子存焉；"
    py: "yǒu zǐ cún yān;"
    en: "there will be my son left;"
  - h: "子又生孫，"
    py: "zǐ yòu shēng sūn,"
    en: "my son will father grandsons,"
  - h: "孫又生子；"
    py: "sūn yòu shēng zǐ;"
    en: "and the grandsons will father sons;"
  - h: "子又有子，"
    py: "zǐ yòu yǒu zǐ,"
    en: "the sons will have sons,"
  - h: "子又有孫；"
    py: "zǐ yòu yǒu sūn;"
    en: "and the sons will have grandsons:"
  - h: "子子孫孫，"
    py: "zǐ zǐ sūn sūn,"
    en: "sons and grandsons, generation after generation,"
  - h: "無窮匱也，"
    py: "wú qióng kuì yě,"
    en: "will never run out,"
  - h: "而山不加增，"
    py: "ér shān bù jiā zēng,"
    en: "while the mountains will grow no bigger:"
  - h: "何苦而不平？」"
    py: "hé kǔ ér bù píng?"
    en: "why fret that they won't be levelled?\""
  - h: "河曲智叟亡以應。"
    py: "Héqū Zhìsǒu wú yǐ yìng."
    en: "The Wise Old Man of the River Bend had no answer."
  - h: "操蛇之神聞之，"
    py: "Cāo shé zhī shén wén zhī,"
    en: "The snake-holding gods heard of it"
  - h: "懼其不已也，"
    py: "jù qí bù yǐ yě,"
    en: "and, afraid that he would never stop,"
  - h: "告之於帝。"
    py: "gào zhī yú dì."
    en: "reported it to God on High."
  - h: "帝感其誠，"
    py: "Dì gǎn qí chéng,"
    en: "God was moved by his sincerity"
  - h: "命夸娥氏二子負二山，"
    py: "mìng Kuā'é shì èr zǐ fù èr shān,"
    en: "and ordered the two sons of the Kua'e clan to carry off the two mountains on their backs,"
  - h: "一厝朔東，"
    py: "yī cuò Shuò dōng,"
    en: "one to be set down east of Shuo,"
  - h: "一厝雍南。"
    py: "yī cuò Yōng nán."
    en: "the other south of Yong."
  - h: "自此冀之南，"
    py: "Zì cǐ Jì zhī nán,"
    en: "From then on, south of Ji"
  - h: "漢之陰，"
    py: "Hàn zhī yīn,"
    en: "and south of the Han,"
  - h: "無隴斷焉。"
    py: "wú lǒng duàn yān."
    en: "there has been no ridge to bar the way."

notes:
  - n: 1
    line: 0
    at: 河曲智叟
    text: >
      **河曲** "the bend of the (Yellow) River", where he lives; **智叟** "the Wise Old Man" (叟 sǒu "old
      man"). The two names are a pair, and the story turns them round: 張湛 comments 俗謂之智者，未必非愚也
      "the one the world calls wise is not necessarily not a fool" (compare L12 n.4). **止之** "(tried to)
      stop him": 止 "to stop" (→ L4, 舟止) used with an object, "make (someone) stop", the causative
      shift of → L10 n.10.
  - n: 2
    line: 1
    at: 甚矣，汝之不惠
    text: >
      **The predicate comes first** in an exclamation: 甚矣，汝之不惠 = 汝之不惠甚矣 "your lack of wisdom is
      extreme". Putting 甚矣 "(it is) extreme!" in front throws the weight on it, like English "How
      great is your folly!". 汝之不惠 is subject + 之 + predicate (→ L2 n.3). **惠** = 慧 huì "wise",
      a borrowed character (→ L8 n.5). You met the same shape in L3's exercise: 甚矣吾衰也.
  - n: 3
    line: 2
    at: 殘年餘力
    text: >
      **殘** cán "remaining, what is left over" (modern 殘 "cruel, damaged"); **餘** yú "surplus,
      remaining" (→ L5 n.4). *Simplified-character warning:* simplified Chinese writes 余 for 餘, and 余
      is also the classical pronoun "I" (→ L3 n.6, 予 and 余). In a simplified classical text, 余 can be
      either word; the traditional text keeps them apart (mainland editions sometimes print 馀 where
      the two would clash).
  - n: 4
    line: 3
    at: 一毛
    text: >
      **毀** huǐ "to destroy, demolish". **一毛** "a single hair": the trees and grass on a mountain are its
      hair. 曾不能 "can't even" (→ L12 n.15). The Wise Old Man repeats the wife's argument from L12,
      with contempt instead of concern.
  - n: 5
    line: 4
    at: 其如土石何
    text: >
      **其 as a modal word**: before the verb of a question or a wish, 其 adds "how ever, surely":
      其如土石何 "what *could* you ever do about the earth and rocks?" (如 X 何 → L12 n.16). So far 其 was
      "his, its" (→ L1 n.6) and "that" (→ L2 n.8); this 其 is an adverb. You met it in L3's exercise:
      桓魋其如予何 "what can Huan Tui do to me?"
  - n: 6
    line: 5
    at: 長息
    text: >
      **息** xī "breath": 長息 cháng xī "a long breath, a deep sigh" (長 cháng "long", → L3 n.2). Modern
      息 is mostly "rest" (休息) or "interest" (利息), both from "breathing (space)".
  - n: 7
    line: 6
    at: 汝心之固
    text: >
      **Two 固 in a row.** 汝心之固 "the *solidness* of your mind", i.e. its obstinacy: the adjective 固
      "solid, fixed" as a noun, in a subject + 之 + predicate phrase (→ L2 n.3). Then 固不可徹 "is
      *certainly* impenetrable": 固 "certainly" (→ L5 n.10). **徹** chè "to go right through".
  - n: 8
    line: 8
    at: 曾不若
    text: >
      **不若** "not as good as": 若 "to be like" (→ L4 n.7), so "not equal to". 曾不若孀妻弱子 "you are not
      even a match for the widow and her little boy" (L12 lines 28–30), who at least came to help.
  - n: 9
    line: 9
    at: 雖我之死
    text: >
      **雖** suī "even if; although", the first conjunction in the course that introduces a whole clause.
      Here the clause is subject + 之 + predicate (→ L2 n.3): 雖我之死 "even granting my death". Whether
      雖 is "although" (a fact) or "even if" (a supposition) depends on the context: the old man is
      still alive, so "even if". (L7's exercise had 雖令不從 "even if he gives orders, they are not
      followed".)
  - n: 10
    line: 10
    at: 有子存焉
    text: >
      **存** cún "to survive, remain". **焉** = 於是 "in it, there" (→ L12 n.25): 有子存焉 "there will be
      sons remaining (in the world)".
  - n: 11
    line: 16
    at: 無窮匱也
    text: >
      **窮** qióng "to come to an end, be exhausted" (古今詞義: "poor" is 貧 in Classical Chinese; 窮 is
      to have come to the end of one's road). **匱** kuì "to run short". 無窮匱 "there will be no running
      out". 子子孫孫 "sons' sons and grandsons' grandsons": doubled nouns mean "one after another, every".
  - n: 12
    line: 17
    at: 而山不加增
    text: >
      **而** "whereas, but": the contrast of → L1 n.9 between the endless family and the mountain that
      cannot grow. **加增** jiā zēng "to grow larger" (two words meaning "add, increase").
  - n: 13
    line: 18
    at: 何苦而不平
    text: >
      **何苦而不平** "what is there to worry about, that it won't be levelled?" 何苦 "what hardship, what
      is there to fret about" (modern 何苦 "why bother" comes from here). **平** "to be level" has a
      passive sense with no passive marker: the mountain "gets levelled". Classical Chinese often leaves
      the passive unmarked when the sense is clear (compare 可 + verb, → L1 n.8).
  - n: 14
    line: 19
    at: 亡以應
    text: >
      **亡以應** wú yǐ yìng = 無以應 "had nothing to answer with" (無以 → L8 n.11; 亡 read wú → L11 n.2). 應
      "to answer" (→ L2 n.8). The wise man is beaten by the fool in argument before the gods step in.
  - n: 15
    line: 20
    at: 操蛇之神
    text: >
      **操蛇之神** "the snake-holding gods": a verb phrase + 之 + noun (→ L2 n.9), with 操 "to hold" (→ L9
      n.7). 張湛 explains from the 山海經: the gods of the mountains and seas all hold snakes. The gods of
      these mountains are afraid of losing their home.
  - n: 16
    line: 21
    at: 懼其不已
    text: >
      **其 as the subject of a clause.** 懼其不已 "feared his not stopping" = "feared that he would never
      stop". When a clause is the object of a verb (懼, 聞, 知 …), its subject is often 其 "his", the
      pronoun form of the "X 之" of → L2 n.3 (其 = 彼之 "his"). **已** yǐ "to stop, come to an end"
      (not "already", → L4 n.6): 不已 "not stop". The final 也 marks a pause (→ L6 n.2).
  - n: 17
    line: 22
    at: 告之於帝
    text: >
      **告 A 於 B** "report A to B": 之 "it" (the matter) and 於帝 "to God". **帝** dì "the Lord on High",
      the supreme god of the sky (天帝 in L6); only from the First Emperor on did 帝 become the title of
      earthly rulers.
  - n: 18
    line: 23
    at: 感其誠
    text: >
      **感** gǎn "to be moved by"; **誠** chéng "sincerity, wholeheartedness" (a noun here; in L6 誠 was
      the adverb "truly", → L6 n.3). 其 "his" (→ L1 n.6).
  - n: 19
    line: 24
    at: 命夸娥氏二子
    text: >
      **命 A V** "order A to V": like 使 (→ L6 n.7), 命 takes a person who then does the action. **夸娥氏**
      Kuā'é shì, a clan of giants or strong gods (張湛: "not in other records; probably gods of great
      strength"); the 四部叢刊 text and Wiktionary write 夸蛾. 二子 "two sons". **負** fù "to carry on the
      back".
  - n: 20
    line: 25
    at: 一厝朔東
    text: >
      **厝** cuò "to place, set down" (= 措 or 置). **一 … 一 …** "one … the other …". 朔東 "east of Shuo"
      (朔方, the far north) and 雍南 "south of Yong" (雍州, the far west): the mountains are moved to
      the edges of the world.
  - n: 21
    line: 27
    at: 自此
    text: >
      **自此** "from this (time) on": 自 "from" (→ L4 n.2), 此 "this". The story ends where it began,
      with an explanation of the landscape: 冀之南，漢之陰 (→ L12 n.3).
  - n: 22
    line: 29
    at: 隴斷
    text: >
      **隴斷** lǒng duàn (also written 壟斷) "a high ridge, a raised barrier": 無隴斷焉 "there was no barrier
      there" (焉 → n. 10). Mencius has the same word, written 龍斷, for the high mound from which a
      greedy trader looked over the whole market to corner it; that is where modern 壟斷 "monopoly"
      comes from (古今詞義).

