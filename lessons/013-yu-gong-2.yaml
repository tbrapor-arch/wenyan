exercise:
  - h: "賢哉，回也！"
    py: "Xián zāi, Huí yě!"
    src: 論語·雍也
    en: "How worthy he is, Hui!"
    tests: "predicate first in an exclamation (n. 2), 哉"
  - h: "雖曰未學，吾必謂之學矣。"
    py: "Suī yuē wèi xué, wú bì wèi zhī xué yǐ."
    src: 論語·學而
    en: "Even if he says he has not studied, I would certainly call him learned."
    tests: "雖 \"even if\", 未, 謂"
  - h: "死而後已，不亦遠乎？"
    py: "Sǐ ér hòu yǐ, bù yì yuǎn hū?"
    src: 論語·泰伯
    en: "It stops only at death: is that not a long road?"
    tests: "已 = to stop; 不亦…乎 (→ L4 n.8)"
  - h: "泰伯，其可謂至德也已矣。"
    py: "Tàibó, qí kě wèi zhì dé yě yǐ yǐ."
    src: 論語·泰伯
    en: "Taibo can surely be called a man of the highest virtue."
    tests: "modal 其 \"surely\"; 也已矣 stacked final particles"

culture: >
  張湛, the 4th-century editor of the *Liezi*, adds a comment at the end of the story: people who
  want results by evening sigh at the end of the year, but the great man takes heaven and earth for
  a single morning and countless generations for one long breath, and does not mind whether the work
  is finished by himself or by others. Mao's
  reading in 1945 was the same in a political key: the work is collective and goes on beyond any
  one life. Today 愚公移山 is the standard idiom for tireless perseverance against impossible odds.
