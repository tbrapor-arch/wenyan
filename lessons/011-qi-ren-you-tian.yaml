id: 11
slug: qi-ren-you-tian
title: 杞人憂天
title_py: Qǐ rén yōu tiān
title_en: The Man of Qi Who Feared the Sky Would Fall
source:
  work: 列子·天瑞
  author: attributed to 列禦寇 Lie Yukou (Warring States); the text as we have it was edited by 張湛 (4th c. AD)
  period: compiled by the 4th century AD from older material
  text_from: >
    《列子·天瑞》, as quoted on English Wiktionary 杞人憂天 (CC BY-SA), whose readings 亡 wú and 舍 shì
    we follow. Compared line by line, 2026-11-19, with two unpunctuated transcriptions in the Kanseki
    Repository: the 四部叢刊 text (KR5c0049) and the 四庫全書 文淵閣 text (KR5c0125). Same words
    throughout; the old editions write the variant forms 徃 (往) and 舎 (舍), and both have a rare
    variant glyph in 舍然 or 杞 that the transcriptions could not encode.
status: draft

intro: >
  The *Liezi* is a Daoist book in the line of the *Zhuangzi*, full of stories that poke fun at
  ordinary certainties. This one gave Chinese its word for a groundless worry (杞憂, 杞人憂天). It is
  almost all dialogue, so it is the place to meet the language of conversation: a second-person
  pronoun (若 "you"), the particles 耳 "only" and 邪 (a question), the question 奈何 "why?" and its
  split form 奈 … 何 "what can be done about …?". Note also 亡, read wú here.

lines:
  - h: "杞國有人，"
    py: "Qǐ guó yǒu rén,"
    en: "In the state of Qi there was a man"
  - h: "憂天地崩墜，"
    py: "yōu tiān dì bēng zhuì,"
    en: "who worried that heaven and earth would collapse and fall,"
  - h: "身亡所寄，"
    py: "shēn wú suǒ jì,"
    en: "leaving him nowhere to put himself,"
    lit: "body have-no place-where lodge"
  - h: "廢寢食者。"
    py: "fèi qǐn shí zhě."
    en: "and who gave up sleeping and eating."
  - h: "又有憂彼之所憂者，"
    py: "Yòu yǒu yōu bǐ zhī suǒ yōu zhě,"
    en: "There was another man, who worried about that man's worrying,"
    lit: "also there-was worrying that-one 's what-worried one"
  - h: "因往曉之，曰："
    py: "yīn wǎng xiǎo zhī, yuē:"
    en: "so he went to put him right, saying:"
  - h: "「天，積氣耳，"
    py: "Tiān, jī qì ěr,"
    en: "\"Heaven is nothing but piled-up air;"
  - h: "亡處亡氣。"
    py: "wú chù wú qì."
    en: "there is no place without air."
    lit: "there-is-no place there-is-no air"
  - h: "若屈伸呼吸，"
    py: "Ruò qū shēn hū xī,"
    en: "You bend and stretch, breathe out and in,"
  - h: "終日在天中行止，"
    py: "zhōng rì zài tiān zhōng xíng zhǐ,"
    en: "you go about all day inside heaven:"
  - h: "奈何憂崩墜乎？」"
    py: "nài hé yōu bēng zhuì hū?"
    en: "why worry about it collapsing?\""
  - h: "其人曰："
    py: "Qí rén yuē:"
    en: "The man said:"
  - h: "「天果積氣，"
    py: "Tiān guǒ jī qì,"
    en: "\"If heaven really is piled-up air,"
  - h: "日月星宿不當墜邪？」"
    py: "rì yuè xīng xiù bù dāng zhuì yé?"
    en: "won't the sun, moon and stars fall down?\""
  - h: "曉之者曰："
    py: "Xiǎo zhī zhě yuē:"
    en: "The one putting him right said:"
  - h: "「日月星宿，"
    py: "Rì yuè xīng xiù,"
    en: "\"The sun, moon and stars"
  - h: "亦積氣中之有光耀者，"
    py: "yì jī qì zhōng zhī yǒu guāng yào zhě,"
    en: "are just the parts of that piled-up air that shine;"
  - h: "只使墜，"
    py: "zhǐ shǐ zhuì,"
    en: "even if they fell,"
  - h: "亦不能有所中傷。」"
    py: "yì bù néng yǒu suǒ zhòng shāng."
    en: "they couldn't hit or hurt anything.\""
  - h: "其人曰："
    py: "Qí rén yuē:"
    en: "The man said:"
  - h: "「奈地壞何？」"
    py: "Nài dì huài hé?"
    en: "\"And what if the earth gives way?\""
    lit: "deal-with earth collapse how"
  - h: "曉者曰："
    py: "Xiǎo zhě yuē:"
    en: "The one putting him right said:"
  - h: "「地積塊耳，"
    py: "Dì jī kuài ěr,"
    en: "\"The earth is nothing but piled-up clods,"
  - h: "充塞四虛，"
    py: "chōng sè sì xū,"
    en: "filling the empty space on all four sides;"
  - h: "亡處亡塊。"
    py: "wú chù wú kuài."
    en: "there is no place without clods."
  - h: "若躇步跐蹈，"
    py: "Ruò chú bù cǐ dǎo,"
    en: "You stride and step and stamp about,"
  - h: "終日在地上行止，"
    py: "zhōng rì zài dì shàng xíng zhǐ,"
    en: "you go about all day on the earth:"
  - h: "奈何憂其壞？」"
    py: "nài hé yōu qí huài?"
    en: "why worry about it giving way?\""
  - h: "其人舍然大喜，"
    py: "Qí rén shì rán dà xǐ,"
    en: "The man was relieved and overjoyed,"
  - h: "曉之者亦舍然大喜。"
    py: "xiǎo zhī zhě yì shì rán dà xǐ."
    en: "and the one who had put him right was relieved and overjoyed too."

notes:
  - n: 1
    line: 0
    at: 杞國有人
    text: >
      **杞** Qǐ, a tiny state in present-day Henan whose rulers claimed descent from the Xia dynasty.
      The sentence is the 有 … 者 frame (→ L1 n.2) stretched over four lines: 杞國有人 [憂 … ，… ，
      廢寢食] 者 "in Qi there was a man who worried …, … and gave up sleeping and eating". With 人
      inside the frame, 有人 … 者 is "there was a person who …".
  - n: 2
    line: 2
    at: 亡所寄
    text: >
      **亡 = 無, read wú**: "not to have, there is no". This 亡 is the same character as 亡 wáng "to
      lose, run away" (→ L5 n.12, L10 n.4), used for the word 無, which sounded close. When it means
      "there is no", read it wú, as Wiktionary does. 亡所寄 = 無所寄 "nothing on which (his body could)
      lodge": 所 + verb (→ L4 n.5) after 無, "nothing that …, nowhere that …". 身 "his own person" (→
      L1 n.9).
  - n: 3
    line: 3
    at: 廢寢食
    text: >
      **廢** fèi "to abandon, give up", not "waste, useless" as in modern 廢物. 寢 qǐn "to sleep (lying
      down)", 食 shí "to eat": 廢寢食 "gave up sleep and food", the source of the phrase 廢寢忘食.
  - n: 4
    line: 4
    at: 彼之所憂
    text: >
      **彼** bǐ "that, that one", the far demonstrative (此 "this" is the near one, → L4 n.7). It points
      at a person as well as a thing, so it often works as "he, they": 彼之所憂 "what *that man* worried
      about". The phrase is subject + 之 + 所 + verb, as in 吾劍之所從墜 (→ L4 n.5). The second man
      worries about the first man's worry, and that is the joke of the whole story.
  - n: 5
    line: 5
    at: 曉之
    text: >
      **曉** xiǎo "to make (someone) understand, enlighten": 曉之 "put him right". The adjective
      "clear, bright" (曉 is also "dawn") is used as a verb meaning "make clear to": the causative kind
      of word-class shift (→ L10 n.10). Modern 曉得 "to know" uses the plain sense. 因 "and so" (→ L1
      n.5), 往 "to go" (→ L3 n.7).
  - n: 6
    line: 6
    at: 耳
    text: >
      **耳** ěr at the end of a sentence = "only, that's all" (it is a fusion of 而已 "and stop").
      天，積氣耳 "heaven — piled-up air, that's all": a judgment sentence, A，B (→ L1 n.11), with 耳
      in place of 也. **積** jī "to pile up, accumulate"; **氣** qì "air, vapour", the stuff of which
      the Chinese cosmos was thought to be made.
  - n: 7
    line: 7
    at: 亡處亡氣
    text: >
      **亡處亡氣** wú chù wú qì "there is no place where there is no air": two negatives make "air is
      everywhere", like 無不 (→ L2 n.5). **處** chù "place" (compare 處 chǔ "to dwell", → L8 n.3).
  - n: 8
    line: 8
    at: 若
    text: >
      **若 = "you".** At the head of a clause, before a verb, 若 is a second-person pronoun: 若屈伸呼吸
      "*you* bend and stretch, breathe out and in". So far "you" has been 子, the polite form (→ L2
      n.7); 若 is plainer, used to equals and inferiors. Coming next: **汝** (also written **女**) rǔ, the
      everyday "you" (L12), and 爾 ěr. Don't confuse it with 若 "to be like" (→ L4 n.7): the slot
      tells you which.
  - n: 9
    line: 10
    at: 奈何
    text: >
      **奈何** nài hé "why? how (can)?": 奈何憂崩墜乎 "why worry about it collapsing?". The question
      word stands before the verb it questions (→ L9 n.11 何不), and 乎 ends the question (→ L4 n.8).
  - n: 10
    line: 12
    at: 果
    text: >
      **果** "really, in fact" (→ L6 n.3). At the head of a clause, the sense slides to "if it really
      is so": 天果積氣 "if heaven really is piled-up air". Classical Chinese often leaves "if" unsaid;
      the second clause shows that the first was a condition.
  - n: 11
    line: 13
    at: 邪
    text: >
      **邪** yé (= 耶) is a question particle, like 乎 (→ L4 n.8) but more often in questions that
      invite a "yes": 不當墜邪 "shouldn't they fall?" Read yé, not xié "evil". **當** dāng "should,
      ought to"; **星宿** xīng xiù "the stars and constellations": 宿 is xiù when it means a lunar
      mansion (sù "to lodge" otherwise).
  - n: 12
    line: 16
    at: 積氣中之有光耀者
    text: >
      A long noun phrase: [積氣中] 之 [有光耀] 者 "the ones within the piled-up air that have light". The
      place (積氣中 "in the piled air") + 之 modifies the 者 phrase (→ L1 n.2, L1 n.10). 亦 "just,
      likewise (air)".
  - n: 13
    line: 17
    at: 只使
    text: >
      **只使** zhǐ shǐ "even if, supposing": 只使墜 "even if they did fall". 使 here makes a condition
      ("suppose"), not a causative (→ L6 n.7); later texts write 即使 or 縱使, and 即使 is still the
      modern word.
  - n: 14
    line: 18
    at: 有所中傷
    text: >
      **有所 V** "have something that (one) V's": the opposite of 無所 (n. 2). 不能有所中傷 "could not
      hit or harm anything". **中** zhòng "to hit (the mark)", the verb, not zhōng "middle". Modern
      中傷 means "to slander", a figurative "hit and hurt".
  - n: 15
    line: 20
    at: 奈地壞何
    text: >
      **奈 X 何** "what can be done about X?, what about X?": the thing in question goes *between* 奈
      and 何. 奈地壞何 "what about the earth giving way?" Compare 奈何 in n. 9, where nothing stands
      in between. 如 X 何 works the same way: you'll meet it in L12 (如太形、王屋何).
  - n: 16
    line: 22
    at: 積塊
    text: >
      **塊** kuài "clod of earth". **充塞** chōng sè "to fill up, stuff": 塞 read sè, "to block" (→
      L10 n.2). 四虛 "the void in all four directions". The answer mirrors the first one point by point:
      天，積氣耳 / 地積塊耳.
  - n: 17
    line: 25
    at: 躇步跐蹈
    text: >
      **躇步跐蹈** chú bù cǐ dǎo: four verbs of walking, "to stride, step, tread, stamp". The first
      answer had four for breathing and moving (屈伸呼吸): the man moves through heaven and stamps
      on earth all day without harm.
  - n: 18
    line: 28
    at: 舍然
    text: >
      **舍然** shì rán "relieved, freed of worry" = 釋然: 舍 stands for 釋 "to let go" (a borrowed
      character, → L8 n.5), hence the reading shì. -然 makes it a description of manner (→ L3 n.3).
      大喜 "greatly delighted".

