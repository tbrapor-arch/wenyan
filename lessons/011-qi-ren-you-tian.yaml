exercise:
  - h: "偃之言是也，前言戲之耳。"
    py: "Yǎn zhī yán shì yě, qián yán xì zhī ěr."
    src: 論語·陽貨
    en: "What Yan says is right; what I said before was only teasing him."
    tests: "耳 = only; 是 here = right"
  - h: "既使我與若辯矣，若勝我，我不若勝，若果是也？我果非也邪？"
    py: "Jì shǐ wǒ yǔ ruò biàn yǐ, ruò shèng wǒ, wǒ bù ruò shèng, ruò guǒ shì yě? Wǒ guǒ fēi yě yé?"
    src: 莊子·齊物論
    en: "Suppose you and I have argued. If you have beaten me and I have not beaten you, are you really right? Am I really wrong?"
    tests: "若 = you; 果; 邪; 使 = suppose; in 我不若勝 the pronoun object 若 comes before the verb, as it often does after a negative"
  - h: "亡而為有，虛而為盈，約而為泰，難乎有恆矣。"
    py: "Wú ér wéi yǒu, xū ér wéi yíng, yuē ér wéi tài, nán hū yǒu héng yǐ."
    src: 論語·述而
    en: "Having nothing and acting as if one had, being empty and acting full, being poor and acting grand: it is hard for such a man to be constant."
    tests: "亡 wú = 無, 虛, 而"
  - h: "騅不逝兮可柰何！虞兮虞兮柰若何！"
    py: "Zhuī bù shì xī kě nài hé! Yú xī Yú xī nài ruò hé!"
    src: 史記·項羽本紀
    en: "My horse Zhui will not go on — what can be done? Yu, oh Yu, what will become of you?"
    tests: "柰 = 奈: 奈何, 奈 X 何, 若 = you (Xiang Yu's last song, to his lady Yu)"

culture: >
  杞人憂天 (or simply 杞憂, also borrowed into Japanese as *kiyū*) is said of anyone who frets about
  imaginary dangers. The *Liezi* goes on past our passage: a sage laughs at both men, and then Liezi
  himself laughs at the sage. Whether heaven and earth will perish, he says, "is not something I can
  know", so why trouble one's heart about it? The ending is pure Daoism: neither worry nor
  reassurance, but indifference.
