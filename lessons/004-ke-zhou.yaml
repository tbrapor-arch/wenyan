exercise:
  - h: "學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？"
    py: "Xué ér shí xí zhī, bù yì yuè hū? Yǒu péng zì yuǎn fāng lái, bù yì lè hū?"
    src: 論語·學而
    en: "To learn and practise it at the right times — is that not a pleasure? To have friends come from afar — is that not a joy?"
    tests: "不亦…乎, 自"
  - h: "己所不欲，勿施於人。"
    py: "Jǐ suǒ bù yù, wù shī yú rén."
    src: 論語·衛靈公
    en: "What you yourself do not want, do not do to others."
    tests: "所 (所不欲 \"what one doesn't want\"), 於"
  - h: "是可忍也，孰不可忍也？"
    py: "Shì kě rěn yě, shú bù kě rěn yě?"
    src: 論語·八佾
    en: "If this can be tolerated, what cannot?"
    tests: "是 = this, 可 + verb (→ L1 n.8)"
  - h: "逝者如斯夫！不舍晝夜。"
    py: "Shì zhě rú sī fú! Bù shě zhòu yè."
    src: 論語·子罕
    en: "What passes away is like this, day and night without ceasing!"
    tests: "如 = 若, 者, 夫 (exclamatory, at the end)"

culture: >
  Lü Buwei, a merchant, became chancellor of Qin and patron of the young king who would become the
  First Emperor. He had the book displayed at the gate of the Qin capital and offered a thousand
  pieces of gold to anyone who could add or remove a single character (一字千金). Like Han Fei,
  the authors of 察今 argue against copying the laws of the ancient kings: "times change, so laws
  must change".
