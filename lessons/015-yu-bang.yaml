exercise:
  - h: "學如不及，猶恐失之。"
    py: "Xué rú bù jí, yóu kǒng shī zhī."
    src: 論語·泰伯
    en: "Learn as if you could never catch up, and still be afraid of losing it."
    tests: "恐 \"fear\", 如, 猶 (→ L6 n.16), 及 (→ L9 n.10)"
  - h: "願車馬，衣輕裘，與朋友共，敝之而無憾。"
    py: "Yuàn chē mǎ, yì qīng qiú, yǔ péngyǒu gòng, bì zhī ér wú hàn."
    src: 論語·公冶長
    en: "I would like to share my carriages and horses, and the light furs I wear, with my friends, and have no regrets if they wear them out."
    tests: "願 \"wish\"; 敝 = 弊 \"wear out\"; 衣 yì \"to wear\", a noun used as a verb"
  - h: "臣固知王之不忍也。"
    py: "Chén gù zhī wáng zhī bù rěn yě."
    src: 孟子·梁惠王上
    en: "I knew of course that Your Majesty could not bear it."
    tests: "臣 for \"I\" and 王 for \"you\"; 固 (→ L5 n.10); subject + 之 + predicate as an object"

culture: >
  The idiom is quoted in full as 鷸蚌相爭，漁人得利 "when the snipe and the mussel fight, the
  fisherman gets the profit" (also 漁翁得利); 漁人之利 alone means a windfall won from other people's
  quarrels. Su Dai's warning came true in the end: within a few decades Qin, which had stayed out of
  the wars among its neighbours, conquered Zhao in 228 BC and Yan in 222 BC.
