exercise:
  - h: "見善如不及，見不善如探湯。"
    py: "Jiàn shàn rú bù jí, jiàn bù shàn rú tàn tāng."
    src: 論語·季氏
    en: "When you see good, act as if you could never catch up with it; when you see evil, as if you had put your hand into boiling water."
    tests: "探湯 (n. 11); 如; 及 (→ L9 n.10)"
  - h: "弟子孰為好學？"
    py: "Dìzǐ shú wéi hào xué?"
    src: 論語·雍也
    en: "Which of your disciples loves learning?"
    tests: "孰 (n. 13), here \"which (of them)?\"; 為 wéi \"to be\"; 好 hào"
  - h: "君子去仁，惡乎成名？"
    py: "Jūnzǐ qù rén, wū hū chéng míng?"
    src: 論語·里仁
    en: "If a gentleman leaves goodness behind, how is he to make a name?"
    tests: "去 \"to leave\" (n. 4); 惡乎 wū hū \"in what way?\": the question word 惡 before its preposition 乎 = 於 (→ L17 n.12, L18 n.1)"

culture: >
  The boys' puzzle is a real one, and Han scholars were already arguing about it (a note in the
  文淵閣 text says that 桓譚's 新論 tells the same story): the sun on the horizon does look larger,
  although it is not nearer, and the noon sun is hotter because its rays fall straight down. The *Liezi* is not interested in the answer. Its point is the boys' last
  line: even Confucius does not know everything, and a Daoist reader would add that no one does.
