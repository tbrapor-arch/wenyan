exercise:
  - h: "莫我知也夫！"
    py: "Mò wǒ zhī yě fú!"
    src: 論語·憲問
    en: "No one understands me!"
    tests: "莫 = no one (note the object 我 moves before the verb after 莫)"
  - h: "民無信不立。"
    py: "Mín wú xìn bù lì."
    src: 論語·顏淵
    en: "Without trust, the people cannot stand."
    tests: "無, 立"
  - h: "燕雀安知鴻鵠之志哉！"
    py: "Yàn què ān zhī hóng hú zhī zhì zāi!"
    src: 史記·陳涉世家
    en: "How could swallows and sparrows know the ambitions of a swan!"
    tests: "之 (attributive)"
  - h: "道不同，不相為謀。"
    py: "Dào bù tóng, bù xiāng wéi móu."
    src: 論語·衛靈公
    en: "Those whose ways differ do not make plans together."
    tests: "同"

culture: >
  The story is a weapon in a debate. Han Fei's opponents praised both Yao and Shun as perfect
  sage-kings; Han Fei answers that if Shun had to correct Yao's mistakes, Yao wasn't perfect, and
  if Yao was perfect, Shun had nothing to correct: "you cannot praise both". The word 矛盾
  entered modern Chinese (and Japanese, *mujun*) as the standard term for "contradiction",
  including the Marxist "contradiction" of Mao's essay 《矛盾論》.
