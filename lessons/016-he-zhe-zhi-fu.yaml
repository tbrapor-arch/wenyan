exercise:
  - h: "諾，吾將仕矣。"
    py: "Nuò, wú jiāng shì yǐ."
    src: 論語·陽貨
    en: "Very well, I will take office."
    tests: "諾, 吾 as subject, 將 \"going to\"; Confucius answering Yang Huo, who pressed him to serve"
  - h: "今者吾喪我，汝知之乎？"
    py: "Jīn zhě wú sàng wǒ, rǔ zhī zhī hū?"
    src: 莊子·齊物論
    en: "Just now I lost my self: did you know it?"
    tests: "吾 the subject, 我 the object (n. 16); 今者 (→ L15 n.3); 汝"
  - h: "十室之邑，必有忠信如丘者焉，不如丘之好學也。"
    py: "Shí shì zhī yì, bì yǒu zhōng xìn rú Qiū zhě yān, bù rú Qiū zhī hào xué yě."
    src: 論語·公冶長
    en: "In a town of ten households there are sure to be people as loyal and trustworthy as I am, but none as fond of learning as I am."
    tests: "丘, Confucius naming himself (n. 7); 邑; 有 … 焉; 不如"
  - h: "回也非助我者也，於吾言無所不說。"
    py: "Huí yě fēi zhù wǒ zhě yě, yú wú yán wú suǒ bù yuè."
    src: 論語·先進
    en: "Hui is no help to me: there is nothing in what I say that he does not delight in."
    tests: "我 the object, 吾 the possessive; 無所不 \"nothing that … not\"; 說 = 悅 yuè"

culture: >
  The idiom 涸轍之鮒 "the carp in the dried-up rut" (also 涸轍之魚) is said of anyone in desperate
  straits, who needs a little help now rather than a great deal later. The story belongs with the
  many anecdotes of Zhuang Zhou's poverty: in another chapter he goes to see the King of Wei in a
  patched gown and shoes tied up with string, and tells him that he is "poor, not down and out" (貧也，非憊也).
