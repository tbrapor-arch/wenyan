exercise:
  translate:
  - {h: "请问，银行在哪儿？", py: "Qǐngwèn, yínháng zài nǎr?", fr: "Excusez-moi, où est la banque ?", en: "Excuse me, where's the bank?"}
  - {h: "我家附近没有超市。", py: "Wǒ jiā fùjìn méiyǒu chāoshì.", fr: "Il n'y a pas de supermarché près de chez moi.", en: "There's no supermarket near my home."}
  - {h: "我的床就在桌子旁边。", py: "Wǒ de chuáng jiù zài zhuōzi pángbiān.", fr: "Mon lit est juste à côté du bureau.", en: "My bed is right next to the desk."}
  - {h: "小雨不在这儿，她在那儿。", py: "Xiǎoyǔ bú zài zhèr, tā zài nàr.", fr: "Xiaoyu n'est pas ici, elle est là-bas.", en: "Xiaoyu isn't here, she's over there."}
  choose:
  - {h: "超市＿＿银行旁边。", opts: [在, 有, 是], a: 在, py: "Chāoshì zài yínháng pángbiān.", fr: "Le supermarché est à côté de la banque.", en: "The supermarket is next to the bank."}
  - {h: "这儿附近＿＿银行吗？", opts: [有, 在, 就], a: 有, py: "Zhèr fùjìn yǒu yínháng ma?", fr: "Il y a une banque près d'ici ?", en: "Is there a bank near here?"}
  - {h: "对不起！——＿＿。", opts: [没关系, 不客气, 请问], a: 没关系, py: "Duìbuqǐ! — Méi guānxi.", fr: "Pardon ! — Ce n'est rien.", en: "Sorry! — No problem."}
  - {h: "谢谢！——＿＿。", opts: [不客气, 对不起, 没关系], a: 不客气, py: "Xièxie! — Bú kèqi.", fr: "Merci ! — De rien.", en: "Thanks! — You're welcome."}
