exercise:
  translate:
  - {h: "我每天坐地铁去上班。", py: "Wǒ měi tiān zuò dìtiě qù shàngbān.", fr: "Je vais au travail en métro tous les jours.", en: "I take the metro to work every day."}
  - {h: "你怎么去超市？", py: "Nǐ zěnme qù chāoshì?", fr: "Comment tu vas au supermarché ?", en: "How do you get to the supermarket?"}
  - {h: "到银行走路要五分钟。", py: "Dào yínháng zǒulù yào wǔ fēnzhōng.", fr: "Jusqu'à la banque, il faut cinq minutes à pied.", en: "It's five minutes' walk to the bank."}
  - {h: "张伟开车很慢。", py: "Zhāng Wěi kāichē hěn màn.", fr: "Zhang Wei conduit très lentement.", en: "Zhang Wei drives very slowly."}
  choose:
  - {h: "我们＿＿地铁去吧。", opts: [坐, 开, 在], a: 坐, py: "Wǒmen zuò dìtiě qù ba.", fr: "Prenons le métro.", en: "Let's take the metro."}
  - {h: "你＿＿去五道口？", opts: [怎么, 什么, 哪儿], a: 怎么, py: "Nǐ zěnme qù Wǔdàokǒu?", fr: "Comment tu vas à Wudaokou ?", en: "How are you getting to Wudaokou?"}
  - {h: "走路十＿＿。", opts: [分钟, 分, 点], a: 分钟, py: "Zǒulù shí fēnzhōng.", fr: "Dix minutes à pied.", en: "Ten minutes on foot."}
  - {h: "小雨＿＿等你！", opts: [在, 有, 去], a: 在, py: "Xiǎoyǔ zài děng nǐ!", fr: "Xiaoyu t'attend !", en: "Xiaoyu's waiting for you!"}
