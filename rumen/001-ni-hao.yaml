exercise:
  translate:
  - {h: "你是王小雨吗？", py: "Nǐ shì Wáng Xiǎoyǔ ma?", fr: "Tu es Wang Xiaoyu ?", en: "Are you Wang Xiaoyu?"}
  - {h: "我不累。", py: "Wǒ bú lèi.", fr: "Je ne suis pas fatigué.", en: "I'm not tired."}
  - {h: "小雨是我的同事。", py: "Xiǎoyǔ shì wǒ de tóngshì.", fr: "Xiaoyu est ma collègue.", en: "Xiaoyu is my colleague."}
  - {h: "我们很好，谢谢！", py: "Wǒmen hěn hǎo, xièxie!", fr: "Nous allons bien, merci !", en: "We're fine, thank you!"}
  choose:
  - {h: "你是马克＿＿？", opts: [吗, 吧, 的], a: "吗", py: "Nǐ shì Mǎkè ma?", fr: "Tu es Marc ?", en: "Are you Marc?"}
  - {h: "我＿＿累。", opts: [是, 不, 吗], a: "不", py: "Wǒ bú lèi.", fr: "Je ne suis pas fatigué.", en: "I'm not tired."}
  - {h: "我们走＿＿！", opts: [吗, 很, 吧], a: "吧", py: "Wǒmen zǒu ba!", fr: "Allons-y !", en: "Let's go!"}
  - {h: "我是你＿＿同事。", opts: [的, 很, 不], a: "的", py: "Wǒ shì nǐ de tóngshì.", fr: "Je suis ta collègue.", en: "I'm your colleague."}
