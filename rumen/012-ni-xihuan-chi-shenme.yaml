exercise:
  translate:
  - {h: "你喜欢喝茶还是喝咖啡？", py: "Nǐ xǐhuan hē chá háishi hē kāfēi?", fr: "Tu préfères le thé ou le café ?", en: "Do you like tea or coffee?"}
  - {h: "这个饭馆的饺子很好吃。", py: "Zhège fànguǎn de jiǎozi hěn hǎochī.", fr: "Les raviolis de ce restaurant sont très bons.", en: "This restaurant's dumplings are very good."}
  - {h: "张伟不吃辣的。", py: "Zhāng Wěi bù chī là de.", fr: "Zhang Wei ne mange pas épicé.", en: "Zhang Wei doesn't eat spicy food."}
  - {h: "我们要三碗米饭。", py: "Wǒmen yào sān wǎn mǐfàn.", fr: "Nous voulons trois bols de riz.", en: "We'd like three bowls of rice."}
  choose:
  - {h: "你喝茶＿＿喝咖啡？", opts: [还是, 和, 也], a: 还是, py: "Nǐ hē chá háishi hē kāfēi?", fr: "Tu bois du thé ou du café ?", en: "Do you drink tea or coffee?"}
  - {h: "我很＿＿吃饺子。", opts: [喜欢, 好吃, 想], a: 喜欢, py: "Wǒ hěn xǐhuan chī jiǎozi.", fr: "J'aime beaucoup les raviolis.", en: "I really like eating dumplings."}
  - {h: "两＿＿米饭。", opts: [碗, 个, 斤], a: 碗, py: "Liǎng wǎn mǐfàn.", fr: "Deux bols de riz.", en: "Two bowls of rice."}
  - {h: "这个菜真＿＿！", opts: [好吃, 喜欢, 多少], a: 好吃, py: "Zhège cài zhēn hǎochī!", fr: "Ce plat est vraiment bon !", en: "This dish is really good!"}
