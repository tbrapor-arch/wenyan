# 入門 · the plan for 100 lessons (STANDARDS.md §13)
#
# Story: Marc (马克), French, spends a year in Beijing: an internship, then a job. Around him:
# 王小雨 (his colleague and guide), 李老师 (his Chinese teacher), 张伟 (flatmate), 小雨's family.
#
# Every 7th lesson is a review. New words per lesson grow from 14 to 32 (tools/rumen.py computes
# the quota from the position of the lesson), so that lesson 100 reaches NHSK 4 (2,000 words).
# Milestones: NHSK 1 (300) ≈ L21, NHSK 2 (500) ≈ L35, NHSK 3 (1,000) ≈ L63, NHSK 4 (2,000) = L100.
# `gram` follows the order of the NHSK grammar syllabus (语法等级大纲), loosely.

lessons:
