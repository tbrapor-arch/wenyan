exercise:
  translate:
  - {h: "这个多少钱？", py: "Zhège duōshao qián?", fr: "Combien coûte celui-ci ?", en: "How much is this one?"}
  - {h: "我想买一个新桌子。", py: "Wǒ xiǎng mǎi yí ge xīn zhuōzi.", fr: "Je voudrais acheter un nouveau bureau.", en: "I'd like to buy a new desk."}
  - {h: "超市的苹果很便宜。", py: "Chāoshì de píngguǒ hěn piányi.", fr: "Les pommes du supermarché sont bon marché.", en: "The supermarket's apples are cheap."}
  - {h: "我们还要买别的吗？", py: "Wǒmen hái yào mǎi bié de ma?", fr: "Il faut acheter autre chose ?", en: "Do we need to buy anything else?"}
  choose:
  - {h: "苹果＿＿钱一斤？", opts: [多少, 几, 什么], a: 多少, py: "Píngguǒ duōshao qián yì jīn?", fr: "Les pommes, combien la livre ?", en: "How much is a jin of apples?"}
  - {h: "我＿＿买水。", opts: [想, 有, 在], a: 想, py: "Wǒ xiǎng mǎi shuǐ.", fr: "Je voudrais acheter de l'eau.", en: "I'd like to buy water."}
  - {h: "＿＿要别的吗？", opts: [还, 都, 也], a: 还, py: "Hái yào bié de ma?", fr: "Et avec ça ?", en: "Anything else?"}
  - {h: "一共十六＿＿。", opts: [块, 个, 斤], a: 块, py: "Yígòng shíliù kuài.", fr: "Seize yuans en tout.", en: "Sixteen kuai altogether."}
