exercise:
  translate:
  - {h: "我有两个哥哥。", py: "Wǒ yǒu liǎng ge gēge.", fr: "J'ai deux grands frères.", en: "I have two older brothers."}
  - {h: "小雨没有姐姐。", py: "Xiǎoyǔ méiyǒu jiějie.", fr: "Xiaoyu n'a pas de grande sœur.", en: "Xiaoyu has no older sister."}
  - {h: "张伟家有几个人？", py: "Zhāng Wěi jiā yǒu jǐ ge rén?", fr: "Ils sont combien dans la famille de Zhang Wei ?", en: "How many are there in Zhang Wei's family?"}
  - {h: "我妹妹也是大学生。", py: "Wǒ mèimei yě shì dàxuéshēng.", fr: "Ma petite sœur aussi est étudiante.", en: "My younger sister is a student too."}
  choose:
  - {h: "我有两＿＿弟弟。", opts: [个, 几, 和], a: 个, py: "Wǒ yǒu liǎng ge dìdi.", fr: "J'ai deux petits frères.", en: "I have two younger brothers."}
  - {h: "我＿＿有哥哥。", opts: [不, 没, 也], a: 没, py: "Wǒ méiyǒu gēge.", fr: "Je n'ai pas de grand frère.", en: "I don't have an older brother."}
  - {h: "你家有＿＿个人？", opts: [几, 什么, 哪], a: 几, py: "Nǐ jiā yǒu jǐ ge rén?", fr: "Vous êtes combien dans ta famille ?", en: "How many in your family?"}
  - {h: "爸爸＿＿妈妈是医生。", opts: [和, 也, 吗], a: 和, py: "Bàba hé māma shì yīshēng.", fr: "Papa et maman sont médecins.", en: "Dad and mum are doctors."}
