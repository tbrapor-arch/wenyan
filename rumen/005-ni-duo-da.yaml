exercise:
  translate:
  - {h: "你女儿今年几岁？", py: "Nǐ nǚ'ér jīnnián jǐ suì?", fr: "Ta fille a quel âge cette année ?", en: "How old is your daughter this year?"}
  - {h: "我妈妈五十五岁。", py: "Wǒ māma wǔshíwǔ suì.", fr: "Ma mère a cinquante-cinq ans.", en: "My mum is fifty-five."}
  - {h: "张伟三十岁，小雨二十九岁。", py: "Zhāng Wěi sānshí suì, Xiǎoyǔ èrshíjiǔ suì.", fr: "Zhang Wei a trente ans, Xiaoyu vingt-neuf.", en: "Zhang Wei is thirty, Xiaoyu twenty-nine."}
  - {h: "我不知道李老师多大。", py: "Wǒ bù zhīdào Lǐ lǎoshī duō dà.", fr: "Je ne sais pas quel âge a Mme Li.", en: "I don't know how old Ms Li is."}
  choose:
  - {h: "你今年＿＿大？", opts: [多, 几, 什么], a: 多, py: "Nǐ jīnnián duō dà?", fr: "Tu as quel âge ?", en: "How old are you?"}
  - {h: "你女儿＿＿岁？", opts: [几, 多, 哪], a: 几, py: "Nǐ nǚ'ér jǐ suì?", fr: "Ta fille a quel âge ?", en: "How old is your daughter?"}
  - {h: "我三十＿＿。", opts: [岁, 个, 大], a: 岁, py: "Wǒ sānshí suì.", fr: "J'ai trente ans.", en: "I'm thirty."}
  - {h: "我不＿＿。你问她吧！", opts: [知道, 认识, 猜], a: 知道, py: "Wǒ bù zhīdào. Nǐ wèn tā ba!", fr: "Je ne sais pas. Demande-lui !", en: "I don't know. Ask her!"}
