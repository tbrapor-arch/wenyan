  - {h: "我也是老师。", py: "Wǒ yě shì lǎoshī.", fr: "Je suis professeur, moi aussi.", en: "I'm a teacher too."}
  - {h: "她叫王小雨。", py: "Tā jiào Wáng Xiǎoyǔ.", fr: "Elle s'appelle Wang Xiaoyu.", en: "She's called Wang Xiaoyu."}
