  translate:
  - {h: "那是谁的床？", py: "Nà shì shéi de chuáng?", fr: "C'est le lit de qui ?", en: "Whose bed is that?"}
  - {h: "这些椅子都是新的。", py: "Zhèxiē yǐzi dōu shì xīn de.", fr: "Ces chaises sont toutes neuves.", en: "These chairs are all new."}
  - {h: "我们都是法国人。", py: "Wǒmen dōu shì Fǎguó rén.", fr: "Nous sommes tous français.", en: "We're all French."}
  - {h: "这个房间真漂亮！", py: "Zhège fángjiān zhēn piàoliang!", fr: "Cette chambre est vraiment jolie !", en: "This room is really pretty!"}
  choose:
  - {h: "我们＿＿是同事。", opts: [都, 也, 和], a: 都, py: "Wǒmen dōu shì tóngshì.", fr: "Nous sommes tous collègues.", en: "We're all colleagues."}
  - {h: "那个房间是＿＿的？", opts: [谁, 哪, 几], a: 谁, py: "Nàge fángjiān shì shéi de?", fr: "Cette chambre est à qui ?", en: "Whose room is that?"}
