  - {h: "我的生日是七月九号。", py: "Wǒ de shēngrì shì qīyuè jiǔ hào.", fr: "Mon anniversaire est le 9 juillet.", en: "My birthday is the ninth of July."}
  - {h: "星期五晚上你有时间吗？", py: "Xīngqīwǔ wǎnshang nǐ yǒu shíjiān ma?", fr: "Tu es libre vendredi soir ?", en: "Are you free on Friday evening?"}
  - {h: "后天我们一起唱歌吧！", py: "Hòutiān wǒmen yìqǐ chàng gē ba!", fr: "Allons chanter ensemble après-demain !", en: "Let's go singing together the day after tomorrow!"}
  choose:
  - {h: "今天星期＿＿？", opts: [几, 多少, 什么], a: 几, py: "Jīntiān xīngqī jǐ?", fr: "On est quel jour ?", en: "What day is it today?"}
  - {h: "今天十月十五＿＿。", opts: [号, 月, 天], a: 号, py: "Jīntiān shíyuè shíwǔ hào.", fr: "Aujourd'hui, c'est le 15 octobre.", en: "Today's 15 October."}
  - {h: "明天＿＿！", opts: [见, 来, 问], a: 见, py: "Míngtiān jiàn!", fr: "À demain !", en: "See you tomorrow!"}
  - {h: "你星期六＿＿时间吗？", opts: [有, 在, 是], a: 有, py: "Nǐ xīngqīliù yǒu shíjiān ma?", fr: "Tu es libre samedi ?", en: "Are you free on Saturday?"}
