  - {h: "我＿＿六点起床。", opts: [每天, 现在, 几点], a: 每天, py: "Wǒ měi tiān liù diǎn qǐchuáng.", fr: "Je me lève tous les jours à six heures.", en: "I get up at six every day."}
  - {h: "你们＿＿点上班？", opts: [几, 多少, 什么], a: 几, py: "Nǐmen jǐ diǎn shàngbān?", fr: "Vous commencez à quelle heure ?", en: "What time do you start work?"}
  - {h: "九点五＿＿。", opts: [分, 点, 半], a: 分, py: "Jiǔ diǎn wǔ fēn.", fr: "Neuf heures cinq.", en: "Five past nine."}
