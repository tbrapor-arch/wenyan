  translate:
  - {h: "现在几点？——现在七点半。", py: "Xiànzài jǐ diǎn? — Xiànzài qī diǎn bàn.", fr: "Quelle heure est-il ? — Sept heures et demie.", en: "What time is it? — Half past seven."}
  - {h: "我每天九点上班。", py: "Wǒ měi tiān jiǔ diǎn shàngbān.", fr: "Je commence le travail à neuf heures tous les jours.", en: "I start work at nine every day."}
  - {h: "明天你几点起床？", py: "Míngtiān nǐ jǐ diǎn qǐchuáng?", fr: "Demain, tu te lèves à quelle heure ?", en: "What time are you getting up tomorrow?"}
  - {h: "小雨早上很忙。", py: "Xiǎoyǔ zǎoshang hěn máng.", fr: "Xiaoyu est très occupée le matin.", en: "Xiaoyu is busy in the mornings."}
  choose:
