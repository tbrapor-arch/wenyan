id: 10
slug: xianzai-ji-dian
title: 现在几点？
title_py: Xiànzài jǐ diǎn?
title_fr: Quelle heure est-il ?
title_en: What time is it?
status: draft
setting:
  fr: "Lundi matin, dans l'appartement. Marc dort encore ; Zhang Wei frappe à sa porte."
  en: "Monday morning, in the flat. Marc is still asleep; Zhang Wei knocks on his door."
lines:
- n: 1
  who: "张伟"
  h: "马克！起床！"
  py: "Mǎkè! Qǐchuáng!"
  fr: "Marc ! Debout !"
  en: "Marc! Get up!"
- n: 2
  who: "马克"
  h: "现在几点？"
  py: "Xiànzài jǐ diǎn?"
  fr: "Quelle heure il est ?"
  en: "What time is it?"
  lit_fr: "(Maintenant combien heures ?)"
  lit_en: "(Now how-many o'clock?)"
- n: 3
  who: "张伟"
  h: "现在八点半。"
  py: "Xiànzài bā diǎn bàn."
  fr: "Huit heures et demie."
  en: "Half past eight."
- n: 4
  who: "马克"
  h: "八点半？我们几点上班？"
  py: "Bā diǎn bàn? Wǒmen jǐ diǎn shàngbān?"
  fr: "Huit heures et demie ? On commence à quelle heure ?"
  en: "Half past eight? What time do we start work?"
- n: 5
  who: "张伟"
  h: "九点。快！"
  py: "Jiǔ diǎn. Kuài!"
  fr: "À neuf heures. Vite !"
  en: "Nine. Hurry!"
- n: 6
  who: "马克"
  h: "你每天几点起床？"
  py: "Nǐ měi tiān jǐ diǎn qǐchuáng?"
  fr: "Tu te lèves à quelle heure, toi, tous les jours ?"
  en: "What time do you get up every day?"
- n: 7
  who: "张伟"
  h: "我每天六点起床。"
  py: "Wǒ měi tiān liù diǎn qǐchuáng."
  fr: "Tous les jours à six heures."
  en: "Six o'clock every day."
- n: 8
  who: "马克"
  h: "六点？真早！"
  py: "Liù diǎn? Zhēn zǎo!"
  fr: "Six heures ? C'est tôt !"
  en: "Six? That's early!"
- n: 9
  who: "张伟"
  h: "我早上很忙。"
  py: "Wǒ zǎoshang hěn máng."
  fr: "J'ai beaucoup à faire le matin."
  en: "I'm busy in the mornings."
- n: 10
  who: "小雨"
  h: "现在九点五分。张伟，你也很晚！"
  py: "Xiànzài jiǔ diǎn wǔ fēn. Zhāng Wěi, nǐ yě hěn wǎn!"
  fr: "Il est neuf heures cinq. Zhang Wei, toi aussi tu es en retard !"
  en: "It's five past nine. Zhang Wei, you're late too!"
- n: 11
  who: "马克"
  h: "对不起！明天我七点起床！"
  py: "Duìbuqǐ! Míngtiān wǒ qī diǎn qǐchuáng!"
  fr: "Pardon ! Demain je me lève à sept heures !"
  en: "Sorry! Tomorrow I'll get up at seven!"
notes:
- n: 1
  line: 2
  topic: grammar
  fr: >
    L'heure : nombre + **点** diǎn : 八点 « huit heures ». Les minutes avec **分** fēn : 九点五分 « neuf heures
    cinq ». La demie : **半** bàn, 八点半. Pour demander : 几点 « combien d'heures » (几, L4 n.2).
  en: >
    Telling the time: number + **点** diǎn: 八点 "eight o'clock". Minutes with **分** fēn: 九点五分 "five past
    nine". Half past: **半** bàn, 八点半. To ask: 几点 "how many o'clock" (几, L4 n.2).
- n: 2
  line: 2
  topic: vocab
  fr: >
    **现在** xiànzài « maintenant ». Comme 今年 (L5 n.2), il va en tête ou devant le verbe.
  en: >
    **现在** xiànzài "now". Like 今年 (L5 n.2), it goes first or before the verb.
- n: 3
  line: 4
  topic: grammar
  fr: >
    L'heure d'une action se met **devant le verbe**, jamais après : 我们几点上班 « nous à-quelle-heure
    commençons », 我每天六点起床 « je chaque-jour six-heures me-lève ». L'ordre : sujet, quand, verbe.
  en: >
    The time of an action goes **before the verb**, never after: 我们几点上班 "we at-what-time start-work",
    我每天六点起床 "I every-day six-o'clock get-up". The order: subject, when, verb.
- n: 4
  line: 4
  topic: vocab
  fr: >
    **上班** shàngbān « aller au travail, commencer le travail », litt. « monter à l'équipe ». Le contraire :
    下班 xiàbān « finir le travail ».
  en: >
    **上班** shàngbān "go to work, start work", lit. "go up to the shift". Its opposite: 下班 xiàbān "finish
    work".
- n: 5
  line: 6
  topic: grammar
  fr: >
    **每** měi « chaque » + **天** tiān « jour » : 每天 « tous les jours ». 天 n'a pas besoin de classificateur.
    Le verbe n'indique pas le temps : 我七点起床 peut être « je me lève » ou « je me lèverai » (ligne 11) ; le
    contexte et les mots de temps suffisent.
  en: >
    **每** měi "every" + **天** tiān "day": 每天 "every day". 天 takes no measure word. The verb doesn't show
    tense: 我七点起床 can be "I get up" or "I'll get up" (line 11); context and time words do the job.
- n: 6
  line: 8
  topic: vocab
  fr: >
    **早** zǎo « tôt », **晚** wǎn « tard ». 早上 zǎoshang « le matin », 晚上 wǎnshang « le soir » (leçon 11).
    Au bureau, on se salue souvent d'un simple 早！« bonjour ! » le matin.
  en: >
    **早** zǎo "early", **晚** wǎn "late". 早上 zǎoshang "morning", 晚上 wǎnshang "evening" (lesson 11). At work
    people often greet each other with just 早！"morning!".
- n: 7
  line: 10
  topic: grammar
  fr: >
    你也很晚 « toi aussi (tu es) très tard » : un adjectif avec 很 (L1 n.9), sans 是. Le chinois dit « être tard »
    là où le français dit « être en retard ».
  en: >
    你也很晚 "you also (are) very late": an adjective with 很 (L1 n.9), no 是.
