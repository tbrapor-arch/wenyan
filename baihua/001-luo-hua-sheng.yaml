# The classical sentences these written words come from. Each is a line of a 文言 lesson
# (checked by the build), so nothing here is quoted from memory.
exercise:
  - h: 以子之矛，陷子之楯，何如？
    ref: 文言 L2
    tests: 如何 (line 5). The classical order is usually 何如.
  - h: 蛇固無足，子安能為之足？
    ref: 文言 L5
    tests: 固 in 固然 (line 15).
  - h: 兔走觸株，折頸而死。
    ref: 文言 L1
    tests: 而 joining two verbs, as in 一望而發生 (line 17).
  - h: 虎以為然，故遂與之行，
    ref: 文言 L6
    tests: 然 "so" as a full word; the 然 of 既然, 居然, 固然, 雖然, 然而.
  - h: 兔不可復得，
    ref: 文言 L1
    tests: 可 + verb, as in 可惜 and 可貴.
  - h: 吾矛之利，於物無不陷也。
    ref: 文言 L2
    tests: 於 in 對於 (line 24); 無 in 無論.

culture: >
  **The other ending.** The version most people in China know is the primary-school one, which
  was cut and reworded for children. The text here is the adult original in a modern edition
  (see note 8 for what the first printing looked like).
